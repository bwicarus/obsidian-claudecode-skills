<!DOCTYPE html>
<!--
  The context bridge.
//
  This page no longer holds a call. Audio belongs to the App alone -- one link,
  held end to end, never handed over -- while this keeps Windows informed of
  whatever the user is actually looking at. Switching between a web page, the
  reader, or a book in the App is therefore not a handover at all: whichever
  surface is in front simply writes the snapshot, and the last write wins.

  That also removes the reason the previous version dropped the call on every
  switch. Two surfaces were competing to own one voice link and the bridge
  admits a single owner, so each switch evicted the other. Nothing here can
  compete: the endpoint refuses START, STOP and audio frames outright.

  Left open in a tab while reading. It is the one place that can hold a socket
  on iOS -- the background service worker is reclaimed, this is not.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>上下文桥</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom));
    font: 15px/1.6 -apple-system, system-ui, sans-serif;
    background: Canvas; color: CanvasText;
  }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .sub { color: color-mix(in srgb, CanvasText 55%, transparent); font-size: 13px; margin-bottom: 18px; }

  .card {
    border: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
    border-radius: 12px; padding: 14px; margin-bottom: 14px;
  }
  .ctx-title { font-weight: 600; margin-bottom: 2px; word-break: break-word; }
  .ctx-url {
    font-size: 12px; color: color-mix(in srgb, CanvasText 50%, transparent);
    word-break: break-all;
  }

  #status { font-size: 14px; min-height: 1.6em; }
  .ok  { color: #30d158; }
  .err { color: #ff453a; }
  .dim { color: color-mix(in srgb, CanvasText 45%, transparent); }

  .hint {
    margin-top: 18px; padding: 12px 14px; border-radius: 10px;
    background: color-mix(in srgb, CanvasText 6%, transparent);
    font-size: 13px; line-height: 1.7;
    color: color-mix(in srgb, CanvasText 70%, transparent);
  }

  /* Failures have to be readable on the device itself; there is no console to
     open on an iPad, and asking for one wastes a TestFlight round. */
  #detail {
    margin-top: 12px; padding: 10px; border-radius: 8px; display: none;
    background: color-mix(in srgb, CanvasText 7%, transparent);
    font: 11px/1.45 ui-monospace, Menlo, monospace;
    white-space: pre-wrap; word-break: break-all;
    max-height: 36vh; overflow: auto;
  }
</style>

<h1>上下文桥</h1>
<div class="sub">把你正在看的页面告诉 Windows 上的助手</div>

<div class="card">
  <div class="ctx-title" id="ctxTitle">等待页面…</div>
  <div class="ctx-url" id="ctxUrl"></div>
</div>

<div id="status" class="dim">正在连接…</div>
<pre id="detail"></pre>

<div class="hint">
  语音由 App 负责,这里只送上下文。<br>
  保持本页开着,换标签、滚动、选中都会自动跟随。
</div>

<script type="module" src="call.js"></script>
