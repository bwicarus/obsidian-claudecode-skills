<!DOCTYPE html>
<!--
  The context bridge.
//
  This page no longer holds a call. Audio belongs to the App alone -- one link,
  held end to end, never handed over -- while this keeps Windows informed of
  whatever the user is actually looking at. Switching between a web page, the
  reader, or a book in the App is therefore not a handover at all: whichever
  surface is in front simply writes the snapshot, and the last write wins.

  That also removes the reason the previous version dropped the call on every
  switch. Two surfaces were competing to own one voice link and the bridge
  admits a single owner, so each switch evicted the other. Nothing here can
  compete: the endpoint refuses START, STOP and audio frames outright.

  Left open in a tab while reading. It is the one place that can hold a socket
  on iOS -- the background service worker is reclaimed, this is not.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>上下文桥</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom));
    font: 15px/1.6 -apple-system, system-ui, sans-serif;
    background: Canvas; color: CanvasText;
  }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .sub { color: color-mix(in srgb, CanvasText 55%, transparent); font-size: 13px; margin-bottom: 18px; }

  .card {
    border: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
    border-radius: 12px; padding: 14px; margin-bottom: 14px;
  }
  .ctx-title { font-weight: 600; margin-bottom: 2px; word-break: break-word; }
  .ctx-url {
    font-size: 12px; color: color-mix(in srgb, CanvasText 50%, transparent);
    word-break: break-all;
  }

  button {
    -webkit-appearance: none; appearance: none; width: 100%;
    border: 0; border-radius: 12px; padding: 15px; margin-bottom: 14px;
    font: 600 16px/1 -apple-system, system-ui, sans-serif;
    background: #0a84ff; color: #fff;
  }
  button:disabled { opacity: .45; }
  button.stop { background: #ff453a; }

  #status { font-size: 14px; min-height: 1.6em; }
  .ok  { color: #30d158; }
  .err { color: #ff453a; }
  .dim { color: color-mix(in srgb, CanvasText 45%, transparent); }

  .hint {
    margin-top: 18px; padding: 12px 14px; border-radius: 10px;
    background: color-mix(in srgb, CanvasText 6%, transparent);
    font-size: 13px; line-height: 1.7;
    color: color-mix(in srgb, CanvasText 70%, transparent);
  }

  /* Failures have to be readable on the device itself; there is no console to
     open on an iPad, and asking for one wastes a TestFlight round. */
  #detail {
    margin-top: 12px; padding: 10px; border-radius: 8px; display: none;
    background: color-mix(in srgb, CanvasText 7%, transparent);
    font: 11px/1.45 ui-monospace, Menlo, monospace;
    white-space: pre-wrap; word-break: break-all;
    max-height: 36vh; overflow: auto;
  }
</style>

<style>
  /* Compact form, used when this page is embedded over the sidebar button.
     Everything but the button is hidden -- the frame is 42px, and the same
     document then serves both uses instead of a second copy drifting apart. */
  :root.compact body { padding: 0; background: transparent; }
  :root.compact h1,
  :root.compact .sub,
  :root.compact .card,
  :root.compact #status,
  :root.compact #detail,
  :root.compact .hint { display: none !important; }
  :root.compact button {
    width: 42px; height: 42px; padding: 0; margin: 0;
    border-radius: 12px; font-size: 0;
    background: #16203a; border: 1px solid #2a3a63;
  }
  :root.compact button.stop { background: #1a7f4b; border-color: #1a7f4b; }
  :root.compact button::after { content: "🖥"; font-size: 18px; }
</style>
<script>
  // Applied before first paint so the embedded form never flashes the full
  // layout inside a 42px frame.
  if (new URLSearchParams(location.search).get("compact") === "1") {
    document.documentElement.classList.add("compact");
  }
</script>

<h1>电脑语音</h1>
<div class="sub">直接连接 Windows,并跟随你正在看的页面</div>

<div class="card">
  <div class="ctx-title" id="ctxTitle">等待页面…</div>
  <div class="ctx-url" id="ctxUrl"></div>
</div>

<!-- Same id as the reader's own computer button, and not by coincidence:
     registerComputerButton accepts only #asst-computer or #vc-top-computer, and
     the capture-phase listener matches the click against that same set before
     it will take an audio lease. -->
<button id="asst-computer" type="button">开始通话</button>
<div id="status" class="dim">正在连接…</div>
<pre id="detail"></pre>

<div class="hint">
  在这里或 App 里启动都可以 —— 谁先启动谁持有,另一端只送上下文,切换不会断。<br>
  换标签、滚动、选中都会自动跟随。
</div>

<!-- Loaded again because this page can once more place a call. Order follows
     the dependency chain: rc-core defines RC; rc-voicecall supplies
     canCaptureComputerVoiceGesture, without which the capture listener returns
     early and no audio lease is ever taken; rc-computer-voice owns the bridge
     protocol. Classic scripts, so they run before the module below. -->
<script src="vendor/rc-core.js"></script>
<script src="vendor/rc-voicecall.js"></script>
<script src="vendor/rc-computer-voice.js"></script>
<script type="module" src="call.js"></script>
