<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>BW网页伴读</title>
  <style>
    body { width: 320px; padding: 14px; font: 14px system-ui, -apple-system, sans-serif; }
    h3 { margin: 0 0 10px; }
    label { display: block; margin-bottom: 4px; color: #555; }
    input { box-sizing: border-box; width: 100%; padding: 8px; border: 1px solid #bbb; border-radius: 7px; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    button { flex: 1; padding: 8px 12px; border: 0; border-radius: 7px; background: #4f7cff; color: white; }
    #test { background: #6b7280; }
    #status { margin-top: 10px; white-space: pre-wrap; color: #333; min-height: 1.2em; }
    .sync-panel { margin-top: 12px; padding-top: 12px; border-top: 1px solid #ddd; }
    .sync-panel h4 { margin: 0 0 6px; font-size: 13px; }
    #sync-status { margin: 0; white-space: pre-wrap; color: #444; line-height: 1.45; }
    #sync-conflicts { margin: 7px 0 0; padding-left: 18px; color: #555; font-size: 12px; }
    [hidden] { display: none !important; }
    .hint { margin-top: 12px; font-size: 12px; color: #888; line-height: 1.5; }
  </style>
  <script src="popup.js" defer></script>
</head>
<body>
  <h3>BW网页伴读</h3>
  <label for="token">设备令牌（Bearer token）</label>
  <input id="token" type="password" autocomplete="off" placeholder="从 /profile/ 创建">
  <div class="row">
    <button id="save">保存</button>
    <button id="test">测试连接</button>
  </div>
  <p id="status"></p>
  <!-- Opens the call in its own extension page rather than running it here: a
       popup is torn down the moment it loses focus, which would cut the call
       the first time the user looked at anything else. -->
  <section class="voice-panel" aria-labelledby="voice-heading">
    <h4 id="voice-heading">电脑语音</h4>
    <button id="voice-open">开始通话</button>
    <p id="voice-status">连接 Windows 上的语音助手</p>
  </section>
  <section class="sync-panel" aria-labelledby="sync-heading">
    <h4 id="sync-heading">跨设备同步</h4>
    <p id="sync-status">正在读取同步状态……</p>
    <ul id="sync-conflicts" hidden></ul>
  </section>
  <p class="hint">首次使用请打开一次已登录的 BW 书籍 PWA，让扩展确认账户；
    此后可以在任意网页管理和使用令牌。令牌只保存在扩展后台，
    不会返回网页或显示在弹窗中。</p>
</body>
</html>
