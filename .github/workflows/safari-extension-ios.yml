# Build the combined BWReader iPad app and its Safari Web Extension without a
# local Mac.  The Xcode project is generated from the checked-in XcodeGen spec;
# package_safari.py remains the only source of the Apple-shaped web resources.
#
# Manual trigger only. macOS minutes bill at 10x on private repositories, so
# this workflow must never run on an ordinary push.
name: BWReader iOS App

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight after building"
        type: boolean
        default: false

concurrency:
  group: bwreader-ios
  cancel-in-progress: false

env:
  APP_NAME: bwicarus-test
  BUNDLE_ID: space.bwicarus.bwreader2
  EXTENSION_BUNDLE_ID: space.bwicarus.bwreader2.Extension
  EXT_DIR: extensions/bw-reader-webext
  PROJECT_DIR: ios/BWReader
  PROJECT_FILE: ios/BWReader/BWReader.xcodeproj
  SCHEME: BWReader
  XCODEGEN_VERSION: "2.46.0"
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          python3 --version

      # The runner's own Python is externally managed. Use a private 3.12
      # installation rather than forcing Pillow into the system interpreter.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging dependencies
        run: python -m pip install --quiet --upgrade pillow

      - name: Build and capture the Safari package
        id: safari
        working-directory: ${{ env.EXT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$(python package_safari.py)"
          printf '%s\n' "$OUTPUT"

          PACKAGE="$(printf '%s\n' "$OUTPUT" | sed -n 's/^package=//p')"
          REPORTED_SHA="$(printf '%s\n' "$OUTPUT" | sed -n 's/^sha256=//p')"
          REPORTED_BUNDLE_ID="$(printf '%s\n' "$OUTPUT" | sed -n 's/^bundle_id=//p')"
          test -n "$PACKAGE" || { echo "package_safari.py did not report package=..."; exit 1; }
          test -n "$REPORTED_SHA" || { echo "package_safari.py did not report sha256=..."; exit 1; }
          test "$REPORTED_BUNDLE_ID" = "$BUNDLE_ID" || {
            echo "package_safari.py bundle ID drift: $REPORTED_BUNDLE_ID != $BUNDLE_ID"
            exit 1
          }
          PACKAGE="$(python -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$PACKAGE")"
          case "$PACKAGE" in
            "$GITHUB_WORKSPACE"/extensions/bw-reader-webext-*-safari-ios.zip) ;;
            *) echo "unexpected Safari package path: $PACKAGE"; exit 1 ;;
          esac
          test -f "$PACKAGE"

          ACTUAL_SHA="$(shasum -a 256 "$PACKAGE" | awk '{print $1}')"
          test "$ACTUAL_SHA" = "$REPORTED_SHA" || {
            echo "Safari package digest does not match package_safari.py output"
            exit 1
          }

          cp "$PACKAGE" "$RUNNER_TEMP/safari-extension.zip"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "artifact=$RUNNER_TEMP/safari-extension.zip" >> "$GITHUB_OUTPUT"
          echo "sha256=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"

      - name: Stage Safari resources at the extension root
        env:
          SAFARI_PACKAGE: ${{ steps.safari.outputs.package }}
        shell: bash
        run: |
          set -euo pipefail
          RESOURCES="$GITHUB_WORKSPACE/$PROJECT_DIR/Extension/Resources"
          rm -rf "$RESOURCES"
          mkdir -p "$RESOURCES"
          unzip -q "$SAFARI_PACKAGE" -d "$RESOURCES"

          test -f "$RESOURCES/manifest.json"
          test -f "$RESOURCES/background.js"
          test -d "$RESOURCES/src"
          test -d "$RESOURCES/vendor"
          test -d "$RESOURCES/icons"
          echo "--- manifest that the extension target will embed ---"
          RESOURCES="$RESOURCES" APP_NAME="$APP_NAME" python <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              (Path(os.environ["RESOURCES"]) / "manifest.json").read_text(encoding="utf-8")
          )
          if manifest.get("name") != os.environ["APP_NAME"]:
              raise SystemExit(
                  f"Safari manifest name drift: {manifest.get('name')!r} != {os.environ['APP_NAME']!r}"
              )
          print(
              json.dumps(
                  {key: manifest[key] for key in ("name", "version", "permissions", "background")},
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY

      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/xcodegen.zip"
          INSTALL_ROOT="$RUNNER_TEMP/xcodegen-release"
          curl --fail --location --retry 3 \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "$ARCHIVE"
          echo "${XCODEGEN_SHA256}  ${ARCHIVE}" | shasum -a 256 -c -
          rm -rf "$INSTALL_ROOT"
          mkdir -p "$INSTALL_ROOT"
          unzip -q "$ARCHIVE" -d "$INSTALL_ROOT"
          test -x "$INSTALL_ROOT/xcodegen/bin/xcodegen"
          echo "$INSTALL_ROOT/xcodegen/bin" >> "$GITHUB_PATH"
          "$INSTALL_ROOT/xcodegen/bin/xcodegen" --version | tee "$RUNNER_TEMP/xcodegen-version.txt"
          grep -F "$XCODEGEN_VERSION" "$RUNNER_TEMP/xcodegen-version.txt"

      - name: Generate the Xcode project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_FILE"
          xcodegen generate \
            --spec "$PROJECT_DIR/project.yml" \
            --project "$PROJECT_DIR"
          test -d "$PROJECT_FILE"
          xcodebuild -project "$PROJECT_FILE" -list

      - name: Build unsigned simulator candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/build-logs"
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee "$RUNNER_TEMP/build-logs/simulator-build.log"

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/dist.p12" -k build.keychain \
            -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a UI prompt no one can answer.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain >/dev/null
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning build.keychain

      - name: Place App Store Connect API key
        env:
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$API_KEY_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8"
          # Also place it where xcodebuild and altool look by default.
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8" \
            ~/.appstoreconnect/private_keys/

      # -allowProvisioningUpdates with the API key lets Xcode create and fetch
      # both the app and extension profiles without checked-in profiles.
      - name: Archive signed device candidate
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/build-logs"
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            | tee "$RUNNER_TEMP/build-logs/archive.log"

      - name: Validate archived app and extension
        env:
          SAFARI_PACKAGE: ${{ steps.safari.outputs.package }}
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/app.xcarchive/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH" || { echo "archive contains no app"; exit 1; }
          APPEX_PATH="$APP_PATH/PlugIns/BWReaderSafariExtension.appex"
          test -d "$APPEX_PATH" || { echo "embedded Safari extension is missing"; exit 1; }

          # The web package must land at the appex root, never under an extra
          # Resources directory.
          test -f "$APPEX_PATH/manifest.json"
          test ! -e "$APPEX_PATH/Resources/manifest.json"

          APP_PATH="$APP_PATH" APPEX_PATH="$APPEX_PATH" \
          APP_BUNDLE_ID="$BUNDLE_ID" EXT_BUNDLE_ID="$EXTENSION_BUNDLE_ID" \
          SAFARI_PACKAGE="$SAFARI_PACKAGE" python <<'PY'
          import os
          import plistlib
          import sys
          import zipfile
          from pathlib import Path

          app = Path(os.environ["APP_PATH"])
          appex = Path(os.environ["APPEX_PATH"])

          def load_info(bundle: Path) -> dict:
              with (bundle / "Info.plist").open("rb") as handle:
                  return plistlib.load(handle)

          def validate_platform(
              info: dict,
              *,
              label: str,
              bundle_id: str,
              expected_families: list[int],
          ) -> None:
              if info.get("CFBundleIdentifier") != bundle_id:
                  raise SystemExit(f"{label} bundle ID mismatch: {info.get('CFBundleIdentifier')!r}")
              if str(info.get("MinimumOSVersion")) != "17.0":
                  raise SystemExit(f"{label} MinimumOSVersion must be 17.0: {info.get('MinimumOSVersion')!r}")
              families = [int(value) for value in info.get("UIDeviceFamily", [])]
              if families != expected_families:
                  raise SystemExit(
                      f"{label} device family mismatch: "
                      f"UIDeviceFamily={families!r}, expected={expected_families!r}"
                  )

          app_info = load_info(app)
          extension_info = load_info(appex)
          validate_platform(
              app_info,
              label="app",
              bundle_id=os.environ["APP_BUNDLE_ID"],
              expected_families=[2],
          )
          validate_platform(
              extension_info,
              label="extension",
              bundle_id=os.environ["EXT_BUNDLE_ID"],
              expected_families=[1, 2],
          )

          app_version = (
              str(app_info.get("CFBundleShortVersionString")),
              str(app_info.get("CFBundleVersion")),
          )
          extension_version = (
              str(extension_info.get("CFBundleShortVersionString")),
              str(extension_info.get("CFBundleVersion")),
          )
          if app_version != extension_version:
              raise SystemExit(
                  f"app/extension version mismatch: {app_version!r} != {extension_version!r}"
              )
          extension_contract = extension_info.get("NSExtension", {})
          if extension_contract.get("NSExtensionPointIdentifier") != "com.apple.Safari.web-extension":
              raise SystemExit("embedded extension is not a Safari Web Extension")
          if extension_contract.get("NSExtensionPrincipalClass") != "BWReaderSafariExtension.SafariWebExtensionHandler":
              raise SystemExit(
                  "unexpected Safari extension handler: "
                  f"{extension_contract.get('NSExtensionPrincipalClass')!r}"
              )

          missing = []
          changed = []
          with zipfile.ZipFile(os.environ["SAFARI_PACKAGE"]) as archive:
              for member in archive.infolist():
                  if member.is_dir():
                      continue
                  target = appex / member.filename
                  if not target.is_file():
                      missing.append(member.filename)
                  elif target.read_bytes() != archive.read(member):
                      changed.append(member.filename)
          if missing or changed:
              raise SystemExit(
                  "Safari resource integrity failure: "
                  f"missing={missing!r}, changed={changed!r}"
              )

          print(
              "validated archive:",
              app_info["CFBundleIdentifier"],
              extension_info["CFBundleIdentifier"],
              "version", ".".join(app_version),
          )
          PY

          codesign --verify --strict --verbose=2 "$APPEX_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -d --verbose=4 "$APP_PATH" 2>&1 | tee "$RUNNER_TEMP/build-logs/app-codesign.txt"
          codesign -d --verbose=4 "$APPEX_PATH" 2>&1 | tee "$RUNNER_TEMP/build-logs/extension-codesign.txt"

      - name: Export IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID" \
            | tee "$RUNNER_TEMP/build-logs/export.log"
          find "$RUNNER_TEMP/export" -maxdepth 1 -type f -print

      - name: Upload to TestFlight
        if: ${{ inputs.upload }}
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          IPA="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA" || { echo "no IPA produced"; exit 1; }
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bwreader-ios-build
          retention-days: 7
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/safari-extension.zip
            ${{ runner.temp }}/build-logs/
            ${{ runner.temp }}/xcodegen-version.txt
            ios/BWReader/BWReader.xcodeproj/
          if-no-files-found: warn

      - name: Clean up signing material
        if: always()
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/dist.p12"
          rm -rf "$RUNNER_TEMP/private_keys"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          security delete-keychain build.keychain || true
