# Build the Safari (iOS) Web Extension without a Mac.
#
# GitHub's macOS runner does what we have no machine for: run Apple's
# safari-web-extension-converter and xcodebuild. The Chromium manifest stays
# the source of truth -- package_safari.py derives an Apple-shaped manifest at
# build time, exactly as it does locally.
#
# Manual trigger only. macOS minutes bill at 10x on private repos, so this must
# never fire on ordinary pushes.
name: Safari Extension (iOS)

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight after building"
        type: boolean
        default: false

concurrency:
  group: safari-ios
  cancel-in-progress: false

env:
  APP_NAME: bwicarus-test
  BUNDLE_ID: space.bwicarus.bwreader
  EXT_DIR: extensions/bw-reader-webext

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          python3 --version
          # The converter's flags differ between Xcode versions; print them so a
          # failure below can be read without guessing.
          xcrun safari-web-extension-converter --help || true

      # The runner's own python3 is Homebrew-managed and refuses installs under
      # PEP 668 (externally-managed-environment). Bring an isolated interpreter
      # instead of forcing packages into it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging deps
        run: python -m pip install --quiet --upgrade pillow

      - name: Build the Apple-shaped extension package
        working-directory: ${{ env.EXT_DIR }}
        run: |
          python package_safari.py
          ls -l ../bw-reader-webext-*-safari-ios.zip

      - name: Unpack it for the converter
        run: |
          mkdir -p build/src
          unzip -q extensions/bw-reader-webext-*-safari-ios.zip -d build/src
          echo "--- manifest that Apple will see ---"
          python -c "import json;m=json.load(open('build/src/manifest.json'));print(json.dumps({k:m[k] for k in ('name','version','permissions','background')},ensure_ascii=False,indent=2))"

      - name: Convert to an Xcode project
        run: |
          xcrun safari-web-extension-converter build/src \
            --project-location build/xcode \
            --app-name "$APP_NAME" \
            --bundle-identifier "$BUNDLE_ID" \
            --swift \
            --copy-resources \
            --no-open \
            --force \
            --no-prompt
          find build/xcode -maxdepth 2 -name '*.xcodeproj' -print

      # The generated scheme name is not fixed -- it follows the app name and
      # gains a platform suffix. Read it rather than hardcoding a guess.
      - name: Resolve project and scheme
        id: proj
        run: |
          PROJ=$(find build/xcode -maxdepth 2 -name '*.xcodeproj' | head -1)
          echo "project=$PROJ" >> "$GITHUB_OUTPUT"
          echo "--- available schemes ---"
          xcodebuild -project "$PROJ" -list
          SCHEME=$(xcodebuild -project "$PROJ" -list -json \
            | python -c "import json,sys;s=json.load(sys.stdin)['project']['schemes'];ios=[x for x in s if 'iOS' in x];print((ios or s)[0])")
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using project=$PROJ scheme=$SCHEME"

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/dist.p12" -k build.keychain \
            -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a UI prompt that no one can answer.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain >/dev/null
          rm -f "$RUNNER_TEMP/dist.p12"
          echo "--- identities available to codesign ---"
          security find-identity -v -p codesigning build.keychain

      - name: Place App Store Connect API key
        env:
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$API_KEY_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8"
          # Also where xcodebuild looks by default.
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8" \
            ~/.appstoreconnect/private_keys/

      # -allowProvisioningUpdates with an API key lets Xcode create and fetch the
      # profiles itself, so no provisioning profile has to be exported by hand.
      - name: Archive
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project "${{ steps.proj.outputs.project }}" \
            -scheme "${{ steps.proj.outputs.scheme }}" \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic

      - name: Export IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"
          ls -l "$RUNNER_TEMP/export"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-ios-build
          retention-days: 7
          path: |
            ${{ runner.temp }}/export/*.ipa
            extensions/bw-reader-webext-*-safari-ios.zip
          if-no-files-found: warn

      - name: Upload to TestFlight
        if: ${{ inputs.upload }}
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          test -n "$IPA" || { echo "no ipa produced"; exit 1; }
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain build.keychain || true
