server {

	# SSL configuration
	#
	# listen 443 ssl default_server;
	# listen [::]:443 ssl default_server;
	#
	# Note: You should disable gzip for SSL traffic.
	# See: https://bugs.debian.org/773332
	#
	# Read up on ssl_ciphers to ensure a secure configuration.
	# See: https://bugs.debian.org/765782
	#
	# Self signed certs generated by the ssl-cert package
	# Don't use them in a production server!
	#
	# include snippets/snakeoil.conf;

	root /var/www/html;

	# Add index.php to the list if you are using PHP
	index index.html index.htm index.nginx-debian.html;
    server_name bwicarus.space; # managed by Certbot

    # MCP server(2026-07-13,反代到 Pi:8766 经 tailnet):claude.ai 连接器服务端请求只走标准 443,
    # Funnel 8443 授权页能开但 token/mcp 永远连不上;/register 不挂(是 webapp 注册页,DCR 走 /oauth/register)
    location /mcp { proxy_pass https://100.99.9.124; proxy_ssl_server_name on; proxy_ssl_name bwicarus-2.taile44d0c.ts.net; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; proxy_buffering off; proxy_read_timeout 3600; proxy_http_version 1.1; }
    location /oauth/ { proxy_pass https://100.99.9.124; proxy_ssl_server_name on; proxy_ssl_name bwicarus-2.taile44d0c.ts.net; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
    location /authorize { proxy_pass https://100.99.9.124; proxy_ssl_server_name on; proxy_ssl_name bwicarus-2.taile44d0c.ts.net; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
    location /token { proxy_pass https://100.99.9.124; proxy_ssl_server_name on; proxy_ssl_name bwicarus-2.taile44d0c.ts.net; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
    location /.well-known/oauth-protected-resource { proxy_pass https://100.99.9.124; proxy_ssl_server_name on; proxy_ssl_name bwicarus-2.taile44d0c.ts.net; proxy_set_header Host $host; }
    location /.well-known/oauth-authorization-server { proxy_pass https://100.99.9.124; proxy_ssl_server_name on; proxy_ssl_name bwicarus-2.taile44d0c.ts.net; proxy_set_header Host $host; }
    location /.well-known/openid-configuration { proxy_pass https://100.99.9.124; proxy_ssl_server_name on; proxy_ssl_name bwicarus-2.taile44d0c.ts.net; proxy_set_header Host $host; }
    # 阅读上下文快照的公开出口。反代到 Pi(数据不落 VPS)。
    # 用公网域名而非 *.ts.net:8443 —— AI 抓取器会把后者判为内网而拒绝访问。
    location /ctx/ {
        proxy_pass https://100.101.15.57/ctx/;
        proxy_ssl_server_name on;
        proxy_ssl_name bwicarus.taile44d0c.ts.net;
        proxy_ssl_verify off;
        proxy_set_header Host bwicarus.taile44d0c.ts.net;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location /login    { proxy_pass http://127.0.0.1:5000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
    location /logout   { proxy_pass http://127.0.0.1:5000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
    location /dashboard { proxy_pass http://127.0.0.1:5000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
    location /private  { proxy_pass http://127.0.0.1:5000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
    location /history  { proxy_pass http://127.0.0.1:5000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
    # StocksNative private gateway (independent from the existing stock website)
    location = /stocks-native/api/voice/ink {
        proxy_pass http://127.0.0.1:5025/api/voice/ink;
        proxy_request_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 409 = @stocks_previous_voice_ink;
        client_max_body_size 340k;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location @stocks_previous_voice_ink {
        rewrite ^ /api/voice/ink break;
        proxy_pass http://127.0.0.1:5024;
        proxy_request_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 340k;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ^~ /stocks-native/ {
        proxy_pass http://127.0.0.1:5025/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 660;
        client_max_body_size 128k;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location /stocks   { proxy_pass http://127.0.0.1:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; proxy_buffering off; proxy_read_timeout 600; client_max_body_size 12m; }
    location /register { proxy_pass http://127.0.0.1:5000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
    location /auth     { proxy_pass http://127.0.0.1:5000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
    location /profile  { proxy_pass http://127.0.0.1:5000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
    location /admin    { proxy_pass http://127.0.0.1:5000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
    location /control  { proxy_pass http://127.0.0.1:5000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }


    # ===== kondate 子站（Basic Auth 简易版）=====
    location /kondate/vnc/ {
        # noVNC 免验证（用户 2026-05-19 明确要求）。风险：任何知道此地址
        # 的人可直接操控已登录 K1001 的浏览器。想"只限自己网络免验证"，
        # 取消下面 allow/deny 两行注释、把 IP 换成你的公网/Tailscale 段即可。
        auth_basic off;
        # allow 1.2.3.4;   # ← 你的 IP
        # deny all;
        proxy_pass http://127.0.0.1:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location /kondate/ {
        auth_basic "kondate access";
        auth_basic_user_file /etc/nginx/htpasswd-kondate;
        proxy_pass http://127.0.0.1:5001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
        proxy_read_timeout 600;
    }

    location /api      { proxy_pass http://127.0.0.1:5000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; client_max_body_size 50m; }


	location / {
		# First attempt to serve request as file, then
		# as directory, then fall back to displaying a 404.
		try_files $uri $uri/ =404;
	}

	# pass PHP scripts to FastCGI server
	#
	#location ~ \.php$ {
	#	include snippets/fastcgi-php.conf;
	#
	#	# With php-fpm (or other unix sockets):
	#	fastcgi_pass unix:/run/php/php7.4-fpm.sock;
	#	# With php-cgi (or other tcp sockets):
	#	fastcgi_pass 127.0.0.1:9000;
	#}

	# deny access to .htaccess files, if Apache's document root
	# concurs with nginx's one
	#
	#location ~ /\.ht {
	#	deny all;
	#}


    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bwicarus.space/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bwicarus.space/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = bwicarus.space) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


	listen 80 ;
	listen [::]:80 ;
    server_name bwicarus.space;
    return 404; # managed by Certbot


}
