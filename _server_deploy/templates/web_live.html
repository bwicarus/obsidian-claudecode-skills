<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="apple-touch-icon" href="/static/icons/web.png">
<link rel="icon" type="image/png" href="/static/icons/web-32.png">
<meta name="apple-mobile-web-app-title" content="网页">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>🌐 {{ url_esc }}</title>
<link rel="stylesheet" href="/static/pdf/epub-styles.css?v={{ reader_js_v }}">
<style>
  /* 实况网页 = 一种**内容源**:壳(顶栏 #ep-top / 侧栏 #ep-side / 全部 rc-*)照搬 EPUB 阅读器,
     只把"章节内容区"换成同源代理 iframe。铁律:不为新形态另造上层建筑。 */
  html,body{margin:0;height:100%;overflow:hidden}
  #wl-url{flex:1 1 auto;min-width:0;background:#0d1322;border:1px solid #2a3550;color:#cfe6ff;
    border-radius:17px;height:34px;padding:0 14px;font-size:13px;outline:none;font-family:inherit}
  #wl-url:focus{border-color:#3b6db5}
  #wl-body{position:absolute;left:0;right:0;bottom:0;top:calc(48px + env(safe-area-inset-top));background:#fff}
  #wl-frame{width:100%;height:100%;border:0;display:block}
  #wl-load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:#0a0e1a;color:#8a9bb4;font-size:14px;z-index:5}
  /* 选区工具条:复用 EPUB 的 #ep-sel 视觉(同一份 epub-styles.css) */
  #ep-sel{position:fixed;z-index:60;display:none}
</style>
</head>
<body data-theme="night">
  <div id="ep-top">
    <button id="wl-home" title="搜索主页" onclick="location.href='/pdf/web?home=1'"><svg class="rc-tbi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.2"/><path d="M15.6 15.6L20 20"/></svg></button>
    <button id="wl-back" title="后退" onclick="wlBack()">←</button>
    <input id="wl-url" value="{{ url_esc }}" spellcheck="false" autocomplete="off" title="地址栏:输网址或搜索词">
    <button id="wl-reader" title="阅读模式:抽正文进阅读器(可高亮/存 vault/进搜索与概念网)">📄</button>
    <button id="ep-fav-btn" title="收藏当前章到收藏夹（书架「⭐ 收藏夹」tab 可查看）"><svg class="rc-tbi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3.5l2.47 5.29 5.53.7-4.1 3.95 1.06 5.56L12 16.9 7.04 19l1.06-5.56-4.1-3.95 5.53-.7L12 3.5z"/></svg></button>
    <button id="ep-search-btn" title="搜索"><svg class="rc-tbi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.2"/><path d="M15.6 15.6L20 20"/></svg></button>
    <button id="fs-toggle" title="全屏">⛶</button>
    <button id="ep-set-btn" title="设置"><svg class="rc-tbi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M21 12h-2.5M5.5 12H3M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8M18.4 18.4l-1.8-1.8M7.4 7.4L5.6 5.6"/></svg></button>
  </div>
  <div id="ep-bar"></div>

  <div id="wl-body">
    <div id="wl-load">🌐 加载中…</div>
    <iframe id="wl-frame" src="/pdf/web/proxy?url={{ url|urlencode }}"></iframe>
  </div>

  <!-- 选区工具条(id/class 与 EPUB 同源,样式来自 epub-styles.css) -->
  <div id="ep-sel">
    <button data-act="dict">📖 查词</button>
    <button data-act="translate">🌐 翻译</button>
    <button data-act="explain">💡 解释</button>
    <button data-act="grammar">📊 语法</button>
    <button data-act="chat">💬 问AI</button>
    <button data-act="note">📝 笔记</button>
    <button data-act="anki">🃏 制卡</button>
  </div>
  <div id="ep-dict"></div>
  <div id="word-pop" onclick="event.stopPropagation()"></div>
  <div id="ep-hlpop"></div>

  <aside id="ep-side">
    <!-- 助手 pane 由共享侧栏动态建(rc-assistant.mountPdfSidebar → #side-pane-asst,与 PDF 同一份代码);
         旧内联助手静态 DOM(#ep-side-asst/#ep-ai-*)已随内联助手退役删除(2026-07-07 清理批次) -->
    <div class="ep-side-pane" data-pane="vocab" id="ep-side-vocab">
      <div id="ep-vocab-scope-row">
        <button data-scope="chapter" onclick="loadVocabPane('chapter')">本章</button>
        <button class="active" data-scope="book" onclick="loadVocabPane('book')">本书</button>
        <button data-scope="all" onclick="loadVocabPane('all')">全部</button>
        <span class="vocab-count" id="ep-vocab-count"></span>
      </div>
      <div id="ep-vocab-list"><div style="color:#5a6680;font-size:12px;padding:10px">点开载入…</div></div>
    </div>
    <div class="ep-side-pane" data-pane="kg" id="ep-side-kg"><div id="ep-kg-nodes"><div class="kg-empty">点开载入…</div></div></div>
    <div class="ep-side-pane" data-pane="hl" id="ep-side-hl"><div class="ep-empty">点开载入高亮…</div></div>
    <div class="ep-side-pane" data-pane="toc" id="ep-side-toc"><div id="ep-toc-list"></div></div>
    <div class="ep-side-pane" data-pane="hist" id="ep-side-hist"><div id="ep-qhist-list"></div></div><!-- 查询结果历史(镜像 PDF,统一抽屉 tab 对等) -->

    <!-- 语法分析 pane(共享核心 RC.grammar 接管:块渲染/结构图/流式/制卡都在 rc-grammar.js,本模板只提供容器)
         照搬 epub_reader.html(epub.js 版)的既有结构,两个 EPUB 阅读器变体共用同一套 id / UX 文案。 -->
    <div class="ep-side-pane" data-pane="grammar" id="ep-side-grammar">
      <div id="ep-grammar-set">
        <div id="ep-grammar-set-head">⚙ 启用语法 KG <span class="gset-caret">▸</span></div>
        <div id="ep-grammar-kglist"><div class="rc-gram-kg-empty">展开载入…</div></div>
      </div>
      <div id="ep-grammar-body"><div class="gb-empty">选词/选句后点「📊 语法」分析所在整句。<br>需先在下方「⚙ 启用语法 KG」勾选至少一本（去技能树点节点「👁 跟踪」）。</div></div>
    </div>
  </aside>

<script src="/static/qa/marked.js?v={{ reader_js_v }}"></script>
<script src="/static/qa/mathjax-full.js?v={{ reader_js_v }}" async></script>
<script src="/static/pdf/rc-ink.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-core.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-md.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-figures.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-highlight.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-snippets.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-result.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-wordpop.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-phrasepop.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-settings.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-knowledge.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-sidedrawer.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-assistant.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-toolchip.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-turncard.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-voicecall.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-grammar.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-stickynote.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-favorites.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-video.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-videoplayer.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-userpages.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/web-adapter.js?v={{ reader_js_v }}"></script>
<script>
  window.__WEB_CFG = { url: {{ url|tojson }} };
</script>
</body>
</html>
