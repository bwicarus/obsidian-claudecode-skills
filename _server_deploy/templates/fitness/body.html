{% extends "fitness/_base.html" %}
{% block title %}3D 肌群图{% endblock %}
{% block content %}
<div class="card" style="padding:0;overflow:hidden;">
  <div id="body3d" style="width:100%;height:68vh;min-height:420px;position:relative;
        background:radial-gradient(circle at 50% 30%, #1a2535, #0a0e15);touch-action:none;">
    <div id="b3-loading" style="position:absolute;inset:0;display:flex;align-items:center;
         justify-content:center;color:var(--text-dim);font-size:13px;">加载 3D 肌肉模型…</div>
    <div id="b3-legend" style="position:absolute;right:10px;top:10px;background:#0a0f1ca8;
         border:1px solid var(--border);border-radius:8px;padding:7px 11px;font-size:11px;line-height:1.9;"></div>
    <div id="b3-info" style="position:absolute;left:10px;right:10px;bottom:10px;background:#0a0f1cee;
         border:1px solid var(--border);border-radius:8px;padding:9px 13px;font-size:13px;display:none;line-height:1.55;"></div>
  </div>
</div>
<div class="card small dim">
  拖动旋转 · 双指缩放 · 点肌肉看详情。颜色 = <b>拮抗肌群力量对比</b>（同器械 est-1RM，主信号）；力量比测不了的肌群回退近 4 周训练量；灰 = 数据不足。
  <span style="display:inline-block;margin-top:6px;">
    <button class="btn small" id="b3-front">正面</button>
    <button class="btn small" id="b3-back">背面</button>
    <a class="btn small" href="/private/fitness/">🩺 看体检详情</a>
  </span>
</div>
{% endblock %}

{% block scripts %}
<script type="module">
import * as THREE from '/static/three/three.module.min.js';
import { OrbitControls } from '/static/three/OrbitControls.js';
import { GLTFLoader } from '/static/three/GLTFLoader.js';

const COL = { green: 0x3fb950, yellow: 0xd29922, red: 0xf85149, insufficient: 0x49515f };
const STATUS_TXT = { green: '充足/均衡', yellow: '偏弱', red: '明显弱/失衡', insufficient: '数据不足' };
const RANK = { red: 3, yellow: 2, green: 1, insufficient: 0 };

// GLB 网格节点名 → balance_profile 的 data key(可多个,取最差作上色;keys=[] 表示当前计划未单独追踪)
const MESH_MAP = {
  chest:      { keys: ['chest'],      label: '胸' },
  abs:        { keys: ['core'],       label: '核心 / 腹' },
  lats:       { keys: ['back'],       label: '背阔肌（拉）' },
  upper_back: { keys: ['back'],       label: '上背 / 划船（拉）' },
  delts:      { keys: ['side_delt','front_delt','rear_delt'], label: '三角肌（肩）' },
  biceps:     { keys: ['biceps'],     label: '二头' },
  triceps:    { keys: ['triceps'],    label: '三头' },
  glutes:     { keys: ['glutes'],     label: '臀' },
  quads:      { keys: ['quads'],      label: '股四头' },
  hamstrings: { keys: ['hamstrings'], label: '腘绳' },
  calves:     { keys: ['calves'],     label: '小腿' },
  traps:      { keys: [],             label: '斜方肌' },
  lower_back: { keys: [],             label: '下背 / 竖脊肌' },
  forearms:   { keys: [],             label: '前臂' },
  adductors:  { keys: [],             label: '内收肌（大腿内侧）' },
};

const host = document.getElementById('body3d');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, host.clientWidth / host.clientHeight, 0.05, 100);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(host.clientWidth, host.clientHeight);
host.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.1; controls.enablePan = false;
controls.target.set(0, 0, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const dl = new THREE.DirectionalLight(0xffffff, 1.0); dl.position.set(1.2, 2.0, 2.5); scene.add(dl);
const dl2 = new THREE.DirectionalLight(0x88aaff, 0.5); dl2.position.set(-1.5, 0.5, -2.5); scene.add(dl2);
const dl3 = new THREE.DirectionalLight(0xffffff, 0.3); dl3.position.set(0, -1.5, 1); scene.add(dl3);

let DATA = {};
const muscleMeshes = [];   // 所有可点的肌肉网格(每块 1 mesh / 1 material)
let _fitR = 3.0;           // fit 后的相机距离
let _targetY = 0;          // 视野中心 Y(整体含头居中)

// 图例
document.getElementById('b3-legend').innerHTML = ['green', 'yellow', 'red', 'insufficient']
  .map(s => `<div><span style="display:inline-block;width:10px;height:10px;border-radius:50%;
    background:#${COL[s].toString(16).padStart(6, '0')};margin-right:5px;vertical-align:-1px;"></span>${STATUS_TXT[s]}</div>`).join('');

function statusOf(mkey){
  const m = MESH_MAP[mkey]; if (!m || !m.keys.length) return 'insufficient';
  let best = 'insufficient';
  for (const k of m.keys){
    const st = ((DATA.muscles || {})[k] || {}).status || 'insufficient';
    if (RANK[st] > RANK[best]) best = st;
  }
  return best;
}
function colorAll(){
  for (const mesh of muscleMeshes){
    const st = statusOf(mesh.userData.mkey);
    const c = COL[st] || COL.insufficient;
    mesh.material.color.setHex(c);
    mesh.material.emissive.setHex(c);
    mesh.material.emissiveIntensity = (st === 'insufficient') ? 0.04 : 0.17;
    mesh.material.opacity = (st === 'insufficient') ? 0.55 : 0.97;
    mesh.material.needsUpdate = true;
  }
}

function showInfo(mkey){
  const info = document.getElementById('b3-info');
  const mm = MESH_MAP[mkey]; if (!mm){ info.style.display = 'none'; return; }
  if (!mm.keys.length){
    info.innerHTML = `<span style="font-weight:700;">${mm.label}</span>
      <span class="dim"> · 暂无该肌群的训练数据（当前计划未单独追踪）</span>`;
    info.style.display = 'block'; return;
  }
  const parts = mm.keys.map(k => {
    const d = (DATA.muscles || {})[k]; if (!d) return null;
    const c = '#' + (COL[d.status] || COL.insufficient).toString(16).padStart(6, '0');
    let extra = '';
    if (d.metric) extra = ` · ${d.metric} = ${d.value == null ? '—' : d.value}`;
    else if (d.weekly != null) extra = ` · 周均 ${d.weekly} 组`;
    return `<span style="color:${c};font-weight:700;">${d.label || k}</span><span style="color:${c};">[${STATUS_TXT[d.status] || ''}]</span>${extra}`;
  }).filter(Boolean);
  info.innerHTML = `<span style="font-weight:700;">${mm.label}</span>` +
    (parts.length ? '<br>' + parts.join('　·　') : ' <span class="dim">数据不足</span>');
  info.style.display = 'block';
}

// 点选(只在"轻点"时触发,拖动旋转不触发)
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let _downX = 0, _downY = 0, _moved = false;
renderer.domElement.addEventListener('pointerdown', e => { _downX = e.clientX; _downY = e.clientY; _moved = false; });
renderer.domElement.addEventListener('pointermove', e => {
  if (Math.abs(e.clientX - _downX) > 8 || Math.abs(e.clientY - _downY) > 8) _moved = true;
});
renderer.domElement.addEventListener('pointerup', e => {
  if (_moved) return;   // 拖动结束,不当作点选
  const r = renderer.domElement.getBoundingClientRect();
  ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(muscleMeshes, false)[0];
  if (hit) showInfo(hit.object.userData.mkey);
});

// 正/背面
let _camAnim = null;
function camTo(z){ _camAnim = { from: camera.position.clone(), to: new THREE.Vector3(0, _targetY, z), t: 0 }; }
document.getElementById('b3-front').onclick = () => camTo(_fitR);
document.getElementById('b3-back').onclick  = () => camTo(-_fitR);

function resize(){ camera.aspect = host.clientWidth / host.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(host.clientWidth, host.clientHeight); }
addEventListener('resize', resize);
function loop(){
  requestAnimationFrame(loop);
  if (_camAnim){ _camAnim.t = Math.min(1, _camAnim.t + 0.05); camera.position.lerpVectors(_camAnim.from, _camAnim.to, _camAnim.t); camera.lookAt(0, _targetY, 0); if (_camAnim.t >= 1) _camAnim = null; }
  controls.update(); renderer.render(scene, camera);
}
loop();

function meshWorldZ(key){
  const m = muscleMeshes.find(x => x.userData.mkey === key); if (!m) return null;
  return new THREE.Box3().setFromObject(m).getCenter(new THREE.Vector3()).z;
}

// 载入解剖肌肉模型
const loader = new GLTFLoader();
loader.load('/static/fitness/body_muscles.glb?v=2', (gltf) => {
  const root = gltf.scene;
  root.traverse(o => {
    if (!o.isMesh) return;
    const isHead = (o.name === 'head' || (o.parent && o.parent.name === 'head'));
    if (isHead){
      // 模型自带的解剖头(颅骨+面肌+颈)：中性骨色，不参与强弱上色、不可点
      o.material = new THREE.MeshStandardMaterial({ color: 0xe0d6c4, roughness: 0.78, metalness: 0.0, side: THREE.DoubleSide });
      return;
    }
    const key = (o.name in MESH_MAP) ? o.name
              : (o.parent && o.parent.name in MESH_MAP) ? o.parent.name : null;
    o.material = new THREE.MeshStandardMaterial({
      color: COL.insufficient, emissive: COL.insufficient, emissiveIntensity: 0.1,
      roughness: 0.55, metalness: 0.0, transparent: true, opacity: 0.95, side: THREE.DoubleSide });
    if (key){ o.userData.mkey = key; muscleMeshes.push(o); }
  });
  // 朝向:此 GLB 是"躺着"的(身高轴=Z,头在 -Z,胸朝 +Y)。绕 X +90° → 站立且胸朝相机(+Z)。已离线核验。
  root.rotation.x = Math.PI / 2;
  root.updateMatrixWorld(true);
  // auto-fit: 缩放到身高 ~1.7 + 居中到原点
  let box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  root.scale.multiplyScalar(1.7 / Math.max(0.001, size.y));
  root.updateMatrixWorld(true);
  box = new THREE.Box3().setFromObject(root);
  root.position.sub(box.getCenter(new THREE.Vector3()));
  root.updateMatrixWorld(true);
  // 防呆:确认胸在前(世界 +Z);若不是绕世界 Y 翻 180°
  const cz = meshWorldZ('chest'), lz = meshWorldZ('lats');
  if (cz == null || lz == null) console.warn('[body3d] chest/lats mesh 缺失，朝向防呆 guard 跳过；若换了 GLB 请核验模型命名/朝向');
  if (cz != null && lz != null && cz < lz){
    console.warn('[body3d] chest 在 lats 之后 → 触发翻转 guard(冷路径)。换 GLB 后请核验朝向。');
    root.rotateOnWorldAxis(new THREE.Vector3(0, 1, 0), Math.PI);
    root.updateMatrixWorld(true);
    root.position.sub(new THREE.Box3().setFromObject(root).getCenter(new THREE.Vector3()));
    root.updateMatrixWorld(true);
  }
  scene.add(root);
  root.updateMatrixWorld(true);
  // 整体 bbox(已含模型自带的头) → 相机距离 + 垂直居中
  const full = new THREE.Box3().setFromObject(root);
  const fc = full.getCenter(new THREE.Vector3());
  _targetY = fc.y;
  const fh = Math.max(0.1, full.max.y - full.min.y);
  _fitR = (fh * 0.5) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.18;
  controls.minDistance = _fitR * 0.45; controls.maxDistance = _fitR * 2.6;
  controls.target.set(0, _targetY, 0);
  camera.position.set(0, _targetY, _fitR); camera.lookAt(0, _targetY, 0);
  document.getElementById('b3-loading').style.display = 'none';
  loadData();
}, undefined, (err) => {
  document.getElementById('b3-loading').textContent = '模型加载失败：' + (err && err.message ? err.message : err);
});

function loadData(){
  fetch('/api/fitness/balance_profile').then(r => r.json()).then(d => {
    if (d && d.ok) DATA = d;
    colorAll();
    const info = document.getElementById('b3-info');
    const prof = (d || {}).profile || {};
    const sr = prof.strength_ratios || [];
    const bad = sr.filter(r => r.status === 'red' || r.status === 'yellow');
    const insuf = sr.filter(r => r.status === 'insufficient');
    if (bad.length){
      info.innerHTML = '点肌肉看详情 · 力量失衡：' + bad.map(r => r.name.replace(' 力量比', '')).join('、');
      info.style.display = 'block';
    } else if ((prof.total_logged_sets || 0) < 8){
      info.innerHTML = '记录的训练还太少，多覆盖 Push/Pull/Legs 才能算力量比。'; info.style.display = 'block';
    } else if (insuf.length){
      info.innerHTML = '力量平衡看起来 OK · 还有 ' + insuf.length + ' 对因缺同器械动作未能评估（点对应肌肉看补什么）';
      info.style.display = 'block';
    }
  }).catch(() => { colorAll(); });
}
</script>
{% endblock %}
