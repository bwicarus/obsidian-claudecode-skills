{% extends "fitness/_base.html" %}
{% block title %}训练历史{% endblock %}
{% block content %}

<div class="card">
  <h2>历史记录</h2>
  <p class="small dim">看每个动作的进度曲线。点动作名展开历史。</p>
  <label class="small dim">筛选动作:
    <select id="ex-filter" style="background:var(--bg);color:var(--text);
                                  border:1px solid var(--border);border-radius:4px;
                                  padding:6px 8px;font-size:14px;">
      <option value="">全部</option>
      {% for day in plan.days %}
      <optgroup label="{{ day.name }}">
        {% for ex in day.exercises %}
        <option value="{{ ex.id }}">{{ ex.name }}</option>
        {% endfor %}
      </optgroup>
      {% endfor %}
    </select>
  </label>
</div>

<div class="card" id="chart-card" style="display:none;">
  <div style="display:flex;gap:8px;align-items:baseline;justify-content:space-between;flex-wrap:wrap;">
    <h3 id="chart-title" style="margin:0;color:var(--text);"></h3>
    <div class="small">
      <label style="cursor:pointer;"><input type="radio" name="metric" value="top" checked> 顶组重量</label>
      <label style="cursor:pointer;margin-left:8px;"><input type="radio" name="metric" value="e1rm"> 估 1RM</label>
      <label style="cursor:pointer;margin-left:8px;"><input type="radio" name="metric" value="vol"> 总容量</label>
    </div>
  </div>
  <div id="chart-svg" style="margin-top:10px;overflow-x:auto;"></div>
  <div class="small dim" id="chart-note" style="margin-top:4px;"></div>
</div>

<div class="card">
  <div id="history-list">
    <p class="dim">加载中…</p>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
const PLAN = {{ plan | tojson }};
const EX_NAME = {};
PLAN.days.forEach(d => d.exercises.forEach(e => { EX_NAME[e.id] = e.name; }));

let _lastRows = [];   // 当前筛选的原始行(切换 metric 时重画图不用重新拉)

async function load(exId) {
  const url = '/api/fitness/history' + (exId ? '?exercise_id=' + encodeURIComponent(exId) : '');
  const r = await fetch(url);
  const d = await r.json();
  const root = document.getElementById('history-list');
  root.innerHTML = '';
  _lastRows = (d.ok && d.rows) ? d.rows : [];
  // 单动作筛选 → 画进度曲线;全部 → 隐藏图
  const chartCard = document.getElementById('chart-card');
  if (exId && _lastRows.length) {
    chartCard.style.display = 'block';
    document.getElementById('chart-title').textContent = (EX_NAME[exId] || exId) + ' 进度';
    drawChart();
  } else {
    chartCard.style.display = 'none';
  }
  if (!d.ok || !d.rows || d.rows.length === 0) {
    root.innerHTML = '<p class="dim">暂无记录。</p>';
    return;
  }
  // group by date
  const byDate = {};
  d.rows.forEach(r => {
    if (!byDate[r.date]) byDate[r.date] = [];
    byDate[r.date].push(r);
  });
  const dates = Object.keys(byDate).sort().reverse();
  dates.forEach(date => {
    const block = document.createElement('div');
    block.style.marginBottom = '20px';
    const h = document.createElement('h3');
    h.textContent = date;
    h.style.color = 'var(--text)';
    block.appendChild(h);

    // group by exercise within date
    const byEx = {};
    byDate[date].forEach(r => {
      if (!byEx[r.exercise_id]) byEx[r.exercise_id] = [];
      byEx[r.exercise_id].push(r);
    });

    Object.keys(byEx).forEach(exId => {
      const sets = byEx[exId].sort((a,b) => a.set_no - b.set_no);
      const row = document.createElement('div');
      row.style.marginBottom = '6px';
      row.style.fontSize = '14px';
      const sum = sets.map(s => `${s.weight_kg ?? '?'}kg×${s.reps ?? '?'}`).join(' / ');
      const total = sets.reduce((a,s) => a + (s.weight_kg||0) * (s.reps||0), 0);
      row.innerHTML = `<strong>${EX_NAME[exId] || exId}</strong>:
        <span class="dim">${sum}</span>
        <span class="dim small"> · 总量 ${total.toFixed(0)} kg</span>`;
      block.appendChild(row);
    });
    root.appendChild(block);
  });
}

// ───────────── 进度曲线(纯 SVG,无外部依赖)─────────────
function _metric() {
  const el = document.querySelector('input[name=metric]:checked');
  return el ? el.value : 'top';
}

function _seriesFromRows(rows, metric) {
  // 按日期聚合该动作:顶组重量 / 估1RM(Epley) / 总容量
  const byDate = {};
  rows.forEach(r => {
    if (r.weight_kg == null || r.reps == null) return;
    (byDate[r.date] = byDate[r.date] || []).push(r);
  });
  const pts = [];
  Object.keys(byDate).sort().forEach(date => {
    const sets = byDate[date];
    let val = 0;
    if (metric === 'vol') {
      val = sets.reduce((a, s) => a + (s.weight_kg || 0) * (s.reps || 0), 0);
    } else if (metric === 'e1rm') {
      val = Math.max(...sets.map(s => (s.weight_kg > 0 && s.reps > 0) ? s.weight_kg * (1 + s.reps / 30) : 0));
    } else {  // top
      val = Math.max(...sets.map(s => s.weight_kg || 0));
    }
    pts.push({ date, val: Math.round(val * 10) / 10 });
  });
  return pts;
}

function drawChart() {
  const metric = _metric();
  const pts = _seriesFromRows(_lastRows, metric);
  const host = document.getElementById('chart-svg');
  const note = document.getElementById('chart-note');
  const unit = metric === 'vol' ? 'kg(容量)' : 'kg';
  if (pts.length < 2) {
    host.innerHTML = '<p class="dim small">至少练 2 次才有曲线。</p>';
    note.textContent = pts.length === 1 ? `仅 1 次记录: ${pts[0].val}${unit}` : '';
    return;
  }
  const W = Math.max(320, Math.min(900, pts.length * 70));
  const H = 200, padL = 44, padR = 12, padT = 16, padB = 36;
  const vals = pts.map(p => p.val);
  let mn = Math.min(...vals), mx = Math.max(...vals);
  if (mn === mx) { mn = mn * 0.95; mx = mx * 1.05 || 1; }
  const pad = (mx - mn) * 0.1; mn -= pad; mx += pad;
  const X = i => padL + (W - padL - padR) * (pts.length === 1 ? 0.5 : i / (pts.length - 1));
  const Y = v => padT + (H - padT - padB) * (1 - (v - mn) / (mx - mn));
  // y 轴刻度 3 条
  let grid = '';
  for (let k = 0; k <= 2; k++) {
    const v = mn + (mx - mn) * k / 2;
    const y = Y(v);
    grid += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#2d333b" stroke-width="1"/>`;
    grid += `<text x="${padL - 6}" y="${y + 4}" fill="#7d8590" font-size="11" text-anchor="end">${(Math.round(v * 10) / 10)}</text>`;
  }
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.val).toFixed(1)}`).join(' ');
  let dots = '', labels = '';
  pts.forEach((p, i) => {
    dots += `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.val).toFixed(1)}" r="3.5" fill="#3fb950"/>`;
    // x 轴日期(只标首/中/末,避免拥挤)
    if (i === 0 || i === pts.length - 1 || i === Math.floor(pts.length / 2)) {
      const md = p.date.slice(5);  // MM-DD
      labels += `<text x="${X(i).toFixed(1)}" y="${H - 12}" fill="#7d8590" font-size="10" text-anchor="middle">${md}</text>`;
    }
    // 最后一个点标值
    if (i === pts.length - 1) {
      labels += `<text x="${X(i).toFixed(1)}" y="${(Y(p.val) - 8).toFixed(1)}" fill="#e6edf3" font-size="11" text-anchor="end">${p.val}</text>`;
    }
  });
  host.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="max-width:100%;">
    ${grid}
    <path d="${line}" fill="none" stroke="#3fb950" stroke-width="2"/>
    ${dots}${labels}
  </svg>`;
  const first = pts[0].val, last = pts[pts.length - 1].val;
  const delta = last - first;
  const pct = first ? (delta / first * 100) : 0;
  note.innerHTML = `${pts.length} 次记录 · 从 ${first}${unit} → ${last}${unit} · `
    + (delta >= 0 ? `<span style="color:var(--accent-2)">↑ +${delta.toFixed(1)} (+${pct.toFixed(0)}%)</span>`
                  : `<span style="color:var(--warn)">↓ ${delta.toFixed(1)} (${pct.toFixed(0)}%)</span>`);
}

document.querySelectorAll('input[name=metric]').forEach(r =>
  r.addEventListener('change', drawChart));

document.getElementById('ex-filter').addEventListener('change', e => load(e.target.value));
load('');
</script>
{% endblock %}
