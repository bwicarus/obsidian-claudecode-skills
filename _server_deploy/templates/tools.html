<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🧰 工具库</title>
<script src="/static/qa/marked.js?v={{ js_v }}"></script>
<script>window.MathJax = { tex: { inlineMath: [['$','$'], ['\\(','\\)']] }, options: { enableMenu: false } };</script>
<script src="/static/qa/mathjax-full.js?v={{ js_v }}" async></script>
<!-- 一份代码(用户设计):流程条/详情窗/设置=rc-toolchip,轮次卡/CLI 追踪=rc-turncard,与阅读器完全同文件 -->
<script src="/static/pdf/rc-core.js?v={{ js_v }}"></script>
<script src="/static/pdf/rc-md.js?v={{ js_v }}"></script>
<script src="/static/pdf/rc-assistant.js?v={{ js_v }}"></script>
<script src="/static/pdf/rc-toolchip.js?v={{ js_v }}"></script>
<script src="/static/pdf/rc-turncard.js?v={{ js_v }}"></script>
<script src="/static/pdf/rc-voicecall.js?v={{ js_v }}"></script><!-- 只取 RC.voiceCard.css(.vc-*/.rc-turn-* 全套样式)+ __vcInfoCardEl;通话 UI 只在 #asst-input 存在时挂,本页没有 -->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: #0b1120; color: #dfe8fa; font: 14px/1.6 -apple-system, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
         display: flex; flex-direction: column; height: 100dvh; }
  /* iOS 全屏(viewport-fit=cover):header 给系统状态栏让位,否则标题被盖住(用户实测) */
  header { flex: 0 0 auto; z-index: 50; display: flex; align-items: center; gap: 12px;
           padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
           background: rgba(11,17,32,.92); border-bottom: 1px solid #1d2a47; backdrop-filter: blur(8px); }
  header h1 { font-size: 17px; margin: 0; flex: 0 0 auto; }
  header .sp { flex: 1; }
  header select { background: #14203a; color: #cdd9f2; border: 1px solid #2a3a63; border-radius: 9px; padding: 6px 10px; font-size: 13px; max-width: 46vw; }
  main { display: grid; grid-template-columns: minmax(300px, 420px) 1fr; gap: 0; flex: 1; min-height: 0; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; grid-template-rows: 45% 55%; } }
  /* 左列:工具列表 */
  #tl-list { overflow-y: auto; padding: 12px; border-right: 1px solid #16213b; }
  .tl-card { background: #101a30; border: 1px solid #22304f; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  .tl-hd { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tl-name { font-weight: 700; font-size: 15px; }
  .tl-kind { flex: 0 0 auto; font-size: 11px; padding: 2px 8px; border-radius: 8px; border: 1px solid; }
  .tl-kind.intent { color: #a9e6b8; border-color: #2f6d45; background: #12281c; }
  .tl-kind.trace  { color: #a8c4f0; border-color: #2a3a63; background: #131f38; }
  .tl-kind.paper  { color: #f0d9a8; border-color: #6d5a2f; background: #282112; }
  .tl-int { margin: 6px 0 2px; font-size: 12.5px; color: #9fb2d6; }
  .tl-int b { color: #cdd9f2; }
  .tl-flow { margin-top: 8px; }
  .tl-ops { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .tl-b { -webkit-appearance: none; appearance: none; background: #14203a; border: 1px solid #2a3a63; color: #cdd9f2;
          border-radius: 9px; padding: 5px 12px; font-size: 12.5px; cursor: pointer; touch-action: manipulation; }
  .tl-b.pri { background: #2b4a8f; border-color: #4a6fd0; color: #fff; }
  .tl-b.danger { color: #ff9d9d; border-color: rgba(200,90,90,.5); }
  .tl-empty { color: #6f7fa3; text-align: center; margin-top: 40px; font-size: 13px; }
  .tl-tabs { display: flex; gap: 6px; margin-bottom: 10px; position: sticky; top: 0; background: #0b1120; padding: 2px 0 8px; z-index: 5; }
  .tl-tab { flex: 1; text-align: center; background: #101a30; border: 1px solid #22304f; color: #9fb2d6; border-radius: 9px; padding: 6px 0; font-size: 13px; cursor: pointer; }
  .tl-tab.on { background: #2b4a8f; border-color: #4a6fd0; color: #fff; }
  .tl-bi { background: #0e1628; border: 1px solid #1c2946; border-radius: 10px; padding: 9px 12px; margin-bottom: 8px; }
  .tl-bi-n { font-weight: 600; font-size: 13.5px; }
  .tl-bi-d { color: #8fa2c6; font-size: 12px; margin: 3px 0 7px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #tl-modal { position: fixed; inset: 0; z-index: 300; background: rgba(5,9,18,.72); display: none; align-items: flex-start; justify-content: center; padding: calc(env(safe-area-inset-top,0px) + 30px) 14px 30px; overflow-y: auto; }
  #tl-modal.on { display: flex; }
  #tl-modal .box { background: #0f1930; border: 1px solid #2a3a63; border-radius: 14px; max-width: 560px; width: 100%; padding: 14px 16px; max-height: 82vh; overflow-y: auto; }
  #tl-modal .box h3 { margin: 0 0 8px; font-size: 15px; }
  #tl-modal .x { float: right; cursor: pointer; color: #8fa2c6; font-size: 18px; padding: 0 4px; }
  /* 右列:聊天 */
  #tl-chat { display: flex; flex-direction: column; min-width: 0; }
  #asst-thread { flex: 1; overflow-y: auto; padding: 14px 16px 8px; }
  /* 气泡基础样式(阅读器里在 reader CSS,这里补一份最小等价;.vc-*/.rc-turn-* 来自 RC.voiceCard.css 同源注入) */
  .asst-msg { max-width: 92%; margin: 0 0 10px; padding: 10px 13px; border-radius: 13px; word-break: break-word; overflow-wrap: anywhere; }
  .asst-a { background: #101a30; border: 1px solid #1e2c4d; margin-right: auto; }
  .asst-u { background: #2b4a8f; color: #fff; margin-left: auto; }
  .asst-msg pre { overflow-x: auto; background: #0b1322; border-radius: 8px; padding: 8px; }
  .asst-msg code { background: #0b1322; border-radius: 4px; padding: 0 4px; }
  .asst-msg img { max-width: 100%; border-radius: 8px; }
  #tl-inrow { display: flex; gap: 8px; padding: 10px 12px calc(env(safe-area-inset-bottom, 0px) + 10px); border-top: 1px solid #16213b; }
  #tl-input { flex: 1; background: #14203a; border: 1px solid #2a3a63; color: #dfe8fa; border-radius: 11px;
              padding: 9px 12px; font-size: 14px; outline: none; }
  #tl-send { flex: 0 0 auto; }
  /* 沙盒预览:右侧滑出真实阅读器 iframe(打开沙盒副本;CLI 产物经 SSE 推给它执行) */
  #tl-sb-badge { flex: 0 0 auto; font-size: 11.5px; color: #a9e6b8; border: 1px solid #2f6d45; background: #12281c; border-radius: 8px; padding: 2px 8px; }
  #tl-sim { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 94vw); z-index: 200;
            background: #0b1120; border-left: 1px solid #2a3a63; box-shadow: -12px 0 40px rgba(0,0,0,.5);
            display: flex; flex-direction: column; }
  #tl-sim[hidden] { display: none; }
  .tl-sim-hd { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #9fb2d6;
               padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px; border-bottom: 1px solid #1d2a47; }
  .tl-sim-hd .sp { flex: 1; }
  #tl-sim-f { flex: 1; border: 0; width: 100%; background: #0b1120; }
</style>
</head>
<body>
<header>
  <h1>🧰 工具库</h1>
  <span class="sp"></span>
  <label style="font-size:12px;color:#8fa2c6">测试上下文</label>
  <select id="tl-book"><option value="">(不带书)</option></select>
  <span id="tl-sb-badge" title="测试都在书的沙盒副本上跑,不动原书">🧪 沙盒</span>
  <button id="tl-sim-open" class="tl-b">👁 预览</button>
</header>
<main>
  <div id="tl-list">
    <div class="tl-tabs">
      <div class="tl-tab on" data-t="mine">我的工具</div>
      <div class="tl-tab" data-t="builtin">内置工具</div>
    </div>
    <div id="tl-mine"><div class="tl-empty">加载中…</div></div>
    <div id="tl-builtin" style="display:none"><div class="tl-empty">加载中…</div></div>
  </div>
  <div id="tl-modal"><div class="box"><span class="x">✕</span><h3 id="tl-modal-t"></h3><div id="tl-modal-b"></div></div></div>
  <div id="tl-chat">
    <div id="asst-thread"></div>
    <div id="tl-inrow">
      <input id="tl-input" type="text" placeholder="和 AI 聊工具:测试、调整、问它会怎么跑…" autocomplete="off">
      <button id="tl-send" class="tl-b pri">发送</button>
    </div>
  </div>
</main>
<div id="tl-sim" hidden>
  <div class="tl-sim-hd">🧪 沙盒预览 · 真实阅读器(可手写/点检查),<b>不动原书</b>
    <span id="tl-sim-info" style="color:#7a8bb0"></span>
    <span class="sp"></span>
    <button id="tl-sim-reload" class="tl-b" title="重新载入预览">↻</button>
    <button id="tl-sim-reset" class="tl-b" title="把沙盒恢复成原书的干净副本">♻ 重置沙盒</button>
    <button id="tl-sim-ext" class="tl-b" title="在新页签打开">↗</button>
    <button id="tl-sim-x" class="tl-b">✕ 收起</button>
  </div>
  <iframe id="tl-sim-f" title="沙盒预览"></iframe>
</div>
<script>
(function () {
  var RC = window.RC || {};
  try { RC.voiceCard && RC.voiceCard.css && RC.voiceCard.css(); } catch (e) {}   // .vc-*/.rc-turn-* 样式(与阅读器同源)
  // renderMd 垫片:rc-assistant 的完整版在阅读器挂载后才导出;本页用 RC.md 等价核心(丢的只有页码链接化)
  RC.assistant = RC.assistant || {};
  if (!RC.assistant.renderMd) RC.assistant.renderMd = function (el, t, wm) { try { el.innerHTML = RC.md(t || ''); if (wm !== false && RC.typeset) RC.typeset(el); } catch (e) { el.textContent = t || ''; } };
  var CLI_TOOLS = { do_task: 1, make_paper: 1, read_check_report: 1, run_saved_task: 1 };
  var thread = document.getElementById('tl-thread') || document.getElementById('asst-thread');

  // ── 书选择(测试上下文;造纸类工具需要书) ──────────────────────────────
  var bookSel = document.getElementById('tl-book');
  fetch('/pdf/api/list-pdfs').then(function (r) { return r.json(); }).then(function (d) {
    (d.pdfs || []).slice(0, 25).forEach(function (b, i) {
      var o = document.createElement('option'); o.value = b.rel; o.textContent = b.name;
      bookSel.appendChild(o);
      if (i === 0) bookSel.value = b.rel;   // 最近打开的书排最前(服务端已按 lastopen 排序)
    });
  }).catch(function () {});
  // ── 沙盒(用户设计:测试在**模拟环境**跑 + 直观看到结果):测试上下文一律换成书的沙盒副本;
  //    预览 = iframe 里开真实阅读器读副本,CLI 产物 client_actions 经 /api/publish-actions → SSE 推给它执行。
  var _sbMap = {};   // 原书 rel → {rel:沙盒rel, anchor:锚页(节选内页码), pages, src_from}
  function sbEnsure(rel, reset) {
    if (!rel) return Promise.resolve(null);
    if (!reset && _sbMap[rel]) return Promise.resolve(_sbMap[rel]);
    return fetch('/pdf/api/sandbox', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file: rel, reset: !!reset }) })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.ok) { _sbMap[rel] = d; return d; } throw new Error((d && d.error) || '沙盒创建失败'); });
  }
  function ctx() {
    var rel = bookSel.value, sb = rel && _sbMap[rel];
    return rel ? { file_rel: (sb && sb.rel) || rel, page: (sb && sb.anchor) || 1, tools_page: true }
               : { no_book: true, tools_page: true };
  }
  // 预览面板:iframe 载入慢/SSE 要先接上 → client_action 进队列,ready 后统一 publish(SSE 无回放,早发会丢)
  var _simQ = [], _simReady = false, _simRel = '';
  var simEl = document.getElementById('tl-sim'), simF = document.getElementById('tl-sim-f');
  function simOpen() {
    var rel = bookSel.value; if (!rel) { RC.toast && RC.toast('先选一本书'); return; }
    sbEnsure(rel).then(function (sb) {
      if (_simRel !== sb.rel) {
        _simReady = false; _simRel = sb.rel;
        simF.src = '/pdf/view?file=' + encodeURIComponent(sb.rel) + '&page=' + (sb.anchor || 1);
        simF.onload = function () { setTimeout(function () { _simReady = true; simFlush(); }, 2500); };   // 等阅读器 SSE 接上
      }
      var inf = document.getElementById('tl-sim-info');
      if (inf) inf.textContent = sb.pages ? ('节选 ' + sb.pages + ' 页 · 围绕你读到的第 ' + (sb.src_from + (sb.anchor || 1) - 1) + ' 页') : '';
      simEl.hidden = false;
    }).catch(function (e) { RC.toast && RC.toast('沙盒:' + e.message); });
  }
  function simFlush() {
    if (!_simReady || !_simQ.length || !_simRel) return;
    var acts = _simQ.splice(0);
    fetch('/pdf/api/publish-actions', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file: _simRel, actions: acts }) }).catch(function () {});
  }
  function simForward(fn, args) { _simQ.push({ fn: fn, args: args }); simOpen(); simFlush(); }
  // CLI/编排的前端动作 → 转发给沙盒预览(rc-turncard._applyNewCAs 走 window[fn],同名即接管)
  window.__upStartTask = function (spec) { simForward('__upStartTask', [spec]); };
  window.goToPage = function (p) { simForward('goToPage', [p]); };
  window.openBookAt = function (fr, pg) { simForward('openBookAt', [fr, pg]); };   // 覆盖 rc-assistant 的跨书导航(别把工具库整页带走)
  document.getElementById('tl-sim-open').addEventListener('click', simOpen);
  document.getElementById('tl-sim-x').addEventListener('click', function () { simEl.hidden = true; });
  document.getElementById('tl-sim-ext').addEventListener('click', function () { if (_simRel) window.open('/pdf/view?file=' + encodeURIComponent(_simRel)); });
  document.getElementById('tl-sim-reload').addEventListener('click', function () { if (_simRel) { _simReady = false; simF.src = simF.src; simF.onload = function () { setTimeout(function () { _simReady = true; simFlush(); }, 2500); }; } });
  document.getElementById('tl-sim-reset').addEventListener('click', function () {
    var rel = bookSel.value; if (!rel) return;
    if (!confirm('重置沙盒?(恢复成原书干净副本,测试产生的纸/高亮/手写全清掉)')) return;
    sbEnsure(rel, true).then(function () {
      RC.toast && RC.toast('沙盒已重置(按当前阅读位置重新节选)');
      if (!simEl.hidden) { _simRel = ''; simOpen(); }
    }).catch(function (e) { RC.toast && RC.toast('重置失败:' + e.message); });
  });
  bookSel.addEventListener('change', function () { simEl.hidden = true; });

  // ── 工具列表 ─────────────────────────────────────────────────────────
  var listEl = document.getElementById('tl-mine');
  // 分区 tab
  document.querySelectorAll('.tl-tab').forEach(function (tb) {
    tb.addEventListener('click', function () {
      document.querySelectorAll('.tl-tab').forEach(function (x) { x.classList.remove('on'); });
      tb.classList.add('on');
      var t = tb.getAttribute('data-t');
      document.getElementById('tl-mine').style.display = t === 'mine' ? '' : 'none';
      document.getElementById('tl-builtin').style.display = t === 'builtin' ? '' : 'none';
      if (t === 'builtin' && !window.__biLoaded) loadBuiltin();
    });
  });
  // 设置浮层(内置工具 ⚙:复用 rc-toolchip 的 mountPrompts —— 与阅读器长按工具条同一套)
  var modal = document.getElementById('tl-modal');
  modal.querySelector('.x').addEventListener('click', function () { modal.classList.remove('on'); });
  modal.addEventListener('click', function (e) { if (e.target === modal) modal.classList.remove('on'); });
  function openToolCfg(name) {
    document.getElementById('tl-modal-t').textContent = '⚙ ' + name;
    var b = document.getElementById('tl-modal-b'); b.innerHTML = '';
    try { RC.toolChip.mountPrompts(b, name); } catch (e) { b.textContent = '(这个工具没有可改设置)'; }
    modal.classList.add('on');
  }
  // 内置工具目录(用户设计:工具库包括**所有**工具;简单工具可升级成复杂工具+AI 功能)
  function loadBuiltin() {
    window.__biLoaded = true;
    var box = document.getElementById('tl-builtin');
    fetch('/pdf/api/builtin-tools').then(function (r) { return r.json(); }).then(function (d) {
      box.innerHTML = '';
      (d.tools || []).forEach(function (t) {
        var c = document.createElement('div'); c.className = 'tl-bi';
        var n = document.createElement('div'); n.className = 'tl-bi-n'; n.textContent = t.name + (t.orch ? '' : ' (内部)');
        var ds = document.createElement('div'); ds.className = 'tl-bi-d'; ds.textContent = t.desc || '';
        var ops = document.createElement('div'); ops.className = 'tl-ops'; ops.style.marginTop = '0';
        function bt(txt, cls, fn) { var b = document.createElement('button'); b.className = 'tl-b' + (cls ? ' ' + cls : ''); b.textContent = txt; b.addEventListener('click', fn); ops.appendChild(b); }
        bt('⚙ 设置', '', function () { openToolCfg(t.name); });
        bt('▶ 试用', '', function () {
          var q = prompt('想让它做什么?(直接描述,AI 会调用「' + t.name + '」)') || '';
          if (q.trim()) send(q.trim() + '(用工具 ' + t.name + ')');
        });
        bt('🧪 造新工具', 'pri', function () {
          var idea = prompt('基于「' + t.name + '」想造个什么工具?(描述步骤/加什么 AI 功能,如:读当前页→挑生词→逐个做卡)') || '';
          if (!idea.trim()) return;
          send('设计并**保存**一个新工具(用 save_intent_tool):基于内置工具「' + t.name + '」,' + idea.trim() + '。保存后简述它运行时会怎么做。');
        });
        c.appendChild(n); c.appendChild(ds); c.appendChild(ops);
        box.appendChild(c);
      });
      if (!(d.tools || []).length) box.innerHTML = '<div class="tl-empty">拉取失败</div>';
    }).catch(function () { box.innerHTML = '<div class="tl-empty">拉取失败</div>'; });
  }
  function kindLabel(k) { return k === 'intent' ? '重新生成型' : (k === 'trace' ? '机械回放型' : '交互纸'); }
  function chipOf(rec) {   // 配方 → rc-toolchip 的 chip 形状(流程条与阅读器同一渲染器)
    var steps = (rec.calls && rec.calls.length)
      ? rec.calls.map(function (c) { return { label: c.tool, detail: c.brief || '', tool: c.tool }; })
      : (rec.flow_ops || []).map(function (op) { return { label: op, detail: '', tool: '' }; });
    return { label: rec.name, tool: '', type: 'text', steps: steps,
             detail: rec.instruction || rec.desc || '', meta: [], vision: [] };
  }
  function render(recs) {
    listEl.innerHTML = '';
    if (!recs.length) { listEl.innerHTML = '<div class="tl-empty">还没有保存过工具。<br>在阅读器里做完一个多步任务,点卡片流程里的「💾 保存为工具」。</div>'; return; }
    recs.forEach(function (rec) {
      var card = document.createElement('div'); card.className = 'tl-card';
      var hd = document.createElement('div'); hd.className = 'tl-hd';
      var nm = document.createElement('span'); nm.className = 'tl-name'; nm.textContent = rec.name;
      var kd = document.createElement('span'); kd.className = 'tl-kind ' + (rec.kind || 'paper'); kd.textContent = kindLabel(rec.kind);
      hd.appendChild(nm); hd.appendChild(kd);
      if (rec.partial) { var pt = document.createElement('span'); pt.className = 'tl-kind trace'; pt.textContent = '节选'; hd.appendChild(pt); }
      card.appendChild(hd);
      var intn = rec.origin || rec.instruction || rec.desc;
      if (intn) { var it = document.createElement('div'); it.className = 'tl-int'; it.innerHTML = '<b>意图</b> · ' + RC.esc(intn); card.appendChild(it); }
      var fl = document.createElement('div'); fl.className = 'tl-flow';
      try { RC.toolChip.renderFlowInto(fl, chipOf(rec)); } catch (e) { fl.textContent = (rec.route || ''); }
      card.appendChild(fl);
      var ops = document.createElement('div'); ops.className = 'tl-ops';
      function btn(txt, cls, fn) { var b = document.createElement('button'); b.className = 'tl-b' + (cls ? ' ' + cls : ''); b.textContent = txt; b.addEventListener('click', fn); ops.appendChild(b); }
      btn('▶ 测试', 'pri', function () {
        var adj = prompt('本次调整(可空,如「15道题,难一点」「基于当前页」):') || '';
        send('运行已保存的工具《' + rec.name + '》' + (adj.trim() ? ',本次调整:' + adj.trim() : ''));
      });
      if (rec.kind === 'intent') {
        btn('✏️ 改意图', '', function () {
          var v = prompt('修改这个工具的意图(运行时以它为准):', rec.instruction || '');
          if (v == null || !v.trim()) return;
          fetch('/pdf/api/recipe-edit', { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: rec.name, instruction: v.trim() }) })
            .then(function (r) { return r.json(); })
            .then(function (d) { RC.toast(d.ok ? '已保存' : ('失败:' + (d.error || '?'))); if (d.ok) load(); });
        });
      }
      btn('🗑 删除', 'danger', function () {
        if (!confirm('删除工具「' + rec.name + '」?')) return;
        fetch('/pdf/api/recipe-delete', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: rec.name }) })
          .then(function (r) { return r.json(); })
          .then(function (d) { RC.toast(d.ok ? '已删除' : ('失败:' + (d.error || '?'))); if (d.ok) load(); });
      });
      card.appendChild(ops);
      listEl.appendChild(card);
    });
  }
  function load() {
    fetch('/pdf/api/recipes?full=1').then(function (r) { return r.json(); })
      .then(function (d) { render(d.recipes || []); })
      .catch(function () { listEl.innerHTML = '<div class="tl-empty">加载失败</div>'; });
  }
  load();

  // ── 聊天(轻胶水:SSE 循环;卡片/流程/CLI 追踪全走共享层) ─────────────────
  var streaming = false, _ridN = 0;
  function uMsg(text) { var d = document.createElement('div'); d.className = 'asst-msg asst-u'; d.textContent = text; thread.appendChild(d); thread.scrollTop = thread.scrollHeight; }
  function send(text) {
    text = (text || '').trim();
    if (!text || streaming) return;
    var rel = bookSel.value;
    if (rel && !_sbMap[rel]) {   // 首次带书发言:先备好沙盒(失败就不发,绝不落在原书上)
      streaming = true;
      sbEnsure(rel).then(function () { streaming = false; _sendNow(text); })
        .catch(function (e) { streaming = false; uMsg(text); var d = document.createElement('div'); d.className = 'asst-msg asst-a'; d.textContent = '⚠️ 沙盒创建失败(' + e.message + '),没有执行——不在原书上测试。'; thread.appendChild(d); });
      return;
    }
    _sendNow(text);
  }
  function _sendNow(text) {
    if (streaming) return;
    streaming = true;
    uMsg(text);
    var tid = 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    var rid = 'tl' + Date.now() + '_' + (_ridN++);
    RC.turnCard.open(tid);
    RC.turnCard.status(tid, '思考中', false);
    var answer = '', sawCli = false;
    function handle(ev, parsed) {
      if (ev === 'answer') {
        answer = parsed;
        var pf = (RC.assistant.splitFollowups ? RC.assistant.splitFollowups(answer) : { text: answer });
        try { RC.turnCard.draftText(tid, pf.text || ''); } catch (e) {}
      } else if (ev === 'tool') { try { RC.turnCard.busy(tid, String(parsed)); } catch (e) {} }
      else if (ev === 'tool-done') { try { RC.turnCard.status(tid, '思考中', false); } catch (e) {} }
      else if (ev === 'tool2' && parsed && parsed.name) {
        if (parsed.task_id && CLI_TOOLS[parsed.name]) { sawCli = true; RC.turnCard.trackCli(tid, parsed.task_id, parsed.label || parsed.name); return; }
        try {
          RC.turnCard.addPart(tid, { kind: 'tool', tool: parsed.name, label: parsed.label || parsed.name,
            args: parsed.args || {}, steps: parsed.sub_steps || [], result: String(parsed.brief || '').slice(0, 6000),
            vision: parsed.vision || [], took_s: parsed.sec, model: parsed.model,
            error: parsed.status === 'error' ? (parsed.brief || '失败') : '' });
        } catch (e) {}
      }
      else if (ev === 'trace' && parsed && parsed.length) {
        var t0 = parsed[0] || {};
        try { RC.turnCard.addPart(tid, { kind: 'meta', model: t0.model || '', sec: t0.sec, tok: t0.tok, tier: t0.tier,
          total_sec: parsed.reduce(function (a, s) { return a + (s.sec || 0); }, 0),
          ts: Math.floor(Date.now() / 1000), action: 'orchestrator' }); } catch (e) {}
      }
      else if (ev === 'error') { try { RC.turnCard.draftText(tid, '⚠️ ' + parsed); } catch (e) {} }
    }
    fetch('/api/assistant/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, context: ctx(), rid: rid, turn_id: tid }) })
      .then(function (r) {
        var rd = r.body.getReader(), dec = new TextDecoder(), buf = '';
        function pump() {
          return rd.read().then(function (x) {
            if (x.done) return;
            buf += dec.decode(x.value, { stream: true });
            var i;
            while ((i = buf.indexOf('\n\n')) >= 0) {
              var chunk = buf.slice(0, i); buf = buf.slice(i + 2);
              var ev = 'message', data = '';
              chunk.split('\n').forEach(function (ln) {
                if (ln.indexOf('event:') === 0) ev = ln.slice(6).trim();
                else if (ln.indexOf('data:') === 0) data += ln.slice(5).trim();
              });
              var parsed; try { parsed = JSON.parse(data); } catch (e) { parsed = data; }
              if (ev === 'done') return;
              handle(ev, parsed);
            }
            return pump();
          });
        }
        return pump();
      })
      .catch(function () { try { RC.turnCard.draftText(tid, '⚠️ 连接失败,重试一次?'); } catch (e) {} })
      .then(function () {
        streaming = false;
        try {
          if (!sawCli) { RC.turnCard.freezeDraft(tid); RC.turnCard.status(tid, '完成', true); }
          // CLI 轮:trackCli 自己管进度/收尾
        } catch (e) {}
      });
  }
  var inp = document.getElementById('tl-input');
  document.getElementById('tl-send').addEventListener('click', function () { var v = inp.value; inp.value = ''; send(v); });
  inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { var v = inp.value; inp.value = ''; send(v); } });
})();
</script>
