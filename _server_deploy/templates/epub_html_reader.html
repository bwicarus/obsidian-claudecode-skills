<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>{% if is_fav %}{{ file_name }}{% else %}{{ file_name }} · EPUB{% endif %}</title>
<link rel="preload" as="script" href="/static/pdf/epub-html.js?v={{ reader_js_v }}"><!-- 主脚本 317KB 在 body 尾,head 先开拉(HTTP/2 并行) -->
{% if is_fav %}<!-- 收藏夹 PWA:装成跟通用阅读器独立的 app,start_url 固定打开本夹(零状态,不受「最近打开的书」影响) -->
<link rel="manifest" href="/pdf/fav/manifest?id={{ fav_id }}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="{{ file_name }}">
<link rel="apple-touch-icon" href="/pdf/fav/icon?sz=180">
<meta name="theme-color" content="#10162a">{% endif %}
<style>
  :root{ --chrome:#0d1426; --chrome-bd:#2a3a63; --fs:19px; --lh:1.7; --pa:#f6f3ea; --ink:#1b1b1b; --lnk:#2a5db0; }
  *{box-sizing:border-box}
  /* iOS tap 可靠性:所有按钮/可点元素去掉双击缩放歧义 + 300ms 延迟(根治弹层/抽屉/设置里按钮偶发点了没反应) */
  button,[role=button],.ep-fb-btn,select,input[type=checkbox]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0e1a;color:#e6edf3;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
  body{display:flex;flex-direction:column}   /* 照搬 PDF:竖向 flex 列(顶栏 + 滚动区),开抽屉用 padding-right 挤,顶栏永远可点 */
  /* 顶栏:视觉对齐 PDF #header(深蓝 #10162a + #2a3550 边 + 可横滚) */
  /* 高度含安全区(刘海机:48px 实高在刘海下方,不被吃掉压扁按钮);按钮放大到 36px 易触控 */
  #ep-top{position:relative;box-sizing:border-box;flex:0 0 auto;height:calc(48px + env(safe-area-inset-top));z-index:50;display:flex;align-items:center;gap:8px;flex-wrap:nowrap;overflow-x:auto;
    padding:0 10px;padding-top:env(safe-area-inset-top);background:#10162a;border-bottom:1px solid #2a3550}
  #ep-top button{background:#1a2540;border:1px solid #2a3550;color:#cfe6ff;border-radius:7px;height:36px;min-width:38px;padding:0 12px;font-size:15px;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap;flex:none;display:inline-flex;align-items:center;justify-content:center;touch-action:manipulation;position:relative;z-index:1}
  #ep-top button:hover{background:#2c3e6a;border-color:#3b6db5}
  #ep-top button svg.rc-tbi{width:20px;height:20px;display:block}
  #ep-top button:active{background:#2c3e6a}
  #ep-top button.active{background:#244470;border-color:#3b6db5;color:#7dd3fc}
  #ep-title{flex:1 1 auto;min-width:0;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;color:#cfe6ff;cursor:pointer}
  /* 章节/百分比 scrubber(照搬 PDF #page-scrub:拖动跳章 + 浮层) */
  #ep-scrub{cursor:ew-resize;user-select:none;-webkit-user-select:none;touch-action:none;padding:2px 6px;display:inline-flex;align-items:baseline;gap:2px;border-radius:5px;flex:none;color:#8a9bb4;font-size:12px}
  #ep-scrub:active{background:#1a2540}
  #ep-scrub #ep-page-cur{color:#cfe6ff;font-variant-numeric:tabular-nums;min-width:1.5em;text-align:right}
  #ep-scrub-pop{display:none;position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:240;background:#10162a;border:1px solid #3b6db5;border-radius:12px;padding:12px 18px;box-shadow:0 8px 28px rgba(0,0,0,.6);flex-direction:column;align-items:center;gap:8px;pointer-events:none;min-width:200px}
  #ep-scrub-pop.on{display:flex}
  #ep-scrub-pop .psp-num{color:#dff1ff;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #ep-scrub-pop .psp-track{width:180px;height:4px;background:#243049;border-radius:2px;overflow:hidden}
  #ep-scrub-pop .psp-fill{height:100%;background:#6fd3ff;width:0%}
  #ep-bar{display:none}
  /* 全屏(照搬 PDF .fs-mode + #fs-restore) */
  body.fs-mode #ep-top{display:none}
  body.fs-mode #ep-content{top:0}
  body.fs-mode #ep-bar{top:env(safe-area-inset-top)}
  #fs-restore{display:none;position:fixed;top:8px;right:8px;z-index:1400;width:34px;height:34px;border-radius:50%;background:rgba(16,22,42,.62);border:1px solid rgba(120,160,220,.5);color:#cfe6ff;font-size:16px;line-height:1;cursor:pointer;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);box-shadow:0 2px 10px rgba(0,0,0,.35);padding:0}
  body.fs-mode #fs-restore{display:flex}
  /* 阅读区:内容在主文档(非 iframe)→ 控制层直接够到 */
  #ep-content{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:var(--pa)}
  #ep-col{max-width:var(--colw, 54em);margin:0 auto;padding:18px 6% 60px;color:var(--ink);font-size:var(--fs);line-height:var(--lh)}
  #ep-col p{margin:0 0 .9em;line-height:var(--lh)}
  #ep-col h1,#ep-col h2,#ep-col h3,#ep-col h4{line-height:1.35;margin:1.1em 0 .5em}
  /* img 只防横向溢出,**不覆盖书写死的尺寸**(行内公式 .calibre_xx 的 width/height 必须保留,否则公式被撑大)。 */
  #ep-col img{max-width:100%}
  #ep-col a{color:var(--lnk)}
  #ep-col table{max-width:100%;border-collapse:collapse;margin:10px 0}
  #ep-col td,#ep-col th{border:1px solid rgba(0,0,0,.18);padding:4px 8px}
  #ep-col ::selection{background:rgba(120,170,255,.45)}
  .ep-sec{min-height:60px;position:relative}   /* position:relative → 手写墨迹 canvas 可 absolute 填满本章 */
  /* ── 手写墨迹层（照搬 PDF 阅读器：canvas 纯显示 pointer-events:none，按章 .ep-sec 锚定 + 归一化适配 reflow）── */
  .ep-ink-canvas{position:absolute;left:0;top:0;z-index:5;pointer-events:none;background:transparent}
  body.ep-ink-mode #ep-content{cursor:crosshair}
  /* 照搬 PDF：手指永不画（只滚动 / 双击切笔↔临时橡皮）；Apple Pencil 始终可画。故手写模式下 .ep-sec 不锁 touch-action，手指照常滚动（笔的滚动由 _inkBlockStylusScroll 拦） */
  #ep-ink-btn.ep-ink-erasing{color:#fbbf24;border-color:#fbbf24}
  #ep-ink-toolbar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);display:none;gap:3px;background:#10162a;border:1px solid #2a3550;border-radius:12px;padding:6px 8px;z-index:82;box-shadow:0 6px 20px rgba(0,0,0,.55);align-items:center;flex-wrap:wrap;max-width:94vw}
  #ep-ink-toolbar.show{display:flex}
  #ep-ink-toolbar button{background:transparent;border:1px solid transparent;color:#cfe6ff;border-radius:8px;padding:6px 9px;cursor:pointer;font-size:15px;line-height:1;-webkit-tap-highlight-color:transparent}
  #ep-ink-toolbar button:hover{background:#1a2540}
  #ep-ink-toolbar button.on{background:#244470;border-color:#3b6db5;color:#fff}
  #ep-ink-toolbar .ep-ink-sep{width:1px;align-self:stretch;background:#2a3550;margin:3px 4px}
  #ep-ink-toolbar .ep-ink-color{width:20px;height:20px;border-radius:50%;border:2px solid #0a0e1a;cursor:pointer;padding:0;box-shadow:0 0 0 1px #2a3550}
  #ep-ink-toolbar .ep-ink-color.on{box-shadow:0 0 0 2px #fff}
  #ep-ink-toolbar input[type=range]{width:72px;accent-color:#3b6db5;vertical-align:middle}
  /* 插图徽标 + 描述弹框:照搬 PDF 阅读器 26-figures.js(苹果风磨砂玻璃圆徽标 + 相机 SVG) */
  .ep-fig-wrap{position:relative;display:inline-block;max-width:100%}
  .fig-badge{position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;z-index:6;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;opacity:.5;background:rgba(10,132,255,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 2px 7px rgba(0,0,0,.2),inset 0 0 0 .5px rgba(255,255,255,.3);-webkit-tap-highlight-color:transparent;transition:transform .12s,opacity .12s}
  .fig-badge:active{transform:scale(.88)}.fig-badge:hover{opacity:.95}
  .fig-badge svg{width:15px;height:15px;display:block}
  .fig-pop{position:fixed;z-index:130;max-width:min(86vw,440px);background:#11192c;color:#e8eeff;border:1px solid #2a3a63;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.5);padding:14px 16px;font-size:14px;line-height:1.6;max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .fig-pop h4{margin:0 0 6px;font-size:14px;color:#7fb0ff;font-weight:600;padding-right:18px}
  .fig-pop .fig-x{position:absolute;top:8px;right:10px;color:#8aa;cursor:pointer;font-size:16px;line-height:1}
  .fig-pop p{margin:.35em 0}.fig-pop .b p:first-child{margin-top:0}.fig-pop .b p:last-child{margin-bottom:0}
  .fig-pop-mask{position:fixed;inset:0;z-index:129;background:transparent}
  .ep-sec.ph{display:flex;align-items:center;justify-content:center;color:#b9b09a;font-size:13px;min-height:48px}
  /* === 以下控制层 UI 跟 epub.js 版一致 === */
  /* 选中工具栏:照搬 PDF #sel-toolbar 两栏(左竖排色板 + 右 preview/按钮组);底部居中作 reflow/iOS 原生选区适配 */
  #ep-sel{position:fixed;z-index:78;display:none;background:#1a2540;border:1px solid #3b6db5;border-radius:9px;padding:6px;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.6);flex-direction:row;align-items:flex-start;max-width:96vw;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}
  #ep-sel.open{display:flex}
  body.ep-side-open #ep-sel{left:calc((100vw - min(38vw,560px)) / 2)}   /* 侧栏开时工具栏居中到左侧内容区,不伸进右侧栏(照 PDF 躲侧栏语义) */
  #ep-hl-pick{display:flex;flex-direction:column;gap:6px;align-items:center;padding:2px 8px 2px 2px;flex-shrink:0;border-right:1px solid #2a3550}
  #ep-hl-pick .lbl{font-size:13px;line-height:1}
  #ep-hl-pick .swatch{width:17px;height:17px;border-radius:50%;border:2px solid #5b6a85;cursor:pointer;flex-shrink:0;transition:border-color .12s,transform .12s,box-shadow .12s;-webkit-tap-highlight-color:transparent}
  #ep-hl-pick .swatch:hover{border-color:#fff;transform:scale(1.08)}
  #ep-hl-pick .swatch.active{border-color:#fff;box-shadow:0 0 0 2px #0078d4,inset 0 0 0 1px rgba(0,0,0,.3);transform:scale(1.05)}
  #ep-main{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
  #ep-sel .ep-preview{color:#a8cdff;font-size:11px;line-height:1.5;background:rgba(0,0,0,.3);border-radius:4px;padding:5px 9px;max-height:54px;overflow:hidden;word-break:break-word;border-left:2px solid #60a5fa}
  #ep-sel .ep-preview .len{color:#7a8497;font-size:10px;margin-left:6px}
  #ep-sel .ep-btns{display:flex;gap:4px;flex-wrap:wrap}
  #ep-sel button{background:transparent;border:none;color:#cfe6ff;cursor:pointer;padding:6px 10px;border-radius:4px;font-size:12px;white-space:nowrap;-webkit-tap-highlight-color:transparent}
  #ep-sel button:hover{background:#2c3e6a;color:#fff}
  #ep-sel button:active{background:#2c3e6a}
  #ep-phrase-btn{background:#244470 !important;border-color:#6fd3ff !important;color:#cfe6ff !important}
  #ep-phrase-btn.breathe{animation:ep-phrase-breathe 1.1s ease-in-out infinite}
  @keyframes ep-phrase-breathe{0%,100%{box-shadow:0 0 0 0 rgba(111,211,255,.0)}50%{box-shadow:0 0 0 3px rgba(111,211,255,.45)}}
  mark.ep-phrase-hl{background:rgba(59,109,181,.42);border:1px solid rgba(111,211,255,.85);border-radius:3px;color:inherit;cursor:pointer;padding:0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  mark.ep-phrase-hl.breathe{animation:ep-phrase-hl-breathe 1.1s ease-in-out infinite}
  @keyframes ep-phrase-hl-breathe{0%,100%{opacity:.55}50%{opacity:.95}}
  /* 单词查询中呼吸高亮(真实 mark 包文字节点,随内容自然滚动,颜色对齐共享层 rc-wp-breathe 的青/teal)。
     动画拆到 .breathe 子类(照 PDF 原生 renderWordHl 的 h.ready?'':' breathe'):查询中呼吸,就绪转常亮等点击 */
  mark.ep-word-breathe{background:rgba(56,178,172,.30);border:1px solid rgba(120,231,210,.92);border-radius:3px;color:inherit;cursor:pointer;padding:0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  mark.ep-word-breathe.breathe{animation:ep-word-breathe-kf 1.1s ease-in-out infinite}
  @keyframes ep-word-breathe-kf{0%,100%{opacity:.45}50%{opacity:.9}}
  #ep-dict{position:fixed;z-index:72;display:none;max-width:min(90vw,360px);background:#0f1830;border:1px solid #2f4a7d;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.6);padding:12px 14px;color:#e6edf3;font-size:13px;line-height:1.6}
  #ep-dict.open{display:block}
  #ep-dict .w{font-size:17px;font-weight:700;color:#fff}
  #ep-dict .ph{color:#8fb0e8;font-size:12px;margin-left:7px}
  #ep-dict .tr{margin-top:5px;color:#cfe0ff}
  #ep-dict .df{margin-top:5px;color:#aebcd6;font-size:12px;white-space:pre-wrap}
  #ep-dict .cls{position:absolute;top:6px;right:9px;color:#7a8497;cursor:pointer;font-size:15px}
  #ep-ai{position:fixed;top:0;right:0;bottom:0;width:min(40vw,560px);z-index:75;background:#0d1426;border-left:1px solid var(--chrome-bd);transform:translateX(102%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
  #ep-ai.open{transform:translateX(0)}
  #ep-ai-head{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #1f2740}
  #ep-ai-head .t{flex:1;font-size:14px;color:#aebfe0}
  #ep-ai-head button{background:#16203a;border:1px solid var(--chrome-bd);color:#cfe0ff;border-radius:7px;height:30px;padding:0 10px;cursor:pointer;font-size:13px}
  #ep-ai-body{flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
  .ep-card{background:#11192c;border:1px solid #243056;border-radius:11px;padding:10px 12px}
  .ep-card .h{font-size:11px;color:#7c93c4;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;display:flex;gap:6px;align-items:center}
  .ep-card .c{font-size:14px;line-height:1.65;color:#e6edf3;word-break:break-word}
  /* 气泡照搬 PDF asst-u/asst-a(带尾角) */
  .ep-msg{max-width:92%;padding:9px 12px;border-radius:13px;font-size:14px;line-height:1.55;word-break:break-word}
  .ep-msg.u{align-self:flex-end;background:#1d4ed8;color:#fff;border-bottom-right-radius:4px}
  .ep-msg.a{align-self:flex-start;background:#161d31;border:1px solid #243152;color:#e6edf3;border-bottom-left-radius:4px}
  .ep-msg.a p{margin:.4em 0}.ep-msg.a ul,.ep-msg.a ol{margin:.3em 0;padding-left:1.3em}.ep-msg.a code{background:#0b1220;padding:1px 4px;border-radius:4px}
  .ep-msg.a h1,.ep-msg.a h2,.ep-msg.a h3{font-size:1em;margin:.5em 0 .2em}
  .ep-msg.a img{max-width:100%;height:auto;border-radius:8px;display:block;margin:.4em 0;cursor:zoom-in}
  /* 底部快捷按钮(照搬 #asst-quick / asst-learn) */
  #ep-asst-quick{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;border-top:1px solid #233156}
  #ep-asst-quick button{background:#16203a;border:1px solid #2a3a63;color:#bcd0ff;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  #ep-asst-quick button:active{background:#22305a}
  #ep-asst-quick button.asst-learn{background:#16293a;border-color:#2a4a63;color:#bce0ff}
  /* 麦克风(照搬 #asst-mic,苹果风蓝 + 呼吸光环) */
  #ep-ai-mic{background:#16203a;border:1px solid #2a3a63;color:#9fb4e0;width:42px;height:42px;border-radius:12px;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s,border-color .2s,transform .1s;-webkit-tap-highlight-color:transparent}
  #ep-ai-mic:active{transform:scale(.9)}
  #ep-ai-mic.on{background:#0a84ff;border-color:#0a84ff;color:#fff;animation:epMicPulse 1.5s ease-in-out infinite}
  @keyframes epMicPulse{0%,100%{box-shadow:0 0 0 0 rgba(10,132,255,.5)}50%{box-shadow:0 0 0 9px rgba(10,132,255,0)}}
  #ep-ai-send.stop{background:#b23b3b}
  .ep-card .c p:first-child,.ep-msg p:first-child{margin-top:0}.ep-card .c p:last-child,.ep-msg p:last-child{margin-bottom:0}
  .ep-sel-chip{font-size:11px;color:#8fb0e8;background:#0e1a30;border:1px solid #234;border-radius:6px;padding:2px 7px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block}
  #ep-ai-input{flex:0 0 auto;display:flex;gap:7px;padding:9px;border-top:1px solid #1f2740;align-items:flex-end}
  #ep-ai-ta{flex:1;background:#0e1525;border:1px solid var(--chrome-bd);color:#e6edf3;border-radius:10px;padding:9px 11px;font-size:14px;resize:none;max-height:120px;font-family:inherit;line-height:1.4}
  #ep-ai-send{background:#2563eb;border:none;color:#fff;width:40px;height:40px;border-radius:10px;font-size:17px;cursor:pointer;flex:none}
  .ep-spin{display:inline-block;width:13px;height:13px;border:2px solid #2b3f6e;border-top-color:#7dd3fc;border-radius:50%;animation:eps .8s linear infinite;vertical-align:-2px}
  @keyframes eps{to{transform:rotate(360deg)}}
  /* 逐字浮现 reveal(流式 AI 回答;照搬 mfx.css stream-fx + epub2-assist.js 的 ep- 前缀移植,规则逐字一致):
     流式态 .ep-mfx-streaming 下每字 .ep-mfx-w 默认隐藏,揭示游标推进逐个加 .ep-mfx-reveal 淡入;
     .ep-mfx-shown=上轮已揭示的字即时显示不重播(整段重渲防闪);光标 .ep-mfx-caret 挂在揭示 frontier 后 */
  .ep-mfx-caret{display:inline-block;width:2px;height:1.05em;margin-left:1px;vertical-align:-0.18em;border-radius:1px;background:linear-gradient(#60a5fa,#7dd3fc);box-shadow:0 0 6px rgba(96,165,250,.7)}
  .ep-msg.a.ep-mfx-streaming{box-shadow:0 0 0 1px rgba(96,165,250,.28),0 0 16px rgba(96,165,250,.14)}
  .ep-mfx-w{opacity:1}
  @media (prefers-reduced-motion:no-preference){
    @keyframes epMfxBlink{0%,45%{opacity:1}55%,100%{opacity:0}}
    .ep-mfx-caret{animation:epMfxBlink 1s steps(1) infinite}
    @keyframes epMfxChar{from{opacity:0;filter:blur(4px)}to{opacity:1;filter:none}}
    .ep-msg.a.ep-mfx-streaming .ep-mfx-w{opacity:0}
    .ep-msg.a.ep-mfx-streaming .ep-mfx-w.ep-mfx-shown{opacity:1}
    .ep-msg.a.ep-mfx-streaming .ep-mfx-w.ep-mfx-reveal{animation:epMfxChar .34s ease both}
  }
  /* 高亮照搬 PDF:半透明底色(JS 给 rgba)+ 字色不变透出来;无色=虚框只留备注;有备注=底部点线指示 */
  mark.ep-hl{border-radius:2px;padding:0 1px;cursor:pointer;color:inherit;background:transparent}
  mark.ep-hl.nocolor{background:transparent !important;outline:1px dashed rgba(120,120,120,.7);outline-offset:1px}
  mark.ep-hl.has-note{border-bottom:2px dotted rgba(90,90,90,.6)}

  #ep-toc{position:fixed;top:0;left:0;bottom:0;width:min(82vw,360px);z-index:80;background:#0d1426;border-right:1px solid var(--chrome-bd);transform:translateX(-102%);transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}

  .ep-toc-i:active{background:#16203a}
  #ep-mask{position:fixed;inset:0;z-index:79;background:rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:opacity .25s}
  #ep-mask.open{opacity:1;visibility:visible}
  #ep-set{position:fixed;top:52px;right:8px;z-index:60;background:#10162a;border:1px solid var(--chrome-bd);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.6);padding:12px;min-width:240px;display:none}
  #ep-set.open{display:block}

  /* 搜索:照搬 PDF #search-panel 居中浮层 */

  #ep-search-x:hover{color:#fff}

  .ep-sr:hover{background:#162045}
  .ep-sr .loc{color:#7dd3fc;font-size:12px;white-space:nowrap;flex-shrink:0}
  .ep-sr .ex{color:#cfe6ff;font-size:12.5px;line-height:1.5;overflow:hidden}.ep-sr .ex b{background:#3b6db5;color:#fff;border-radius:2px;padding:0 1px}

  #ep-load{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#0a0e1a;color:#aebfe0;font-size:14px}
  #ep-load .sp{width:34px;height:34px;border:3px solid #243056;border-top-color:#3b82f6;border-radius:50%;animation:eps 1s linear infinite}
  #ep-load a{color:#60a5fa;text-decoration:none;font-size:13px}
  /* ── Phase G:振假名 / 译页 / 生词下划线 ── */
  #ep-col ruby[data-eph]{ ruby-align:center; }
  #ep-col rt.ep-rt{ font-size:.55em;line-height:1;color:var(--lnk);font-weight:600;user-select:none; }
  #ep-col .ep-tr-rt{ display:block;font-size:.86em;line-height:1.55;color:var(--lnk);opacity:.92;border-left:2px solid var(--lnk);padding:2px 0 2px 9px;margin:.15em 0 .8em;border-radius:0 4px 4px 0; }

  /* 乐观去下划线(__epubDeco.optimisticMaster,rc-wordpop「☆ 标记掌握」调):标掌握瞬间隐下划线,失败 restore 撤销。
     class 名/规则逐字照搬 epubjs 引擎 epub2-deco.js 的已验证实现 */
  #ep-col .ep-vocab-und.ep2-und-opt-off{ border-bottom-color:transparent !important; opacity:1 !important; }
  /* 搜索命中临时高亮(照搬 PDF .search-hl) */
  #ep-col .ep-search-hl{ background:#ffe066;color:#1b1b1b;border-radius:2px;box-shadow:0 0 0 2px #ffe066;animation:epSearchHl 6s ease-out forwards; }
  @keyframes epSearchHl{ 0%,70%{background:#ffe066;box-shadow:0 0 0 2px #ffe066} 100%{background:rgba(255,224,102,0);box-shadow:0 0 0 0 transparent} }
  /* 插图说明徽标总开关(设置面板「📷 插图说明徽标」,默认开,localStorage;只隐藏徽标 UI,不拦截徽标创建/描述请求,
     纯 CSS 隐藏最简单、跟 rc-figures.js 共享层零耦合)。徽标是 RC.figures.attach 生成的 .rc-fig-badge(挂在 .rc-fig-wrap 里)。 */
  body.ep-fig-off .rc-fig-badge{ display:none !important; }
  /* 抽屉 pane 互斥:rc-sidedrawer 的 `#ep-side-hl{display:flex}`(ID 选择器)比 `.ep-side-pane{display:none}`(类)
     特异性高 → 高亮 pane 永远 display:flex,「还没有高亮」漏渲到助手输入框下方,还把助手快捷条(清空/模型)挤上去害得点不准。
     这里用更高特异性 (1,2,0) 的 :not(.active) 把非激活 pane 强制隐藏(只在默认手搓版模板生效,不碰共享 rc-sidedrawer / epub.js 版)。 */
  #ep-side .ep-side-pane:not(.active){display:none}
  /* 语法 pane 自身 chrome(设置区折叠头 + 分析块容器滚动)—— 这部分是本阅读器的布局选择,不属于 rc-grammar.js
     共享核心的职责(核心只管容器里"渲什么",不管容器怎么摆);照搬 epub2-grammar.js 已验证过的等价样式。
     .grammar-block 等分析卡片本身的样式由 rc-grammar.js 注入(scoped 到 .rc-grammar),这里不重复。 */
  #ep-side-grammar{padding:0;display:flex;flex-direction:column;min-height:0}
  #ep-grammar-set{flex:0 0 auto;border-bottom:1px solid #1c2740;background:#0b1020}
  #ep-grammar-set-head{display:flex;align-items:center;gap:6px;padding:9px 12px;cursor:pointer;font-size:12px;color:#9fb4d4;user-select:none}
  #ep-grammar-set-head:hover{background:#141d33}
  #ep-grammar-set-head .gset-caret{margin-left:auto;color:#7a8497;font-size:10px;transition:transform .15s}
  #ep-grammar-set.open #ep-grammar-set-head .gset-caret{transform:rotate(90deg)}
  #ep-grammar-kglist{display:none;padding:4px 10px 10px;max-height:42vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
  #ep-grammar-set.open #ep-grammar-kglist{display:block}
  #ep-grammar-body{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:10px 10px 40px}
</style>
</head>
<body>
  <script>
  /* 全屏阅读偏好：渲染前(早于紧接着的 #ep-top)就给 <body> 加 fs-mode，避免开着全屏时刷新一闪顶栏。
     照搬 PDF pdf_reader.html <head> 内联脚本的用意，但 EPUB 的 CSS 选择器是 body.fs-mode #ep-top(复合选择器，要求类直接
     打在 <body> 上)；<head> 阶段 document.body 还不存在，不能照抄 PDF 挂到 documentElement 那招 —— 改成本段作为
     <body> 内第一个节点，浏览器解析到它会同步执行完才继续画后面的 #ep-top，效果等价(根治顶栏先闪一下再隐藏)。 */
  try { if (localStorage.getItem('eph-fs-mode') === '1') document.body.classList.add('fs-mode'); } catch (e) {}
  </script>
  <style id="ep-book-css"></style>

    <button id="ep-fav-btn" title="收藏当前章到收藏夹（书架「⭐ 收藏夹」tab 可查看）"><svg class="rc-tbi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3.5l2.47 5.29 5.53.7-4.1 3.95 1.06 5.56L12 16.9 7.04 19l1.06-5.56-4.1-3.95 5.53-.7L12 3.5z"/></svg></button>

    <button id="ep-upage-btn" title="插入我的页（在当前章之后插入一页 markdown 笔记页,像书的一页一样阅读;✏️ 可再编辑）"><svg class="rc-tbi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="3.5" width="13" height="17" rx="2"/><path d="M12 8.5V15.5"/><path d="M8.5 12H15.5"/></svg></button>
    <button id="ep-search-btn" title="搜索"><svg class="rc-tbi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.2"/><path d="M15.6 15.6L20 20"/></svg></button>

  <!-- 手写笔工具栏(照搬 PDF #ink-toolbar:工具/色板/笔宽/撤销重做/显隐/清空);手写模式开时浮现 -->

        <span class="vocab-count" id="ep-vocab-count"></span>
      </div>
      <div id="ep-vocab-list"><div style="color:#5a6680;font-size:12px;padding:10px">点开载入…</div></div>
    </div>
    <div class="ep-side-pane" data-pane="kg" id="ep-side-kg"><div id="ep-kg-nodes"><div class="kg-empty">点开载入…</div></div></div>
    <div class="ep-side-pane" data-pane="hl" id="ep-side-hl"><div class="ep-empty">点开载入高亮…</div></div>
    <div class="ep-side-pane" data-pane="toc" id="ep-side-toc"><div id="ep-toc-list"></div></div>
    <!-- 语法分析 pane(共享核心 RC.grammar 接管:块渲染/结构图/流式/制卡都在 rc-grammar.js,本模板只提供容器)
         照搬 epub_reader.html(epub.js 版)的既有结构,两个 EPUB 阅读器变体共用同一套 id / UX 文案。 -->
    <div class="ep-side-pane" data-pane="grammar" id="ep-side-grammar">
      <div id="ep-grammar-set">
        <div id="ep-grammar-set-head">⚙ 启用语法 KG <span class="gset-caret">▸</span></div>
        <div id="ep-grammar-kglist"><div class="rc-gram-kg-empty">展开载入…</div></div>
      </div>
      <div id="ep-grammar-body"><div class="gb-empty">选词/选句后点「📊 语法」分析所在整句。<br>需先在下方「⚙ 启用语法 KG」勾选至少一本（去技能树点节点「👁 跟踪」）。</div></div>
    </div>
  </aside>

  <div id="ep-search">
    <div id="ep-search-bar"><input id="ep-search-in" type="search" placeholder="全文搜索（全书）…" autocomplete="off" enterkeyhint="search"><span id="ep-search-stat"></span><button id="ep-search-x" title="关闭">✕</button></div>
    <div id="ep-search-res"></div>
  </div>

  <div id="ep-load"><div class="sp"></div><div id="ep-load-msg">正在打开 EPUB…</div></div>

  <!-- AI 结果模态(rc-result.js;UI 与 PDF 一致;CSS 自注入) -->
  <div id="result-mask" onclick="if(event.target===this) closeResult()">
    <div id="result-modal">
      <h3 id="result-title">结果</h3>
      <div class="src" id="result-src"></div>
      <div class="content" id="result-content"></div>
      <div id="result-followup">
        <input id="result-followup-input" placeholder="继续追问…（基于上面的解释）" onkeydown="if(event.key==='Enter'){event.preventDefault();_followupAsk();}">
        <button onclick="_followupAsk()">追问</button>
      </div>
      <div class="actions">
        <div id="vocab-actions"></div>
        <button id="result-mark-btn" onclick="markFromResult()" title="给原始选中加高亮（把当前回答存到备注）" style="background:#244470;color:#fff;border-color:#3b6db5">🖌 标记</button>
        <button id="result-anki-btn" onclick="ankiFromResult()" title="把「选中原文 + 这条解释」做成 Anki 卡片（后台，不挡界面）" style="background:#13351f;color:#7ee2b8;border-color:#34d399">🎴 制 Anki</button>
        <button onclick="closeResult()">关闭</button>
      </div>
    </div>
  </div>
  <div id="draft-badge" onclick="openDraftModal()" title="已选段落">
    <div style="display:flex;flex-direction:column;align-items:center;line-height:1.1"><span class="icon">📋</span><span class="count" id="draft-count">0</span></div>
  </div>
  <div id="draft-mask" onclick="if(event.target===this) closeDraftModal()">
    <div id="draft-modal">
      <h3><span>📋 已选段落 <span id="draft-modal-count" style="color:#7a8497;font-size:12px;font-weight:400"></span></span><button class="clear-all" onclick="clearAllDrafts()">全部清空</button></h3>
      <div id="draft-list"></div>
      <div id="draft-actions">
        <button class="primary" onclick="createNoteFromDrafts()">📝 创建笔记</button>
        <button onclick="createAnkiFromDrafts()">🎴 创建 Anki</button>
        <button onclick="createBothFromDrafts()">📚 笔记 + Anki</button>
      </div>
    </div>
  </div>

<script>
  window.EPUB_CFG = { fileRel: {{ file_rel|tojson }}, fileName: {{ file_name|tojson }}, sha: {{ sha|tojson }}, serverPos: {{ server_pos|default(None)|tojson }}, serverPosTs: {{ server_pos_ts|default(0) }} };
</script>
<script src="/static/qa/marked.js"></script>
<!-- 必须在 mathjax.js 前配 $...$ 行内分隔符(照搬 pdf_reader.html;MathJax v3 默认只认 \(...\)) -->
<script>window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']]},options:{skipHtmlTags:['script','noscript','style','textarea','pre','code']}};</script>
<!-- tex-chtml-full 构建:全部 TeX 扩展内置,零运行时 autoload(同 pdf_reader.html,\boldsymbol 红字根因修复) -->
<script src="/static/qa/mathjax-full.js" async></script>

<script src="/static/pdf/rc-ink.js?v={{ reader_js_v }}"></script><!-- 墨迹共享核心(epub-html/rc-stickynote 依赖) -->
<script src="/static/pdf/rc-core.js?v={{ reader_js_v }}"></script>

<script src="/static/pdf/rc-snippets.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-result.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-wordpop.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-phrasepop.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-settings.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-knowledge.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-sidedrawer.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-assistant.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-grammar.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-stickynote.js?v={{ reader_js_v }}"></script>

</body>
