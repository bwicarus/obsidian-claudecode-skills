<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>{% if is_fav %}{{ file_name }}{% else %}{{ file_name }} · EPUB{% endif %}</title>
<link rel="preload" as="script" href="/static/pdf/epub-html.js?v={{ reader_js_v }}"><!-- 主脚本 317KB 在 body 尾,head 先开拉(HTTP/2 并行) -->
{% if is_fav %}<!-- 收藏夹 PWA:装成跟通用阅读器独立的 app,start_url 固定打开本夹(零状态,不受「最近打开的书」影响) -->
<link rel="manifest" href="/pdf/fav/manifest?id={{ fav_id }}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="{{ file_name }}">
<link rel="apple-touch-icon" href="/pdf/fav/icon?sz=180">
<meta name="theme-color" content="#10162a">{% endif %}
<link rel="stylesheet" href="/static/pdf/epub-styles.css?v={{ reader_js_v }}"><!-- 原整块内联 CSS 抽出(immutable 缓存+HTML 瘦身;改它会 bust reader_js_v) -->
</head>
<body>
  <script>
  /* 全屏阅读偏好：渲染前(早于紧接着的 #ep-top)就给 <body> 加 fs-mode，避免开着全屏时刷新一闪顶栏。
     照搬 PDF pdf_reader.html <head> 内联脚本的用意，但 EPUB 的 CSS 选择器是 body.fs-mode #ep-top(复合选择器，要求类直接
     打在 <body> 上)；<head> 阶段 document.body 还不存在，不能照抄 PDF 挂到 documentElement 那招 —— 改成本段作为
     <body> 内第一个节点，浏览器解析到它会同步执行完才继续画后面的 #ep-top，效果等价(根治顶栏先闪一下再隐藏)。 */
  try { if (localStorage.getItem('eph-fs-mode') === '1') document.body.classList.add('fs-mode'); } catch (e) {}
  </script>
  <style id="ep-book-css"></style>
  <div id="ep-top">
    <div id="ep-title" onclick="location.href='/pdf/'" title="点击返回书架">{{ file_name }}</div>
    <span id="ep-scrub" title="左右拖动快速跳章 · 点击输入百分比"><b id="ep-page-cur">1</b><span id="ep-page-total" style="color:#8a9bb4;font-size:12px">/ –</span></span>
    <button id="ep-fav-btn" title="收藏当前章到收藏夹（书架「⭐ 收藏夹」tab 可查看）"><svg class="rc-tbi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3.5l2.47 5.29 5.53.7-4.1 3.95 1.06 5.56L12 16.9 7.04 19l1.06-5.56-4.1-3.95 5.53-.7L12 3.5z"/></svg></button>
    <button id="ep-ruby" title="振假名 / 音标(あ)">あ</button>
    <button id="ep-pagetr" title="整页翻译">译页</button>
    <button id="ep-ink-btn" title="手写笔（Apple Pencil 直接画；点此开桌面/触屏手写模式，按章保存）"><svg class="rc-tbi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19.3 7.3L16.7 4.7L4.7 16.7L4 20L7.3 19.3Z"/><path d="M7.3 19.3L4.7 16.7"/></svg></button>
    <button id="ep-note-btn" title="便签（在当前视野中央新建;单击短条折叠/展开,长按短条移动/删除,长按内容区编辑）"><svg class="rc-tbi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5H19V14L14 19H5Z"/><path d="M14 19V14H19"/><path d="M8 9.5H15.5"/><path d="M8 12.5H12"/></svg></button>
    <button id="ep-upage-btn" title="插入我的页（在当前章之后插入一页 markdown 笔记页,像书的一页一样阅读;✏️ 可再编辑）"><svg class="rc-tbi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="3.5" width="13" height="17" rx="2"/><path d="M12 8.5V15.5"/><path d="M8.5 12H15.5"/></svg></button>
    <button id="ep-search-btn" title="搜索"><svg class="rc-tbi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.2"/><path d="M15.6 15.6L20 20"/></svg></button>
    <button id="fs-toggle" title="全屏">⛶</button>
    <button id="ep-set-btn" title="设置"><svg class="rc-tbi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M21 12h-2.5M5.5 12H3M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8M18.4 18.4l-1.8-1.8M7.4 7.4L5.6 5.6"/></svg></button>
  </div>
  <div id="ep-bar"></div>
  <div id="ep-scrub-pop"><div class="psp-num">—</div><div class="psp-track"><div class="psp-fill"></div></div></div>
  <button id="fs-restore" onclick="(function(){})()" title="退出全屏">⤢</button>
  <!-- 手写笔工具栏(照搬 PDF #ink-toolbar:工具/色板/笔宽/撤销重做/显隐/清空);手写模式开时浮现 -->
  <div id="ep-ink-toolbar">
    <button data-itool="pen" class="on" title="笔">✒️</button>
    <button data-itool="line" title="直线">／</button>
    <button data-itool="arrow" title="箭头">↗</button>
    <button data-itool="rect" title="矩形">▭</button>
    <button data-itool="eraser" title="橡皮（点笔画删除整条）">🧹</button>
    <span class="ep-ink-sep"></span>
    <button class="ep-ink-color on" style="background:#e74c3c" data-c="#e74c3c" title="红"></button>
    <button class="ep-ink-color" style="background:#3b82f6" data-c="#3b82f6" title="蓝"></button>
    <button class="ep-ink-color" style="background:#22c55e" data-c="#22c55e" title="绿"></button>
    <button class="ep-ink-color" style="background:#fbbf24" data-c="#fbbf24" title="黄"></button>
    <button class="ep-ink-color" style="background:#111111" data-c="#111111" title="黑"></button>
    <input type="range" id="ep-ink-width" min="1" max="10" step="0.5" value="2.5" title="粗细">
    <span class="ep-ink-sep"></span>
    <button data-act="undo" title="撤销">↶</button>
    <button data-act="redo" title="重做">↷</button>
    <button id="ep-ink-eye" data-act="eye" title="显示/隐藏全部墨迹">👁</button>
    <button data-act="clear" title="清空本章墨迹" style="color:#ff8a8a">🗑</button>
  </div>
  <div id="ep-content"><div id="ep-col"></div></div>

  <div id="ep-set">
    <div class="row"><label>字号</label><div class="stepper"><button id="ep-fs-dn">A−</button><span id="ep-fs-v" style="font-size:13px;color:#cfe0ff;min-width:42px;text-align:center">100%</span><button id="ep-fs-up">A+</button></div></div>
    <div class="row"><label>主题</label><div class="seg" id="ep-theme"><button data-th="paper" class="on">纸</button><button data-th="sepia">褐</button><button data-th="night">夜</button></div></div>
    <div class="row"><label>行距</label><div class="stepper"><button id="ep-lh-dn">−</button><span id="ep-lh-v" style="font-size:13px;color:#cfe0ff;min-width:42px;text-align:center">1.7</span><button id="ep-lh-up">+</button></div></div>
    <div class="row"><label>栏宽</label><div class="stepper"><button id="ep-mw-dn">−</button><span id="ep-mw-v" style="font-size:13px;color:#cfe0ff;min-width:42px;text-align:center">54</span><button id="ep-mw-up">+</button></div></div>
    <div class="row"><label>📷 插图说明徽标</label><input type="checkbox" id="ep-fig-badge-chk" checked onchange="window.toggleFigBadge && window.toggleFigBadge(this.checked)" style="width:16px;height:16px"></div>
    <div style="border-top:1px solid #1f2740;margin-top:6px;padding-top:10px">
      <button id="ep-full-btn" style="width:100%;background:#16203a;border:1px solid var(--chrome-bd);color:#cfe0ff;border-radius:8px;padding:9px;font-size:13px;cursor:pointer">📄 完整功能版（转 PDF）</button>
      <div style="font-size:11px;color:#7c93c4;margin-top:6px;line-height:1.45">需要 OCR/手写 等 PDF 专属功能时，转成 PDF 用完整阅读器打开（后台转换，可关页面）。</div>
    </div>
  </div>

  <div id="ep-sel">
    <div id="ep-hl-pick"></div>
    <div id="ep-main">
      <div class="ep-preview" id="ep-preview">—</div>
      <div class="ep-btns">
        <button data-act="copy" data-grp="both">📋 复制</button>
        <button data-act="search" data-grp="both" title="用浏览器搜索选中内容">🔍 搜索</button>
        <button data-act="dict" data-grp="word">🔍 查词</button>
        <button data-act="phrase" data-grp="phrase" id="ep-phrase-btn" style="display:none">📘 词组</button>
        <button data-act="translate" data-grp="multi">🌐 翻译</button><button data-act="explain" data-grp="multi">💡 解释</button><button data-act="grammar" data-grp="multi">📊 语法</button><button data-act="chat" data-grp="multi">💬 对话</button>
        <button data-act="note" data-grp="both">📝 笔记</button><button data-act="anki" data-grp="both">🎴 制卡</button>
      </div>
    </div>
  </div>
  <div id="ep-dict"></div>
  <div id="word-pop" onclick="event.stopPropagation()"></div>
  <div id="ep-hlpop"></div>

  <!-- 右侧统一抽屉(照搬 PDF #grammar-panel):把手 + tab 栏由 rc-sidedrawer.init 注入;
       6 pane = 助手/单词本/知识点/高亮/目录/语法(语法 pane 内容由 rc-grammar.js 共享核心接管) -->
  <aside id="ep-side">
    <div class="ep-side-pane active" data-pane="asst" id="ep-side-asst">
      <div id="ep-ai-body"></div>
      <!-- 快捷栏按钮由共享构建器 rcBuildQuickBar 填(与 PDF 同一份来源，按钮永不分叉)；容器留空 -->
      <div id="ep-asst-quick"></div>
      <div id="ep-ai-input">
        <button id="ep-ai-mic" title="语音输入"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V22h2v-3.07A7 7 0 0 0 19 12h-2z"/></svg></button>
        <textarea id="ep-ai-ta" rows="1" placeholder="问这本书 / 让我帮你…"></textarea>
        <button id="ep-ai-send" title="发送">➤</button>
      </div>
    </div>
    <div class="ep-side-pane" data-pane="vocab" id="ep-side-vocab">
      <div id="ep-vocab-scope-row">
        <button data-scope="chapter" onclick="loadVocabPane('chapter')">本章</button>
        <button class="active" data-scope="book" onclick="loadVocabPane('book')">本书</button>
        <button data-scope="all" onclick="loadVocabPane('all')">全部</button>
        <span class="vocab-count" id="ep-vocab-count"></span>
      </div>
      <div id="ep-vocab-list"><div style="color:#5a6680;font-size:12px;padding:10px">点开载入…</div></div>
    </div>
    <div class="ep-side-pane" data-pane="kg" id="ep-side-kg"><div id="ep-kg-nodes"><div class="kg-empty">点开载入…</div></div></div>
    <div class="ep-side-pane" data-pane="hl" id="ep-side-hl"><div class="ep-empty">点开载入高亮…</div></div>
    <div class="ep-side-pane" data-pane="toc" id="ep-side-toc"><div id="ep-toc-list"></div></div>
    <!-- 语法分析 pane(共享核心 RC.grammar 接管:块渲染/结构图/流式/制卡都在 rc-grammar.js,本模板只提供容器)
         照搬 epub_reader.html(epub.js 版)的既有结构,两个 EPUB 阅读器变体共用同一套 id / UX 文案。 -->
    <div class="ep-side-pane" data-pane="grammar" id="ep-side-grammar">
      <div id="ep-grammar-set">
        <div id="ep-grammar-set-head">⚙ 启用语法 KG <span class="gset-caret">▸</span></div>
        <div id="ep-grammar-kglist"><div class="rc-gram-kg-empty">展开载入…</div></div>
      </div>
      <div id="ep-grammar-body"><div class="gb-empty">选词/选句后点「📊 语法」分析所在整句。<br>需先在下方「⚙ 启用语法 KG」勾选至少一本（去技能树点节点「👁 跟踪」）。</div></div>
    </div>
  </aside>

  <div id="ep-search">
    <div id="ep-search-bar"><input id="ep-search-in" type="search" placeholder="全文搜索（全书）…" autocomplete="off" enterkeyhint="search"><span id="ep-search-stat"></span><button id="ep-search-x" title="关闭">✕</button></div>
    <div id="ep-search-res"></div>
  </div>

  <div id="ep-load"><div class="sp"></div><div id="ep-load-msg">正在打开 EPUB…</div></div>

  <!-- AI 结果模态(rc-result.js;UI 与 PDF 一致;CSS 自注入) -->
  <div id="result-mask" onclick="if(event.target===this) closeResult()">
    <div id="result-modal">
      <h3 id="result-title">结果</h3>
      <div class="src" id="result-src"></div>
      <div class="content" id="result-content"></div>
      <div id="result-followup">
        <input id="result-followup-input" placeholder="继续追问…（基于上面的解释）" onkeydown="if(event.key==='Enter'){event.preventDefault();_followupAsk();}">
        <button onclick="_followupAsk()">追问</button>
      </div>
      <div class="actions">
        <div id="vocab-actions"></div>
        <button id="result-mark-btn" onclick="markFromResult()" title="给原始选中加高亮（把当前回答存到备注）" style="background:#244470;color:#fff;border-color:#3b6db5">🖌 标记</button>
        <button id="result-anki-btn" onclick="ankiFromResult()" title="把「选中原文 + 这条解释」做成 Anki 卡片（后台，不挡界面）" style="background:#13351f;color:#7ee2b8;border-color:#34d399">🎴 制 Anki</button>
        <button onclick="closeResult()">关闭</button>
      </div>
    </div>
  </div>
  <div id="draft-badge" onclick="openDraftModal()" title="已选段落">
    <div style="display:flex;flex-direction:column;align-items:center;line-height:1.1"><span class="icon">📋</span><span class="count" id="draft-count">0</span></div>
  </div>
  <div id="draft-mask" onclick="if(event.target===this) closeDraftModal()">
    <div id="draft-modal">
      <h3><span>📋 已选段落 <span id="draft-modal-count" style="color:#7a8497;font-size:12px;font-weight:400"></span></span><button class="clear-all" onclick="clearAllDrafts()">全部清空</button></h3>
      <div id="draft-list"></div>
      <div id="draft-actions">
        <button class="primary" onclick="createNoteFromDrafts()">📝 创建笔记</button>
        <button onclick="createAnkiFromDrafts()">🎴 创建 Anki</button>
        <button onclick="createBothFromDrafts()">📚 笔记 + Anki</button>
      </div>
    </div>
  </div>

<script>
  window.EPUB_CFG = { fileRel: {{ file_rel|tojson }}, fileName: {{ file_name|tojson }}, sha: {{ sha|tojson }}, serverPos: {{ server_pos|default(None)|tojson }}, serverPosTs: {{ server_pos_ts|default(0) }} };
</script>
<script src="/static/qa/marked.js"></script>
<!-- 必须在 mathjax.js 前配 $...$ 行内分隔符(照搬 pdf_reader.html;MathJax v3 默认只认 \(...\)) -->
<script>window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']]},options:{skipHtmlTags:['script','noscript','style','textarea','pre','code']}};</script>
<!-- tex-chtml-full 构建:全部 TeX 扩展内置,零运行时 autoload(同 pdf_reader.html,\boldsymbol 红字根因修复) -->
<script src="/static/qa/mathjax-full.js" async></script>
<!-- 统一控制层(window.RC):PDF/EPUB 共用。本次只接 rc-core + rc-md(零底座耦合),PDF 阅读器不受影响 -->
<script src="/static/pdf/rc-ink.js?v={{ reader_js_v }}"></script><!-- 墨迹共享核心(epub-html/rc-stickynote 依赖) -->
<script src="/static/pdf/rc-core.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-md.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-figures.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-highlight.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-snippets.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-result.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-wordpop.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-phrasepop.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-settings.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-knowledge.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-sidedrawer.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-assistant.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-grammar.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-stickynote.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-favorites.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-video.js?v={{ reader_js_v }}"></script><!-- 助手搜视频结果卡 -->
<script src="/static/pdf/rc-userpages.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/epub-html.js?v={{ reader_js_v }}"></script>
</body>
</html>
