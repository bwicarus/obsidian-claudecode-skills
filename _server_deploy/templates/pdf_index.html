<!doctype html>
<html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF 阅读器 · 文件列表</title>
<style>
body{margin:0;padding:0;background:#1a1d24;color:#e6e6f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px}
.container{max-width:1000px;margin:0 auto;padding:30px 20px}
h1{font-size:22px;color:#cfe6ff;margin:0 0 8px}
.sub{color:#8a9bb4;font-size:13px;margin-bottom:24px}
input[type=search]{width:100%;background:#0d1322;border:1px solid #2a3550;color:#e6e6f0;border-radius:6px;padding:10px 14px;font-size:14px;margin-bottom:20px;box-sizing:border-box}
input[type=search]:focus{outline:none;border-color:#3b6db5}
.pdf-list{display:flex;flex-direction:column;gap:8px}
.pdf-item{background:#10162a;border:1px solid #1f2740;border-radius:6px;padding:12px 16px;transition:all .15s;-webkit-touch-callout:none;user-select:none}
.pdf-item:hover{background:#162045;border-color:#3b6db5}
.pdf-row{display:flex;align-items:center;gap:10px;cursor:pointer}
.pdf-name{color:#cfe6ff;font-weight:600;font-size:14px}
.pdf-meta{color:#8a9bb4;font-size:11px;margin-top:4px}
.pdf-dir{color:#5a6680;font-size:11px;font-family:monospace}
.prep-btn{background:#1a2540;border:1px solid #3b6db5;color:#9fcbff;border-radius:6px;padding:6px 11px;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.prep-btn:disabled{opacity:.5;cursor:default}
.comp-toggle{background:#141a2e;border:1px solid #2a3550;color:#7a8497;border-radius:6px;padding:6px 11px;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.comp-toggle.on{background:#244470;border-color:#3b6db5;color:#cfe6ff;font-weight:600}
.comp-toggle.gray{opacity:.55}
.comp-toggle.breathing{animation:comp-breathe 1.1s ease-in-out infinite;color:#9fcbff;border-color:#3b6db5}
@keyframes comp-breathe{0%,100%{opacity:.4}50%{opacity:1}}
.prep-prog{display:flex;align-items:center;gap:8px;margin-top:10px}
.prep-track{flex:1;height:6px;background:#1f2740;border-radius:3px;overflow:hidden}
.prep-bar{height:100%;width:0;background:#3b82f6;transition:width .3s}
.prep-msg{color:#8a9bb4;font-size:11px;white-space:nowrap;max-width:55%;overflow:hidden;text-overflow:ellipsis}
.empty{color:#5a6680;text-align:center;padding:60px}
.ctx-menu{position:fixed;z-index:1000;background:#10162a;border:1px solid #3b6db5;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.6);overflow:hidden;display:none;min-width:150px}
.ctx-menu .ctx-title{padding:9px 16px;color:#8a9bb4;font-size:11px;border-bottom:1px solid #1f2740;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.ctx-menu button{display:block;width:100%;text-align:left;background:none;border:none;color:#cfe6ff;padding:12px 16px;font-size:14px;cursor:pointer}
.ctx-menu button:active,.ctx-menu button:hover{background:#1a2540}
.ctx-menu button.danger{color:#ff8a8a}
</style>
<!-- mfx:Claude Design 动效+美化层(同阅读器),书架的卡片/行/按钮也享受入场动画/悬浮/玻璃质感 -->
<link rel="stylesheet" href="/static/pdf/mfx.css?v=mfx-2">
</head>
<body>
<div class="container">
  <h1>📚 PDF 阅读器</h1>
  <div class="sub">vault 里所有 PDF（{{ pdfs|length }} 个），按修改时间倒序 · 长按一本可重命名/删除 · 🔧 预处理给扫描书补文字层</div>
  <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
    <label style="background:#1a2540;border:1px solid #3b6db5;color:#cfe6ff;border-radius:6px;padding:8px 16px;cursor:pointer;font-size:13px">
      ⬆️ 上传 PDF
      <input type="file" accept="application/pdf" style="display:none" onchange="uploadPdf(this)">
    </label>
    <input type="text" id="upload-dir" placeholder="目标目录（默认 资源/uploads）" style="background:#0d1322;border:1px solid #2a3550;color:#e6e6f0;border-radius:6px;padding:8px 12px;font-size:13px;flex:1;min-width:200px">
    <span id="upload-status" style="color:#8a9bb4;font-size:12px"></span>
  </div>
  <div style="display:flex;gap:10px;align-items:stretch;margin-bottom:20px">
    <input type="search" id="search" placeholder="🔍 按文件名筛选" oninput="filter()" style="margin-bottom:0;flex:1">
    <a href="/pdf/search" style="background:#244470;border:1px solid #3b6db5;color:#cfe6ff;border-radius:6px;padding:10px 16px;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap;display:flex;align-items:center">🔎 全文搜索</a>
  </div>
  <div class="pdf-list" id="list">
    {% for p in pdfs %}
    <div class="pdf-item" data-name="{{ p.name|lower }}" data-rel="{{ p.rel }}" data-disp="{{ p.name }}"
         data-comp-exists="{{ '1' if p.comp_exists else '' }}" data-comp-compressing="{{ '1' if p.comp_compressing else '' }}"
         ontouchstart="lpStart(event,this)" ontouchend="lpEnd()" ontouchmove="lpEnd()"
         onmousedown="lpStart(event,this)" onmouseup="lpEnd()" onmouseleave="lpEnd()"
         oncontextmenu="return ctxDel(event,this)">
      <div class="pdf-row" onclick="openBook(event,this)">
        <div style="flex:1;min-width:0">
          <div class="pdf-name">{{ p.name }}</div>
          <div class="pdf-meta"><span class="pdf-dir">{{ p.dir }}</span> · {{ p.size_kb }} KB</div>
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0">
          <button class="prep-btn" onclick="preprocess(event,this,'vision')" title="印刷/文档书：Google Vision OCR，快（~2s/页）。已有文字层秒判跳过">📄 文档</button>
          <button class="prep-btn" onclick="preprocess(event,this,'manga')" title="漫画书：manga-ocr，能读气泡/竖排/手写体字（Vision 漏识的），慢（~40s/页）">🎴 漫画</button>
          <button class="prep-btn" onclick="preprocess(event,this,'vision',true)" title="模糊扫描书：栅格化+锐化+对比增强，让字迹更清晰（同时 OCR 补文字层）">✨ 增加清晰度</button>
          <button class="comp-toggle" onclick="compToggle(event,this)" title="压缩版：体积更小、慢网更快。开启后打开本书传压缩版；原书不动（OCR/好网仍用原书）。无压缩版时灰色，点一下生成（呼吸=压缩中）。">🗜 压缩版</button>
          <button class="prep-btn" onclick="prewarmFromList(event,this)" title="预热整本：按页原生宽度把全书所有页（背景图 + 字符/振假名）一次渲好缓存 → 之后翻页秒开。本地实例尤其推荐（本地直接全本渲好、零等待）。">📥 预热</button>
          <button class="prep-btn" onclick="formulaOCR(event,this)" title="公式识别：Claude 视觉给本书的独立公式补 LaTeX（中文混排也准，后台跑，无需 PC）。完成后阅读时点公式直接得 $...$，可复制/问AI/制卡。">🧮 公式</button>
        </div>
      </div>
      <div class="prep-prog" style="display:none"><div class="prep-track"><div class="prep-bar"></div></div><span class="prep-msg"></span></div>
    </div>
    {% else %}
    <div class="empty">vault 里没找到 PDF</div>
    {% endfor %}
  </div>
</div>
<div class="ctx-menu" id="ctx-menu">
  <div class="ctx-title" id="ctx-title"></div>
  <button onclick="ctxRename()">✏️ 重命名</button>
  <button class="danger" onclick="ctxDelete()">🗑 删除</button>
</div>
<script>
function filter() {
  const q = document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('.pdf-item').forEach(el => {
    el.style.display = el.dataset.name.includes(q) ? '' : 'none';
  });
}

// ── 长按弹菜单：重命名 / 删除（移动端 ~500ms / 桌面右键） ──
let _lpTimer = null, _lpFired = false, _ctxItem = null;
function lpStart(ev, item) {
  if (ev.target.closest('.prep-btn')) return;   // 长按预处理按钮不弹菜单
  _lpFired = false;
  clearTimeout(_lpTimer);
  const pt = ev.touches ? ev.touches[0] : ev;
  const x = pt ? pt.clientX : 0, y = pt ? pt.clientY : 0;
  _lpTimer = setTimeout(() => { _lpFired = true; showCtxMenu(item, x, y); }, 500);
}
function lpEnd() { clearTimeout(_lpTimer); }
function ctxDel(ev, item) { ev.preventDefault(); _lpFired = true; showCtxMenu(item, ev.clientX, ev.clientY); return false; }
function showCtxMenu(item, x, y) {
  _ctxItem = item;
  const m = document.getElementById('ctx-menu');
  document.getElementById('ctx-title').textContent = item.dataset.disp;
  m.style.display = 'block';
  const mw = m.offsetWidth || 160, mh = m.offsetHeight || 110;
  m.style.left = Math.max(8, Math.min(x, window.innerWidth - mw - 8)) + 'px';
  m.style.top  = Math.max(8, Math.min(y, window.innerHeight - mh - 8)) + 'px';
}
function hideCtxMenu() { const m = document.getElementById('ctx-menu'); if (m) m.style.display = 'none'; _ctxItem = null; }
document.addEventListener('click', (e) => { if (!e.target.closest('#ctx-menu')) hideCtxMenu(); });
document.addEventListener('touchstart', (e) => { if (!e.target.closest('#ctx-menu') && !e.target.closest('.pdf-item')) hideCtxMenu(); }, true);
function ctxDelete() { const item = _ctxItem; hideCtxMenu(); if (item) deleteBook(item); }
async function ctxRename() {
  const item = _ctxItem; hideCtxMenu();
  if (!item) return;
  const cur = item.dataset.disp, base = cur.replace(/\.pdf$/i, '');
  const nn = prompt('重命名《' + cur + '》\n输入新文件名（可不带 .pdf）：', base);
  if (nn === null) return;
  const name = nn.trim();
  if (!name || name === base) return;
  try {
    const r = await fetch('/pdf/api/rename-pdf', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({file: item.dataset.rel, new_name: name}),
    });
    const d = await r.json();
    if (d.ok) {
      item.dataset.rel = d.rel; item.dataset.disp = d.name; item.dataset.name = d.name.toLowerCase();
      item.querySelector('.pdf-name').textContent = d.name;
    } else alert('重命名失败：' + (d.error || ''));
  } catch (e) { alert('重命名失败：' + e.message); }
}
function openBook(ev, row) {
  if (_lpFired) { _lpFired = false; return; }   // 长按刚弹过菜单 → 不导航
  const item = row.closest('.pdf-item');
  let url = '/pdf/view?file=' + encodeURIComponent(item.dataset.rel);
  // 压缩版开关开着 → 带 &compressed=1(打开时传压缩版)
  if (item.dataset.compExists === '1' && localStorage.getItem(_compKey(item.dataset.rel)) === '1') url += '&compressed=1';
  location.href = url;
}
// ── 压缩版开关(每本书独立):灰=无压缩版(点击生成,呼吸=压缩中) / ○=有但不用 / ●=用压缩版打开 ──
function _compKey(rel) { return 'pdf-use-compressed:' + rel; }
function _compRender(item) {
  const btn = item.querySelector('.comp-toggle'); if (!btn) return;
  const rel = item.dataset.rel, exists = item.dataset.compExists === '1';
  const breathing = btn.classList.contains('breathing');
  const on = exists && localStorage.getItem(_compKey(rel)) === '1';
  btn.classList.toggle('on', on && !breathing);
  btn.classList.toggle('gray', !exists && !breathing);
  if (breathing) return;   // 文字由轮询更新(压缩中 N%)
  btn.textContent = !exists ? '🗜 生成压缩版' : (on ? '🗜 压缩版 ●' : '🗜 压缩版 ○');
}
function compToggle(ev, btn) {
  ev.stopPropagation();
  const item = btn.closest('.pdf-item'), rel = item.dataset.rel;
  if (btn.classList.contains('breathing')) return;   // 压缩中,忽略点击
  if (item.dataset.compExists === '1') {              // 已有压缩版 → 切 用/不用
    const cur = localStorage.getItem(_compKey(rel)) === '1';
    localStorage.setItem(_compKey(rel), cur ? '0' : '1');
    _compRender(item);
  } else {                                            // 无压缩版 → 触发生成 + 呼吸 + 轮询
    btn.classList.add('breathing'); btn.textContent = '🗜 压缩中…';
    fetch('/pdf/api/compress-make', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({file: rel})})
      .then(r => r.json()).then(d => {
        if (!d.ok) { btn.classList.remove('breathing'); _compRender(item); alert('启动压缩失败：' + (d.error || '')); return; }
        if (d.exists) { item.dataset.compExists = '1'; btn.classList.remove('breathing'); localStorage.setItem(_compKey(rel), '1'); _compRender(item); return; }
        _compPoll(item);
      }).catch(e => { btn.classList.remove('breathing'); _compRender(item); });
  }
}
function _compPoll(item) {
  const rel = item.dataset.rel, btn = item.querySelector('.comp-toggle');
  let tries = 0;
  const iv = setInterval(async () => {
    tries++;
    try {
      const d = await (await fetch('/pdf/api/compressed-status?file=' + encodeURIComponent(rel))).json();
      if (d.exists) { clearInterval(iv); btn.classList.remove('breathing'); item.dataset.compExists = '1'; localStorage.setItem(_compKey(rel), '1'); _compRender(item); return; }
      if (d.phase === 'error') { clearInterval(iv); btn.classList.remove('breathing'); _compRender(item); alert('压缩失败：' + (d.error || '')); return; }
      if (d.compressing) btn.textContent = '🗜 压缩中… ' + (d.percent || 0) + '%';
    } catch (e) {}
    if (tries > 1800) { clearInterval(iv); btn.classList.remove('breathing'); _compRender(item); }   // ~1h 兜底
  }, 2000);
}
document.querySelectorAll('.pdf-item').forEach(it => {
  _compRender(it);
  if (it.dataset.compCompressing === '1') { const b = it.querySelector('.comp-toggle'); if (b) { b.classList.add('breathing'); b.textContent = '🗜 压缩中…'; _compPoll(it); } }
});
async function deleteBook(item) {
  const name = item.dataset.disp, rel = item.dataset.rel;
  if (!confirm('删除《' + name + '》？\n不可恢复（会一并清理它的 OCR/预处理缓存；高亮/笔记另存不动）。')) return;
  try {
    const r = await fetch('/pdf/api/delete-pdf', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({file: rel}),
    });
    const d = await r.json();
    if (d.ok) { item.style.transition = 'opacity .2s'; item.style.opacity = '0'; setTimeout(() => item.remove(), 200); }
    else alert('删除失败：' + (d.error || ''));
  } catch (e) { alert('删除失败：' + e.message); }
}

// ── 预处理（扫描书补文字层）：后台 detached 跑，关网页/重启不中断；前端轮询进度 ──
async function preprocess(ev, btn, engine, enhance) {
  ev.stopPropagation();
  const item = btn.closest('.pdf-item'), rel = item.dataset.rel;
  const btns = [...item.querySelectorAll('.prep-btn')];
  const prog = item.querySelector('.prep-prog'), bar = item.querySelector('.prep-bar'), msg = item.querySelector('.prep-msg');
  if (engine === 'manga' && !confirm('用 manga-ocr 处理《' + item.dataset.disp + '》？\n适合漫画书（读气泡/竖排/手写体字）。CPU 上较慢（约 40 秒/页），后台跑，关页面不中断。')) return;
  if (enhance && !confirm('增加《' + item.dataset.disp + '》的清晰度？\n会把扫描页栅格化并锐化（字迹更清晰），同时 OCR 补文字层。后台跑，关页面不中断。')) return;
  btns.forEach(b => b.disabled = true);
  prog.style.display = 'flex'; bar.style.width = '0%'; msg.textContent = '启动中…';
  try {
    const r = await fetch('/pdf/api/preprocess-async', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({file: rel, engine: engine || 'vision', enhance: !!enhance}),
    });
    const d = await r.json();
    if (!d.ok) { msg.textContent = '✗ ' + (d.error || '失败'); btns.forEach(b => b.disabled = false); return; }
    pollPrep(rel, btns, bar, msg);
  } catch (e) { msg.textContent = '✗ ' + e.message; btns.forEach(b => b.disabled = false); }
}
// ── 整本预热（背景图 + 字符层/振假名，按页原生宽度；后台跑，复用进度条）──
async function prewarmFromList(ev, btn) {
  ev.stopPropagation();
  const item = btn.closest('.pdf-item'), rel = item.dataset.rel;
  const prog = item.querySelector('.prep-prog'), bar = item.querySelector('.prep-bar'), msg = item.querySelector('.prep-msg');
  prog.style.display = 'flex'; bar.style.width = '0%'; msg.textContent = '预热启动中…';
  let width = 1352;
  try {
    const m = await (await fetch('/pdf/api/book-meta?file=' + encodeURIComponent(rel))).json();
    if (m && m.ok && m.page_w) width = Math.max(400, Math.min(2400, Math.round(m.page_w)));   // 渲染基准=页原生宽(与显示解耦)
  } catch (_) {}
  try {
    const r = await fetch('/pdf/api/prewarm-async', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({file: rel, width}),
    });
    const d = await r.json();
    if (!d.ok) { msg.textContent = '✗ ' + (d.error || '启动失败'); return; }
  } catch (e) { msg.textContent = '✗ ' + e.message; return; }
  const iv = setInterval(async () => {
    let st;
    try { st = await (await fetch('/pdf/api/prewarm-status?file=' + encodeURIComponent(rel) + '&width=' + width)).json(); }
    catch (_) { return; }
    if (!st || !st.ok) return;
    bar.style.width = (st.percent || 0) + '%';
    msg.textContent = (st.percent >= 100) ? '✓ 已预热整本（翻页秒开）' : ('预热中… ' + Math.floor(st.percent) + '%');
    if (st.percent >= 100 || (!st.running && st.done > 0)) {
      clearInterval(iv);
      if (st.percent >= 100) { bar.style.width = '100%'; msg.textContent = '✓ 已预热整本（翻页秒开）'; }
      setTimeout(() => { prog.style.display = 'none'; }, 4000);
    }
  }, 2000);
}

// ── 公式识别（Claude 视觉，后台 detached + 进度轮询；复用同一进度条）──
async function formulaOCR(ev, btn) {
  ev.stopPropagation();
  const item = btn.closest('.pdf-item'), rel = item.dataset.rel;
  const prog = item.querySelector('.prep-prog'), bar = item.querySelector('.prep-bar'), msg = item.querySelector('.prep-msg');
  prog.style.display = 'flex'; bar.style.width = '0%'; msg.textContent = '公式识别启动中…';
  try {
    const d = await (await fetch('/pdf/api/formula-ocr', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({file:rel})})).json();
    if (!d.ok) { msg.textContent = '✗ ' + (d.msg || '启动失败'); return; }
    if (d.done) { bar.style.width='100%'; msg.textContent = '✓ 公式都已识别（'+d.have+'/'+d.total+'）'; setTimeout(()=>{prog.style.display='none';},4000); return; }
    msg.textContent = '公式识别中（后台，可关页面）… ' + d.have + '/' + d.total;
  } catch (e) { msg.textContent = '✗ ' + e.message; return; }
  const iv = setInterval(async () => {
    let st;
    try { st = await (await fetch('/pdf/api/formula-ocr-status?file=' + encodeURIComponent(rel))).json(); }
    catch (_) { return; }
    if (!st || !st.ok) return;
    const pct = st.total ? Math.round(100 * st.have / st.total) : 0;
    bar.style.width = pct + '%';
    msg.textContent = st.running ? ('公式识别中… ' + st.have + '/' + st.total) : ('✓ 公式识别完成 ' + st.have + '/' + st.total + '（点公式可选成 $...$）');
    if (!st.running) { clearInterval(iv); bar.style.width = '100%'; setTimeout(() => { prog.style.display = 'none'; }, 5000); }
  }, 3000);
}

// ── 智能压缩（gs 降采样图像+保留文字层）：复用同一进度条/轮询 ──
async function compress(ev, btn) {
  ev.stopPropagation();
  const item = btn.closest('.pdf-item'), rel = item.dataset.rel;
  const btns = [...item.querySelectorAll('.prep-btn')];
  const prog = item.querySelector('.prep-prog'), bar = item.querySelector('.prep-bar'), msg = item.querySelector('.prep-msg');
  if (!confirm('智能压缩《' + item.dataset.disp + '》？\n只重压图像（长边≤2400px + JPEG），保留文字层、选中/搜索不受影响，扫描书体积常省一大半。\n有损图像，但原书可重建（不满意就再点「增加清晰度」）。后台跑，关页面不中断。')) return;
  btns.forEach(b => b.disabled = true);
  prog.style.display = 'flex'; bar.style.width = '0%'; msg.textContent = '启动中…';
  try {
    const r = await fetch('/pdf/api/compress-async', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({file: rel}),
    });
    const d = await r.json();
    if (!d.ok) { msg.textContent = '✗ ' + (d.error || '失败'); btns.forEach(b => b.disabled = false); return; }
    pollPrep(rel, btns, bar, msg);
  } catch (e) { msg.textContent = '✗ ' + e.message; btns.forEach(b => b.disabled = false); }
}
function pollPrep(rel, btns, bar, msg) {
  let tries = 0;
  const iv = setInterval(async () => {
    tries++;
    try {
      const r = await fetch('/pdf/api/preprocess-status?file=' + encodeURIComponent(rel));
      const d = await r.json();
      const pct = d.percent || 0;
      bar.style.width = pct + '%';
      if (d.phase === 'done') {
        clearInterval(iv); bar.style.width = '100%';
        msg.textContent = '✓ ' + (d.msg || '完成'); btns.forEach(b => b.disabled = false);
        return;
      }
      if (d.phase === 'error') {
        clearInterval(iv); msg.textContent = '✗ ' + (d.error || '失败'); btns.forEach(b => b.disabled = false); return;
      }
      msg.textContent = (d.msg || d.phase || '处理中') + (pct ? ' · ' + pct + '%' : '');
    } catch (e) { /* 网络瞬断：继续轮询（后台没停） */ }
    if (tries > 3600) { clearInterval(iv); btns.forEach(b => b.disabled = false); }   // ~2h 兜底(漫画慢)
  }, 2000);
}

async function uploadPdf(input) {
  const file = input.files[0];
  if (!file) return;
  const status = document.getElementById('upload-status');
  const dir = document.getElementById('upload-dir').value.trim() || '资源/uploads';
  status.textContent = '⏳ 上传中…' + (file.size > 1024*1024 ? ` (${(file.size/1024/1024).toFixed(1)} MB)` : '');
  const fd = new FormData();
  fd.append('file', file);
  fd.append('target_dir', dir);
  try {
    const r = await fetch('/pdf/api/upload', {method:'POST', body: fd});
    const d = await r.json();
    if (d.ok) {
      status.innerHTML = `✓ 已上传 → <a href="${d.view_url}" style="color:#60a5fa">${d.rel}</a>`;
      setTimeout(() => location.href = d.view_url, 800);
    } else {
      status.innerHTML = `<span style="color:#c00">✗ ${d.error || '失败'}</span>`;
    }
  } catch (e) {
    status.innerHTML = `<span style="color:#c00">✗ ${e.message}</span>`;
  }
  input.value = '';
}

// ── 刷新后恢复进行中的预处理/OCR 任务（后端进度文件驱动，进程没停 → 重新挂进度条+轮询）──
async function resumeActiveJobs() {
  try {
    const r = await fetch('/pdf/api/preprocess-active');
    const d = await r.json();
    (d.active || []).forEach(job => {
      const item = [...document.querySelectorAll('.pdf-item')].find(el => el.dataset.rel === job.rel);
      if (!item) return;
      const btns = [...item.querySelectorAll('.prep-btn')];
      const prog = item.querySelector('.prep-prog'), bar = item.querySelector('.prep-bar'), msg = item.querySelector('.prep-msg');
      btns.forEach(b => b.disabled = true);
      prog.style.display = 'flex';
      bar.style.width = (job.percent || 0) + '%';
      msg.textContent = (job.msg || job.phase || '处理中…');
      pollPrep(job.rel, btns, bar, msg);
    });
  } catch (e) {}
}
resumeActiveJobs();
