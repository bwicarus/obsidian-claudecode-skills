<!doctype html>
<html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF 阅读器 · 文件列表</title>
<style>
body{margin:0;padding:0;background:#1a1d24;color:#e6e6f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px}
.container{max-width:1000px;margin:0 auto;padding:30px 20px}
h1{font-size:22px;color:#cfe6ff;margin:0 0 8px}
.sub{color:#8a9bb4;font-size:13px;margin-bottom:24px}
input[type=search]{width:100%;background:#0d1322;border:1px solid #2a3550;color:#e6e6f0;border-radius:6px;padding:10px 14px;font-size:14px;margin-bottom:20px;box-sizing:border-box}
input[type=search]:focus{outline:none;border-color:#3b6db5}
.pdf-list{display:flex;flex-direction:column;gap:8px}
.pdf-item{background:#10162a;border:1px solid #1f2740;border-radius:6px;padding:12px 16px;cursor:pointer;transition:all .15s}
.pdf-item:hover{background:#162045;border-color:#3b6db5}
.pdf-name{color:#cfe6ff;font-weight:600;font-size:14px}
.pdf-meta{color:#8a9bb4;font-size:11px;margin-top:4px}
.pdf-dir{color:#5a6680;font-size:11px;font-family:monospace}
.empty{color:#5a6680;text-align:center;padding:60px}
</style>
</head>
<body>
<div class="container">
  <h1>📚 PDF 阅读器</h1>
  <div class="sub">vault 里所有 PDF（{{ pdfs|length }} 个），按修改时间倒序</div>
  <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
    <label style="background:#1a2540;border:1px solid #3b6db5;color:#cfe6ff;border-radius:6px;padding:8px 16px;cursor:pointer;font-size:13px">
      ⬆️ 上传 PDF
      <input type="file" accept="application/pdf" style="display:none" onchange="uploadPdf(this)">
    </label>
    <input type="text" id="upload-dir" placeholder="目标目录（默认 资源/uploads）" style="background:#0d1322;border:1px solid #2a3550;color:#e6e6f0;border-radius:6px;padding:8px 12px;font-size:13px;flex:1;min-width:200px">
    <span id="upload-status" style="color:#8a9bb4;font-size:12px"></span>
  </div>
  <input type="search" id="search" placeholder="🔍 搜索（按文件名）" oninput="filter()">
  <div class="pdf-list" id="list">
    {% for p in pdfs %}
    <div class="pdf-item" data-name="{{ p.name|lower }}" onclick="location.href='/pdf/view?file={{ p.rel|urlencode }}'">
      <div class="pdf-name">{{ p.name }}</div>
      <div class="pdf-meta"><span class="pdf-dir">{{ p.dir }}</span> · {{ p.size_kb }} KB</div>
    </div>
    {% else %}
    <div class="empty">vault 里没找到 PDF</div>
    {% endfor %}
  </div>
</div>
<script>
function filter() {
  const q = document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('.pdf-item').forEach(el => {
    el.style.display = el.dataset.name.includes(q) ? '' : 'none';
  });
}

async function uploadPdf(input) {
  const file = input.files[0];
  if (!file) return;
  const status = document.getElementById('upload-status');
  const dir = document.getElementById('upload-dir').value.trim() || '资源/uploads';
  status.textContent = '⏳ 上传中…' + (file.size > 1024*1024 ? ` (${(file.size/1024/1024).toFixed(1)} MB)` : '');
  const fd = new FormData();
  fd.append('file', file);
  fd.append('target_dir', dir);
  try {
    const r = await fetch('/pdf/api/upload', {method:'POST', body: fd});
    const d = await r.json();
    if (d.ok) {
      status.innerHTML = `✓ 已上传 → <a href="${d.view_url}" style="color:#60a5fa">${d.rel}</a>`;
      setTimeout(() => location.href = d.view_url, 800);
    } else {
      status.innerHTML = `<span style="color:#c00">✗ ${d.error || '失败'}</span>`;
    }
  } catch (e) {
    status.innerHTML = `<span style="color:#c00">✗ ${e.message}</span>`;
  }
  input.value = '';
}
</script>
</body></html>
