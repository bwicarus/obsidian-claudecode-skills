<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>{{ file_name }} · EPUB</title>
<style>
  :root{ --chrome:#0d1426; --chrome-bd:#2a3a63; --ink:#1b1b1b; --paper:#f6f3ea; }
  *{box-sizing:border-box}
  /* iOS tap 可靠性:所有按钮去掉双击缩放歧义 + 300ms 延迟(照搬手搓版) */
  button,[role=button],.ep-fb-btn,select,input[type=checkbox]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0e1a;color:#e6edf3;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
  body{display:flex;flex-direction:column}   /* 照搬手搓版(=PDF):竖向 flex 列(顶栏 + 阅读区),开抽屉用 padding-right 挤,顶栏永远可点 */

  /* ── 顶栏(verbatim 搬自 epub_html_reader.html #ep-top;title/scrub/あ/译页/🔍/⛶/⚙)── */
  #ep-top{position:relative;flex:0 0 auto;height:calc(48px + env(safe-area-inset-top));z-index:50;display:flex;align-items:center;gap:8px;flex-wrap:nowrap;overflow-x:auto;
    padding:0 10px;padding-top:env(safe-area-inset-top);background:#10162a;border-bottom:1px solid #2a3550}
  #ep-top button{background:#1a2540;border:1px solid #2a3550;color:#cfe6ff;border-radius:7px;height:36px;min-width:38px;padding:0 12px;font-size:15px;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap;flex:none;display:inline-flex;align-items:center;justify-content:center;touch-action:manipulation;position:relative;z-index:1}
  #ep-top button:hover{background:#2c3e6a;border-color:#3b6db5}
  #ep-top button:active{background:#2c3e6a}
  #ep-top button.active{background:#244470;border-color:#3b6db5;color:#7dd3fc}
  #ep-title{flex:1 1 auto;min-width:0;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;color:#cfe6ff;cursor:pointer}
  /* 章节/百分比 scrubber(verbatim 搬自手搓版 #ep-scrub:拖动跳章 + 浮层) */
  #ep-scrub{cursor:ew-resize;user-select:none;-webkit-user-select:none;touch-action:none;padding:2px 6px;display:inline-flex;align-items:baseline;gap:2px;border-radius:5px;flex:none;color:#8a9bb4;font-size:12px}
  #ep-scrub:active{background:#1a2540}
  #ep-scrub #ep-page-cur{color:#cfe6ff;font-variant-numeric:tabular-nums;min-width:1.5em;text-align:right}
  #ep-scrub-pop{display:none;position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:240;background:#10162a;border:1px solid #3b6db5;border-radius:12px;padding:12px 18px;box-shadow:0 8px 28px rgba(0,0,0,.6);flex-direction:column;align-items:center;gap:8px;pointer-events:none;min-width:200px}
  #ep-scrub-pop.on{display:flex}
  #ep-scrub-pop .psp-num{color:#dff1ff;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #ep-scrub-pop .psp-track{width:180px;height:4px;background:#243049;border-radius:2px;overflow:hidden}
  #ep-scrub-pop .psp-fill{height:100%;background:#6fd3ff;width:0%}
  #ep-bar{position:fixed;top:calc(48px + env(safe-area-inset-top));left:0;height:2px;background:#3b82f6;z-index:51;width:0;transition:width .2s}
  /* 全屏(verbatim 搬自手搓版 .fs-mode + #fs-restore) */
  body.fs-mode #ep-top{display:none}
  body.fs-mode #ep-bar{top:env(safe-area-inset-top)}
  #fs-restore{display:none;position:fixed;top:8px;right:8px;z-index:1400;width:34px;height:34px;border-radius:50%;background:rgba(16,22,42,.62);border:1px solid rgba(120,160,220,.5);color:#cfe6ff;font-size:16px;line-height:1;cursor:pointer;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);box-shadow:0 2px 10px rgba(0,0,0,.35);padding:0}
  body.fs-mode #fs-restore{display:flex}

  /* ── 阅读区:epub.js renderTo 的目标(占满顶栏下方);epub.js 注入的 iframe 充满 ── */
  #ep-viewer{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;background:var(--paper)}
  #ep-viewer iframe{border:0}

  /* ── 选中工具栏(左 色板列 #ep-hl-pick | 右 #ep-main:preview 在上、按钮一排;按词/多词分流由 epub2.js showSel 控制 display;z>抽屉)── */
  #ep-sel{position:fixed;z-index:78;display:none;flex-direction:row;align-items:flex-start;max-width:96vw;
    background:#1a2540;border:1px solid #3b6db5;border-radius:9px;padding:6px;box-shadow:0 6px 18px rgba(0,0,0,.6);gap:8px}
  #ep-sel.open{display:flex}
  /* 4 色板(verbatim 搬自 epub_html_reader.html #ep-hl-pick;.swatch[data-c=色值] 点击直接用该色高亮,激活外框 .active)*/
  #ep-hl-pick{display:flex;flex-direction:column;gap:6px;align-items:center;padding:2px 8px 2px 2px;flex-shrink:0;border-right:1px solid #2a3550}
  #ep-hl-pick .lbl{font-size:13px;line-height:1}
  #ep-hl-pick .swatch{width:17px;height:17px;border-radius:50%;border:2px solid #5b6a85;cursor:pointer;flex-shrink:0;transition:border-color .12s,transform .12s,box-shadow .12s;-webkit-tap-highlight-color:transparent}
  #ep-hl-pick .swatch:hover{border-color:#fff;transform:scale(1.08)}
  #ep-hl-pick .swatch.active{border-color:#fff;box-shadow:0 0 0 2px #0078d4,inset 0 0 0 1px rgba(0,0,0,.3);transform:scale(1.05)}
  #ep-main{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
  #ep-sel .ep-preview{color:#a8cdff;font-size:11px;line-height:1.5;background:rgba(0,0,0,.3);border-radius:4px;
    padding:5px 9px;max-height:54px;overflow:hidden;word-break:break-word;border-left:2px solid #60a5fa}
  #ep-sel .ep-preview .len{color:#7a8497;font-size:10px;margin-left:6px}
  #ep-sel .ep-btns{display:flex;gap:4px;flex-wrap:wrap}
  #ep-sel button{background:transparent;border:none;color:#cfe6ff;cursor:pointer;padding:6px 9px;border-radius:6px;
    font-size:12.5px;white-space:nowrap;-webkit-tap-highlight-color:transparent}
  #ep-sel button:hover{background:#2c3e6a;color:#fff}
  #ep-sel button:active{background:#2c3e6a}
  /* ── 字典浮层(legacy 容器;RC.dict/RC.wordpop 自带浮层)── */
  #ep-dict{position:fixed;z-index:72;display:none;max-width:min(90vw,360px);background:#0f1830;border:1px solid #2f4a7d;
    border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.6);padding:12px 14px;color:#e6edf3;font-size:13px;line-height:1.6}
  #ep-dict.open{display:block}
  #ep-dict .w{font-size:17px;font-weight:700;color:#fff}
  #ep-dict .ph{color:#8fb0e8;font-size:12px;margin-left:7px}
  #ep-dict .tr{margin-top:5px;color:#cfe0ff}
  #ep-dict .df{margin-top:5px;color:#aebcd6;font-size:12px;white-space:pre-wrap}
  #ep-dict .cls{position:absolute;top:6px;right:9px;color:#7a8497;cursor:pointer;font-size:15px}
  /* ── 高亮编辑浮层(legacy 容器,后续 phase 用)── */
  #ep-hlpop{position:fixed;z-index:74;display:none;background:#0f1830;border:1px solid #2f4a7d;border-radius:11px;
    box-shadow:0 10px 30px rgba(0,0,0,.6);padding:10px;color:#e6edf3}
  #ep-hlpop.open{display:block}

  /* ── 统一抽屉「助手」pane 内容(snippets 结果卡 / 助手对话占位 UI;CSS 与手搓版一致)── */
  #ep-ai-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;display:flex;flex-direction:column;gap:10px}
  .ep-card{background:#11192c;border:1px solid #243056;border-radius:11px;padding:10px 12px}
  .ep-card .h{font-size:11px;color:#7c93c4;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;display:flex;gap:6px;align-items:center}
  .ep-card .c{font-size:14px;line-height:1.65;color:#e6edf3;word-break:break-word}
  .ep-msg{max-width:94%;padding:8px 11px;border-radius:12px;font-size:14px;line-height:1.6;word-break:break-word}
  .ep-msg.u{align-self:flex-end;background:#234;color:#dbeaff}
  .ep-msg.a{align-self:flex-start;background:#11192c;border:1px solid #243056;color:#e6edf3}
  .ep-card .c p:first-child,.ep-msg p:first-child{margin-top:0}
  .ep-card .c p:last-child,.ep-msg p:last-child{margin-bottom:0}
  .ep-sel-chip{font-size:11px;color:#8fb0e8;background:#0e1a30;border:1px solid #234;border-radius:6px;padding:2px 7px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block}
  /* 底部快捷按钮(照搬手搓版 #ep-asst-quick) */
  #ep-asst-quick{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;border-top:1px solid #233156}
  #ep-asst-quick button{background:#16203a;border:1px solid #2a3a63;color:#bcd0ff;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  #ep-asst-quick button:active{background:#22305a}
  #ep-asst-quick button.asst-learn{background:#16293a;border-color:#2a4a63;color:#bce0ff}
  #ep-ai-input{flex:0 0 auto;display:flex;gap:7px;padding:9px;border-top:1px solid #1f2740;align-items:flex-end}
  /* 抽屉只显示 active pane(静态写死,页面一加载就生效,不依赖 rc-sidedrawer init 时机/成败);
     active 用 flex 列 → 聊天区(#ep-ai-body)填满、输入框沉底,下方不再漏出其它 pane 的「点开载入…」占位 */
  #ep-side .ep-side-pane{display:none}
  #ep-side .ep-side-pane.active{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
  #ep-ai-ta{flex:1;background:#0e1525;border:1px solid var(--chrome-bd);color:#e6edf3;border-radius:10px;padding:9px 11px;
    font-size:14px;resize:none;max-height:120px;font-family:inherit;line-height:1.4}
  #ep-ai-send{background:#2563eb;border:none;color:#fff;width:40px;height:40px;border-radius:10px;font-size:17px;cursor:pointer;flex:none}
  /* 麦克风(照搬手搓版 #ep-ai-mic) */
  #ep-ai-mic{background:#16203a;border:1px solid #2a3a63;color:#9fb4e0;width:42px;height:42px;border-radius:12px;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s,border-color .2s,transform .1s;-webkit-tap-highlight-color:transparent}
  #ep-ai-mic:active{transform:scale(.9)}
  #ep-ai-mic.on{background:#0a84ff;border-color:#0a84ff;color:#fff;animation:epMicPulse 1.5s ease-in-out infinite}
  @keyframes epMicPulse{0%,100%{box-shadow:0 0 0 0 rgba(10,132,255,.5)}50%{box-shadow:0 0 0 9px rgba(10,132,255,0)}}
  .ep-spin{display:inline-block;width:13px;height:13px;border:2px solid #2b3f6e;border-top-color:#7dd3fc;border-radius:50%;animation:eps .8s linear infinite;vertical-align:-2px}
  @keyframes eps{to{transform:rotate(360deg)}}
  /* 高亮列表项 / 空态 / 目录项(渲进抽屉对应 pane) */
  .ep-hl-item{display:flex;align-items:flex-start;gap:9px;background:#11192c;border:1px solid #243056;border-radius:10px;padding:9px 10px}
  .ep-hl-item .dot{flex:0 0 auto;width:14px;height:14px;border-radius:4px;margin-top:2px}
  .ep-hl-item .tx{flex:1;min-width:0;font-size:13px;color:#dbe7ff;line-height:1.5;word-break:break-word}
  .ep-empty{color:#7c93c4;font-size:13px;text-align:center;padding:20px}
  #ep-toc-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .ep-toc-i{display:block;padding:10px 16px;font-size:13.5px;color:#cdd8f5;border-bottom:1px solid #161e34;cursor:pointer;line-height:1.4}
  .ep-toc-i:active{background:#16203a}

  /* ── 回到第X页返回条(verbatim 搬自 PDF reader.src/05-nav.js _showPageBackBar;epub2-assist jumpTo 记跳前 cfi → 弹此条 → 点击回跳;CSS 在模板,DOM 由 epub2-assist 显隐+绑 click)── */
  #page-back-bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:140;display:none;
    background:#1a2540;border:1px solid #3b6db5;color:#cfe6ff;padding:9px 18px;border-radius:20px;font-size:14px;
    cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.5);-webkit-tap-highlight-color:transparent;white-space:nowrap}
  #page-back-bar:active{transform:translateX(-50%) scale(.95)}
  .asst-pagelink{color:#7dd3fc;cursor:pointer;border-bottom:1px dashed rgba(125,211,252,.6);padding:0 1px}
  .asst-pagelink:active{color:#bae6fd}

  /* ── 加载/错误 ── */
  #ep-load{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;flex-direction:column;
    gap:12px;background:#0a0e1a;color:#aebfe0;font-size:14px}
  #ep-load .sp{width:34px;height:34px;border:3px solid #243056;border-top-color:#3b82f6;border-radius:50%;animation:eps 1s linear infinite}
  #ep-load a{color:#60a5fa;text-decoration:none;font-size:13px}
</style>
</head>
<body>
  <!-- 顶栏:verbatim 搬自 epub_html_reader.html(=PDF 阅读器布局):title/scrub 页码/あ振假名/译页/🔍搜索/⛶全屏/⚙设置 -->
  <div id="ep-top">
    <div id="ep-title" onclick="location.href='/pdf/'" title="点击返回书架">{{ file_name }}</div>
    <span id="ep-scrub" title="左右拖动快速跳章 · 点击输入百分比"><b id="ep-page-cur">1</b><span id="ep-page-total" style="color:#8a9bb4;font-size:12px">/ –</span></span>
    <button id="ep-ruby" title="振假名 / 音标(あ)">あ</button>
    <button id="ep-pagetr" title="整页翻译">译页</button>
    <button id="ep-search-btn" title="搜索">🔍</button>
    <button id="fs-toggle" title="全屏">⛶</button>
    <button id="ep-set-btn" title="设置">⚙️</button>
  </div>
  <div id="ep-bar"></div>
  <div id="ep-scrub-pop"><div class="psp-num">—</div><div class="psp-track"><div class="psp-fill"></div></div></div>
  <button id="fs-restore" title="退出全屏">⤢</button>
  <!-- 回到第X页返回条:CSS 在本模板,文案/显隐/click 由 epub2-assist 管(PDF 命名 window.pageGoBack;未就绪则 no-op) -->
  <div id="page-back-bar" onclick="if(typeof pageGoBack==='function')pageGoBack()"></div>
  <div id="ep-viewer"></div>

  <!-- 选中工具栏(data-act/data-grp 与手搓版一致;word=单词 / multi=多词 / both=两者,分流由 epub2.js showSel 控制)
       左列 #ep-hl-pick 4 色板(.swatch[data-c=色值];点某色→epub2-highlight.js 直接用该色高亮),右 #ep-main = preview+按钮 -->
  <div id="ep-sel">
    <div id="ep-hl-pick">
      <span class="lbl">🖌</span>
      <i class="swatch" data-c="#fff59d" style="background:#fff59d"></i>
      <i class="swatch" data-c="#a7f3d0" style="background:#a7f3d0"></i>
      <i class="swatch" data-c="#a3d4ff" style="background:#a3d4ff"></i>
      <i class="swatch" data-c="#fda4af" style="background:#fda4af"></i>
    </div>
    <div id="ep-main">
      <div class="ep-preview" id="ep-preview">—</div>
      <div class="ep-btns">
        <button data-act="copy" data-grp="both">📋 复制</button>
        <button data-act="dict" data-grp="word">🔍 查词</button>
        <button data-act="translate" data-grp="multi">🌐 翻译</button>
        <button data-act="explain" data-grp="multi">💡 解释</button>
        <button data-act="grammar" data-grp="multi">📊 语法</button>
        <button data-act="chat" data-grp="multi">💬 对话</button>
        <button data-act="highlight" data-grp="both">🖍 高亮</button>
        <button data-act="note" data-grp="both">📝 笔记</button>
        <button data-act="anki" data-grp="both">🎴 制卡</button>
      </div>
    </div>
  </div>
  <div id="ep-dict"></div>
  <div id="ep-hlpop"></div>

  <!-- 右侧统一抽屉(照搬手搓版 #ep-side):把手 + tab 栏由 RC.sidedrawer.init 注入;5 pane = 助手/单词本/知识点/高亮/目录 -->
  <aside id="ep-side">
    <div class="ep-side-pane active" data-pane="asst" id="ep-side-asst">
      <div id="ep-ai-body"></div>
      <div id="ep-asst-quick">
        <button class="asst-learn" data-send="总结这一章的要点，分点列出，简洁">📝 总结本章</button>
        <button class="asst-learn" data-send="这一章里我可能还没掌握哪些词？逐个讲讲">📚 本章生词</button>
        <button class="asst-learn" data-send="这一章涉及哪些知识点？简要讲讲">🧩 这章知识点</button>
        <button data-q="clear">🗑 清空</button>
        <button data-q="models">⚙ 模型</button>
      </div>
      <div id="ep-ai-input">
        <button id="ep-ai-mic" title="语音输入"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V22h2v-3.07A7 7 0 0 0 19 12h-2z"/></svg></button>
        <textarea id="ep-ai-ta" rows="1" placeholder="问这本书 / 让我帮你…"></textarea>
        <button id="ep-ai-send" title="发送">➤</button>
      </div>
    </div>
    <div class="ep-side-pane" data-pane="vocab" id="ep-side-vocab">
      <div id="ep-vocab-scope-row">
        <button data-scope="chapter" onclick="loadVocabPane('chapter')">本章</button>
        <button class="active" data-scope="book" onclick="loadVocabPane('book')">本书</button>
        <button data-scope="all" onclick="loadVocabPane('all')">全部</button>
        <span class="vocab-count" id="ep-vocab-count"></span>
      </div>
      <div id="ep-vocab-list"><div style="color:#5a6680;font-size:12px;padding:10px">点开载入…</div></div>
    </div>
    <div class="ep-side-pane" data-pane="kg" id="ep-side-kg"><div id="ep-kg-nodes"><div class="kg-empty">点开载入…</div></div></div>
    <div class="ep-side-pane" data-pane="hl" id="ep-side-hl"><div class="ep-empty">点开载入高亮…</div></div>
    <div class="ep-side-pane" data-pane="toc" id="ep-side-toc"><div id="ep-toc-list"></div></div>
    <!-- 语法分析 pane(epub2-grammar.js 接管:tab 由该模块动态插进 #ep-side-tabs;设置区折叠 + 分析块容器)-->
    <div class="ep-side-pane" data-pane="grammar" id="ep-side-grammar">
      <div id="ep-grammar-set">
        <div id="ep-grammar-set-head">⚙ 启用语法 KG <span class="gset-caret">▸</span></div>
        <div id="ep-grammar-kglist"><div class="gk-empty">展开载入…</div></div>
      </div>
      <div id="ep-grammar-body"><div class="gb-empty">选词/选句后点「📊 语法」分析所在整句。<br>需先在下方「⚙ 启用语法 KG」勾选至少一本（去技能树点节点「👁 跟踪」）。</div></div>
    </div>
  </aside>

  <div id="ep-load">
    <!-- 加载期间也能退回书架(遮罩盖住标题,这里给个出口;goPdfList 不存在则回落整页跳 /pdf/;照搬 PDF pdf-loading 逃生口)-->
    <a href="/pdf/" onclick="try{goPdfList();return false}catch(_){return true}"
       style="position:absolute;top:16px;left:16px;background:#244470;border:1px solid #3b6db5;color:#cfe6ff;border-radius:8px;padding:9px 16px;font-size:14px;text-decoration:none;cursor:pointer">← 返回书架</a>
    <div class="sp"></div><div id="ep-load-msg">正在打开 EPUB…</div>
  </div>

  <!-- AI 结果模态 + 草稿系统(rc-result.js;UI/CSS 由 rc-result 自注入,这里只贴它依赖的 DOM 骨架,与 PDF 一致) -->
  <div id="result-mask" onclick="if(event.target===this) closeResult()">
    <div id="result-modal">
      <h3 id="result-title">结果</h3>
      <div class="src" id="result-src"></div>
      <div class="content" id="result-content"></div>
      <div id="result-followup">
        <input id="result-followup-input" placeholder="继续追问…（基于上面的解释）" onkeydown="if(event.key==='Enter'){event.preventDefault();_followupAsk();}">
        <button onclick="_followupAsk()">追问</button>
      </div>
      <div class="actions">
        <div id="vocab-actions"></div>
        <button id="result-mark-btn" onclick="markFromResult()" title="给选中原文加高亮（用上次颜色 + 把当前回答存到备注）" style="background:#244470;color:#fff;border-color:#3b6db5">🖌 标记</button>
        <button id="result-anki-btn" onclick="ankiFromResult()" title="把「选中原文 + 这条解释」做成 Anki 卡片（后台，不挡界面）" style="background:#13351f;color:#7ee2b8;border-color:#34d399">🎴 制 Anki</button>
        <button onclick="closeResult()">关闭</button>
      </div>
    </div>
  </div>
  <div id="draft-badge" onclick="openDraftModal()" title="已选段落">
    <div style="display:flex;flex-direction:column;align-items:center;line-height:1.1"><span class="icon">📋</span><span class="count" id="draft-count">0</span></div>
  </div>
  <div id="draft-mask" onclick="if(event.target===this) closeDraftModal()">
    <div id="draft-modal">
      <h3><span>📋 已选段落 <span id="draft-modal-count" style="color:#7a8497;font-size:12px;font-weight:400"></span></span><button class="clear-all" onclick="clearAllDrafts()">全部清空</button></h3>
      <div id="draft-list"></div>
      <div id="draft-actions">
        <button class="primary" onclick="createNoteFromDrafts()">📝 创建笔记</button>
        <button onclick="createAnkiFromDrafts()">🎴 创建 Anki</button>
        <button onclick="createBothFromDrafts()">📚 笔记 + Anki</button>
      </div>
    </div>
  </div>

<script>
  window.EPUB_CFG = {
    base: {{ epub_base|tojson }},
    fileRel: {{ file_rel|tojson }},
    fileName: {{ file_name|tojson }}
