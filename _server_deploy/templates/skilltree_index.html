<!doctype html>
<html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>技能树</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f7;color:#222;margin:0;padding:32px}
h1{margin:0 0 16px;font-size:22px}
ul{list-style:none;padding:0}
li{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:14px 18px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
a{color:#0057b8;text-decoration:none;font-weight:600;font-size:15px}
.meta{color:#888;font-size:12px}
</style></head>
<body>
<h1>知识图谱（技能树）</h1>
{% if books %}
<ul>
{% for b in books %}
  <li><a href="/skilltree/{{ b.id }}/">{{ b.id }}</a>
      <span class="meta">{{ b.nodes }} 节点 · {{ b.edges }} 边</span></li>
{% endfor %}
</ul>
{% else %}
<p>还没有书的知识图谱。先用 <code>scripts/kg/*</code> 流水线生成 <code>knowledge_graph/&lt;book&gt;.json</code>。</p>
{% endif %}
</body></html>
