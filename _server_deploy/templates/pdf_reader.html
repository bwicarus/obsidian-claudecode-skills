<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#1a1d24;color:#e6e6f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px}
/* 用 dvh 避开 iOS Safari 100vh 包含 toolbar 高度让 header 挤出可视区的 bug */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#header{flex:0 0 48px;display:flex;align-items:center;padding:0 14px;background:#10162a;border-bottom:1px solid #2a3550;gap:12px;flex-wrap:wrap;overflow-x:auto}
/* 文件名不再 flex:1 撑开 → 后面的按钮都紧跟在文件名右侧靠左排，右上角让给侧栏 */
#header h1{font-size:14px;margin:0;color:#cfe6ff;flex:0 1 auto;max-width:28vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#header button{background:#1a2540;border:1px solid #2a3550;color:#cfe6ff;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12px}
#header button:hover{background:#2c3e6a;border-color:#3b6db5}
#header input[type=number]{background:#0d1322;border:1px solid #2a3550;color:#e6e6f0;border-radius:4px;padding:4px 8px;width:60px;font-size:12px}

#main{flex:1;overflow:auto;background:#0a0e1a;padding:16px 6px;text-align:center;position:relative}
/* canvas 用 inline 固定 cw×ch（精确比例，绝不被 CSS 缩放）；宽度自适应靠重算 scale 重 render，overlay 同坐标系永不错位 */
#main canvas{display:block;margin:0 auto 12px;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,0.4)}
.page-wrap{position:relative;display:inline-block;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* 去边模式:page-wrap 裁成可见区(width/height 内联设)+ overflow 裁切;所有子层(canvas/textLayer/
   char层/ruby/句子层)加同一 translate 位移到裁切原点 → 各层相对位置不变、选中坐标自动跟随 */
.crop-on{position:relative;overflow:hidden}  /* position:relative 仅去边时加→单页模式 #page-container 才能裁住浮层(否则浮层锚到 #main 逃逸) */
.crop-on>*{transform:translate(calc(-1*var(--crop-l,0px)),calc(-1*var(--crop-t,0px)))}
#crop-toggle.active{background:#244470;border-color:#3b6db5;color:#7dd3fc}
/* PDF.js v4 官方 textLayer CSS（来自 web/viewer.css）+ iPad/触屏适配 */
.textLayer{position:absolute;text-align:initial;inset:0;overflow:hidden;opacity:.25;line-height:1;-webkit-text-size-adjust:none;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:2;pointer-events:auto;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:rgba(96,165,250,.15);
  /* 关键：禁用字距/连字/字偶距，让 spans 宽度计算稳定（防 iOS Safari 偏移）*/
  font-feature-settings:"kern" 0,"liga" 0,"clig" 0;
  font-variant-ligatures:none;
  font-kerning:none}
.textLayer :is(span,br){color:transparent;position:absolute;white-space:pre;cursor:pointer;transform-origin:0% 0%;
  -webkit-user-select:none;user-select:none;
  font-feature-settings:"kern" 0,"liga" 0,"clig" 0;
  font-kerning:none}
.textLayer span.markedContent{top:0;height:0}
.textLayer br{-webkit-user-select:none;user-select:none}
/* native selection 设透明 —— 视觉高亮交给手绘 overlay（避免 textLayer 对齐误差 */
.textLayer ::selection{background:transparent!important;color:transparent}
/* 选中高亮叠层：用 PyMuPDF 提取的 char-level bbox 画，跟 canvas 渲染精确对齐 */
.sel-overlay{position:absolute;inset:0;pointer-events:none;z-index:3}
.sel-overlay .hl{position:absolute;background:rgba(59,109,181,.65);border-radius:2px;mix-blend-mode:multiply}
/* char layer：透明覆盖 PDF，接管所有选中事件（绕开 PDF.js textLayer 字符位置误差）*/
.char-layer{position:absolute;inset:0;z-index:4;cursor:text;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:0;cursor:default;user-select:none;-webkit-user-select:none}
.textLayer .endOfContent.active{inset:0}

/* 右侧语法分析抽屉：流式堆叠的依存句法图（displaCy 风格） */
/* 侧栏从顶部贯通用全高度（top:0），盖住 header 右侧空白区 */
#grammar-panel{position:fixed;top:0;right:0;bottom:0;width:38vw;max-width:560px;background:#10162a;border-left:1px solid #2a3550;display:none;flex-direction:column;z-index:20;box-shadow:-6px 0 16px rgba(0,0,0,.4)}
#grammar-panel.open{display:flex}
/* 右边缘把手：竖排小标签，点击展开面板；面板展开时隐藏 */
#side-handle{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:15;writing-mode:vertical-rl;background:#1a2540;border:1px solid #2a3550;border-right:none;border-radius:8px 0 0 8px;color:#7dd3fc;padding:14px 6px;font-size:12px;letter-spacing:2px;cursor:pointer;box-shadow:-2px 0 10px rgba(0,0,0,.35);user-select:none}
#side-handle:hover{background:#2c3e6a;color:#fff}
body.grammar-open #side-handle{display:none}
/* 侧栏展开时 header + main 都让出右侧空间，按钮始终在侧栏左侧可见 */
body.grammar-open #main,body.grammar-open #header{padding-right:calc(min(38vw,560px) + 12px)}
body.grammar-open #result-mask{padding-right:min(38vw,560px)}   /* result 弹框居中到侧栏左侧可视区 */
/* 顶部 tab 栏：语法分析 / 知识点 切换 */
#side-tabs{flex:0 0 auto;display:flex;align-items:center;gap:2px;padding:6px 8px;border-bottom:1px solid #2a3550}
#side-tabs .side-tab{background:transparent;border:none;color:#7a8497;font-size:12px;cursor:pointer;padding:5px 11px;border-radius:6px;white-space:nowrap}
#side-tabs .side-tab:hover{background:#1a2540;color:#cfe6ff}
#side-tabs .side-tab.active{background:#1a2540;color:#7dd3fc;font-weight:600}
#side-tabs .side-tab-sp{flex:1}
#side-tabs .side-icon-btn{background:transparent;border:none;color:#7a8497;font-size:15px;cursor:pointer;padding:3px 7px}
#side-tabs .side-icon-btn:hover{color:#fff}
/* pane：默认隐藏，active 显示并撑满 */
.side-pane{display:none;flex:1 1 auto;overflow-y:auto;overflow-x:hidden;min-height:0}
.side-pane.active{display:block}
#side-pane-kg{padding:14px}
#side-pane-vocab{padding:12px}
/* 单词本 */
#vocab-scope-row{display:flex;align-items:center;gap:6px;padding-bottom:10px;border-bottom:1px solid #1c2740;margin-bottom:10px}
#vocab-scope-row button{background:transparent;border:1px solid #2a3550;color:#7a8497;font-size:11px;border-radius:6px;padding:3px 12px;cursor:pointer}
#vocab-scope-row button.active{background:#1a2540;color:#7dd3fc;border-color:#3b6db5;font-weight:600}
#vocab-scope-row .vocab-count{margin-left:auto;font-size:10px;color:#5a6680}
.vocab-item{border:1px solid #1f2740;border-radius:8px;padding:9px 11px;margin-bottom:8px;background:#0d1322}
.vocab-item .vi-head{display:flex;align-items:center;gap:7px}
.vocab-item .vi-word{font-size:14px;font-weight:600;color:#cfe6ff;cursor:pointer}
.vocab-item .vi-word:hover{color:#7dd3fc;text-decoration:underline}
.vocab-item .vi-phon{font-size:11px;color:#7a8497;font-family:monospace}
.vocab-item .vi-audio{background:transparent;border:none;cursor:pointer;font-size:14px;padding:0 2px;line-height:1}
.vocab-item .vi-audio:hover{transform:scale(1.15)}
.vocab-item .vi-mastery-badge{margin-left:auto;font-size:9px;padding:1px 7px;border-radius:8px;white-space:nowrap}
.vocab-item .vi-bar{height:4px;border-radius:2px;background:#1a2540;margin:6px 0;overflow:hidden}
.vocab-item .vi-bar>div{height:100%;border-radius:2px;transition:width .2s}
.vocab-item .vi-zh{font-size:11px;color:#9fb4d4;line-height:1.45;margin:3px 0}
.vocab-item .vi-foot{display:flex;align-items:center;gap:8px;margin-top:5px}
.vocab-item .vi-pages{font-size:10px;color:#7a8497;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.vocab-item .vi-pages a{color:#7dd3fc;cursor:pointer;margin-right:6px}
.vocab-item .vi-pages a:hover{text-decoration:underline}
.vocab-item .vi-anki{flex:0 0 auto;font-size:10px;background:#1a2540;border:1px solid #2a3550;color:#cfe6ff;border-radius:5px;padding:3px 9px;cursor:pointer}
.vocab-item .vi-anki:hover{background:#2c3e6a}
.vocab-item .vi-anki.done{color:#22c55e;border-color:#22c55e;cursor:default}
.side-pane .side-h2{font-size:13px;color:#8a9bb4;text-transform:uppercase;letter-spacing:.08em;margin:0 0 10px;font-weight:600}
/* 流式堆叠：按时间顺序，最新在最上 */
#grammar-panel-body{padding:10px 10px 40px}

/* 一次分析 = 一个可折叠卡片，文档流堆叠 */
.grammar-block{position:relative;margin-bottom:12px;border:1px solid #2a3550;border-radius:8px;background:#0d1322;overflow:hidden}
.grammar-block.focus{border-color:#fbbf24;box-shadow:0 0 0 1px rgba(251,191,36,.3)}
.grammar-block .gb-header{display:flex;align-items:center;gap:7px;padding:10px 11px;cursor:pointer;user-select:none}
.grammar-block .gb-header:hover{background:#141d33}
.grammar-block .gb-header .gb-title{flex:1;min-width:0;font-size:12px;color:#cfe6ff;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grammar-block .gb-header .gb-badge{flex:0 0 auto;font-size:9px;color:#7dd3fc;background:#16243f;border-radius:8px;padding:1px 7px}
.grammar-block .gb-header .gb-del{flex:0 0 auto;color:#5a6680;font-size:12px;cursor:pointer;padding:0 3px;opacity:.7}
.grammar-block .gb-header .gb-del:hover{color:#ef4444;opacity:1}
.grammar-block .gb-header .gb-caret{flex:0 0 auto;color:#7a8497;font-size:11px;transition:transform .15s}
.grammar-block.open .gb-header .gb-caret{transform:rotate(90deg)}
.grammar-block .gb-content{display:none}
.grammar-block.open .gb-content{display:block}
.grammar-block .gb-fu-answers{display:none;padding:0 12px}
.grammar-block.open .gb-fu-answers{display:block}
.grammar-block .gb-fu-q{margin-top:10px;padding-top:8px;border-top:1px solid #2a3550;color:#a8cdff;font-size:12px;font-weight:600}
.grammar-block .gb-fu-a{margin-top:5px;color:#e6e6f0;font-size:12.5px;line-height:1.6}
.grammar-block .gb-followup{display:none;gap:6px;padding:8px 12px 12px}
.grammar-block.open .gb-followup{display:flex}
.grammar-block .gb-fu-input{flex:1;min-width:0;background:#0d1322;border:1px solid #2a3550;color:#cfe6ff;border-radius:6px;padding:7px 10px;font-size:12px}
.grammar-block .gb-fu-input:focus{outline:none;border-color:#3b6db5}
.grammar-block .gb-followup button{background:#244470;border:1px solid #3b6db5;color:#fff;border-radius:6px;padding:7px 14px;cursor:pointer;font-size:12px;white-space:nowrap}
.grammar-block .gb-followup button.gb-anki-btn{background:#13351f;border-color:#34d399;color:#7ee2b8;padding:7px 10px}
#qhist-list .qhist-item{padding:8px 12px;border-bottom:1px solid #1f2740;cursor:pointer}
#qhist-list .qhist-item:hover{background:#162045}
#qhist-list .qhist-title{color:#cfe6ff;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#qhist-list .qhist-src{color:#8a9bb4;font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#qhist-list .qhist-time{color:#5a6680;font-size:10px;margin-top:2px}
/* 三个分区都留白 + 淡分隔，透气 */
.grammar-block .gb-trans{padding:11px 12px;font-size:12px;color:#cfe6ff;line-height:1.55;border-top:1px solid #1c2740}
.grammar-block .gb-loading{padding:14px;text-align:center;color:#7a8497;font-style:italic;font-size:12px}
.grammar-block .gb-pending{opacity:.65;font-style:italic;animation:gbpulse 1.2s ease-in-out infinite}
@keyframes gbpulse{0%,100%{opacity:.4}50%{opacity:.8}}

/* 句子结构图：默认收起的二级折叠区 */
.gb-diagram-wrap{border-top:1px solid #1c2740}
.gb-diagram-toggle{display:flex;align-items:center;gap:6px;padding:9px 12px;cursor:pointer;font-size:11px;color:#9fb4d4;user-select:none}
.gb-diagram-toggle:hover{background:#141d33}
.gb-diagram-toggle .gv-switch{display:inline-flex;gap:2px;margin-left:8px}
.gb-diagram-toggle .gv-switch button{background:#0d1322;border:1px solid #2a3550;color:#7a8497;font-size:10px;border-radius:4px;padding:1px 6px;cursor:pointer;line-height:1.5}
.gb-diagram-toggle .gv-switch button:hover{color:#cfe6ff;border-color:#3b6db5}
.gb-diagram-toggle .gv-switch button.active{background:#1a2540;color:#7dd3fc;border-color:#3b6db5;font-weight:600}
.gb-diagram-toggle .dg-caret{margin-left:auto;color:#7a8497;font-size:10px;transition:transform .15s}
.gb-diagram-wrap.dgram-open .gb-diagram-toggle .dg-caret{transform:rotate(90deg)}
.grammar-block .gb-diagram{display:none;overflow-x:auto;overflow-y:hidden;padding:6px 10px 12px;-webkit-overflow-scrolling:touch}
.gb-diagram-wrap.dgram-open .gb-diagram{display:block}
.grammar-block .gb-diagram svg{display:block}
/* 长句按从句分段：每段一个类型标签 + 短图 */
.dep-clause{margin-bottom:12px}
.dep-clause:last-child{margin-bottom:0}
.dep-clause-label{display:inline-block;font-size:10px;font-weight:600;color:#0d1322;background:#7dd3fc;border-radius:4px;padding:1px 7px;margin:0 0 3px 2px}
/* 成分分块（主谓宾定状从句，彩色块）*/
.comp-blocks{display:flex;flex-direction:column;gap:5px;padding:2px 0}
.comp-block{border-left:3px solid #64748b;border-radius:0 6px 6px 0;background:#0d1322;padding:6px 9px;line-height:1.5}
.comp-block .comp-label{display:inline-block;font-size:9px;font-weight:600;color:#0d1322;border-radius:4px;padding:1px 7px;margin-right:7px;vertical-align:middle}
.comp-block .comp-text{font-size:13px;color:#e6e6f0}
/* 主干+修饰折叠：骨架行内，修饰成分折叠成可点 chip */
.sk-blocks{font-size:14px;line-height:2;color:#e6e6f0;padding:2px 0}
.sk-core{color:#e6e6f0}
.sk-mod{display:inline-block;font-size:11px;border:1px dashed currentColor;border-radius:5px;padding:0 6px;margin:0 2px;cursor:pointer;opacity:.85;vertical-align:middle;white-space:normal}
.sk-mod:hover{opacity:1;background:rgba(255,255,255,.06)}
.sk-mod.open{border-style:solid}
/* 成分树（融合）：成分块 + 层次缩进 + 折叠 */
.ctree{font-size:13px;padding:2px 0}
.ctree .ct-row{display:flex;align-items:baseline;gap:6px;padding:3px 0}
.ctree .ct-label{flex:0 0 auto;font-size:9px;font-weight:600;color:#0d1322;border-radius:4px;padding:1px 6px}
.ctree .ct-text{color:#e6e6f0;line-height:1.45}
.ctree .ct-caret{flex:0 0 auto;margin-left:auto;color:#7a8497;font-size:10px;cursor:pointer;padding:0 4px;user-select:none}
.ctree .ct-children{margin-left:13px;border-left:1px dashed #2a3550;padding-left:9px}
.ctree .ct-text.ct-core{color:#9fb4d4}   /* 展开态：核心词淡化，与折叠整句区分 */

/* displaCy 词 / 词性标签 / 弧线 */
.dep-token{cursor:pointer}
.dep-word{font-size:15px;font-weight:600}
.dep-pos{font-size:9px;font-family:monospace;fill:#8a9bb4}
.dep-arc{fill:none;stroke:#5a6e94;stroke-width:1.5}
.dep-arrow{fill:#5a6e94}
.dep-label{font-size:9px;fill:#7dd3fc;font-weight:600}
.dep-tip{position:fixed;z-index:30;background:#1a2540;border:1px solid #3b6db5;border-radius:6px;padding:5px 9px;font-size:11px;color:#e6e6f0;pointer-events:none;max-width:220px;box-shadow:0 4px 14px rgba(0,0,0,.5);display:none}
/* 可展开弧线树：每层一段，子从句缩进 */
.dep-tree .dep-tscroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.dep-tree .dep-tchildren{}
.dep-tree .dep-tsub{margin:4px 0 8px 14px;border-left:1px dashed #2a3550;padding-left:9px}
.dep-token.dep-ph .dep-word{text-decoration:underline dotted}

/* 跟踪语法点列表（图例已去掉，词本身着色 + 词下中文词性标足够）*/
.gb-analyses{border-top:1px solid #1c2740;padding:2px 0}
.gb-ana{padding:9px 12px;border-bottom:1px solid #141c30;cursor:pointer}
.gb-ana:last-child{border-bottom:none}
.gb-ana .a-head{font-size:12px;font-weight:600;color:#a8cdff}
.gb-ana .a-phrase{font-size:10px;color:#facc15;font-family:monospace;margin-top:3px}
.gb-ana .a-body{display:none;font-size:11px;color:#cfe6ff;line-height:1.55;margin-top:6px}
.gb-ana.open .a-body{display:block}
.gb-ana .a-ex{margin:5px 0 0 16px;padding:0;font-size:10px;color:#7a8497;line-height:1.5}

@media (max-width:900px){
  /* 窄屏也挤压 PDF（不再全屏盖住），让左侧 PDF 缩小后完整显示 */
  #grammar-panel{width:58vw;max-width:none}
  body.grammar-open #main,body.grammar-open #header{padding-right:calc(58vw + 10px)}
}

/* 知识点节点卡（在统一面板的「知识点」pane 内）*/
.kg-node{background:#0d1322;border:1px solid #1f2740;border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:12px;display:flex;align-items:flex-start;gap:8px}
.kg-node .kg-node-main{flex:1;min-width:0;cursor:pointer}
.kg-node:hover{background:#162045;border-color:#3b6db5}
.kg-track-btn{flex:none;align-self:center;background:transparent;border:1px solid #3a4456;color:#8a9bb4;border-radius:5px;padding:3px 8px;font-size:11px;cursor:pointer;white-space:nowrap}
.kg-track-btn:hover{border-color:#34d399;color:#cfe6ff}
.kg-track-btn.on{background:#13351f;border-color:#34d399;color:#34d399}
.kg-node .lbl{font-weight:600;color:#cfe6ff}
.kg-node .sum{color:#8a9bb4;font-size:11px;margin-top:3px;line-height:1.5}
.kg-node.mastered{border-left:3px solid #34d399}
.kg-node.unlockable{border-left:3px solid #60a5fa}
.kg-node.locked{border-left:3px solid #3a4456;opacity:.7}

/* 选中工具栏：跟随选区浮出 */
#sel-toolbar{position:absolute;display:none;background:#1a2540;border:1px solid #3b6db5;border-radius:8px;padding:6px;gap:8px;z-index:99;box-shadow:0 6px 16px rgba(0,0,0,0.6);flex-direction:row;align-items:flex-start;max-width:480px}
#sel-toolbar.open{display:flex}
#sel-main{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
#sel-toolbar .preview{color:#a8cdff;font-size:11px;line-height:1.5;background:rgba(0,0,0,.3);border-radius:4px;padding:5px 9px;max-height:54px;overflow:hidden;word-break:break-word;border-left:2px solid #60a5fa}
#sel-toolbar .preview .len{color:#7a8497;font-size:10px;margin-left:6px}
#sel-toolbar .btns{display:flex;gap:4px;flex-wrap:wrap}
#sel-toolbar button{background:transparent;border:none;color:#cfe6ff;cursor:pointer;padding:6px 10px;border-radius:4px;font-size:12px;white-space:nowrap}
#sel-toolbar button:hover{background:#2c3e6a;color:#fff}

/* 结果浮层 */
#result-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:200}
#result-mask.open{display:flex}
#result-modal{background:#10162a;border:1px solid #2a3550;border-radius:10px;padding:18px 22px;width:640px;max-width:92vw;height:80vh;max-height:80vh;display:flex;flex-direction:column;line-height:1.7;position:relative}
#result-modal h3{margin:0 0 10px;font-size:15px;color:#cfe6ff;flex-shrink:0;padding-right:36px}
#result-modal .src{color:#8a9bb4;font-size:12px;border-left:3px solid #3b6db5;padding:8px 12px;margin-bottom:14px;background:#0d1322;border-radius:0 6px 6px 0;white-space:pre-wrap;word-break:break-word;max-height:120px;overflow:auto;flex-shrink:0}
#result-modal .content{font-size:13px;color:#e6e6f0;flex:1 1 auto;overflow-y:auto;min-height:0;padding-right:4px}
#result-modal .content p{margin:6px 0}
#result-modal .content code{background:#0d1322;padding:2px 5px;border-radius:3px}
#result-modal .actions{flex-shrink:0;margin-top:14px;padding-top:10px;border-top:1px solid #2a3550;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;align-items:center}
#result-followup{flex-shrink:0;display:flex;gap:6px;margin-top:10px}
#result-followup input{flex:1;background:#0d1322;border:1px solid #2a3550;color:#cfe6ff;border-radius:6px;padding:8px 11px;font-size:12.5px}
#result-followup input:focus{outline:none;border-color:#3b6db5}
#result-followup button{background:#244470;border:1px solid #3b6db5;color:#fff;border-radius:6px;padding:8px 16px;cursor:pointer;font-size:12.5px;white-space:nowrap}
#result-followup button:hover{background:#2c4f86}
#result-modal .actions #vocab-actions{display:none;flex:1;align-items:center;gap:8px;flex-wrap:wrap}
#result-modal .actions #vocab-actions.show{display:flex}
#result-modal .actions button{background:#1a2540;border:1px solid #2a3550;color:#cfe6ff;border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12px}
#result-modal .actions button:hover{background:#2c3e6a;border-color:#3b6db5}
#result-modal .loading{color:#8a9bb4;font-style:italic}

/* AI 回答里的加号选中按钮（同 QA browser 风格） */
#result-content h1,#result-content h2,#result-content h3,#result-content h4,#result-content h5,#result-content h6{position:relative}
#result-content h1.has-pick,#result-content h2.has-pick,#result-content h3.has-pick,#result-content h4.has-pick,#result-content h5.has-pick,#result-content h6.has-pick,#result-content p.fake-head.has-pick,#result-content li.fake-head.has-pick{padding-right:30px}
.pick-btn{flex-shrink:0;width:20px;height:20px;line-height:18px;text-align:center;border:1.5px solid #5b6a85;border-radius:50%;background:transparent;color:#a8cdff;font-size:14px;cursor:pointer;user-select:none;transition:all .12s;padding:0;font-family:inherit}
.pick-btn:hover{border-color:#60a5fa;color:#60a5fa}
.pick-btn.on{background:#0078d4;border-color:#0078d4;color:#fff;font-weight:700}
#result-content .head-pick{position:absolute;right:0;top:50%;transform:translateY(-50%)}
.reply-pick-all{align-self:flex-start;margin-top:8px;font-size:11px;color:#a8cdff;background:transparent;border:1px dashed #5b6a85;border-radius:12px;padding:3px 12px;cursor:pointer;user-select:none;transition:all .12s}
.reply-pick-all:hover{border-color:#60a5fa;color:#60a5fa}
.reply-pick-all.on{background:#0078d4;border-color:#0078d4;border-style:solid;color:#fff;font-weight:600}
#result-content .hsec-picked,#result-content .hsec-picked-body{background:rgba(96,165,250,.08);box-shadow:-3px 0 0 #60a5fa}
#result-content .hsec-picked{border-top-left-radius:4px;border-top-right-radius:4px;padding-top:2px}
#result-content .picked-all{box-shadow:0 0 0 2px #0078d4 inset;background:rgba(96,165,250,.06);border-radius:6px;padding:4px}

/* 右下角草稿 badge（已选 snippets 数量） */
#draft-badge{position:fixed;right:18px;bottom:18px;width:54px;height:54px;border-radius:50%;background:#244470;border:2px solid #3b6db5;color:#fff;font-size:18px;font-weight:700;cursor:pointer;z-index:300;box-shadow:0 4px 16px rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;user-select:none}
#draft-badge.show{display:flex}
#draft-badge:hover{background:#2c5188;border-color:#60a5fa}
#draft-badge .count{font-size:13px;font-weight:600;line-height:1}
#draft-badge .icon{font-size:18px;line-height:1}

/* 草稿列表 modal */
#draft-mask{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:300}
#draft-mask.open{display:flex}
#draft-modal{background:#10162a;border:1px solid #2a3550;border-radius:10px;padding:18px 22px;width:min(640px,92vw);max-height:84vh;display:flex;flex-direction:column}
#draft-modal h3{margin:0 0 12px;font-size:15px;color:#cfe6ff;display:flex;align-items:center;gap:10px}
#draft-modal h3 .clear-all{margin-left:auto;font-size:11px;color:#7a8497;background:transparent;border:1px solid #2a3550;border-radius:4px;padding:3px 8px;cursor:pointer}
#draft-list{flex:1;overflow-y:auto;margin:0 -6px;padding:0 6px}
/* 草稿项 wrap：右侧后方删除图标，左滑 item 露出 */
.draft-item-wrap{position:relative;border-bottom:1px solid #1f2740;overflow:hidden;box-sizing:border-box}
.draft-item{position:relative;z-index:2;background:#10162a;display:flex;gap:10px;align-items:flex-start;padding:10px 8px;cursor:pointer;transition:transform .15s,background .15s;will-change:transform;width:100%;box-sizing:border-box}
.draft-item:hover{background:#0d1322}
.draft-item .body{flex:1;min-width:0}
.draft-item .src{color:#7a8497;font-size:10px;margin-bottom:3px}
.draft-item .text{color:#cfe6ff;font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word;max-height:80px;overflow:hidden}
.draft-item .text.full{max-height:none}
.draft-item .sel-circle{flex-shrink:0;width:20px;height:20px;border-radius:50%;border:2px solid #5b6a85;cursor:pointer;margin-top:2px;transition:all .15s;touch-action:pan-y;align-self:center}
.draft-item .sel-circle:hover{border-color:#60a5fa}
.draft-item.selected .sel-circle{background:#34d399;border-color:#34d399;box-shadow:inset 0 0 0 3px #10162a}
.draft-item-wrap.swiped .draft-item .sel-circle{border-color:#7a2828}
.draft-item-del-row{position:absolute;right:0;top:0;bottom:0;width:64px;background:#7a2828;color:#fff;border:none;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:1;visibility:hidden}
.draft-item-del-row:hover{background:#9a3232}
.draft-item-wrap.swiped .draft-item-del-row{visibility:visible}
.draft-item-wrap.swiped .draft-item{transform:translateX(-64px)}
.draft-empty{text-align:center;color:#5a6680;padding:40px 20px;font-size:13px}
#draft-actions{margin-top:14px;padding-top:14px;border-top:1px solid #2a3550;display:flex;gap:8px;flex-wrap:wrap}
#draft-actions button{flex:1;min-width:0;background:#1a2540;border:1px solid #3b6db5;color:#cfe6ff;border-radius:6px;padding:9px 12px;font-size:12px;cursor:pointer;transition:background .15s}
#draft-actions button:hover{background:#2c3e6a}
#draft-actions button.primary{background:#244470;color:#fff;border-color:#3b6db5}
#draft-actions button.primary:hover{background:#2c5188}
#draft-actions button:disabled{opacity:.5;cursor:not-allowed}

/* vocab 下划线层：z-index 6 高于 char-layer(4) / hl-layer(5)，让句子按钮可点；
   layer 本体 pointer-events:none 不拦 char-layer 拖选；只有 .vocab-sentence-btn auto */
.vocab-layer{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.vocab-underline{position:absolute;pointer-events:none;border-radius:1px}
.vocab-underline.m-new   {height:2.5px;background:#f59e0b}                    /* 新词：橙 */
.vocab-underline.m-learning {height:2.3px;background:#fb923c;opacity:.92}    /* 学习中：浅橙（之前漏了这档样式→下划线隐形，框却计数→看着「1个词却框」）*/
.vocab-underline.m-seen  {height:2px;  background:#facc15;opacity:.85}       /* 见过：黄 */
.vocab-underline.m-known {height:1.5px;background:#a3e635;opacity:.65}       /* 熟：淡绿 */
.vocab-underline.m-mastered {display:none}                                    /* 掌握：不画 */

/* 句子框：素描排线 + mix-blend-mode 让颜色叠到字下方（白底显色，字像素不被遮）
   句首 / 句末用 L 按钮承担两端标识，box 自身无 border */
/* 自动检测到的「学习句子」框(达到阈值才框)：默认铺**淡**斜纹(查得多了整页太满,故 alpha 调低)；
   「翻译中」(点 L 加载译文期间)斜纹加深 + 呼吸，译文出来后由 .vocab-sentence-overlay 接管。*/
.vocab-sentence-box{position:absolute;pointer-events:none;box-sizing:border-box;transition:all .12s;background-image:var(--sent-hatch);background-color:transparent;mix-blend-mode:multiply}
.vocab-sentence-box.translating{background-image:var(--sent-hatch-strong,var(--sent-hatch));animation:sent-breathe 1.1s ease-in-out infinite}
@keyframes sent-breathe{0%,100%{opacity:.3}50%{opacity:1}}
.vocab-sentence-box.highlight{background-color:var(--sent-fill,rgba(245,158,11,.08))}

/* 句末按钮：包裹最后一个字符的 L 形（右边 + 下边加粗）*/
.vocab-sentence-btn-l{position:absolute;background:transparent;border:none;border-right:4px solid currentColor;border-bottom:4px solid currentColor;padding:2px 4px 2px 2px;cursor:pointer;pointer-events:auto;box-sizing:content-box;transition:background .12s,box-shadow .12s}
.vocab-sentence-btn-l:hover{background:var(--sent-fill,rgba(245,158,11,.10));box-shadow:0 0 0 1px var(--sent-fill,rgba(245,158,11,.3))}
.vocab-sentence-btn-l.active{background:var(--sent-fill,rgba(245,158,11,.10));box-shadow:inset -4px -4px 0 0 currentColor}

/* 句首按钮：包裹第一个字符的反 L 形（左边 + 上边加粗）— 跟句末对称 */
.vocab-sentence-btn-l-start{position:absolute;background:transparent;border:none;border-left:4px solid currentColor;border-top:4px solid currentColor;padding:2px 2px 2px 4px;cursor:pointer;pointer-events:auto;box-sizing:content-box;transition:background .12s,box-shadow .12s}
.vocab-sentence-btn-l-start:hover{background:var(--sent-fill,rgba(245,158,11,.10));box-shadow:0 0 0 1px var(--sent-fill,rgba(245,158,11,.3))}
.vocab-sentence-btn-l-start.active{background:var(--sent-fill,rgba(245,158,11,.10));box-shadow:inset 4px 4px 0 0 currentColor}

/* 翻译覆盖层：白底 + 黑字；hatch 用 ::after 伪元素 mix-blend-mode 在字下方显色 */
.vocab-sentence-overlay{position:absolute;background-color:#ffffff;color:#111 !important;box-sizing:border-box;cursor:pointer;pointer-events:auto;white-space:normal;word-break:break-word;font-family:inherit;overflow:hidden;text-align:left;font-weight:500;box-shadow:inset 4px 0 0 var(--sent-stroke,#d97706),inset -1px 0 0 var(--sent-stroke,#d97706),inset 0 -1px 0 var(--sent-stroke,#d97706),inset 0 1px 0 var(--sent-stroke,#d97706)}
.vocab-sentence-overlay::after{content:'';position:absolute;inset:0;background-image:var(--sent-hatch);mix-blend-mode:multiply;pointer-events:none}
.vocab-sentence-overlay:hover{background-color:#fff8e1}

/* 已保存高亮层：z-index 5 高于 char-layer(4)，让 hl-saved 能收到点击；
   hl-layer 本体 pointer-events:none 让空白处事件透传到 char-layer
   mix-blend-mode:multiply → 颜色叠在字底，字像素不被糊 → 可高 opacity */
.hl-layer{position:absolute;inset:0;z-index:5;pointer-events:none}
.hl-layer .hl-saved{position:absolute;border-radius:2px;pointer-events:auto;cursor:pointer;opacity:.45;transition:opacity .12s}
.hl-layer .hl-saved:hover{opacity:.65}
.hl-layer .hl-saved.has-note{box-shadow:inset 0 -2px 0 rgba(0,0,0,.35)}
/* 仅备注（无色）：透明背景 + 虚线边框提示"这里有备注但无颜色高亮" */
.hl-layer .hl-saved.no-color{background:transparent !important;mix-blend-mode:normal;opacity:1;border:1px dashed rgba(150,170,200,.55)}
.hl-layer .hl-saved.no-color:hover{border-color:#60a5fa;background:rgba(96,165,250,.08) !important}

/* 手写墨迹层：canvas 永远 pointer-events:none（纯显示），绘制靠 page-wrap capture 拦截 */
/* 必须覆盖 #main canvas{background:#fff} —— 否则墨迹层变白底盖住整个 PDF */
.ink-layer{position:absolute;inset:0;z-index:7;pointer-events:none;background:transparent !important;box-shadow:none !important;margin:0 !important}
body.ink-mode #main{cursor:crosshair}   /* 桌面手写模式：鼠标十字（手指只滚动/双击切工具，不画）*/
/* 振假名/音标叠加层：z-index 8 在所有层之上但 pointer-events:none → 点击穿透到 char-layer 选词 */
.ruby-layer{position:absolute;inset:0;z-index:8;pointer-events:none}
.ruby-layer .rt{position:absolute;box-sizing:border-box;color:#1746a2;font-weight:600;line-height:.95;white-space:nowrap;text-align:center;background:rgba(255,255,255,.72);border-radius:2px;padding:0 1px;overflow:visible}
#ruby-toggle.active{background:#244470;border-color:#3b6db5;color:#7dd3fc}
/* 整页翻译：逐行白底中文覆盖在原文上方（z-index 9 盖住一切；pointer-events none → 点击穿透到 char-layer 仍可选原文） */
.page-tr-layer{position:absolute;inset:0;z-index:9;pointer-events:none}
/* 行间对照翻译:译文当行上方小字(原文不遮),半透明白底衬底便于阅读 */
.page-tr-rt{position:absolute;box-sizing:border-box;color:#0b3d91;font-weight:600;line-height:1;white-space:nowrap;text-align:left;background:rgba(255,255,255,.86);border-radius:2px;padding:0 1px;overflow:visible}
#pagetr-toggle.active{background:#244470;border-color:#3b6db5;color:#7dd3fc}
/* 全文搜索面板 */
#search-panel{display:none;position:fixed;top:54px;left:50%;transform:translateX(-50%);z-index:260;width:min(520px,94vw);background:#10162a;border:1px solid #3b6db5;border-radius:12px;box-shadow:0 10px 36px rgba(0,0,0,.65);overflow:hidden}
#search-panel.open{display:block}
#search-panel .sp-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #2a3550}
#search-panel .sp-bar input{flex:1;background:#0d1322;border:1px solid #2a3550;color:#e6e6f0;border-radius:7px;padding:8px 11px;font-size:14px;outline:none}
#search-panel .sp-bar input:focus{border-color:#3b6db5}
#search-panel .sp-stat{color:#7a8497;font-size:11px;white-space:nowrap;min-width:48px;text-align:right}
#search-panel .sp-close{background:transparent;border:none;color:#7a8497;font-size:18px;cursor:pointer;padding:2px 6px}
#search-panel .sp-close:hover{color:#fff}
#search-results{max-height:min(60vh,440px);overflow-y:auto}
#search-results .sr-item{padding:9px 13px;border-bottom:1px solid #1b2336;cursor:pointer;display:flex;gap:10px;align-items:baseline}
#search-results .sr-item:hover{background:#162045}
#search-results .sr-pg{color:#7dd3fc;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}
#search-results .sr-snip{color:#cfe6ff;font-size:12.5px;line-height:1.5;overflow:hidden}
#search-results .sr-snip mark{background:#3b6db5;color:#fff;border-radius:2px;padding:0 1px}
#search-results .sr-empty{padding:16px;color:#5a6680;font-size:12px;text-align:center}
/* 词组高亮层：点「词组」按钮后出现，查询中呼吸、出结果后常亮**保持**；可点击 → 点它才消失。 */
.phrase-hl-layer{position:absolute;inset:0;pointer-events:none;z-index:6}
.phrase-hl-layer .hl{position:absolute;background:rgba(59,109,181,.42);border:1px solid rgba(111,211,255,.85);border-radius:3px;pointer-events:auto;cursor:pointer}
.phrase-hl-layer.breathe .hl{animation:sel-breathe 1.1s ease-in-out infinite}
/* 搜索命中在原文位置的临时高亮（黄，z-index 6 在 char-layer 之上但 pointer-events:none） */
.search-hl-layer{position:absolute;inset:0;pointer-events:none;z-index:6}
.search-hl{position:absolute;background:rgba(250,204,21,.45);border-radius:2px;mix-blend-mode:multiply;box-shadow:0 0 0 1px rgba(234,179,8,.65)}
#ink-fab{position:fixed;left:16px;bottom:78px;width:46px;height:46px;border-radius:50%;background:#1a2540;border:2px solid #3b6db5;color:#cfe6ff;font-size:19px;cursor:pointer;z-index:175;box-shadow:0 4px 14px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
#ink-fab.on{background:#13351f;border-color:#34d399;color:#7ee2b8}
#ink-toolbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:none;gap:3px;background:#10162a;border:1px solid #2a3550;border-radius:12px;padding:6px 8px;z-index:180;box-shadow:0 6px 20px rgba(0,0,0,.55);align-items:center;flex-wrap:wrap;max-width:94vw}
#ink-toolbar.show{display:flex}
#ink-toolbar button{background:transparent;border:1px solid transparent;color:#cfe6ff;border-radius:8px;padding:6px 9px;cursor:pointer;font-size:15px;line-height:1}
#ink-toolbar button:hover{background:#1a2540}
#ink-toolbar button.on{background:#244470;border-color:#3b6db5;color:#fff}
#ink-toolbar .ink-sep{width:1px;align-self:stretch;background:#2a3550;margin:3px 4px}
#ink-toolbar .ink-color{width:20px;height:20px;border-radius:50%;border:2px solid #0a0e1a;cursor:pointer;padding:0;box-shadow:0 0 0 1px #2a3550}
#ink-toolbar .ink-color.on{box-shadow:0 0 0 2px #fff}
#ink-toolbar input[type=range]{width:72px;accent-color:#3b6db5;vertical-align:middle}

/* toolbar 内的高亮色板：只有色圆点，点 = 立刻标记 + 互斥激活外框 */
#hl-color-picker{display:flex;flex-direction:column;gap:6px;align-items:center;padding:2px;flex-shrink:0;border-right:1px solid #2a3550;padding-right:8px}
#hl-color-picker .swatch{width:17px;height:17px;border-radius:50%;border:2px solid #5b6a85;cursor:pointer;flex-shrink:0;transition:border-color .12s,transform .12s,box-shadow .12s}
/* 选中句子(多词)按钮加大；单词小框发音按钮 */
#sel-btns-multi button{padding:9px 18px;font-size:14px}
/* 短词组：词组按钮高亮 + 呼吸；选中高亮框呼吸（完成后常亮） */
#sel-phrase-btn{background:#244470 !important;border-color:#6fd3ff !important;color:#cfe6ff !important}
#sel-phrase-btn.breathe{animation:phrase-breathe 1.1s ease-in-out infinite}
@keyframes phrase-breathe{0%,100%{box-shadow:0 0 0 0 rgba(111,211,255,.0)}50%{box-shadow:0 0 0 3px rgba(111,211,255,.45)}}
.sel-overlay.phrase-breathe .hl{animation:sel-breathe 1.1s ease-in-out infinite}
@keyframes sel-breathe{0%,100%{opacity:.45}50%{opacity:.9}}
#word-pop .wp-speak{background:transparent;border:1px solid #3b6db5;color:#a8cdff;border-radius:50%;width:26px;height:26px;cursor:pointer;font-size:12px;padding:0;flex-shrink:0}
#word-pop .wp-speak:hover{background:#244470;color:#fff}
#hl-color-picker .swatch:hover{border-color:#fff;transform:scale(1.08)}
#hl-color-picker .swatch.active{border-color:#fff;box-shadow:0 0 0 2px #0078d4,inset 0 0 0 1px rgba(0,0,0,.3);transform:scale(1.05)}
/* 单词小框 */
#word-pop{position:absolute;display:none;background:#10162a;border:1px solid #3b6db5;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.6);z-index:200;width:min(340px,86vw);font-size:13px;color:#cfe6ff;overflow:hidden}
#word-pop .wp-head{display:flex;align-items:center;gap:8px;padding:11px 14px 7px;flex-wrap:wrap}
#word-pop .wp-word{font-size:17px;font-weight:600;color:#fff}
#word-pop .wp-phon{color:#a8cdff;font-style:italic;font-size:12px}
#word-pop .wp-pitch{display:inline-flex;align-items:flex-end;gap:0;font-size:15px;color:#cfe6ff;padding-top:4px}
#word-pop .wp-pitch .pm{position:relative;padding:3px 1px 0;line-height:1.1;border-top:2px solid transparent}
#word-pop .wp-pitch .pm.hi{border-top:2px solid #6fd3ff;color:#dff1ff}
#word-pop .wp-pitch .pm.drop::after{content:"";position:absolute;right:-1px;top:0;height:9px;border-right:2px solid #ff8a8a}
#word-pop .wp-pitch .pm-type{margin-left:6px;font-size:10px;color:#5a6680;font-style:normal;align-self:center;border:1px solid #2a3450;border-radius:4px;padding:0 4px}
#word-pop .wp-ex{margin-top:8px;padding-top:7px;border-top:1px dashed #243049}
#word-pop .wp-ex .wp-ex-ja{color:#dfe9ff;font-size:13px;line-height:1.5;margin-top:5px}
#word-pop .wp-ex .wp-ex-zh{color:#8fb0d8;font-size:12px;line-height:1.45;margin-bottom:3px}
/* 日语完整字典大页面 */
#result-content .jp-head{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;padding-bottom:4px}
#result-content .jp-romaji{color:#8fb0d8;font-style:italic;font-size:13px}
#result-content .jp-pos{color:#5a6680;font-size:11px;border:1px solid #2a3450;border-radius:4px;padding:0 5px;align-self:center}
#result-content .jp-zh{margin-top:8px;color:#dff1ff;font-size:15px;line-height:1.6}
#result-content .jp-sec-label{margin-top:14px;color:#7a8497;font-size:11px;border-top:1px solid #2a3550;padding-top:8px}
#result-content .jp-kanji-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
#result-content .jp-kanji-chip{font-size:26px;line-height:1;padding:8px 12px;background:#162045;border:1px solid #2e3f63;border-radius:10px;color:#dff1ff;cursor:pointer;transition:all .12s}
#result-content .jp-kanji-chip.active{background:#244470;border-color:#6fd3ff;box-shadow:0 0 0 1px #6fd3ff}
#result-content .jp-kanji-detail{margin-top:8px;display:flex;gap:12px;align-items:flex-start;background:#10162a;border:1px solid #243049;border-radius:8px;padding:10px}
#result-content .jp-kanji-detail:empty{display:none}
#result-content .jk-lit{font-size:40px;line-height:1;color:#fff;flex-shrink:0}
#result-content .jk-body{font-size:13px;color:#cfe6ff;line-height:1.8}
#result-content .jk-tag{display:inline-block;width:18px;text-align:center;border-radius:3px;font-size:11px;margin-right:6px;color:#0b1020;font-style:normal}
#result-content .jk-tag.jk-on{background:#6fd3ff}
#result-content .jk-tag.jk-kun{background:#9fe0b8}
#result-content .jk-mean{color:#8fb0d8;font-size:12px;margin-top:3px}
#result-content .jp-ex-ja{color:#dfe9ff;font-size:14px;line-height:1.6;margin-top:7px}
#result-content .jp-ex-zh{color:#8fb0d8;font-size:12.5px;line-height:1.45}
#result-content .jp-ai-btn{margin-top:14px;width:100%;background:#1a2748;border:1px solid #3b6db5;color:#a8cdff;border-radius:8px;padding:9px;cursor:pointer;font-size:13px}
#result-content .jp-ai-btn:disabled{opacity:.6}
#result-content .jp-ai-out{margin-top:10px;color:#cfe6ff;line-height:1.7}
/* 页码 scrubber + 拖动预览 */
#page-scrub{cursor:ew-resize;user-select:none;-webkit-user-select:none;touch-action:none;padding:2px 4px;display:inline-flex;align-items:baseline;gap:2px;border-radius:5px}
#page-scrub:active{background:#1a2540}
#page-scrub #page-cur{color:#cfe6ff;font-variant-numeric:tabular-nums;min-width:1.5em;text-align:right}
#page-scrub-pop{display:none;position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:240;background:#10162a;border:1px solid #3b6db5;border-radius:12px;padding:12px 18px;box-shadow:0 8px 28px rgba(0,0,0,.6);flex-direction:column;align-items:center;gap:8px;pointer-events:none;min-width:200px}
#page-scrub-pop .psp-num{color:#dff1ff;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
#page-scrub-pop .psp-track{width:180px;height:4px;background:#243049;border-radius:2px;overflow:hidden}
#page-scrub-pop .psp-fill{height:100%;background:#6fd3ff;width:0%}
#word-pop .wp-freq{color:#5a6680;font-size:11px;margin-left:auto}
#word-pop .wp-def{padding:7px 14px 11px;line-height:1.6;color:#cfe6ff;cursor:pointer;border-top:1px solid #1f2740}
#word-pop .wp-pos-tag{display:inline-block;font-size:10.5px;color:#7a8497;background:#1a2540;border:1px solid #2a3550;border-radius:4px;padding:0 5px;margin-right:7px;vertical-align:1px;font-weight:500}
/* 日语变形分析行（原形 + 语法标签）；word-pop 小框 + 完整字典(result-content)共用 */
#word-pop .jp-inflect,#result-content .jp-inflect{font-size:12px;color:#9fb4cf;padding:6px 14px 0;line-height:1.5}
#result-content .jp-inflect{padding:6px 0 0}
.jp-inflect b{color:#dff1ff;font-weight:600}
.jp-inflect .jp-inflect-mark{display:inline-block;background:#16352a;border:1px solid #2e7d4f;color:#9fe0b8;border-radius:4px;padding:0 6px;font-size:11px;margin-left:2px}
#word-pop .wp-def:hover{background:#162045}
#word-pop .wp-more{color:#60a5fa;font-size:11px;margin-top:7px}
#word-pop .wp-actions{display:flex;gap:8px;padding:9px 14px;border-top:1px solid #1f2740;background:#0d1322}
#word-pop .wp-actions button{flex:1;background:#1a2540;border:1px solid #2a3550;color:#cfe6ff;border-radius:6px;padding:8px;cursor:pointer;font-size:12px}
#word-pop .wp-actions button:hover{border-color:#3b6db5}
#word-pop .wp-anki{background:#13351f !important;border-color:#34d399 !important;color:#7ee2b8 !important}

/* 句子译文浮层：点 L 按钮弹出。z-index 210 高于侧栏(20)/result-mask(200) */
#sent-popover{position:fixed;display:none;z-index:210;background:#10162a;border:1px solid #3b6db5;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.6);padding:12px 30px 13px 14px;width:min(360px,86vw);font-size:13px;color:#cfe6ff}
#sent-popover.open{display:block}
#sent-popover .sent-close{position:absolute;top:5px;right:8px;background:transparent;border:none;color:#7a8497;font-size:18px;line-height:1;cursor:pointer;padding:2px 4px}
#sent-popover .sent-close:hover{color:#fff}
#sent-popover .sent-en{color:#a8cdff;font-size:12px;line-height:1.5;margin-bottom:8px;border-left:2px solid #3b6db5;padding-left:8px}
#sent-popover .sent-zh{color:#cfe6ff;line-height:1.6;white-space:pre-wrap}
#sent-popover .sent-zh.loading{color:#8a9bb4;font-style:italic}

/* 高亮 popover：点击已存在的高亮弹出 */
#hl-popover{position:absolute;background:#1a2540;border:1px solid #3b6db5;border-radius:8px;padding:10px 12px;z-index:150;display:none;box-shadow:0 6px 16px rgba(0,0,0,.6);min-width:280px;max-width:360px}
#hl-popover.open{display:block}
#hl-popover .row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
#hl-popover .row-lbl{font-size:11px;color:#7a8497;margin-right:2px}
#hl-popover .swatch{width:20px;height:20px;border-radius:50%;border:2px solid #5b6a85;cursor:pointer;flex-shrink:0}
#hl-popover .swatch.cur{border-color:#fff;box-shadow:0 0 0 2px #0078d4}
#hl-popover textarea{width:100%;box-sizing:border-box;background:#0d1322;border:1px solid #2a3550;color:#e6e6f0;border-radius:4px;padding:6px 8px;font-size:12px;font-family:inherit;resize:vertical;min-height:48px;margin-bottom:8px;line-height:1.5}
/* 高亮 popover 内的预览块（选中/所在句/解释 三行省略 + 点击展开 + 触屏左滑） */
#hl-popover .hl-snip-wrap{position:relative;margin-bottom:10px;overflow:hidden;border-radius:0 4px 4px 0;box-sizing:border-box}
#hl-popover .hl-snip{position:relative;z-index:2;background:#1a2540;display:flex;align-items:flex-start;gap:8px;border-left:2px solid #60a5fa;padding:6px 10px;cursor:pointer;transition:transform .15s;will-change:transform;width:100%;box-sizing:border-box}
#hl-popover .hl-snip:hover{background:rgba(0,0,0,.42)}
#hl-popover .hl-snip-content{flex:1;min-width:0}
#hl-popover .hl-snip-circle{flex-shrink:0;width:20px;height:20px;border-radius:50%;border:2px solid #5b6a85;align-self:center;cursor:grab;transition:border-color .12s;touch-action:pan-y}
#hl-popover .hl-snip-circle:hover{border-color:#60a5fa}
#hl-popover .hl-snip-wrap.swiped .hl-snip-circle{border-color:#7a2828}
#hl-popover .hl-snip-row{font-size:11px;line-height:1.5;color:#cfe6ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
#hl-popover .hl-snip-row:last-child{margin-bottom:0}
#hl-popover .hl-snip-row.text{color:#cfe6ff}
#hl-popover .hl-snip-row.sentence{color:#a8cdff}
#hl-popover .hl-snip-row.body{color:#cfe6ff}
#hl-popover .hl-snip-row .row-lbl{color:#7a8497;font-size:10px;margin-right:6px;font-weight:600;letter-spacing:.04em}
#hl-popover .hl-snip-content.expanded .hl-snip-row{white-space:pre-wrap;overflow:visible;text-overflow:initial;word-break:break-word}
/* 右侧后方的删除按钮：visibility 控制，未 swiped 时彻底不可见（不仅靠 z-index） */
#hl-popover .hl-snip-del-row{position:absolute;right:0;top:0;bottom:0;width:64px;background:#7a2828;color:#fff;border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:1;border-radius:0 4px 4px 0;visibility:hidden}
#hl-popover .hl-snip-del-row:hover{background:#9a3232}
#hl-popover .hl-snip-wrap.swiped .hl-snip-del-row{visibility:visible}
#hl-popover .hl-snip-wrap.swiped .hl-snip{transform:translateX(-64px)}
#hl-popover .actions{display:flex;gap:6px;justify-content:flex-end}
#hl-popover button{background:transparent;border:1px solid #3b6db5;color:#cfe6ff;border-radius:4px;padding:4px 12px;font-size:11px;cursor:pointer}
#hl-popover button:hover{background:#2c3e6a}
#hl-popover button.del{border-color:#7a2828;color:#ffb4b4}
#hl-popover button.del:hover{background:#4a1a1a}
#hl-popover button.primary{background:#244470;border-color:#3b6db5;color:#fff}
#hl-popover button.primary:hover{background:#2c5188}

/* 设置 modal：高亮颜色管理 */
.set-hl-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.set-hl-row .swatch-w{position:relative;display:inline-block}
.set-hl-row .swatch{width:28px;height:28px;border-radius:50%;border:2px solid #2a3550;cursor:default;display:block}
.set-hl-row .del{position:absolute;right:-5px;top:-5px;width:16px;height:16px;border-radius:50%;background:#7a2828;border:1px solid #4a1a1a;color:#ffb4b4;font-size:10px;line-height:13px;cursor:pointer;padding:0;text-align:center}
.set-hl-row .del:hover{background:#9a3232}

</style>
</head>
<body>
<div id="app">
  <div id="header">
    <button onclick="location.href='/pdf/'">📚 文件</button>
    <h1>{{ file_name }}</h1>
    <button id="mode-toggle" onclick="toggleReadMode()" title="切换 单页 / 连续滚动">📄 单页</button>
    <button onclick="changePage(-1)" title="上一页">◀</button>
    <span id="page-scrub" title="左右拖动快速跳页 · 点击输入页码"><b id="page-cur">{{ page }}</b><span id="page-total" style="color:#8a9bb4;font-size:12px">/ –</span></span>
    <button onclick="changePage(1)" title="下一页">▶</button>
    <button onclick="fitWidth()" title="按页宽自适应（取消手动缩放）">↔ 适应</button>
    <button onclick="openLangPicker()" title="本书文本语言(决定查词用哪本词典)">🌐</button>
    <button id="ruby-toggle" onclick="toggleRuby()" title="振假名 / 英文音标叠加（汉字上方注假名读音、英文词上方注音标）">あ</button>
    <button id="pagetr-toggle" onclick="togglePageTranslate()" title="整页翻译：当前页所有句子就地显示中文（再按关闭）">译页</button>
    <button id="crop-toggle" onclick="toggleCrop()" title="去边阅读模式：隐藏每页左/右/上/下边距（在 ⚙ 设置里配各边百分比）">✂️ 去边</button>
    <button onclick="openSearch()" title="全文搜索（全书）">🔍</button>
    <button onclick="openSettings()" title="AI 设置">⚙️</button>
  </div>
  <!-- 本书语言选择 -->
  <div id="lang-mask" style="position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;
       align-items:center;justify-content:center;z-index:251"
       onclick="if(event.target===this) document.getElementById('lang-mask').style.display='none'">
    <div style="background:#161b22;border:1px solid #2d333b;border-radius:10px;padding:18px;
         min-width:260px;max-width:90vw;color:#e6edf3;">
      <div style="font-size:15px;font-weight:600;margin-bottom:4px;">🌐 本书文本语言</div>
      <div style="font-size:12px;color:#8a9bb4;margin-bottom:12px;">
        勾选书里出现的语言。决定点词查哪本词典:日语→中日(读音+中文),英语→英汉,中文→不查。
      </div>
      <div id="lang-checks" style="display:flex;flex-direction:column;gap:10px;font-size:14px;">
        <label style="cursor:pointer;"><input type="checkbox" value="en" style="width:16px;height:16px;vertical-align:middle;margin-right:6px;">英语 English</label>
        <label style="cursor:pointer;"><input type="checkbox" value="ja" style="width:16px;height:16px;vertical-align:middle;margin-right:6px;">日语 日本語</label>
        <label style="cursor:pointer;"><input type="checkbox" value="zh" style="width:16px;height:16px;vertical-align:middle;margin-right:6px;">中文(母语,不查词)</label>
      </div>
      <div style="margin-top:16px;text-align:right;">
        <button onclick="document.getElementById('lang-mask').style.display='none'" style="margin-right:8px;">取消</button>
        <button onclick="saveLangPicker()" style="background:#1f6feb;color:#fff;border:none;padding:6px 14px;border-radius:6px;">保存</button>
      </div>
    </div>
  </div>
  <div id="main">
    <div id="pdf-loading" style="display:none;position:fixed;inset:0;z-index:1500;
         background:#0d1117ee;flex-direction:column;align-items:center;justify-content:center;
         gap:14px;color:#e6edf3;font-size:15px;">
      <div style="width:34px;height:34px;border:3px solid #2d5a8a;border-top-color:#7dd3fc;
           border-radius:50%;animation:pdfspin .8s linear infinite;"></div>
      <div id="pdf-loading-text">📄 加载中…</div>
      <div style="width:200px;height:6px;background:#1c232c;border-radius:3px;overflow:hidden;">
        <div id="pdf-loading-bar" style="height:100%;width:0%;background:#7dd3fc;
             transition:width .25s;"></div>
      </div>
      <div id="pdf-loading-hint" class="dim" style="font-size:12px;color:#7d8590;"></div>
    </div>
    <div id="page-scrub-pop"><div class="psp-num">1 / 1</div><div class="psp-track"><div class="psp-fill"></div></div></div>
    <div id="page-container"></div>
    <div id="search-panel">
      <div class="sp-bar">
        <input id="search-input" type="search" placeholder="全文搜索（全书）…" autocomplete="off"
               oninput="_searchDebounced()" onkeydown="if(event.key==='Enter'){event.preventDefault();_runSearch();}else if(event.key==='Escape'){closeSearch();}">
        <span class="sp-stat" id="search-stat"></span>
        <button class="sp-close" onclick="closeSearch()" title="关闭">✕</button>
      </div>
      <div id="search-results"></div>
    </div>
    <div id="sel-toolbar">
      <div id="hl-color-picker"><span class="lbl">🖌</span></div>
      <div id="sel-main">
        <div class="preview" id="sel-preview">—</div>
        <!-- 单词选中：查词（小框，第2步） -->
        <div class="btns" id="sel-btns-word" style="display:none">
          <button onclick="onCopySel()" title="复制选中文本">📋 复制</button>
          <button onclick="onLookupWord()" title="查词典">🔍 查词</button>
        </div>
        <!-- 多词/句子选中：翻译 + 解释；短词组额外显示「词组」按钮 -->
        <div class="btns" id="sel-btns-multi" style="display:none">
          <button id="sel-phrase-btn" onclick="onPhrase()" title="当作词组：看释义/翻译 + 收藏作分词依据" style="display:none">📘 词组</button>
          <button onclick="onCopySel()" title="复制选中文本">📋 复制</button>
          <button onclick="onTranslate()">🌐 翻译</button>
          <button onclick="onExplain()">💡 解释</button>
          <button onclick="onChat()">💬 对话</button>
        </div>
        <div id="grammar-btn-row" style="display:none">
          <button onclick="onGrammarAnalyze()" style="background:#244470;border:1px solid #3b6db5;color:#fff;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12px" title="按跟踪的语法点分析选中片段">📊 语法分析</button>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- 手写笔：Apple Pencil 落笔自动画；点 FAB 开桌面手写模式 + 显示工具栏 -->
<button id="ink-fab" onclick="inkToggle()" title="手写笔（Apple Pencil 直接画；点此开桌面/触屏手写模式）">✏️</button>
<div id="ink-toolbar">
  <button data-tool="pen" class="on" onclick="inkSetTool('pen',this)" title="笔">✒️</button>
  <button data-tool="line" onclick="inkSetTool('line',this)" title="直线">／</button>
  <button data-tool="arrow" onclick="inkSetTool('arrow',this)" title="箭头">↗</button>
  <button data-tool="rect" onclick="inkSetTool('rect',this)" title="矩形">▭</button>
  <button data-tool="eraser" onclick="inkSetTool('eraser',this)" title="橡皮（点笔画删除整条）">🧹</button>
  <span class="ink-sep"></span>
  <button class="ink-color on" style="background:#e74c3c" onclick="inkSetColor('#e74c3c',this)" title="红"></button>
  <button class="ink-color" style="background:#3b82f6" onclick="inkSetColor('#3b82f6',this)" title="蓝"></button>
  <button class="ink-color" style="background:#22c55e" onclick="inkSetColor('#22c55e',this)" title="绿"></button>
  <button class="ink-color" style="background:#fbbf24" onclick="inkSetColor('#fbbf24',this)" title="黄"></button>
  <button class="ink-color" style="background:#e6e6f0" onclick="inkSetColor('#e6e6f0',this)" title="白"></button>
  <input type="range" min="1" max="10" step="0.5" value="2.5" oninput="inkSetWidth(this.value)" title="粗细">
  <span class="ink-sep"></span>
  <button onclick="inkUndo()" title="撤销">↶</button>
  <button onclick="inkRedo()" title="重做">↷</button>
  <button id="ink-eye" onclick="inkToggleVisible()" title="显示/隐藏全部墨迹">👁</button>
  <button onclick="inkClearPage()" title="清空本页墨迹" style="color:#ff8a8a">🗑</button>
</div>

<!-- 屏幕右边缘把手：点击展开右侧面板（关闭时显示）-->
<div id="side-handle" onclick="toggleGrammarPanel()" title="展开侧栏：语法分析 / 知识点">语法 · 知识点</div>

<!-- 右侧统一面板：顶部 tab 切换「语法分析 / 知识点」-->
<aside id="grammar-panel">
  <div id="side-tabs">
    <button class="side-tab active" data-pane="grammar" onclick="switchSideTab('grammar')">📊 语法</button>
    <button class="side-tab" data-pane="vocab" onclick="switchSideTab('vocab')">📒 单词本</button>
    <button class="side-tab" data-pane="kg" onclick="switchSideTab('kg')">📋 知识点</button>
    <button class="side-tab" data-pane="hist" onclick="switchSideTab('hist')">📜 历史</button>
    <span class="side-tab-sp"></span>
    <button class="side-icon-btn" id="side-clear" onclick="clearGrammarBlocks()" title="清空全部分析">🗑</button>
    <button class="side-icon-btn" onclick="closeGrammarPanel()" title="关闭">✕</button>
  </div>
  <div id="grammar-panel-body" class="side-pane active" data-pane="grammar">
    <!-- 语法分析卡按时间顺序堆叠，最新在最上 -->
  </div>
  <div id="side-pane-vocab" class="side-pane" data-pane="vocab">
    <div id="vocab-scope-row">
      <button data-scope="page" onclick="loadVocabList('page')">本页</button>
      <button class="active" data-scope="book" onclick="loadVocabList('book')">本书</button>
      <button data-scope="all" onclick="loadVocabList('all')">全部</button>
      <span class="vocab-count" id="vocab-count"></span>
    </div>
    <div id="vocab-list"><div style="color:#5a6680;font-size:12px;padding:10px">点开载入…</div></div>
  </div>
  <div id="side-pane-kg" class="side-pane" data-pane="kg">
    <h2 class="side-h2">当前页对应知识点</h2>
    <div id="kg-nodes"><div style="color:#5a6680;font-size:12px">加载中…</div></div>
  </div>
  <div id="side-pane-hist" class="side-pane" data-pane="hist">
    <h2 class="side-h2">查询结果历史（本书）</h2>
    <div id="qhist-list"><div style="color:#5a6680;font-size:12px;padding:10px">还没有查询记录</div></div>
  </div>
</aside>

<div id="debug-log" style="position:fixed;left:10px;bottom:10px;background:rgba(0,0,0,.85);color:#7be096;font-family:monospace;font-size:11px;padding:8px 12px;border-radius:6px;max-width:600px;max-height:200px;overflow:auto;z-index:9999"></div>
<script>
  // ES module 之前的诊断：监听所有错误（包括 import 失败），写到 #debug-log + 页面
  function dlog(msg, color) {
    const el = document.getElementById('debug-log');
    if (!el) { console.log(msg); return; }
    const line = document.createElement('div');
    line.style.color = color || '#7be096';
    line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
    el.appendChild(line);
    el.scrollTop = el.scrollHeight;
  }
  window.dlog = dlog;
  window.addEventListener('error', (e) => {
    dlog('❌ ERROR: ' + (e.message || e.error?.message || 'unknown') +
         ' @ ' + (e.filename || '?') + ':' + (e.lineno || '?'), '#ff6b6b');
  });
  window.addEventListener('unhandledrejection', (e) => {
    dlog('❌ PROMISE REJECTION: ' + (e.reason?.message || e.reason || 'unknown'), '#ff6b6b');
  });
  dlog('页面加载完成，准备 import PDF.js…');
</script>

<script>
// ══════════════ 手写笔（Apple Pencil 自动 + 桌面/触屏模式开关）══════════════
// 坐标全部归一化 0-1（相对页 css 尺寸），跨缩放/设备稳定；线宽固定 css px。
// canvas 永远 pointer-events:none（纯显示），绘制靠 page-wrap capture 拦截 pointerdown。
const _ink = {
  tool: 'pen', color: '#e74c3c', width: 2.5,
  mode: false,          // 桌面/触屏手写模式（鼠标/手指接管）；Apple Pencil 始终可画
  visible: true,
  byPage: {},           // {num: [stroke,...]} 服务器加载
  drawing: null,        // {pw, num, stroke|eraser}
  lastPw: null,         // 最近绘制的页（撤销/清空作用对象）
  saveTimers: {},
  _lastTap: null,       // 上一下「极短 tap」的时间/位置（Pencil 双击切换检测用）
};
window._ink = _ink;

function _inkActivePw() {
  return _ink.lastPw || document.querySelector(`.page-wrap[data-page-num="${currentPage}"]`);
}
function _inkStrokesOf(pw) { if (!pw.__inkStrokes) pw.__inkStrokes = []; return pw.__inkStrokes; }

// viewport client 坐标 → 该页归一化 [x,y]
function _inkNorm(pw, cx, cy) {
  const cv = pw.__inkCanvas; if (!cv) return null;
  const r = cv.getBoundingClientRect();
  if (!r.width || !r.height) return null;
  return [(cx - r.left) / r.width, (cy - r.top) / r.height];
}

function _inkRedraw(pw) {
  const cv = pw && pw.__inkCanvas; if (!cv) return;
  const ctx = cv.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (!_ink.visible) return;
  const cssW = parseFloat(cv.style.width) || cv.width;
  const dpr = (cv.width / cssW) || 1;
  for (const s of (pw.__inkStrokes || [])) _inkDrawStroke(ctx, s, cv.width, cv.height, dpr);
}
window._inkRedraw = _inkRedraw;

function _inkDrawStroke(ctx, s, W, H, dpr) {
  const pts = s.p || []; if (!pts.length) return;
  ctx.strokeStyle = s.c || '#e74c3c';
  ctx.lineWidth = Math.max(0.6, (s.w || 2.5) * dpr);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const X = i => pts[i][0] * W, Y = i => pts[i][1] * H;
  if (s.t === 'pen') {
    ctx.beginPath(); ctx.moveTo(X(0), Y(0));
    if (pts.length === 1) { ctx.lineTo(X(0) + 0.1, Y(0)); }
    else {
      for (let i = 1; i < pts.length - 1; i++) {
        const mx = (X(i) + X(i + 1)) / 2, my = (Y(i) + Y(i + 1)) / 2;
        ctx.quadraticCurveTo(X(i), Y(i), mx, my);
      }
      ctx.lineTo(X(pts.length - 1), Y(pts.length - 1));
    }
    ctx.stroke();
  } else if (s.t === 'line' && pts.length >= 2) {
    ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(1), Y(1)); ctx.stroke();
  } else if (s.t === 'arrow' && pts.length >= 2) {
    ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(1), Y(1)); ctx.stroke();
    const ang = Math.atan2(Y(1) - Y(0), X(1) - X(0)), ah = Math.max(9, ctx.lineWidth * 3.5);
    ctx.beginPath(); ctx.moveTo(X(1), Y(1));
    ctx.lineTo(X(1) - ah * Math.cos(ang - 0.42), Y(1) - ah * Math.sin(ang - 0.42));
    ctx.moveTo(X(1), Y(1));
    ctx.lineTo(X(1) - ah * Math.cos(ang + 0.42), Y(1) - ah * Math.sin(ang + 0.42));
    ctx.stroke();
  } else if (s.t === 'rect' && pts.length >= 2) {
    const x0 = X(0), y0 = Y(0), x1 = X(1), y1 = Y(1);
    ctx.strokeRect(Math.min(x0, x1), Math.min(y0, y1), Math.abs(x1 - x0), Math.abs(y1 - y0));
  }
}

// ── 橡皮命中检测（归一化坐标）──
function _inkPtSeg(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], l2 = dx * dx + dy * dy;
  if (l2 === 0) return Math.hypot(p[0] - a[0], p[1] - a[1]);
  let t = ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / l2; t = Math.max(0, Math.min(1, t));
  return Math.hypot(p[0] - (a[0] + t * dx), p[1] - (a[1] + t * dy));
}
function _inkHit(s, pt, thr) {
  const pts = s.p || []; if (!pts.length) return false;
  if (s.t === 'rect' && pts.length >= 2) {
    const x0 = Math.min(pts[0][0], pts[1][0]), x1 = Math.max(pts[0][0], pts[1][0]);
    const y0 = Math.min(pts[0][1], pts[1][1]), y1 = Math.max(pts[0][1], pts[1][1]);
    const nx = (Math.abs(pt[0] - x0) < thr || Math.abs(pt[0] - x1) < thr) && pt[1] > y0 - thr && pt[1] < y1 + thr;
    const ny = (Math.abs(pt[1] - y0) < thr || Math.abs(pt[1] - y1) < thr) && pt[0] > x0 - thr && pt[0] < x1 + thr;
    return nx || ny;
  }
  for (let i = 0; i < pts.length - 1; i++) if (_inkPtSeg(pt, pts[i], pts[i + 1]) < thr) return true;
  if (pts.length === 1) return Math.hypot(pt[0] - pts[0][0], pt[1] - pts[0][1]) < thr;
  return false;
}
function _inkEraseAt(pw, pt) {
  const arr = _inkStrokesOf(pw); let removed = false;
  for (let i = arr.length - 1; i >= 0; i--) if (_inkHit(arr[i], pt, 0.014)) { arr.splice(i, 1); removed = true; }
  if (removed) _inkRedraw(pw);
  return removed;
}

// ── undo / redo（每页）──
function _inkPushUndo(pw) {
  if (!pw.__inkUndo) pw.__inkUndo = [];
  pw.__inkUndo.push(JSON.stringify(pw.__inkStrokes || []));
  if (pw.__inkUndo.length > 40) pw.__inkUndo.shift();
  pw.__inkRedo = [];
}

// ── 指针绘制 ──
// 绘制中：先 putImageData 还原「已完成笔画」快照，再用一条连续 quadratic 曲线重绘当前笔画
// → 单次 stroke 抗锯齿光滑（无增量段 round cap 毛边），且每帧只重绘一条 → 流畅
function _inkDrawCurrentOnSnap(d) {
  const pw = d.pw, cv = pw && pw.__inkCanvas; if (!cv) return;
  const ctx = cv.getContext('2d');
  const dpr = (cv.width / (parseFloat(cv.style.width) || cv.width)) || 1;
  if (d.snap) {
    ctx.putImageData(d.snap, 0, 0);
  } else {   // 快照不可用（极少）→ 回退重绘除当前外的全部
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
    if (_ink.visible) for (const s of (pw.__inkStrokes || [])) if (s !== d.stroke) _inkDrawStroke(ctx, s, cv.width, cv.height, dpr);
  }
  _inkDrawStroke(ctx, d.stroke, cv.width, cv.height, dpr);
}

// 手指快速双击画布切换 笔 ↔ 橡皮（替代浏览器拿不到的 Apple Pencil 双击笔身手势）
function _inkDoubleTapSwitch(pw, skipUndo) {
  if (!skipUndo && _ink.tool !== 'eraser') {   // 仅笔模式 pen 误点才需撤销；手指双击无误点
    const arr = pw.__inkStrokes || [];
    if (arr.length) arr.pop();
    _inkRedraw(pw);
    _inkScheduleSave(pw, parseInt(pw.dataset.pageNum));
  }
  const next = (_ink.tool === 'eraser') ? 'pen' : 'eraser';
  _ink.tool = next;
  document.querySelectorAll('#ink-toolbar button[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === next));
  window.dlog && window.dlog('双击切换 → ' + (next === 'eraser' ? '🧹 橡皮' : '✒️ 笔'));
  const fb = document.getElementById('ink-fab');
  if (fb) { fb.textContent = next === 'eraser' ? '🧹' : '✏️'; clearTimeout(fb.__t); fb.__t = setTimeout(() => { fb.textContent = '✏️'; }, 1300); }
}

function _inkPointerDown(e) {
  const pw = e.currentTarget; if (!pw || !pw.__inkCanvas) return;
  // 手指(touch)快速双击 → 切换 笔↔橡皮。仅「手写激活」时(开了工具栏 或 本次已画过笔)，
  // 不破坏纯阅读时手指双击选段；单指 tap/滑不拦截，照常选词/选段/滚动。
  // 笔正在画时忽略手指（挡掉写字时手掌/另一手误触切橡皮）；窗口/距离收紧防误判
  if (e.pointerType === 'touch' && !_ink.drawing && (_ink.mode || _ink.lastPw)) {
    const now = Date.now(), lt = _ink._lastTap;
    if (lt && now - lt.t < 350 && Math.hypot(e.clientX - lt.x, e.clientY - lt.y) < 32) {
      e.preventDefault(); e.stopPropagation();
      _ink._lastTap = null;
      _inkDoubleTapSwitch(pw, true);
      return;
    }
    _ink._lastTap = { t: now, x: e.clientX, y: e.clientY };
  }
  // 绘制：Apple Pencil 始终；鼠标仅桌面手写模式；手指永不画（只滚动/双击切工具）
  if (!(e.pointerType === 'pen' || (e.pointerType === 'mouse' && _ink.mode))) return;
  e.preventDefault(); e.stopPropagation();               // 挡掉 char-layer 选词
  try { pw.setPointerCapture(e.pointerId); } catch (_) {}
  const num = parseInt(pw.dataset.pageNum) || currentPage;
  _ink.lastPw = pw;
  const pt = _inkNorm(pw, e.clientX, e.clientY); if (!pt) return;
  if (_ink.tool === 'eraser') {
    _inkPushUndo(pw); _inkEraseAt(pw, pt);
    _ink.drawing = { pw, num, eraser: true };
  } else {
    _inkPushUndo(pw);
    const cv = pw.__inkCanvas, ctx = cv.getContext('2d');
    _inkRedraw(pw);                                        // 画已完成笔画（此刻还不含当前笔画）
    let snap = null;
    try { snap = ctx.getImageData(0, 0, cv.width, cv.height); } catch (_) {}   // 拍快照
    const stroke = { t: _ink.tool, c: _ink.color, w: parseFloat(_ink.width) || 2.5, p: [pt] };
    _inkStrokesOf(pw).push(stroke);
    _ink.drawing = { pw, num, stroke, snap, raf: null };
    _inkDrawCurrentOnSnap(_ink.drawing);                  // 画当前起点
  }
  document.addEventListener('pointermove', _inkPointerMove, true);
  document.addEventListener('pointerup', _inkPointerUp, true);
  document.addEventListener('pointercancel', _inkPointerUp, true);
}
function _inkPointerMove(e) {
  const d = _ink.drawing; if (!d) return;
  e.preventDefault();
  if (d.eraser) { const pt = _inkNorm(d.pw, e.clientX, e.clientY); if (pt) _inkEraseAt(d.pw, pt); return; }
  const s = d.stroke;
  if (s.t === 'pen') {
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ce of evs) {
      const p = _inkNorm(d.pw, ce.clientX, ce.clientY); if (!p) continue;
      const last = s.p[s.p.length - 1];
      // 抽稀：丢弃与上一点过近的采样点（120Hz Pencil 点太密 → quadratic 退化成折线、边缘发毛）
      if (last) { const dx = p[0] - last[0], dy = p[1] - last[1]; if (dx * dx + dy * dy < 6e-6) continue; }
      s.p.push(p);
    }
  } else {
    const pt = _inkNorm(d.pw, e.clientX, e.clientY); if (pt) s.p[1] = pt;
  }
  // rAF 节流：每帧最多重绘一次（快照还原 + 当前笔画一条）→ 平滑 + 流畅
  if (!d.raf) d.raf = requestAnimationFrame(() => { d.raf = null; if (_ink.drawing === d) _inkDrawCurrentOnSnap(d); });
}
function _inkPointerUp(e) {
  const d = _ink.drawing; if (!d) return;
  if (d.raf) { cancelAnimationFrame(d.raf); d.raf = null; }
  document.removeEventListener('pointermove', _inkPointerMove, true);
  document.removeEventListener('pointerup', _inkPointerUp, true);
  document.removeEventListener('pointercancel', _inkPointerUp, true);
  if (!d.eraser) {
    const s = d.stroke;
    if (s.t !== 'pen' && s.p.length < 2) {   // 形状没拖动 → 丢弃
      const arr = _inkStrokesOf(d.pw), i = arr.indexOf(s); if (i >= 0) arr.splice(i, 1);
    }
  }
  d.snap = null;
  _ink.drawing = null;
  _inkRedraw(d.pw);              // 最终全量平滑重绘
  _inkScheduleSave(d.pw, d.num);
}
window._inkPointerDown = _inkPointerDown;

// ── 保存 / 加载 ──
function _inkScheduleSave(pw, num) {
  _ink.byPage[num] = pw.__inkStrokes;
  clearTimeout(_ink.saveTimers[num]);
  _ink.saveTimers[num] = setTimeout(() => _inkSave(num, pw.__inkStrokes), 900);
}
async function _inkSave(num, strokes) {
  if (!FILE_REL) return;
  try {
    await fetch('/pdf/api/ink', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file: FILE_REL, page: num, strokes: strokes || [] }),
    });
  } catch (_) {}
}
async function _inkLoadAll() {
  if (!FILE_REL) return;
  try {
    const r = await fetch('/pdf/api/ink?file=' + encodeURIComponent(FILE_REL));
    const d = await r.json();
    if (d.ok && d.pages) {
      _ink.byPage = {};
      for (const k in d.pages) _ink.byPage[parseInt(k)] = d.pages[k];
      document.querySelectorAll('.page-wrap[data-loaded="1"]').forEach(pw => {
        const n = parseInt(pw.dataset.pageNum);
        if (_ink.byPage[n]) { pw.__inkStrokes = JSON.parse(JSON.stringify(_ink.byPage[n])); _inkRedraw(pw); }
      });
    }
  } catch (_) {}
}
window._inkLoadAll = _inkLoadAll;

// ── 工具栏 ──
window.inkToggle = () => {
  _ink.mode = !_ink.mode;
  document.body.classList.toggle('ink-mode', _ink.mode);
  document.getElementById('ink-fab').classList.toggle('on', _ink.mode);
  document.getElementById('ink-toolbar').classList.toggle('show', _ink.mode);
};
window.inkSetTool = (t, btn) => {
  _ink.tool = t;
  document.querySelectorAll('#ink-toolbar button[data-tool]').forEach(b => b.classList.toggle('on', b === btn));
};
window.inkSetColor = (c, btn) => {
  _ink.color = c;
  document.querySelectorAll('#ink-toolbar .ink-color').forEach(b => b.classList.toggle('on', b === btn));
};
window.inkSetWidth = (v) => { _ink.width = parseFloat(v) || 2.5; };
window.inkToggleVisible = () => {
  _ink.visible = !_ink.visible;
  const eye = document.getElementById('ink-eye'); if (eye) eye.style.opacity = _ink.visible ? '1' : '.4';
  document.querySelectorAll('.page-wrap[data-loaded="1"]').forEach(pw => _inkRedraw(pw));
};
window.inkUndo = () => {
  const pw = _inkActivePw(); if (!pw || !pw.__inkUndo || !pw.__inkUndo.length) return;
  if (!pw.__inkRedo) pw.__inkRedo = [];
  pw.__inkRedo.push(JSON.stringify(pw.__inkStrokes || []));
  pw.__inkStrokes = JSON.parse(pw.__inkUndo.pop());
  _ink.lastPw = pw; _inkRedraw(pw); _inkScheduleSave(pw, parseInt(pw.dataset.pageNum));
};
window.inkRedo = () => {
  const pw = _inkActivePw(); if (!pw || !pw.__inkRedo || !pw.__inkRedo.length) return;
  if (!pw.__inkUndo) pw.__inkUndo = [];
  pw.__inkUndo.push(JSON.stringify(pw.__inkStrokes || []));
  pw.__inkStrokes = JSON.parse(pw.__inkRedo.pop());
  _ink.lastPw = pw; _inkRedraw(pw); _inkScheduleSave(pw, parseInt(pw.dataset.pageNum));
};
window.inkClearPage = () => {
  const pw = _inkActivePw(); if (!pw || !(pw.__inkStrokes && pw.__inkStrokes.length)) return;
  _inkPushUndo(pw); pw.__inkStrokes = []; _ink.lastPw = pw;
  _inkRedraw(pw); _inkScheduleSave(pw, parseInt(pw.dataset.pageNum));
};
</script>
</body></html>
