<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>⭐ {{ folder_name }} · 收藏夹</title>
<style>
  /* 收藏夹查看页(阶段A)——照 html_reader.html 精简接法:顶栏 + 滚动区 + 选中工具栏 + rc-result/rc-wordpop。
     设计:references/reader-userpages-favorites.md「二、收藏夹设计」。零进度状态:本页不写任何 LS.pos/最近阅读。 */
  *{box-sizing:border-box}
  button,[role=button],select,input[type=checkbox]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#0a0e1a;color:#e6edf3;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden}

  /* ── 顶栏(镜像 html_reader.html #html-top)── */
  #fav-top{flex:0 0 auto;height:calc(48px + env(safe-area-inset-top));z-index:50;display:flex;align-items:center;gap:8px;
    padding:0 10px;padding-top:env(safe-area-inset-top);background:#10162a;border-bottom:1px solid #2a3550}
  #fav-top a.back{background:#1a2540;border:1px solid #2a3550;color:#cfe6ff;border-radius:7px;height:36px;padding:0 12px;font-size:14px;
    text-decoration:none;white-space:nowrap;flex:none;display:inline-flex;align-items:center;justify-content:center}
  #fav-top a.back:hover{background:#2c3e6a;border-color:#3b6db5}
  #fav-title{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;color:#cfe6ff}
  #fav-count{flex:none;color:#8a9bb4;font-size:12px}

  /* ── 阅读区:条目序列(每条 = 分隔条 + 原书页图/章 HTML 的纸面卡片)── */
  #fav-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  #fav-content{max-width:860px;margin:0 auto;padding:16px 12px 120px}
  .fav-entry{margin:0 0 26px}
  .fav-div{display:flex;align-items:center;gap:6px;padding:7px 10px;margin-bottom:8px;background:#10162a;border:1px solid #2a3550;
    border-radius:9px;font-size:12.5px;color:#cfe6ff}
  .fav-div .bk{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .fav-div .loc{flex:none;color:#8a9bb4}
  .fav-div .sp{flex:1}
  .fav-div a.open{flex:none;color:#7dd3fc;text-decoration:none;font-size:12px;padding:3px 8px;border:1px solid #2a3a63;border-radius:6px}
  .fav-div a.open:hover{background:#1a2540}
  .fav-div button.rm{flex:none;background:transparent;border:1px solid #2a3550;color:#ff8a8a;border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer}
  .fav-div button.rm:hover{background:#2a1620;border-color:#7a2828}
  .fav-item{background:var(--paper,#f6f3ea);border-radius:10px;overflow:hidden}
  .fav-item.pdf{padding:0;line-height:0}
  .fav-item.pdf img.fav-pgimg{width:100%;height:auto;display:block}
  .fav-item.epub{padding:22px 20px;color:#1b1b1b;font-size:17px;line-height:1.72;word-break:break-word}
  .fav-item.epub h1{font-size:1.5em;margin:.6em 0 .4em}
  .fav-item.epub h2{font-size:1.25em;margin:1em 0 .4em}
  .fav-item.epub h3{font-size:1.1em;margin:.9em 0 .35em}
  .fav-item.epub p{margin:.65em 0}
  .fav-item.epub img{max-width:100%;height:auto}
  .fav-item.epub a{color:#2563eb}
  .fav-item.epub table{max-width:100%;border-collapse:collapse;margin:8px 0}
  .fav-item.epub td,.fav-item.epub th{border:1px solid rgba(0,0,0,.18);padding:4px 8px}
  .fav-item.epub blockquote{border-left:3px solid #9bb4d6;margin:.7em 0;padding:.2em 0 .2em 12px;color:#33415a}
  .fav-item.epub ::selection{background:rgba(120,170,255,.45)}
  .fav-loading{color:#5a6680;font-size:13px;text-align:center;padding:26px 10px;line-height:1.5}
  .fav-empty{color:#7c93c4;font-size:13.5px;text-align:center;padding:70px 16px;line-height:1.9}
  .fav-empty a{color:#7dd3fc}

  /* ── 选中工具栏(照 html_reader.html #html-sel;阶段A 只留即时类)── */
  #fav-sel{position:fixed;z-index:78;display:none;flex-direction:column;align-items:stretch;max-width:96vw;
    background:#1a2540;border:1px solid #3b6db5;border-radius:9px;padding:6px;box-shadow:0 6px 18px rgba(0,0,0,.6);gap:5px}
  #fav-sel.open{display:flex}
  #fav-sel .fav-preview{color:#a8cdff;font-size:11px;line-height:1.5;background:rgba(0,0,0,.3);border-radius:4px;
    padding:5px 9px;max-height:54px;overflow:hidden;word-break:break-word;border-left:2px solid #60a5fa}
  #fav-sel .fav-preview .len{color:#7a8497;font-size:10px;margin-left:6px}
  #fav-sel .fav-btns{display:flex;gap:4px;flex-wrap:wrap}
  #fav-sel button{background:transparent;border:none;color:#cfe6ff;cursor:pointer;padding:6px 9px;border-radius:6px;
    font-size:12.5px;white-space:nowrap}
  #fav-sel button:hover{background:#2c3e6a;color:#fff}
</style>
</head>
<body>
  <div id="fav-top">
    <a class="back" href="/pdf/" title="返回书架">← 书架</a>
    <div id="fav-title">⭐ {{ folder_name }}</div>
    <span id="fav-count">{{ items|length }} 条</span>
  </div>

  <div id="fav-scroll">
    <div id="fav-content"></div>
  </div>

  <!-- 选中工具栏(分流由 fav-reader.js showSel 控制;阶段A:复制/查词/翻译/解释/对话) -->
  <div id="fav-sel">
    <div class="fav-preview" id="fav-preview">—</div>
    <div class="fav-btns">
      <button data-act="copy" data-grp="both">📋 复制</button>
      <button data-act="dict" data-grp="word">🔍 查词</button>
      <button data-act="translate" data-grp="multi">🌐 翻译</button>
      <button data-act="explain" data-grp="multi">💡 解释</button>
      <button data-act="chat" data-grp="multi">💬 对话</button>
    </div>
  </div>

  <!-- AI 结果模态 + 草稿系统(rc-result.js;DOM 骨架与 html_reader.html 一致,UI/CSS 由 rc-result 自注入) -->
  <div id="result-mask" onclick="if(event.target===this) closeResult()">
    <div id="result-modal">
      <h3 id="result-title">结果</h3>
      <div class="src" id="result-src"></div>
      <div class="content" id="result-content"></div>
      <div id="result-followup">
        <input id="result-followup-input" placeholder="继续追问…（基于上面的解释）" onkeydown="if(event.key==='Enter'){event.preventDefault();_followupAsk();}">
        <button onclick="_followupAsk()">追问</button>
      </div>
      <div class="actions">
        <div id="vocab-actions"></div>
        <button id="result-anki-btn" onclick="ankiFromResult()" title="把「选中原文 + 这条解释」做成 Anki 卡片（后台）" style="background:#13351f;color:#7ee2b8;border-color:#34d399">🎴 制 Anki</button>
        <button onclick="closeResult()">关闭</button>
      </div>
    </div>
  </div>
  <div id="draft-badge" onclick="openDraftModal()" title="已选段落">
    <div style="display:flex;flex-direction:column;align-items:center;line-height:1.1"><span class="icon">📋</span><span class="count" id="draft-count">0</span></div>
  </div>
  <div id="draft-mask" onclick="if(event.target===this) closeDraftModal()">
    <div id="draft-modal">
      <h3><span>📋 已选段落 <span id="draft-modal-count" style="color:#7a8497;font-size:12px;font-weight:400"></span></span><button class="clear-all" onclick="clearAllDrafts()">全部清空</button></h3>
      <div id="draft-list"></div>
      <div id="draft-actions">
        <button class="primary" onclick="createNoteFromDrafts()">📝 创建笔记</button>
        <button onclick="createAnkiFromDrafts()">🎴 创建 Anki</button>
        <button onclick="createBothFromDrafts()">📚 笔记 + Anki</button>
      </div>
    </div>
  </div>

<script>
  window.FAV_CFG = {
    folderId: {{ folder_id|tojson }},
    folderName: {{ folder_name|tojson }},
    items: {{ items|tojson }}
  };
</script>
<script src="/static/qa/marked.js"></script>
<!-- 必须在 mathjax.js 前配 $...$ 行内分隔符(同 html_reader.html);rc-result/rc-wordpop 流式渲染靠它 -->
<script>window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']]},options:{skipHtmlTags:['script','noscript','style','textarea','pre','code']}};</script>
<script src="/static/qa/mathjax.js" async></script>
<!-- 统一控制层(window.RC):本页接 result(含草稿)/ wordpop / snippets(制卡走 result 模态) -->
<script src="/static/pdf/rc-core.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-md.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-snippets.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-result.js?v={{ reader_js_v }}"></script>
<script src="/static/pdf/rc-wordpop.js?v={{ reader_js_v }}"></script>
<!-- 收藏夹查看页驱动(跨书条目序列 + FavAdapter) -->
<script src="/static/pdf/fav-reader.js?v={{ reader_js_v }}"></script>
</body>
</html>
