<!doctype html>
<html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ book }} · 技能树</title>
<script src="//bwicarus.taile44d0c.ts.net/static/qa/marked.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;background:#0a0e1a;color:#e6e6f0;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
#bar{background:linear-gradient(180deg,#141a2b,#0e1320);border-bottom:1px solid #2a3550;padding:9px 18px;display:flex;align-items:center;gap:10px;flex-shrink:0;z-index:10}
#bar h1{font-size:14px;font-weight:700;letter-spacing:.05em;color:#9ec3ff}
#bar .meta{font-size:12px;color:#8a9bb4}
#bar button{background:#1a2540;color:#9ec3ff;border:1px solid #2a3550;border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
#bar button:hover{background:#27345a}
#bar button:disabled{opacity:.4;cursor:default}
#crumb{font-size:13px;color:#cfe6ff;font-weight:500;padding-left:6px}
#crumb .sep{color:#5a6680;margin:0 6px}
#legend{margin-left:auto;display:flex;gap:14px;font-size:11px;color:#8a9bb4}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle;box-shadow:0 0 8px currentColor}
#viz{flex:1;position:relative;overflow:hidden;background-color:#0a0e1a;background-image:
  radial-gradient(ellipse at center,rgba(40,60,120,.16) 0%,transparent 60%),
  linear-gradient(rgba(60,80,140,.05) 1px,transparent 1px),
  linear-gradient(90deg,rgba(60,80,140,.05) 1px,transparent 1px);
  background-size:100% 100%, 40px 40px, 40px 40px}
#canvas-wrap{position:absolute;inset:0;overflow:auto;padding:20px}
#canvas-wrap::-webkit-scrollbar{width:10px;height:10px}
#canvas-wrap::-webkit-scrollbar-thumb{background:#2a3550;border-radius:5px}
svg.canvas{display:block}
/* 节点 */
.tile{cursor:pointer}
.tile rect{transition:filter .15s, stroke-width .15s}
.tile:hover rect{filter:brightness(1.4)}
.tile text.tname{font-weight:600;fill:currentColor;text-anchor:middle;pointer-events:none;user-select:none}
.tile text.tsub{fill:#7a8497;text-anchor:middle;pointer-events:none;user-select:none}
.tile text.tcount{fill:#7dc4ff;text-anchor:middle;pointer-events:none;user-select:none;font-weight:600}
.tile.mastered rect{stroke:#34d399;stroke-width:2.2;fill:#0d2a1f;filter:drop-shadow(0 0 8px #34d39977)}
.tile.mastered{color:#7be096}
.tile.unlocked rect{stroke:#fbbf24;stroke-width:2;fill:#241a08;filter:drop-shadow(0 0 6px #fbbf2466)}
.tile.unlocked{color:#fcd383}
.tile.locked rect{stroke:#6a7488;stroke-width:1.5;fill:#141926;stroke-dasharray:4 3}
.tile.locked{color:#7a8497}
.tile.focus rect{stroke:#7dc4ff;stroke-width:4;fill:#0c1a30;filter:drop-shadow(0 0 22px #7dc4ffcc)}
.tile.focus{color:#cfe6ff}
/* 边 */
.edge{fill:none;stroke-linecap:round}
.edge.mast{stroke:#34d399aa;stroke-width:2}
.edge.unl{stroke:#fbbf24aa;stroke-width:1.8}
.edge.lock{stroke:#5a6680cc;stroke-width:1.4;stroke-dasharray:4 3}
/* detail */
#detail{position:absolute;right:0;top:0;bottom:0;width:360px;background:linear-gradient(180deg,#10162a,#0a0e1a);border-left:1px solid #2a3550;padding:18px 20px 24px;overflow-y:auto;transform:translateX(100%);transition:transform .22s ease;font-size:13px;line-height:1.65;z-index:5}
#detail.open{transform:translateX(0);box-shadow:-12px 0 32px rgba(0,0,0,.5)}
#detail h2{font-size:16px;margin-bottom:8px;color:#e6e6f0}
#detail .lbl{color:#8a9bb4;font-size:10px;margin-top:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
#detail .v{margin-top:3px;color:#cfd6e6;word-break:break-all}
#detail a{color:#7dc4ff;text-decoration:none}
#detail a:hover{text-decoration:underline}
#detail-close{position:absolute;top:12px;right:14px;background:none;border:none;color:#8a9bb4;font-size:18px;cursor:pointer;line-height:1}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;margin-right:6px;font-weight:600}
.b-mast{background:#10412a;color:#7be096;box-shadow:inset 0 0 0 1px #34d399}
.b-unl{background:#3a2a08;color:#fcd383;box-shadow:inset 0 0 0 1px #fbbf24}
.b-lock{background:#1f2530;color:#7a8497;box-shadow:inset 0 0 0 1px #4a5568}
.b-type{background:#142540;color:#9ec3ff;box-shadow:inset 0 0 0 1px #3b6db5}
#detail .prereqs li{margin:5px 0;padding:7px 10px;background:#0d1322;border:1px solid #1f2740;border-radius:6px;cursor:pointer;list-style:none;font-size:12px}
#detail .prereqs li:hover{background:#162045;border-color:#3b6db5}
/* settings modal */
#sett-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:20}
#sett-mask.open{display:flex}
#sett-panel{background:#10162a;border:1px solid #2a3550;border-radius:10px;padding:22px 24px;width:360px;max-width:90vw}
#sett-panel h3{font-size:15px;margin-bottom:14px;color:#9ec3ff}
#sett-panel label{display:block;font-size:12px;color:#9aa4b2;margin-bottom:6px}
#sett-panel input[type=range]{width:100%;margin:6px 0}
#sett-panel .preview-strip{height:6px;background:#1a2540;border-radius:3px;margin-top:8px;position:relative}
#sett-panel .preview-strip span{position:absolute;top:0;left:0;height:100%;background:#7dc4ff;border-radius:3px}
#sett-panel .row{margin:14px 0}
#sett-panel .val{color:#cfe6ff;font-weight:600;font-size:13px;margin-left:6px}
#sett-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
#sett-foot button{padding:7px 16px;border-radius:6px;border:1px solid #2a3550;background:#1a2540;color:#cfe6ff;cursor:pointer;font-size:13px}
#sett-foot .primary{background:#244470;border-color:#3b6db5;color:#fff}
</style></head>
<body>
<div id="bar">
  <h1>{{ book }} · 技能树</h1>
  <button id="back-btn" onclick="goBack()" title="返回上一级">◀ 后退</button>
  <span id="crumb">全部章</span>
  <span class="meta" id="meta">加载中…</span>
  <button onclick="openSettings()">⚙ 设置</button>
  <div id="legend">
    <span><span class="dot" style="background:#34d399;color:#34d399"></span>已掌握</span>
    <span><span class="dot" style="background:#fbbf24;color:#fbbf24"></span>已解锁</span>
    <span><span class="dot" style="background:#4a5568;color:#4a5568"></span>未解锁</span>
  </div>
</div>
<div id="viz">
  <div id="canvas-wrap">
    <svg class="canvas"><defs>
      <marker id="arr-mast" viewBox="0 -5 10 10" refX="9" refY="0" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,-4L9,0L0,4" fill="#34d399"/></marker>
      <marker id="arr-unl" viewBox="0 -5 10 10" refX="9" refY="0" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,-4L9,0L0,4" fill="#fbbf24"/></marker>
      <marker id="arr-lock" viewBox="0 -5 10 10" refX="9" refY="0" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,-4L9,0L0,4" fill="#5a6680"/></marker>
    </defs></svg>
  </div>
  <aside id="detail">
    <button id="detail-close" onclick="closeDetail()">✕</button>
    <h2 id="d-name">—</h2>
    <div id="d-badges"></div>
    <div class="lbl">编号 · 类型</div><div class="v" id="d-label">—</div>
    <div class="lbl">描述</div><div class="v" id="d-summary">—</div>
    <div class="lbl">页码 · 路径</div><div class="v" id="d-path">—</div>
    <div class="lbl">关联</div><div class="v" id="d-link">—</div>
    <div class="lbl">前置（点跳）</div><ul class="prereqs" id="d-prereqs"></ul>
    <div class="lbl">后续</div><ul class="prereqs" id="d-unlocks"></ul>
  </aside>
</div>

<!-- 设置弹窗 -->
<div id="sett-mask" onclick="if(event.target===this) closeSettings()">
  <div id="sett-panel">
    <h3>显示设置</h3>
    <div class="row">
      <label>方块宽度（占页面宽的比例）<span class="val" id="sett-val">12%</span></label>
      <input type="range" id="sett-ratio" min="5" max="30" step="1">
      <div class="preview-strip"><span id="sett-bar"></span></div>
    </div>
    <p style="font-size:11px;color:#8a9bb4;line-height:1.5;margin-top:8px">
      比例越大，单个方块越突出，能同屏显示的方块越少；反之亦然。<br>
      不再有缩放交互——所有方块固定按这个比例渲染，超出页面则滚动。
    </p>
    <div id="sett-foot">
      <button onclick="closeSettings()">取消</button>
      <button class="primary" onclick="applySettings()">应用</button>
    </div>
  </div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const BOOK="{{ book }}";
const VAULT="Obsidian Vault";

// 设置（localStorage 持久化）
const SETT_KEY="skilltree_settings_"+BOOK;
function loadSettings(){
  try{ return Object.assign({blockRatio:0.12}, JSON.parse(localStorage.getItem(SETT_KEY)||"{}")); }
  catch(_){ return {blockRatio:0.12}; }
}
function saveSettings(s){ try{ localStorage.setItem(SETT_KEY, JSON.stringify(s)); }catch(_){} }
let settings=loadSettings();

let KG=null, id2={};
let nodesByLevel={0:[],1:[],2:[]};
let edgesByLevel={0:[],1:[],2:[]};
let viewStack=[];           // 历史
let current={kind:"home"};  // {kind:"home"|"chapter"|"section"|"focus", id?}

fetch(`/skilltree/${BOOK}/data.json`).then(r=>r.json()).then(d=>{
  KG=d; id2=Object.fromEntries(KG.nodes.map(n=>[n.id,n]));
  for(const n of KG.nodes){(nodesByLevel[n.level]=nodesByLevel[n.level]||[]).push(n)}
  buildAggregatedEdges();
  document.getElementById("meta").textContent=
    `${nodesByLevel[0].length} 章 · ${nodesByLevel[1].length} 节 · ${nodesByLevel[2].length} 知识点`;
  render();
});

function stateOf(n){return n.mastered?"mastered":(n.unlocked?"unlocked":"locked")}
function ancestorAtLevel(nid,lv){let c=id2[nid];while(c&&c.level>lv)c=id2[c.parent_id];return c&&c.level===lv?c.id:null}
function buildAggregatedEdges(){
  edgesByLevel[2]=(KG.edges||[]).filter(e=>e.kind==="prereq"&&id2[e.from]?.level===2&&id2[e.to]?.level===2);
  for(const lv of [1,0]){
    const seen=new Set(); const out=[];
    for(const e of edgesByLevel[2]){
      const a=ancestorAtLevel(e.from,lv), b=ancestorAtLevel(e.to,lv);
      if(!a||!b||a===b) continue;
      const k=a+"→"+b; if(seen.has(k)) continue; seen.add(k);
      out.push({from:a,to:b,kind:"prereq",level:lv});
    }
    edgesByLevel[lv]=out;
  }
}

// ============================================================
// 后退 / 导航
// ============================================================
function pushView(v){ viewStack.push(current); current=v; updateNav(); render(); }
function goBack(){ if(viewStack.length){ current=viewStack.pop(); updateNav(); render(); } }
function updateNav(){
  document.getElementById("back-btn").disabled = viewStack.length===0;
  const c=current;
  let label="全部章";
  if(c.kind==="chapter"){
    label=`章：${id2[c.id]?.name||c.id}`;
  }else if(c.kind==="section"){
    const sec=id2[c.id]; const chap=sec?id2[sec.parent_id]:null;
    label=`${chap?chap.name+' › ':''}${sec?sec.name:c.id}`;
  }else if(c.kind==="focus"){
    label=`聚焦：${id2[c.id]?.name||c.id}`;
  }
  document.getElementById("crumb").textContent=label;
}

// ============================================================
// 视图 → 节点 + 边
// ============================================================
function nodesForView(){
  if(current.kind==="home"){
    return {nodes: nodesByLevel[0].slice(), edges: edgesByLevel[0].slice(), level:0};
  }
  if(current.kind==="chapter"){
    // 章下所有 L1 节
    const subs=nodesByLevel[1].filter(n=>n.parent_id===current.id);
    const ids=new Set(subs.map(n=>n.id));
    const edges=edgesByLevel[1].filter(e=>ids.has(e.from)&&ids.has(e.to));
    return {nodes:subs, edges, level:1};
  }
  if(current.kind==="section"){
    // 节下所有 L2 + 节内的 L2 边
    const subs=nodesByLevel[2].filter(n=>n.parent_id===current.id);
    const ids=new Set(subs.map(n=>n.id));
    const edges=edgesByLevel[2].filter(e=>ids.has(e.from)&&ids.has(e.to));
    return {nodes:subs, edges, level:2};
  }
  if(current.kind==="focus"){
    // 该 L2 + 所有传递前置
    const all=ancestorsTransitive(current.id);
    const subs=[...all].map(i=>id2[i]).filter(Boolean);
    const ids=new Set(subs.map(n=>n.id));
    const edges=edgesByLevel[2].filter(e=>ids.has(e.from)&&ids.has(e.to));
    return {nodes:subs, edges, level:2};
  }
  return {nodes:[], edges:[], level:0};
}
function ancestorsTransitive(rootId){
  const out=new Set([rootId]); const stack=[rootId];
  while(stack.length){
    const cur=stack.pop();
    for(const e of edgesByLevel[2]){
      if(e.to===cur && !out.has(e.from)){out.add(e.from); stack.push(e.from)}
    }
  }
  return out;
}

// ============================================================
// 渲染（HTML+SVG）
// ============================================================
function render(){
  const wrap=document.getElementById("canvas-wrap");
  const svg=d3.select("svg.canvas");
  svg.selectAll("g.layer").remove();
  const layer=svg.append("g").attr("class","layer");
  const {nodes, edges, level}=nodesForView();
  if(!nodes.length){
    svg.attr("width", wrap.clientWidth).attr("height", wrap.clientHeight-40);
    layer.append("text").attr("x",wrap.clientWidth/2).attr("y",60)
      .attr("text-anchor","middle").attr("fill","#5a6680").attr("font-size",14).text("此视图无节点");
    return;
  }
  // 方块尺寸（按比例 × 页面宽）
  const W = wrap.clientWidth - 380 - 40;   // 去掉 detail 面板 + padding
  const blockW = Math.max(70, Math.floor(W * settings.blockRatio));
  const blockH = Math.max(34, Math.floor(blockW * (level===0?0.45:level===1?0.36:0.32)));
  const gapX = Math.max(14, Math.floor(blockW * 0.18));
  const gapY = Math.max(36, Math.floor(blockH * 1.6));
  // 布局：分层 DAG（按 depth，max 在顶）
  const inE={}; for(const n of nodes) inE[n.id]=[];
  for(const e of edges) if(inE[e.to]) inE[e.to].push(e.from);
  const depth={}; for(const n of nodes) depth[n.id]=0;
  let ch=true, it=0;
  while(ch && it++<nodes.length+2){
    ch=false;
    for(const n of nodes){
      const d=inE[n.id].length?Math.max(...inE[n.id].map(s=>(depth[s]??0)+1)):0;
      if(d!==depth[n.id]){depth[n.id]=d;ch=true}
    }
  }
  const maxD=Math.max(...Object.values(depth),0);
  const byDepth={};
  for(const n of nodes)(byDepth[depth[n.id]]=byDepth[depth[n.id]]||[]).push(n);
  // 排序：按 numeric_label / name
  for(const d in byDepth){
    byDepth[d].sort((a,b)=>(a.numeric_label||"").localeCompare(b.numeric_label||"")||a.name.localeCompare(b.name));
  }
  // 计算每层 wrap：超出 W 自动换行
  const cols=Math.max(1, Math.floor((W) / (blockW+gapX)));
  const positions={};
  let maxRowY=0;
  let y=20;
  for(let d=maxD; d>=0; d--){
    const row=byDepth[d]||[];
    const subRows=Math.ceil(row.length/cols)||1;
    const totalW = Math.min(row.length, cols)*(blockW+gapX) - gapX;
    const xStart = Math.max(20, (W-totalW)/2);
    row.forEach((n,i)=>{
      const sr=Math.floor(i/cols);
      const col=i%cols;
      positions[n.id]={
        x: xStart + col*(blockW+gapX) + blockW/2,
        y: y + sr*(blockH+gapY*0.5) + blockH/2,
      };
    });
    y += subRows*(blockH+gapY*0.5) + gapY*0.5;
    maxRowY = Math.max(maxRowY, y);
  }
  // SVG 尺寸 = 内容尺寸（容器自适应滚动）
  const svgW = Math.max(W, cols*(blockW+gapX));
  const svgH = Math.max(wrap.clientHeight-40, maxRowY+40);
  svg.attr("width", svgW).attr("height", svgH);

  // 边
  layer.selectAll(".edge").data(edges).enter().append("path")
    .attr("class",e=>"edge "+edgeClass(e))
    .attr("d",e=>{
      const s=positions[e.from], t=positions[e.to];
      if(!s||!t) return "";
      const y1=s.y-blockH/2, y2=t.y+blockH/2, my=(y1+y2)/2;
      return `M${s.x},${y1} C${s.x},${my} ${t.x},${my} ${t.x},${y2}`;
    })
    .attr("marker-end",e=>`url(#arr-${edgeClass(e)})`);

  // 节点
  const focusedId = current.kind==="focus" ? current.id : null;
  const tile=layer.selectAll(".tile").data(nodes).enter().append("g")
    .attr("class",d=>`tile ${stateOf(d)}${d.id===focusedId?' focus':''}`)
    .attr("transform",d=>{const p=positions[d.id]; return `translate(${p.x-blockW/2},${p.y-blockH/2})`})
    .on("click",(_,d)=>nodeClick(d));
  tile.append("rect").attr("width",blockW).attr("height",blockH)
    .attr("rx", level===0?12:level===1?9:7).attr("ry",level===0?12:level===1?9:7);
  const fontMain = Math.max(10, Math.floor(blockW*0.10));
  const fontSub  = Math.max(9,  Math.floor(blockW*0.075));
  if(level===0){
    tile.append("text").attr("class","tname").attr("font-size",fontMain).attr("x",blockW/2).attr("y",blockH/2-6).text(d=>d.name);
    tile.append("text").attr("class","tsub").attr("font-size",fontSub).attr("x",blockW/2).attr("y",blockH/2+10).text(d=>d.chapter_label||"");
    tile.append("text").attr("class","tcount").attr("font-size",fontSub).attr("x",blockW/2).attr("y",blockH/2+10+fontSub+2).text(d=>`${countL2Under(d)} 知识点`);
  }else if(level===1){
    tile.append("text").attr("class","tname").attr("font-size",fontMain).attr("x",blockW/2).attr("y",blockH/2-2).text(d=>truncate(d.name, blockW, fontMain));
    tile.append("text").attr("class","tsub").attr("font-size",fontSub).attr("x",blockW/2).attr("y",blockH/2+fontSub+4).text(d=>`${d.section_label||""} · ${countL2Under(d)}`);
  }else{
    tile.append("text").attr("class","tname").attr("font-size",fontMain).attr("x",blockW/2).attr("y",blockH/2-2).text(d=>truncate(d.name, blockW, fontMain));
    tile.append("text").attr("class","tsub").attr("font-size",fontSub).attr("x",blockW/2).attr("y",blockH/2+fontSub+4).text(d=>d.numeric_label||d.type||"");
  }
  // 自动滚动到聚焦节点
  if(focusedId){
    const p=positions[focusedId];
    if(p){
      wrap.scrollTo({left: Math.max(0, p.x - wrap.clientWidth/2), top: Math.max(0, p.y - wrap.clientHeight/2), behavior:"smooth"});
    }
    showDetail(id2[focusedId]);
  }
}

function truncate(s, w, fontSize){
  // 粗估：CSS px / 字符 ≈ fontSize (中文)
  const maxChars = Math.max(4, Math.floor((w-12) / (fontSize*0.95)));
  return s.length>maxChars ? s.slice(0,maxChars-1)+"…" : s;
}
function countL2Under(node){
  if(node.level===2) return 0;
  let n=0;
  for(const x of nodesByLevel[2]){
    let c=x;
    while(c && c.parent_id){
      if(c.parent_id===node.id){n++;break}
      c=id2[c.parent_id];
    }
  }
  return n;
}
function edgeClass(e){const f=id2[e.from];return f?.mastered?"mast":(f?.unlocked?"unl":"lock")}

function nodeClick(n){
  if(n.level===0) pushView({kind:"chapter", id:n.id});
  else if(n.level===1) pushView({kind:"section", id:n.id});
  else pushView({kind:"focus", id:n.id});
}

// ============================================================
// detail
// ============================================================
function obsidianUrl(noteRef){
  if(!noteRef) return "";
  let p=noteRef.replace(/\\/g,"/"); if(p.toLowerCase().endsWith(".md")) p=p.slice(0,-3);
  return "obsidian://open?vault="+encodeURIComponent(VAULT)+"&file="+encodeURIComponent(p);
}
function showDetail(n){
  if(!n) return;
  document.getElementById("detail").classList.add("open");
  document.getElementById("d-name").textContent=n.name;
  const st=stateOf(n);
  const sLabel={mastered:"已掌握",unlocked:"已解锁",locked:"未解锁"}[st];
  const sBadge={mastered:"b-mast",unlocked:"b-unl",locked:"b-lock"}[st];
  const badges=[`<span class="badge ${sBadge}">${sLabel}</span>`];
  if(n.level<2){
    badges.push(`<span class="badge b-type">L${n.level} ${n.level===0?'章':'节'}</span>`);
    badges.push(`<span class="badge b-type">${countL2Under(n)} 知识点</span>`);
  }else{
    if(n.type) badges.push(`<span class="badge b-type">${n.type}</span>`);
    if(typeof n.mastery==="number") badges.push(`<span class="badge b-type">掌握 ${(n.mastery*100).toFixed(0)}%</span>`);
  }
  document.getElementById("d-badges").innerHTML=badges.join("");
  document.getElementById("d-label").textContent=[n.numeric_label||"", n.type||""].filter(Boolean).join(" · ")
    || (n.level===0?n.chapter_label:n.section_label)||"—";
  document.getElementById("d-summary").innerHTML=n.summary?marked.parse(n.summary):"—";
  const chain=[]; let cur=id2[n.parent_id]; while(cur){chain.unshift(cur.name); cur=id2[cur.parent_id]}
  const pageStr=(n.pages||[]).join(", ")||"—";
  document.getElementById("d-path").innerHTML=`p.${pageStr}<br><small style="color:#6b7488">${chain.join(" › ")||"（顶层）"}</small>`;
  const link=[];
  if(n.note_ref) link.push(`<a href="${obsidianUrl(n.note_ref)}">📝 ${n.note_ref}</a>`);
  if(n.card_refs && n.card_refs.length) link.push(`🎴 ${n.card_refs.length} 张 Anki 卡`);
  document.getElementById("d-link").innerHTML=link.join("<br>")||"—";
  function fillList(elId, dir){
    const ul=document.getElementById(elId); ul.innerHTML="";
    if(n.level!==2){const li=document.createElement("li"); li.style.cursor="default"; li.style.color="#5a6680"; li.textContent="（聚合层：点该方块进入知识点视图后可见前置链）"; ul.appendChild(li); return}
    let count=0;
    for(const e of edgesByLevel[2]) if(e[dir==="prereq"?"to":"from"]===n.id){
      const other=id2[e[dir==="prereq"?"from":"to"]]; if(!other) continue;
      const li=document.createElement("li");
      const arrow=dir==="prereq"?"←":"→";
      const stO=stateOf(other);
      const stEmoji={mastered:"🟢",unlocked:"🟡",locked:"⚫"}[stO];
      li.innerHTML=`${stEmoji} ${arrow} <b>${other.name}</b>${e.evidence?'<br><small style="color:#6b7488">'+e.evidence+'</small>':''}`;
      li.onclick=()=>{pushView({kind:"focus", id:other.id})};
      ul.appendChild(li); count++;
    }
    if(!count){const li=document.createElement("li"); li.style.cursor="default"; li.style.color="#5a6680"; li.textContent="（无）"; ul.appendChild(li)}
  }
  fillList("d-prereqs","prereq");
  fillList("d-unlocks","unlock");
}
function closeDetail(){document.getElementById("detail").classList.remove("open")}

// ============================================================
// settings
// ============================================================
function openSettings(){
  document.getElementById("sett-mask").classList.add("open");
  const inp=document.getElementById("sett-ratio");
  inp.value=Math.round(settings.blockRatio*100);
  updateSettPreview();
  inp.oninput=updateSettPreview;
}
function updateSettPreview(){
  const v=+document.getElementById("sett-ratio").value;
  document.getElementById("sett-val").textContent=v+"%";
  document.getElementById("sett-bar").style.width=(v/30*100)+"%";
}
function applySettings(){
  const v=+document.getElementById("sett-ratio").value;
  settings.blockRatio=v/100;
  saveSettings(settings);
  closeSettings();
  render();
}
function closeSettings(){document.getElementById("sett-mask").classList.remove("open")}

// 快捷键
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    if(document.getElementById("sett-mask").classList.contains("open")) closeSettings();
    else goBack();
  }
  if(e.key==="Backspace" && !["INPUT","TEXTAREA"].includes(document.activeElement.tagName)) goBack();
});
window.addEventListener("resize",()=>render());
updateNav();
</script></body></html>
