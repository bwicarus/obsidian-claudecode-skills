<!doctype html>
<html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ book }} · 技能树</title>
<script src="//bwicarus.taile44d0c.ts.net/static/qa/marked.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;background:#0a0e1a;color:#e6e6f0;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
#bar{background:linear-gradient(180deg,#141a2b,#0e1320);border-bottom:1px solid #2a3550;padding:9px 18px;display:flex;align-items:center;gap:14px;flex-shrink:0;z-index:10}
#bar h1{font-size:14px;font-weight:700;letter-spacing:.05em;color:#9ec3ff}
#bar .meta{font-size:12px;color:#8a9bb4}
#bar button{background:#1a2540;color:#9ec3ff;border:1px solid #2a3550;border-radius:6px;padding:4px 12px;font-size:12px;cursor:pointer}
#bar button:hover{background:#27345a}
#lvl{font-size:11px;color:#7dc4ff;background:#0e2042;border:1px solid #244470;padding:3px 9px;border-radius:10px;font-weight:600}
#legend{margin-left:auto;display:flex;gap:14px;font-size:11px;color:#8a9bb4}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle;box-shadow:0 0 8px currentColor}
#viz{flex:1;position:relative;overflow:hidden;background-color:#0a0e1a;background-image:
  radial-gradient(ellipse at center,rgba(40,60,120,.18) 0%,transparent 60%),
  linear-gradient(rgba(60,80,140,.05) 1px,transparent 1px),
  linear-gradient(90deg,rgba(60,80,140,.05) 1px,transparent 1px);
  background-size:100% 100%, 40px 40px, 40px 40px}
svg{width:100%;height:100%;cursor:grab;display:block}
svg:active{cursor:grabbing}
/* 节点 */
.tile{cursor:pointer;transition:opacity .25s}
.tile rect{transition:filter .15s, stroke-width .15s, stroke .15s}
.tile:hover rect{filter:brightness(1.4)}
.tile text.tname{font-weight:600;fill:currentColor;text-anchor:middle;pointer-events:none;user-select:none}
.tile text.tsub{fill:#7a8497;text-anchor:middle;pointer-events:none;user-select:none}
.tile text.tcount{fill:#7dc4ff;text-anchor:middle;pointer-events:none;user-select:none;font-weight:600}
/* 状态色 */
.tile.mastered rect{stroke:#34d399;stroke-width:2;fill:#0d2a1f;filter:drop-shadow(0 0 6px #34d39966)}
.tile.mastered{color:#7be096}
.tile.unlocked rect{stroke:#fbbf24;stroke-width:1.8;fill:#241a08;filter:drop-shadow(0 0 5px #fbbf2455)}
.tile.unlocked{color:#fcd383}
.tile.locked rect{stroke:#4a5568;stroke-width:1.3;fill:#141926;stroke-dasharray:3 3}
.tile.locked{color:#6b7488}
/* 聚焦/淡出 */
.tile.dim{opacity:.13}
.tile.dim text{display:none}
.tile.dim rect{filter:none;stroke-dasharray:none}
.tile.hi.unlocked rect{stroke-width:2.5;filter:drop-shadow(0 0 14px #fbbf24cc)}
.tile.hi.mastered rect{stroke-width:3;filter:drop-shadow(0 0 16px #34d399dd)}
.tile.hi.locked rect{stroke:#9aa4b2;stroke-width:1.8;stroke-dasharray:5 3;filter:drop-shadow(0 0 8px #9aa4b266)}
.tile.hi.locked{color:#b4becf}
.tile.focus rect{stroke:#7dc4ff !important;stroke-width:4 !important;fill:#0c1a30 !important;filter:drop-shadow(0 0 22px #7dc4ffcc) !important;stroke-dasharray:none !important}
.tile.focus{color:#cfe6ff}
/* 边 */
.edge{fill:none;stroke-linecap:round;transition:opacity .25s, stroke .15s}
.edge.mast{stroke:#34d39955;stroke-width:1.5}
.edge.unl{stroke:#fbbf2445;stroke-width:1.3}
.edge.lock{stroke:#3a4658;stroke-width:1.1;stroke-dasharray:3 4}
.edge.dim{opacity:.04}
.edge.hi.mast{stroke:#34d399ee;stroke-width:2.5}
.edge.hi.unl{stroke:#fbbf24ee;stroke-width:2.3}
.edge.hi.lock{stroke:#9aa4b2cc;stroke-width:2;stroke-dasharray:4 3}
/* detail */
#detail{position:absolute;right:0;top:0;bottom:0;width:360px;background:linear-gradient(180deg,#10162a,#0a0e1a);border-left:1px solid #2a3550;padding:18px 20px 24px;overflow-y:auto;transform:translateX(100%);transition:transform .22s ease;font-size:13px;line-height:1.65;z-index:5}
#detail.open{transform:translateX(0);box-shadow:-12px 0 32px rgba(0,0,0,.5)}
#detail h2{font-size:16px;margin-bottom:8px;color:#e6e6f0}
#detail .lbl{color:#8a9bb4;font-size:10px;margin-top:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
#detail .v{margin-top:3px;color:#cfd6e6;word-break:break-all}
#detail a{color:#7dc4ff;text-decoration:none}
#detail a:hover{text-decoration:underline}
#detail-close{position:absolute;top:12px;right:14px;background:none;border:none;color:#8a9bb4;font-size:18px;cursor:pointer;line-height:1}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;margin-right:6px;font-weight:600}
.b-mast{background:#10412a;color:#7be096;box-shadow:inset 0 0 0 1px #34d399}
.b-unl{background:#3a2a08;color:#fcd383;box-shadow:inset 0 0 0 1px #fbbf24}
.b-lock{background:#1f2530;color:#7a8497;box-shadow:inset 0 0 0 1px #4a5568}
.b-type{background:#142540;color:#9ec3ff;box-shadow:inset 0 0 0 1px #3b6db5}
#detail .prereqs li{margin:5px 0;padding:7px 10px;background:#0d1322;border:1px solid #1f2740;border-radius:6px;cursor:pointer;list-style:none;font-size:12px}
#detail .prereqs li:hover{background:#162045;border-color:#3b6db5}
#hint{position:absolute;left:18px;bottom:14px;background:rgba(13,19,34,.85);border:1px solid #2a3550;padding:8px 12px;border-radius:8px;font-size:11px;color:#9aa4b2;backdrop-filter:blur(4px)}
#hint kbd{background:#1a2540;border:1px solid #2a3550;padding:1px 5px;border-radius:3px;color:#cfe6ff;font-size:10px}
</style></head>
<body>
<div id="bar">
  <h1>{{ book }} · 技能树</h1>
  <span id="lvl">L0 章</span>
  <span class="meta" id="meta">加载中…</span>
  <button onclick="resetView()" title="缩放至全图">⊡ 全图</button>
  <button onclick="clearFocus()" title="清除聚焦">⊙ 清除</button>
  <div id="legend">
    <span><span class="dot" style="background:#34d399;color:#34d399"></span>已掌握</span>
    <span><span class="dot" style="background:#fbbf24;color:#fbbf24"></span>已解锁</span>
    <span><span class="dot" style="background:#4a5568;color:#4a5568"></span>未解锁</span>
  </div>
</div>
<div id="viz">
  <svg><defs>
    <marker id="arr-mast" viewBox="0 -5 10 10" refX="9" refY="0" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,-4L9,0L0,4" fill="#34d399"/></marker>
    <marker id="arr-unl" viewBox="0 -5 10 10" refX="9" refY="0" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,-4L9,0L0,4" fill="#fbbf24"/></marker>
    <marker id="arr-lock" viewBox="0 -5 10 10" refX="9" refY="0" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,-4L9,0L0,4" fill="#4a5568"/></marker>
  </defs></svg>
  <aside id="detail">
    <button id="detail-close" onclick="closeDetail()">✕</button>
    <h2 id="d-name">—</h2>
    <div id="d-badges"></div>
    <div class="lbl">编号 · 类型</div><div class="v" id="d-label">—</div>
    <div class="lbl">描述</div><div class="v" id="d-summary">—</div>
    <div class="lbl">页码 · 路径</div><div class="v" id="d-path">—</div>
    <div class="lbl">关联</div><div class="v" id="d-link">—</div>
    <div class="lbl">前置链（点跳）</div><ul class="prereqs" id="d-prereqs"></ul>
    <div class="lbl">后续（解锁后开放）</div><ul class="prereqs" id="d-unlocks"></ul>
  </aside>
  <div id="hint">缩放即切层（远→章 → 节 → 知识点）· 点节点聚焦/钻取 · <kbd>⊡</kbd> 全图 · <kbd>Esc</kbd> 取消</div>
</div>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const BOOK="{{ book }}";
const VAULT="Obsidian Vault";
// LOD 阈值（k = zoom scale）
const K_L0_L1=0.35, K_L1_L2=0.85, HYST=0.05;
const FOCUS_HOPS=3;

let KG=null, id2=null;
let nodesByLevel={0:[],1:[],2:[]};
let edgesByLevel={0:[],1:[],2:[]};
let depthL2={};
let currentLevel=0, focusId=null;
let rendering=false;

const svg=d3.select("svg"), W=()=>svg.node().clientWidth, H=()=>svg.node().clientHeight;
const g=svg.append("g");
const zoom=d3.zoom().scaleExtent([0.05,4]).on("zoom",onZoom);
svg.call(zoom);

fetch(`/skilltree/${BOOK}/data.json`).then(r=>r.json()).then(d=>{
  KG=d; id2=Object.fromEntries(KG.nodes.map(n=>[n.id,n]));
  for(const n of KG.nodes){(nodesByLevel[n.level]=nodesByLevel[n.level]||[]).push(n)}
  computeAllLayouts();
  document.getElementById("meta").textContent=
    `${KG.nodes.filter(n=>n.level===0).length} 章 · ${KG.nodes.filter(n=>n.level===1).length} 节 · ${KG.nodes.filter(n=>n.level===2).length} 知识点`;
  renderLevel(0);
  resetView();
});

function stateOf(n){return n.mastered?"mastered":(n.unlocked?"unlocked":"locked")}

// =========================================================================
// 全局布局：L2 用最长路径 depth；L1/L0 用子节点 centroid
// =========================================================================
const NW={0:200,1:148,2:118}, NH={0:62,1:44,2:34};
function computeAllLayouts(){
  const l2=nodesByLevel[2];
  const inE={}; for(const n of l2) inE[n.id]=[];
  const l2edges=(KG.edges||[]).filter(e=>e.kind==="prereq"&&id2[e.from]?.level===2&&id2[e.to]?.level===2);
  for(const e of l2edges) inE[e.to].push(e.from);
  for(const n of l2) depthL2[n.id]=0;
  let ch=true, it=0;
  while(ch&&it++<l2.length+2){
    ch=false;
    for(const n of l2){
      const d=inE[n.id].length?Math.max(...inE[n.id].map(s=>(depthL2[s]??0)+1)):0;
      if(d!==depthL2[n.id]){depthL2[n.id]=d;ch=true}
    }
  }
  const maxD=Math.max(...Object.values(depthL2),0);
  const byDepth={}; for(const n of l2)(byDepth[depthL2[n.id]]=byDepth[depthL2[n.id]]||[]).push(n);
  const chapOf=n=>{let c=n;while(c&&c.parent_id){if(id2[c.parent_id]?.level===0)return c.parent_id;c=id2[c.parent_id]}return ""};
  const PADX=80, PADY=80, GAP_X=18, GAP_Y=78;
  for(const d in byDepth){
    byDepth[d].sort((a,b)=>(chapOf(a).localeCompare(chapOf(b)))||(a.numeric_label||"").localeCompare(b.numeric_label||""));
    byDepth[d].forEach((n,i)=>{
      n.x=PADX+i*(NW[2]+GAP_X)+NW[2]/2;
      n.y=PADY+(maxD-(+d))*GAP_Y+NH[2]/2;
    });
  }
  // L1 = centroid(自己的 L2 子) ；fallback: 同 L0 兄弟之间的页码顺序
  for(const n1 of nodesByLevel[1]){
    const kids=l2.filter(x=>x.parent_id===n1.id && x.x!=null);
    if(kids.length){
      n1.x=kids.reduce((a,b)=>a+b.x,0)/kids.length;
      n1.y=kids.reduce((a,b)=>a+b.y,0)/kids.length;
    }
  }
  // 无 L2 子的 L1（如本节没抽到知识点）→ 放父 L0 附近，按节序排
  for(const n0 of nodesByLevel[0]){
    const sibs=nodesByLevel[1].filter(x=>x.parent_id===n0.id);
    const empty=sibs.filter(x=>x.x==null);
    if(empty.length){
      const placed=sibs.filter(x=>x.x!=null);
      let baseX=placed.length?placed.reduce((a,b)=>a+b.x,0)/placed.length:PADX+nodesByLevel[0].indexOf(n0)*600;
      let baseY=placed.length?placed.reduce((a,b)=>a+b.y,0)/placed.length:PADY+200;
      empty.sort((a,b)=>(a.section_label||"").localeCompare(b.section_label||""));
      empty.forEach((n,i)=>{n.x=baseX+(i-empty.length/2)*(NW[1]+22);n.y=baseY});
    }
  }
  // L0 = centroid(L1 children)
  for(const n0 of nodesByLevel[0]){
    const kids=nodesByLevel[1].filter(x=>x.parent_id===n0.id && x.x!=null);
    if(kids.length){
      n0.x=kids.reduce((a,b)=>a+b.x,0)/kids.length;
      n0.y=kids.reduce((a,b)=>a+b.y,0)/kids.length;
    }else{
      n0.x=PADX+nodesByLevel[0].indexOf(n0)*600; n0.y=PADY+200;
    }
  }
  // 聚合 edges
  edgesByLevel[2]=l2edges;
  edgesByLevel[1]=aggregateUp(l2edges, 1);
  edgesByLevel[0]=aggregateUp(l2edges, 0);
}
function ancestorAtLevel(nodeId, lv){
  let cur=id2[nodeId];
  while(cur && cur.level>lv) cur=id2[cur.parent_id];
  return cur && cur.level===lv ? cur.id : null;
}
function aggregateUp(l2edges, lv){
  const seen=new Set(); const out=[];
  for(const e of l2edges){
    const a=ancestorAtLevel(e.from, lv), b=ancestorAtLevel(e.to, lv);
    if(!a||!b||a===b) continue;
    const k=a+"→"+b; if(seen.has(k)) continue; seen.add(k);
    // 边状态 = 源节点状态（聚合后取较好状态？这里直接用源的 mastered/unlocked）
    out.push({from:a,to:b,kind:"prereq",level:lv});
  }
  return out;
}

// =========================================================================
// 渲染：按当前 level
// =========================================================================
function bezier(s,t,lv){
  const x1=s.x, y1=s.y-NH[lv]/2, x2=t.x, y2=t.y+NH[lv]/2;
  const my=(y1+y2)/2;
  return `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`;
}
function edgeStateClass(e){
  const f=id2[e.from];
  return f?.mastered ? "mast" : (f?.unlocked ? "unl" : "lock");
}
function cssEsc(s){return (s||"").replace(/([.\\:#\[\]@\!])/g,'\\$1')}
function childCountAtL2(node){
  // 数该节点（L0/L1）下挂多少 L2
  if(node.level===2) return 0;
  let n=0;
  for(const x of nodesByLevel[2]){
    let cur=x; while(cur && cur.parent_id){
      if(cur.parent_id===node.id){n++; break}
      cur=id2[cur.parent_id];
    }
  }
  return n;
}
function renderLevel(lv){
  if(rendering) return;
  rendering=true;
  currentLevel=lv;
  document.getElementById("lvl").textContent=`L${lv} ${lv===0?'章':lv===1?'节':'知识点'}`;
  g.selectAll("*").remove();
  const nodes=nodesByLevel[lv].filter(n=>n.x!=null);
  const edges=edgesByLevel[lv];
  // 边
  g.selectAll(".edge").data(edges).enter().append("path")
    .attr("class",e=>"edge "+edgeStateClass(e))
    .attr("data-from",e=>e.from).attr("data-to",e=>e.to)
    .attr("d",e=>{const s=id2[e.from],t=id2[e.to];return s&&t?bezier(s,t,lv):""})
    .attr("marker-end",e=>`url(#arr-${edgeStateClass(e)})`);
  // 节点
  const w=NW[lv], h=NH[lv];
  const tile=g.selectAll(".tile").data(nodes).enter().append("g")
    .attr("class",d=>`tile l${lv} ${stateOf(d)}`)
    .attr("data-id",d=>d.id)
    .attr("transform",d=>`translate(${d.x-w/2},${d.y-h/2})`)
    .on("click",(_,d)=>nodeClick(d));
  tile.append("rect").attr("width",w).attr("height",h).attr("rx",lv===0?12:lv===1?9:7).attr("ry",lv===0?12:lv===1?9:7);
  // 文字
  if(lv===0){
    tile.append("text").attr("class","tname").attr("font-size",14).attr("x",w/2).attr("y",h/2-6).text(d=>d.name);
    tile.append("text").attr("class","tsub").attr("font-size",10).attr("x",w/2).attr("y",h/2+10).text(d=>d.chapter_label||"");
    tile.append("text").attr("class","tcount").attr("font-size",10).attr("x",w/2).attr("y",h/2+22).text(d=>`${childCountAtL2(d)} 知识点`);
  }else if(lv===1){
    tile.append("text").attr("class","tname").attr("font-size",12).attr("x",w/2).attr("y",h/2-2)
      .text(d=>{const n=d.name; return n.length>11?n.slice(0,11)+"…":n});
    tile.append("text").attr("class","tsub").attr("font-size",9).attr("x",w/2).attr("y",h/2+11)
      .text(d=>`${d.section_label||""} · ${childCountAtL2(d)} 知识点`);
  }else{
    tile.append("text").attr("class","tname").attr("font-size",11).attr("x",w/2).attr("y",h/2-2)
      .text(d=>{const n=d.name; return n.length>11?n.slice(0,11)+"…":n});
    tile.append("text").attr("class","tsub").attr("font-size",9).attr("x",w/2).attr("y",h/2+10)
      .text(d=>d.numeric_label||d.type||"");
  }
  reapplyHighlight();
  rendering=false;
}

// =========================================================================
// 缩放联动 LOD（带滞回）
// =========================================================================
function onZoom(ev){
  g.attr("transform",ev.transform);
  const k=ev.transform.k;
  let want=currentLevel;
  if(currentLevel===0){
    if(k > K_L0_L1+HYST) want=1;
  }else if(currentLevel===1){
    if(k < K_L0_L1-HYST) want=0;
    else if(k > K_L1_L2+HYST) want=2;
  }else{
    if(k < K_L1_L2-HYST) want=1;
  }
  if(want!==currentLevel) renderLevel(want);
}

// =========================================================================
// 点击：L0/L1 钻取（动画缩放到目标层）；L2 聚焦
// =========================================================================
function nodeClick(n){
  if(n.level<2){
    // 钻取：缩放使其 L1 / L2 子节点正好填屏
    const kids = nodesByLevel[n.level+1].filter(x=>x.parent_id===n.id && x.x!=null);
    if(!kids.length){showDetail(n); return}
    zoomToFit(kids, 0.78);
    setTimeout(()=>showDetail(n),200);
  }else{
    focusOn(n.id);
  }
}
function ancestorsTransitive(rootId){
  const out=new Set([rootId]);
  const stack=[rootId];
  while(stack.length){
    const cur=stack.pop();
    for(const e of edgesByLevel[2]){
      if(e.to===cur && !out.has(e.from)){out.add(e.from); stack.push(e.from)}
    }
  }
  return out;
}
function ancestorsKHops(rootId, K){
  const out=new Set([rootId]);
  let fr=new Set([rootId]);
  for(let h=0;h<K;h++){
    const nx=new Set();
    for(const e of edgesByLevel[2]){
      if(fr.has(e.to) && !out.has(e.from)){out.add(e.from); nx.add(e.from)}
    }
    if(!nx.size) break;
    fr=nx;
  }
  return out;
}
function focusOn(id){
  focusId=id;
  const allAnc=ancestorsTransitive(id);
  const nearAnc=ancestorsKHops(id, FOCUS_HOPS);
  // 强制切到 L2（聚焦只在 L2 有意义）
  if(currentLevel!==2){
    const target=[...nearAnc].map(a=>id2[a]).filter(Boolean);
    zoomToFit(target, 0.82);   // 缩放会触发 onZoom → renderLevel(2)，然后下面再 reapplyHighlight
    setTimeout(()=>{reapplyHighlight(); showDetail(id2[id])}, 800);
    return;
  }
  reapplyHighlight();
  zoomToFit([...nearAnc].map(a=>id2[a]).filter(Boolean), 0.82);
  showDetail(id2[id]);
}
function reapplyHighlight(){
  if(focusId==null || currentLevel!==2){
    g.selectAll(".tile").classed("dim",false).classed("hi",false).classed("focus",false);
    g.selectAll(".edge").classed("dim",false).classed("hi",false);
    return;
  }
  const allAnc=ancestorsTransitive(focusId);
  g.selectAll(".tile").classed("dim",true).classed("hi",false).classed("focus",false);
  g.selectAll(".edge").classed("dim",true).classed("hi",false);
  for(const aid of allAnc){
    d3.select(`.tile[data-id="${cssEsc(aid)}"]`).classed("dim",false).classed("hi",true);
  }
  d3.select(`.tile[data-id="${cssEsc(focusId)}"]`).classed("focus",true).classed("hi",false);
  for(const e of edgesByLevel[2]){
    if(allAnc.has(e.from) && allAnc.has(e.to)){
      d3.select(`.edge[data-from="${cssEsc(e.from)}"][data-to="${cssEsc(e.to)}"]`)
        .classed("dim",false).classed("hi",true);
    }
  }
}
function clearFocus(){
  focusId=null;
  reapplyHighlight();
  closeDetail();
}
function resetView(){
  const nodes=nodesByLevel[currentLevel].filter(n=>n.x!=null);
  if(!nodes.length) return;
  zoomToFit(nodes, 0.92);
}
function zoomToFit(nodes, padFactor){
  if(!nodes.length) return;
  const xs=nodes.map(n=>n.x), ys=nodes.map(n=>n.y);
  const dx=Math.max(...xs)-Math.min(...xs) || NW[currentLevel]*2;
  const dy=Math.max(...ys)-Math.min(...ys) || NH[currentLevel]*2;
  const minX=Math.min(...xs), minY=Math.min(...ys);
  const wv=W()-380, hv=H();
  const k=Math.min(wv/(dx+NW[currentLevel]*2), hv/(dy+NH[currentLevel]*4)) * (padFactor||0.85);
  const kc=Math.max(0.05, Math.min(2.5, k));
  const tx=wv/2 - kc*(minX+dx/2);
  const ty=hv/2 - kc*(minY+dy/2);
  svg.transition().duration(750)
    .call(zoom.transform, d3.zoomIdentity.translate(tx,ty).scale(kc));
}

// detail
// =========================================================================
function obsidianUrl(noteRef){
  if(!noteRef) return "";
  let p=noteRef.replace(/\\/g,"/"); if(p.toLowerCase().endsWith(".md")) p=p.slice(0,-3);
  return "obsidian://open?vault="+encodeURIComponent(VAULT)+"&file="+encodeURIComponent(p);
}
function showDetail(n){
  if(!n) return;
  document.getElementById("detail").classList.add("open");
  document.getElementById("d-name").textContent=n.name;
  const st=stateOf(n);
  const sLabel={mastered:"已掌握",unlocked:"已解锁",locked:"未解锁"}[st];
  const sBadge={mastered:"b-mast",unlocked:"b-unl",locked:"b-lock"}[st];
  const badges=[`<span class="badge ${sBadge}">${sLabel}</span>`];
  if(n.level<2){
    badges.push(`<span class="badge b-type">L${n.level} ${n.level===0?'章':'节'}</span>`);
    badges.push(`<span class="badge b-type">${childCountAtL2(n)} 知识点</span>`);
  }else{
    if(n.type) badges.push(`<span class="badge b-type">${n.type}</span>`);
    if(typeof n.mastery==="number") badges.push(`<span class="badge b-type">掌握 ${(n.mastery*100).toFixed(0)}%</span>`);
  }
  document.getElementById("d-badges").innerHTML=badges.join("");
  document.getElementById("d-label").textContent=[n.numeric_label||"", n.type||""].filter(Boolean).join(" · ")
    || (n.level===0?n.chapter_label:n.section_label)||"—";
  document.getElementById("d-summary").innerHTML=n.summary?marked.parse(n.summary):"—";
  const chain=[]; let cur=id2[n.parent_id]; while(cur){chain.unshift(cur.name); cur=id2[cur.parent_id]}
  const pageStr=(n.pages||[]).join(", ")||"—";
  document.getElementById("d-path").innerHTML=`p.${pageStr}<br><small style="color:#6b7488">${chain.join(" › ")||"（顶层）"}</small>`;
  const link=[];
  if(n.note_ref){ link.push(`<a href="${obsidianUrl(n.note_ref)}">📝 ${n.note_ref}</a>`); }
  if(n.card_refs && n.card_refs.length){
    link.push(`🎴 ${n.card_refs.length} 张 Anki 卡`);
  }
  document.getElementById("d-link").innerHTML=link.join("<br>")||"—";
  // 前置/后续 — 仅 L2 有
  function fillList(elId, dir){
    const ul=document.getElementById(elId); ul.innerHTML="";
    if(n.level!==2){const li=document.createElement("li"); li.style.cursor="default"; li.style.color="#5a6680"; li.textContent="（聚合视图：钻入到知识点层级才能看）"; ul.appendChild(li); return}
    let count=0;
    for(const e of edgesByLevel[2]) if(e[dir==="prereq"?"to":"from"]===n.id){
      const other=id2[e[dir==="prereq"?"from":"to"]]; if(!other) continue;
      const li=document.createElement("li");
      const arrow=dir==="prereq"?"←":"→";
      const stO=stateOf(other);
      const stEmoji={mastered:"🟢",unlocked:"🟡",locked:"⚫"}[stO];
      li.innerHTML=`${stEmoji} ${arrow} <b>${other.name}</b>${e.evidence?'<br><small style="color:#6b7488">'+e.evidence+'</small>':''}`;
      li.onclick=()=>focusOn(other.id);
      ul.appendChild(li); count++;
    }
    if(!count){const li=document.createElement("li"); li.style.cursor="default"; li.style.color="#5a6680"; li.textContent="（无）"; ul.appendChild(li)}
  }
  fillList("d-prereqs","prereq");
  fillList("d-unlocks","unlock");
}
function closeDetail(){document.getElementById("detail").classList.remove("open")}
document.addEventListener("keydown",e=>{ if(e.key==="Escape") clearFocus() });
window.addEventListener("resize",()=>{
  if(focusId) focusOn(focusId);
  else resetView();
});
