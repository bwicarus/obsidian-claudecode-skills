<!doctype html>
<html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ book }} · 技能树</title>
<script src="//bwicarus.taile44d0c.ts.net/static/qa/marked.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;background:#0a0e1a;color:#e6e6f0;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
#bar{background:linear-gradient(180deg,#141a2b,#0e1320);border-bottom:1px solid #2a3550;padding:9px 14px;display:flex;align-items:center;gap:8px;flex-shrink:0;z-index:10;flex-wrap:wrap}
#bar h1{font-size:14px;font-weight:700;letter-spacing:.04em;color:#9ec3ff;margin-right:6px}
#bar .meta{font-size:11px;color:#8a9bb4}
#bar button{background:#1a2540;color:#9ec3ff;border:1px solid #2a3550;border-radius:6px;padding:5px 11px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
#bar button:hover{background:#27345a}
#bar button:disabled{opacity:.4;cursor:default}
#bar button.danger{background:#4a1a1a;border-color:#7a2828;color:#ffb4b4}
#bar button.danger:hover{background:#5e2424}
#bar button.on{background:#244470;border-color:#3b6db5;color:#fff}
#crumb{font-size:12px;color:#cfe6ff;font-weight:500;padding:0 4px}
#crumb .sep{color:#5a6680;margin:0 4px}
#search{background:#0d1322;border:1px solid #2a3550;color:#e6e6f0;border-radius:6px;padding:5px 10px;font-size:12px;width:180px;outline:none}
#search:focus{border-color:#3b6db5}
#legend{margin-left:auto;display:flex;gap:12px;font-size:10px;color:#8a9bb4}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle;box-shadow:0 0 6px currentColor}
#viz{flex:1;position:relative;overflow:hidden;background-color:#0a0e1a;background-image:
  radial-gradient(ellipse at center,rgba(40,60,120,.16) 0%,transparent 60%),
  linear-gradient(rgba(60,80,140,.05) 1px,transparent 1px),
  linear-gradient(90deg,rgba(60,80,140,.05) 1px,transparent 1px);
  background-size:100% 100%, 40px 40px, 40px 40px}
#canvas-wrap{position:absolute;inset:0;overflow:auto;padding:20px;padding-right:380px}
#canvas-wrap::-webkit-scrollbar{width:10px;height:10px}
#canvas-wrap::-webkit-scrollbar-thumb{background:#2a3550;border-radius:5px}
svg.canvas{display:block}
/* 节点 */
.tile{cursor:pointer}
/* 瓶颈节点角标 💎（bottleneck_score >= 阈值时显示）*/
.tile text.bottleneck-mark{display:none;font-size:12px;pointer-events:none;user-select:none}
.tile.is-bottleneck text.bottleneck-mark{display:block}
/* hover/长按 tooltip */
#node-tooltip{position:fixed;display:none;z-index:30;background:#0d1322;border:1.5px solid #3b6db5;border-radius:8px;padding:10px 12px;max-width:340px;font-size:13px;line-height:1.5;color:#cfd6e6;box-shadow:0 8px 24px rgba(0,0,0,.6);pointer-events:none}
#node-tooltip.show{display:block}
#node-tooltip .ttl{font-weight:700;color:#e6e6f0;font-size:14px;margin-bottom:4px}
#node-tooltip .meta{font-size:10px;color:#8a9bb4;margin-bottom:6px;letter-spacing:.5px}
#node-tooltip .sum{color:#a0aec0;font-size:12px}
/* 推断掌握（mastery 由后续节点反向传递）：节点边框叠加双层虚线 + 右上角小标记 ↓ */
.tile.inferred rect.tbox{stroke-dasharray:5 2 1 2}
.tile.inferred text.inferred-mark{display:block}
.tile text.inferred-mark{display:none;font-size:10px;font-weight:700;fill:currentColor;opacity:.62;pointer-events:none;user-select:none}
.tile rect.tbox{transition:filter .15s, stroke-width .15s}
.tile:hover rect.tbox{filter:brightness(1.4)}
.tile text.tname{font-weight:600;fill:currentColor;text-anchor:middle;pointer-events:none;user-select:none}
.tile text.tsub{fill:#7a8497;text-anchor:middle;pointer-events:none;user-select:none}
.tile text.tcount{fill:#7dc4ff;text-anchor:middle;pointer-events:none;user-select:none;font-weight:600}
/* mastery 四态：边框颜色清晰可见，无发光。让状态一眼可辨。*/
.tile.mastered rect.tbox{stroke:#34d399;stroke-width:1.8;fill:#0e2118}
.tile.mastered{color:#7be096}
.tile.unlockable rect.tbox{stroke:#60a5fa;stroke-width:1.8;fill:#0e1a2e}
.tile.unlockable{color:#a8cdff}
.tile.previewable rect.tbox{stroke:#7889a3;stroke-width:1.5;fill:#141a28}
.tile.previewable{color:#9aa9c3}
.tile.locked rect.tbox{stroke:#3a4456;stroke-width:1.2;fill:#0e131e;stroke-dasharray:3 3}
.tile.locked{color:#6f7888}
.tile.locked text.tname{opacity:.65}
.tile.focus rect.tbox{stroke:#7dc4ff;stroke-width:4;fill:#0c1a30;filter:drop-shadow(0 0 22px #7dc4ffcc);stroke-dasharray:none}
.tile.focus{color:#cfe6ff}
/* === Factorio davemcw chain mode：focus 视图节点链路高亮 === */
.tile.chain-fade{opacity:.13;transition:opacity .25s}
.tile.chain-anc rect.tbox{stroke:#a5c8ff !important;stroke-width:3.5 !important;fill:#0a1530 !important;filter:drop-shadow(0 0 14px #60a5faaa) !important;stroke-dasharray:none !important}
.tile.chain-anc{color:#d0e1ff}
.tile.chain-desc rect.tbox{stroke:#c084fc !important;stroke-width:2.6 !important;fill:#1c1233 !important;filter:drop-shadow(0 0 10px #c084fc88) !important;stroke-dasharray:none !important}
.tile.chain-desc{color:#dcc5ff}
/* 直接后续但未解锁：显示但灰色虚线（区别于紫色高亮 + 区别于 fade 隐形）*/
.tile.chain-desc-locked{opacity:.55}
.tile.chain-desc-locked rect.tbox{stroke:#5a6478 !important;stroke-width:1.5 !important;fill:#141926 !important;stroke-dasharray:4 3 !important;filter:none !important}
.tile.chain-desc-locked{color:#8a96ad}
.tile.chain-self{opacity:1}
.tile.chain-self rect.tbox{stroke:#fde047 !important;stroke-width:5 !important;fill:#231a08 !important;filter:drop-shadow(0 0 28px #fde047cc) !important}
.tile.chain-self{color:#fef3c7}
/* 边：上游链蓝、下游链紫、无关淡化 */
.edge.chain-edge-fade{opacity:.08 !important;transition:opacity .25s}
.edge.chain-edge-anc{stroke:#60a5fa !important;opacity:.95 !important;stroke-dasharray:none !important}
.edge.chain-edge-desc{stroke:#c084fc !important;opacity:.95 !important;stroke-dasharray:none !important}
.edge.chain-edge-desc-locked{stroke:#5a6478 !important;opacity:.6 !important;stroke-dasharray:4 3 !important}
.tile.search-hit rect.tbox{stroke:#ff79c6 !important;stroke-width:3 !important;filter:drop-shadow(0 0 12px #ff79c6cc) !important}
.tile.filter-out{opacity:.18}
/* 章节用位置（章带+侧色线）编码，节点不再叠章色条 */
.tile rect.chap-bar{display:none}
.tile rect.mastery-bar{display:none}
/* 章带不用大矩形背景，改成屏幕两侧 4px 竖色线 + 左侧章名贴边 */
rect.chap-side{rx:2;ry:2;pointer-events:none}
text.chap-band-label{
  font-weight:800;
  letter-spacing:3px;
  pointer-events:none;
  user-select:none;
  filter:drop-shadow(0 0 5px currentColor) drop-shadow(0 2px 4px rgba(0,0,0,.65));
}
/* 未开放章节折叠条 */
g.locked-bar{cursor:pointer}
g.locked-bar rect.locked-bar-rect{fill:#171c28;stroke:#262d3c;stroke-width:1}
g.locked-bar:hover rect.locked-bar-rect{fill:#1d2334;stroke:#3a4456}
g.locked-bar text.locked-bar-label{fill:#6f7888;font-size:12px;letter-spacing:.5px;pointer-events:none;user-select:none}
g.locked-bar:hover text.locked-bar-label{fill:#9aa9c3}
/* 边 */
.edge{fill:none;stroke-linecap:round}
.edge.mast{stroke:#34d399aa}
.edge.unl{stroke:#fbbf24aa}
.edge.prev{stroke:#7283a5aa;stroke-dasharray:5 4}
.edge.lock{stroke:#3e4a64aa;stroke-dasharray:4 3;opacity:.6}
/* detail：整面板按 mastery 状态着色（背景渐变 + 顶部色带 + 左边框）*/
#detail{position:absolute;right:0;top:0;bottom:0;width:360px;background:linear-gradient(180deg,#10162a,#0a0e1a);border-left:4px solid #2a3550;padding:18px 20px 24px;overflow-y:auto;transform:translateX(100%);transition:transform .22s ease,border-left-color .25s,background .25s;font-size:13px;line-height:1.6;z-index:5}
#detail.open{transform:translateX(0);box-shadow:-12px 0 32px rgba(0,0,0,.5)}
/* 顶部色带（伪元素，宽度撑满，高度 6px）*/
#detail::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:#2a3550;transition:background .25s}
/* 4 种 mastery 状态主题 */
#detail.theme-mastered{border-left-color:#34d399;background:linear-gradient(180deg,#0e2a1d 0%,#0a0e1a 35%)}
#detail.theme-mastered::before{background:#34d399}
#detail.theme-unlockable{border-left-color:#60a5fa;background:linear-gradient(180deg,#0e1f33 0%,#0a0e1a 35%)}
#detail.theme-unlockable::before{background:#60a5fa}
#detail.theme-previewable{border-left-color:#7889a3;background:linear-gradient(180deg,#161c2a 0%,#0a0e1a 35%)}
#detail.theme-previewable::before{background:#7889a3}
#detail.theme-locked{border-left-color:#3a4456;background:linear-gradient(180deg,#0e131e 0%,#0a0e1a 35%)}
#detail.theme-locked::before{background:#3a4456}

#detail h2{font-size:17px;margin-bottom:10px;color:#e6e6f0;margin-top:6px}
#detail .lbl{color:#8a9bb4;font-size:10px;margin-top:14px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
#detail .v{margin-top:4px;color:#cfd6e6;word-break:break-all}
#detail a{color:#7dc4ff;text-decoration:none}
#detail a:hover{text-decoration:underline}
#detail-close{position:absolute;top:14px;right:14px;background:rgba(0,0,0,0.35);border:1px solid #2a3550;width:32px;height:32px;border-radius:50%;color:#cfd6e6;font-size:18px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center}
#detail-close:hover{background:#1f2740;border-color:#5b6889;color:#fff}

.badge{display:inline-block;padding:5px 12px;border-radius:14px;font-size:12px;margin-right:6px;margin-bottom:4px;font-weight:700}
.b-mast{background:#10412a;color:#7be096;box-shadow:inset 0 0 0 1.5px #34d399}
.b-unl{background:#0e2342;color:#a8cdff;box-shadow:inset 0 0 0 1.5px #60a5fa}
.b-prev{background:#1a2235;color:#b8c4d8;box-shadow:inset 0 0 0 1.5px #7889a3}
.b-lock{background:#1f2530;color:#8a9bb4;box-shadow:inset 0 0 0 1px #4a5568}
.b-type{background:#142540;color:#9ec3ff;box-shadow:inset 0 0 0 1px #3b6db5}

/* 页码 chip 放大：触屏友好，最小点击区 36×28 */
.page-pair{display:inline-flex;align-items:center;gap:1px;margin:4px 6px 4px 0;vertical-align:middle}
.page-link{display:inline-flex;align-items:center;min-height:30px;padding:5px 14px;background:#1a2540;color:#a8cdff;border:1.5px solid #3b6db5;border-right:none;border-radius:8px 0 0 8px;text-decoration:none;font-size:14px;font-family:monospace;font-weight:600;letter-spacing:0.3px}
.page-link:hover{background:#2c3e6a;color:#cfe6ff;border-color:#60a5fa}
.page-link:active{background:#1f3055}
.page-link-web{display:inline-flex;align-items:center;min-height:30px;padding:5px 10px;background:#172033;color:#9aa9c3;border:1.5px solid #3b6db5;border-radius:0 8px 8px 0;text-decoration:none;font-size:14px;line-height:1}
.page-link-web:hover{background:#2c3e6a;color:#fff;border-color:#60a5fa}
.page-link-web:active{background:#1f3055}
.b-chap{font-size:10px;padding:2px 8px}
#detail .prereqs li{margin:5px 0;padding:7px 10px;background:#0d1322;border:1px solid #1f2740;border-radius:6px;cursor:pointer;list-style:none;font-size:12px}
#detail .prereqs li:hover{background:#162045;border-color:#3b6db5}
/* modals */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:20}
.mask.open{display:flex}
.modal{background:#10162a;border:1px solid #2a3550;border-radius:10px;padding:20px 22px;width:420px;max-width:90vw;max-height:80vh;overflow-y:auto}
.modal h3{font-size:15px;margin-bottom:12px;color:#9ec3ff}
.modal label{display:block;font-size:11px;color:#9aa4b2;margin-bottom:4px;margin-top:8px}
.modal input[type=text],.modal textarea,.modal select{width:100%;background:#0d1322;border:1px solid #2a3550;color:#e6e6f0;border-radius:6px;padding:7px 10px;font-size:13px;font-family:inherit;outline:none}
.modal input[type=range]{width:100%;margin:6px 0}
.modal textarea{resize:vertical;min-height:60px}
.modal .row{margin:10px 0}
.modal .preview-strip{height:6px;background:#1a2540;border-radius:3px;margin-top:8px;position:relative}
.modal .preview-strip span{position:absolute;top:0;left:0;height:100%;background:#7dc4ff;border-radius:3px}
.modal .val{color:#cfe6ff;font-weight:600;font-size:13px;margin-left:6px}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.foot button{padding:7px 16px;border-radius:6px;border:1px solid #2a3550;background:#1a2540;color:#cfe6ff;cursor:pointer;font-size:13px}
.foot .primary{background:#244470;border-color:#3b6db5;color:#fff}
.foot .danger{background:#4a1a1a;border-color:#7a2828;color:#ffb4b4}
.reco-item{padding:9px 11px;background:#0d1322;border:1px solid #1f2740;border-radius:6px;margin-bottom:6px;cursor:pointer;font-size:12px}
.reco-item:hover{background:#162045;border-color:#3b6db5}
.reco-item .top{display:flex;justify-content:space-between;color:#cfe6ff}
.reco-item .sub{color:#8a9bb4;font-size:11px;margin-top:3px}
</style></head>
<body>
<div id="bar">
  <h1>{{ book }} · 技能树</h1>
  <button id="back-btn" onclick="goBack()" title="返回上一级（Esc/Backspace）">◀</button>
  <span id="crumb">全部章</span>
  <input id="search" type="text" placeholder="🔍 搜索节点（Enter 跳转）"
         oninput="onSearchInput(event)" onkeydown="if(event.key==='Enter') onSearchEnter()">
  <button onclick="openRecommend()" title="今日学习计划：下一步 / 瓶颈 / 章节进度">🎯 学习计划</button>
  <button id="edit-toggle" onclick="toggleEditMode()" title="编辑模式（点节点改前置/删节点/合并）">✏️ 编辑</button>
  <button onclick="openSettings()">⚙ 设置</button>
  <span class="meta" id="meta">加载中…</span>
  <div id="legend">
    <span><span class="dot" style="background:#34d399;color:#34d399"></span>已掌握</span>
    <span><span class="dot" style="background:#60a5fa;color:#60a5fa"></span>可学</span>
    <span><span class="dot" style="background:#4a5468;color:#4a5468"></span>未解锁</span>
  </div>
</div>
<div id="node-tooltip"></div>
<div id="viz">
  <div id="canvas-wrap">
    <svg class="canvas"><defs>
      <marker id="arr-mast" viewBox="0 -5 10 10" refX="9" refY="0" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,-4L9,0L0,4" fill="#34d399"/></marker>
      <marker id="arr-unl" viewBox="0 -5 10 10" refX="9" refY="0" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,-4L9,0L0,4" fill="#fbbf24"/></marker>
      <marker id="arr-prev" viewBox="0 -5 10 10" refX="9" refY="0" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,-4L9,0L0,4" fill="#7283a5"/></marker>
      <marker id="arr-lock" viewBox="0 -5 10 10" refX="9" refY="0" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,-4L9,0L0,4" fill="#3e4a64"/></marker>
    </defs></svg>
  </div>
  <aside id="detail">
    <button id="detail-close" onclick="closeDetail()">✕</button>
    <h2 id="d-name">—</h2>
    <div id="d-badges"></div>
    <div class="lbl">编号 · 类型</div><div class="v" id="d-label">—</div>
    <div class="lbl">描述</div><div class="v" id="d-summary">—</div>
    <div class="lbl">页码 · 路径</div><div class="v" id="d-path">—</div>
    <div class="lbl">关联</div><div class="v" id="d-link">—</div>
    <div class="lbl">前置（点跳）</div><ul class="prereqs" id="d-prereqs"></ul>
    <div class="lbl">后续</div><ul class="prereqs" id="d-unlocks"></ul>
    <div id="edit-actions" style="display:none;margin-top:14px;border-top:1px solid #2a3550;padding-top:12px">
      <div class="lbl">编辑动作</div>
      <button class="foot" style="display:block;width:100%;margin-top:6px;padding:7px 0;background:#1a2540;border:1px solid #2a3550;color:#cfe6ff;border-radius:6px;cursor:pointer" onclick="editAddPrereqDlg()">＋ 添加前置</button>
      <button class="foot" style="display:block;width:100%;margin-top:6px;padding:7px 0;background:#1a2540;border:1px solid #2a3550;color:#cfe6ff;border-radius:6px;cursor:pointer" onclick="editMergeDlg()">⇆ 合并到其它节点</button>
      <button class="foot" style="display:block;width:100%;margin-top:6px;padding:7px 0;background:#4a1a1a;border:1px solid #7a2828;color:#ffb4b4;border-radius:6px;cursor:pointer" onclick="editDeleteNode()">🗑 删除此节点</button>
      <div class="lbl" style="margin-top:14px">编辑描述</div>
      <textarea id="edit-summary" rows="3" style="width:100%;background:#0d1322;border:1px solid #2a3550;color:#e6e6f0;border-radius:6px;padding:7px 10px;font-size:12px;font-family:inherit"></textarea>
      <button onclick="editSaveSummary()" style="margin-top:6px;padding:6px 14px;background:#244470;border:1px solid #3b6db5;color:#fff;border-radius:6px;cursor:pointer;font-size:12px">保存描述</button>
    </div>
  </aside>
</div>

<!-- 设置 -->
<div id="sett-mask" class="mask" onclick="if(event.target===this) closeSettings()">
  <div class="modal">
    <h3>显示设置</h3>
    <div class="row">
      <label>方块宽度（占页面宽的比例）<span class="val" id="sett-val">12%</span></label>
      <input type="range" id="sett-ratio" min="5" max="30" step="1">
      <div class="preview-strip"><span id="sett-bar"></span></div>
    </div>
    <div class="row">
      <label style="display:flex;align-items:center;gap:10px;cursor:pointer">
        <input type="checkbox" id="sett-zoom" style="width:16px;height:16px;cursor:pointer">
        <span>启用双指缩放（Ctrl+滚轮 或 触屏双指）</span>
      </label>
    </div>
    <div class="row">
      <label style="display:flex;align-items:center;gap:10px;cursor:pointer">
        <input type="checkbox" id="sett-fit" style="width:16px;height:16px;cursor:pointer">
        <span>宽自适应（详情面板打开时画布按剩余宽度重排）</span>
      </label>
    </div>
    <p style="font-size:11px;color:#8a9bb4;line-height:1.5">方块固定按上方比例渲染；缩放只影响视图大小不改 layout；宽自适应让画布跟着详情面板挤压重新排版。</p>
    <div class="foot">
      <button onclick="closeSettings()">取消</button>
      <button class="primary" onclick="applySettings()">应用</button>
    </div>
  </div>
</div>

<!-- 推荐 -->
<div id="reco-mask" class="mask" onclick="if(event.target===this) closeRecommend()">
  <div class="modal">
    <h3>🎯 下一步该学什么</h3>
    <p style="font-size:11px;color:#8a9bb4;margin-bottom:10px">已解锁但还没掌握的知识点，按"开启下游最多"排序——优先攻克这些能解锁最多后续内容。</p>
    <div id="reco-list"></div>
    <div class="foot"><button onclick="closeRecommend()">关闭</button></div>
  </div>
</div>

<!-- 编辑：选目标节点 -->
<div id="pick-mask" class="mask" onclick="if(event.target===this) closePick()">
  <div class="modal">
    <h3 id="pick-title">选择目标节点</h3>
    <input id="pick-q" type="text" placeholder="🔍 搜索（name / 编号 / summary）" oninput="renderPickList()">
    <div id="pick-list" style="max-height:50vh;overflow-y:auto;margin-top:10px"></div>
    <div class="foot"><button onclick="closePick()">取消</button></div>
  </div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const BOOK="{{ book }}";
const VAULT="Obsidian Vault";
const SETT_KEY="skilltree_settings_"+BOOK;
function loadSettings(){
  const defaults={blockRatio:0.12, enableZoom:false, fitToWidth:true};
  try{ return Object.assign(defaults, JSON.parse(localStorage.getItem(SETT_KEY)||"{}")); }
  catch(_){ return defaults; }
}
function saveSettings(s){ try{ localStorage.setItem(SETT_KEY, JSON.stringify(s)); }catch(_){} }
let settings=loadSettings();
let canvasZoom=1;          // 当前缩放倍率（仅 enableZoom 时生效）
let baseSvgW=0, baseSvgH=0; // layout 后的原始尺寸，applyZoom 时乘倍率

let KG=null, id2={};
let nodesByLevel={0:[],1:[],2:[]};
let edgesByLevel={0:[],1:[],2:[]};
let depthByLevel={0:{},1:{},2:{}};   // 全局每层 depth（同节点跨视图同一 y）
let chapterColor={};                   // L0 id → HSL color
let descendants={};                    // L2 id → 传递后继数（决定边粗）
let current={kind:"home"};
let backDepth=0;   // 已通过 pushState 推入的层数；用来决定 ◀ 是否可用
let showLockedSection=false;  // home 视图：未开放章节是否展开
let editMode=false;

const wrap=document.getElementById("canvas-wrap");
const svg=d3.select("svg.canvas");
const root=svg.append("g").attr("class","root");
// 分层渲染：边永远在节点下面（DOM 顺序 = SVG z-order，先加入的在下）
root.append("g").attr("class","layer-bands");   // 章带 + 侧色线 + 章名（最底）
root.append("g").attr("class","layer-edges");   // 连接线
root.append("g").attr("class","layer-tiles");   // 节点（最上，永远盖在边上）
root.append("g").attr("class","layer-overlay"); // locked 折叠条等覆盖层

// ============================================================
// 加载 + 准备
// ============================================================
fetch(`/skilltree/${BOOK}/data.json`).then(r=>r.json()).then(d=>{
  KG=d; id2=Object.fromEntries(KG.nodes.map(n=>[n.id,n]));
  nodesByLevel={0:[],1:[],2:[]};
  for(const n of KG.nodes){(nodesByLevel[n.level]=nodesByLevel[n.level]||[]).push(n)}
  buildAggregatedEdges();
  computeGlobalDepth();
  computeChapterColors();
  computeDescendants();
  document.getElementById("meta").textContent=
    `${nodesByLevel[0].length} 章 · ${nodesByLevel[1].length} 节 · ${nodesByLevel[2].length} 知识点 · ${edgesByLevel[2].length} 边`;
  // 从 URL hash 恢复初始视图，并 replaceState 作为"根状态"（防 ◀ 退出站点）
  const h=location.hash.startsWith("#")?location.hash.slice(1):"";
  current=decodeView(h);
  history.replaceState({view:current, depth:0}, "", location.pathname+(h?"#"+h:""));
  backDepth=0;
  updateWrapPadding();
  updateNav(); render();
  // 章节倒序后第 1 章在底；初始滚到最下端，先看到基础概念
  requestAnimationFrame(() => {
    setTimeout(() => { wrap.scrollTop = wrap.scrollHeight; }, 50);
  });
});

// 缩放：Ctrl+滚轮（桌面） + 双指（触屏）
wrap.addEventListener("wheel", e=>{
  if(!settings.enableZoom || !e.ctrlKey) return;
  e.preventDefault();
  const delta = -e.deltaY * 0.0015;
  canvasZoom = Math.max(0.4, Math.min(2.5, canvasZoom * (1+delta)));
  applyZoomState();
}, { passive:false });
let _touchStartDist=0, _touchStartZoom=1;
wrap.addEventListener("touchstart", e=>{
  if(!settings.enableZoom || e.touches.length!==2) return;
  _touchStartDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  _touchStartZoom = canvasZoom;
}, { passive:true });
wrap.addEventListener("touchmove", e=>{
  if(!settings.enableZoom || e.touches.length!==2) return;
  e.preventDefault();
  const dist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  if(_touchStartDist>0){
    canvasZoom = Math.max(0.4, Math.min(2.5, _touchStartZoom * (dist/_touchStartDist)));
    applyZoomState();
  }
}, { passive:false });

// 浏览器后退/前进
window.addEventListener("popstate",ev=>{
  const st=ev.state||{};
  current = st.view || decodeView((location.hash||"").replace(/^#/,""));
  backDepth = typeof st.depth==="number" ? st.depth : 0;
  updateNav(); render();
});

function ancestorAtLevel(nid,lv){let c=id2[nid];while(c&&c.level>lv)c=id2[c.parent_id];return c&&c.level===lv?c.id:null}
function buildAggregatedEdges(){
  edgesByLevel[2]=(KG.edges||[]).filter(e=>e.kind==="prereq"&&id2[e.from]?.level===2&&id2[e.to]?.level===2);
  for(const lv of [1,0]){
    const seen=new Set(); const out=[];
    for(const e of edgesByLevel[2]){
      const a=ancestorAtLevel(e.from,lv), b=ancestorAtLevel(e.to,lv);
      if(!a||!b||a===b) continue;
      const k=a+"→"+b; if(seen.has(k)) continue; seen.add(k);
      out.push({from:a,to:b,kind:"prereq",level:lv});
    }
    edgesByLevel[lv]=out;
  }
}
function computeGlobalDepth(){
  for(const lv of [0,1,2]){
    const nodes=nodesByLevel[lv]; const edges=edgesByLevel[lv];
    const inE={}; for(const n of nodes) inE[n.id]=[];
    for(const e of edges) if(inE[e.to]) inE[e.to].push(e.from);
    const d={}; for(const n of nodes) d[n.id]=0;
    let ch=true,it=0;
    while(ch&&it++<nodes.length+2){
      ch=false;
      for(const n of nodes){
        const v=inE[n.id].length?Math.max(...inE[n.id].map(s=>(d[s]??0)+1)):0;
        if(v!==d[n.id]){d[n.id]=v;ch=true}
      }
    }
    depthByLevel[lv]=d;
  }
}
function computeChapterColors(){
  const l0=nodesByLevel[0];
  l0.forEach((n,i)=>{
    const h=Math.round((i/Math.max(1,l0.length))*360);
    chapterColor[n.id]=`hsl(${h},60%,55%)`;
  });
}
function computeDescendants(){
  // L2 id → 传递后继数（含自己）
  const adj={}; for(const e of edgesByLevel[2]){(adj[e.from]=adj[e.from]||[]).push(e.to)}
  for(const n of nodesByLevel[2]){
    const seen=new Set([n.id]); const stack=[n.id];
    while(stack.length){const c=stack.pop(); for(const x of (adj[c]||[])){if(!seen.has(x)){seen.add(x);stack.push(x)}}}
    descendants[n.id]=seen.size-1;
  }
}
function chapOf(node){
  let c=node; while(c&&c.parent_id){if(id2[c.parent_id]?.level===0)return c.parent_id;c=id2[c.parent_id]}
  return node.level===0?node.id:null;
}
// 三态：mastered / unlockable / locked。previewable 旧数据归并到 locked。
function stateOf(n){
  if(n.state === "previewable") return "locked";   // 兼容旧数据：可瞟 → 未解锁
  if(n.state) return n.state;
  if(n.mastered) return "mastered";
  if(n.unlocked) return "unlockable";
  return "locked";
}

// ============================================================
// URL hash 同步
// ============================================================
function encodeView(v){
  if(v.kind==="home") return "";
  return v.kind+":"+v.id;
}
function decodeView(s){
  if(!s) return {kind:"home"};
  const [k,...rest]=s.split(":"); const id=rest.join(":");
  if(["chapter","section","focus"].includes(k) && id2[id]) return {kind:k, id};
  return {kind:"home"};
}
// （syncHash / restoreFromHash 已被 pushState / popstate 取代）

// ============================================================
// 导航（用浏览器 history 管栈，避免自维护栈跟 hash 不同步）
// ============================================================
function sameView(a,b){ return a && b && a.kind===b.kind && a.id===b.id; }
function pushView(v){
  if(sameView(v,current)){ render(); return; }   // 同视图不入栈，避免"按 ◀ 没反应"
  // focus → focus 是切换焦点（同一面板换内容），不入栈
  const isFocusSwap = (current.kind==="focus" && v.kind==="focus");
  current=v;
  if(isFocusSwap){
    history.replaceState({view:current, depth:backDepth}, "", "#"+encodeView(current));
  } else {
    backDepth++;
    history.pushState({view:current, depth:backDepth}, "", "#"+encodeView(current));
  }
  updateNav(); render();
}
function goBack(){
  if(backDepth>0){ history.back(); return; }   // 浏览器有我们推入的栈 → 弹一帧
  if(current.kind!=="home"){
    // 深链/刷新场景：浏览器栈空但不在 home。回 home 并用 replaceState 同步 URL。
    current={kind:"home"};
    history.replaceState({view:current, depth:0}, "", location.pathname);
    updateNav(); render();
  }
}
function updateNav(){
  // ◀ 仅当已经在 home 且浏览器栈也空时才 disabled
  document.getElementById("back-btn").disabled = (backDepth===0 && current.kind==="home");
  const c=current; let label="全部章";
  if(c.kind==="chapter"){
    const n=id2[c.id]; label=`章：${n?.name||c.id}`;
  }else if(c.kind==="section"){
    const sec=id2[c.id]; const chap=sec?id2[sec.parent_id]:null;
    label=`${chap?chap.name+' › ':''}${sec?sec.name:c.id}`;
  }else if(c.kind==="focus"){
    label=`聚焦：${id2[c.id]?.name||c.id}`;
  }
  document.getElementById("crumb").textContent=label;
}

// ============================================================
// 视图 → 节点 + 边
// 整体视图（home）和 focus 模式都渲染全部 L2 + 全部边。
// focus 模式只是在 render 时给 chain 节点加 class 凸显，无关节点透明，
// 不裁剪也不重新布局——位置 1:1 跟 home 一致。
// ============================================================
function nodesForView(){
  if(current.kind==="home" || current.kind==="focus")
    return {nodes:nodesByLevel[2].slice(), edges:edgesByLevel[2].slice(), level:2};
  // 保留中间层级（兼容旧 URL hash 直链），不再从 UI 进入
  if(current.kind==="chapter"){
    const subs=nodesByLevel[1].filter(n=>n.parent_id===current.id);
    const ids=new Set(subs.map(n=>n.id));
    return {nodes:subs, edges:edgesByLevel[1].filter(e=>ids.has(e.from)&&ids.has(e.to)), level:1};
  }
  if(current.kind==="section"){
    const subs=nodesByLevel[2].filter(n=>n.parent_id===current.id);
    const ids=new Set(subs.map(n=>n.id));
    return {nodes:subs, edges:edgesByLevel[2].filter(e=>ids.has(e.from)&&ids.has(e.to)), level:2};
  }
  return {nodes:[], edges:[], level:0};
}
function ancestorsTransitive(rootId){
  const out=new Set([rootId]); const stack=[rootId];
  while(stack.length){
    const cur=stack.pop();
    for(const e of edgesByLevel[2]){
      if(e.to===cur && !out.has(e.from)){out.add(e.from); stack.push(e.from)}
    }
  }
  return out;
}
function directSuccessors(rootId){
  // 只一跳：节点本身能立即解锁的后续技能（前置边 from=rootId 的 to 集合）
  const out = new Set();
  for(const e of edgesByLevel[2]){
    if(e.from === rootId) out.add(e.to);
  }
  return out;
}
// focus 模式的 chain 角色集合：
//   ancestors 递归全部（学懂这个需要懂的全部上游）
//   descendants 只直接后续（学懂后能立即开始的下一步技能，符合解锁语义）
let chainAncestors=new Set(), chainDescendants=new Set();
function computeChainSets(focusId){
  chainAncestors = focusId ? ancestorsTransitive(focusId) : new Set();
  chainDescendants = focusId ? directSuccessors(focusId) : new Set();
  if(focusId){ chainAncestors.delete(focusId); }   // direct successors 本就不含 focus
}
function chainRoleNode(n, focusId){
  if(!focusId) return "";
  if(n.id===focusId) return "self";
  if(chainAncestors.has(n.id)) return "anc";
  if(chainDescendants.has(n.id)){
    // 直接后续：locked 显示但灰色（还没解锁但能看到），其它紫色高亮
    return stateOf(n) === "locked" ? "desc-locked" : "desc";
  }
  return "fade";
}
function chainRoleEdge(e, focusId){
  if(!focusId) return "";
  const f=e.from, t=e.to;
  if((f===focusId || chainAncestors.has(f)) && (t===focusId || chainAncestors.has(t))) return "anc";
  if(f===focusId && chainDescendants.has(t)){
    // 焦点 → direct successor 边：根据 successor 是否解锁决定颜色
    return stateOf(id2[t]) === "locked" ? "desc-locked" : "desc";
  }
  return "fade";
}

// ============================================================
// 渲染（带过渡动画）
// ============================================================
function render(){
  let {nodes, edges, level}=nodesForView();
  // focus 模式预计算 chain 角色集合
  const focusedId = current.kind==="focus"?current.id:null;
  const isFocusMode = !!focusedId;
  computeChainSets(focusedId);
  // CSS 切换：focus 模式时 svg root 加 class .focus-mode
  svg.node().parentNode.classList.toggle("focus-mode", isFocusMode);
  // 同步 wrap padding-right（详情面板挤压宽度）
  updateWrapPadding();
  // W = wrap 可视区减去实际 padding（详情面板挤压时 padding-right=380）
  const cs = getComputedStyle(wrap);
  const padL = parseFloat(cs.paddingLeft)  || 20;
  const padR = parseFloat(cs.paddingRight) || 20;
  const W = Math.max(280, wrap.clientWidth - padL - padR);
  const blockW = Math.max(70, Math.floor(W * settings.blockRatio));
  const blockH = Math.max(34, Math.floor(blockW * (level===0?0.45:level===1?0.36:0.32)));
  const gapX = Math.max(14, Math.floor(blockW * 0.18));
  const gapY = Math.max(46, Math.floor(blockH * 1.7));

  const d=depthByLevel[level];
  const cols=Math.max(1, Math.floor(W/(blockW+gapX)));
  const positions={};
  let chapBands=[];
  let curY;

  // ====== home / focus 共用：全部 L2 按章节带上下叠放（Factorio davemcw 风）======
  // 章节顺序：第 9 章在顶，第 1 章在底（基础在底、高级在顶）；页面初始滚到底
  // focus 模式：chain 无关行折叠不占空间（保留 chain 内节点透明度对比）
  if(current.kind==="home" || current.kind==="focus"){
    // 章节倒序：最后一章在顶
    const activeChaps = nodesByLevel[0].filter(ch => stateOf(ch) !== "locked").slice().reverse();
    const lockedChaps = nodesByLevel[0].filter(ch => stateOf(ch) === "locked").slice().reverse();
    // 按章分组 L2
    const chapL2={};
    for(const n of nodes){
      const ch=chapOf(n); if(!ch) continue;
      (chapL2[ch]=chapL2[ch]||[]).push(n);
    }
    // focus 模式：chain 集合（self + ancestor + descendant），用来判断行是否有相关节点
    const chainSet = isFocusMode
      ? new Set([focusedId, ...chainAncestors, ...chainDescendants])
      : null;
    curY=24;
    const labelH=22, bandPadY=10;
    function placeBand(ch){
      const chNodes = chapL2[ch.id] || [];
      if(!chNodes.length) return;
      const byDepth={};
      for(const n of chNodes)(byDepth[d[n.id]||0]=byDepth[d[n.id]||0]||[]).push(n);
      for(const dp in byDepth){
        byDepth[dp].sort((a,b)=>
          (a.numeric_label||"").localeCompare(b.numeric_label||"") ||
          a.name.localeCompare(b.name));
      }
      // focus 模式：整章都无 chain 节点 → 整章带跳过
      if(isFocusMode){
        const anyInChain = chNodes.some(n => chainSet.has(n.id));
        if(!anyInChain){
          chNodes.forEach(n => { positions[n.id]={x:-9999, y:0}; });
          return;
        }
      }
      const bandStartY = curY;
      let bandInnerY = curY + labelH + bandPadY;
      const depths = Object.keys(byDepth).map(Number).sort((a,b)=>b-a);
      let placedAny = false;
      for(const dp of depths){
        const row=byDepth[dp];
        // focus 模式：本行没有 chain 节点 → 折叠（节点屏外）
        if(isFocusMode){
          const rowHasChain = row.some(n => chainSet.has(n.id));
          if(!rowHasChain){
            row.forEach(n => { positions[n.id]={x:-9999, y:0}; });
            continue;
          }
        }
        const subRows=Math.ceil(row.length/cols);
        const wTotal=Math.min(row.length,cols)*(blockW+gapX)-gapX;
        const xStart=Math.max(40,(W-wTotal)/2);
        row.forEach((n,i)=>{
          const sr=Math.floor(i/cols), col=i%cols;
          positions[n.id]={x:xStart+col*(blockW+gapX)+blockW/2,
                           y:bandInnerY+sr*(blockH+gapY*0.4)+blockH/2};
        });
        bandInnerY += subRows*(blockH+gapY*0.4) + gapY*0.22;
        placedAny = true;
      }
      if(!placedAny) return;   // 整章无行被画（不该发生但保险）
      const bandH = bandInnerY - bandStartY + bandPadY - gapY*0.22;
      chapBands.push({id:ch.id, name:ch.name, label:ch.chapter_label,
                      y:bandStartY, h:bandH, color:chapterColor[ch.id]});
      curY = bandStartY + bandH + gapY*0.45;
    }
    activeChaps.forEach(placeBand);
    // locked 章节折叠条（放在所有 active 章下方，最底部）
    if(lockedChaps.length){
      const barH=36;
      window.__lockedBarRect={y:curY+4, h:barH, count:lockedChaps.length};
      curY += barH + 16;
      if(showLockedSection){
        lockedChaps.forEach(placeBand);
      } else {
        for(const ch of lockedChaps){
          const ns = chapL2[ch.id]||[];
          ns.forEach(n => { positions[n.id]={x:-9999, y:0}; });
        }
      }
    } else {
      window.__lockedBarRect=null;
    }
  } else {
    // ====== chapter / section 中间视图：按 depth 分行 ======
    const byDepth={};
    for(const n of nodes)(byDepth[d[n.id]||0]=byDepth[d[n.id]||0]||[]).push(n);
    const visibleDepths=[...new Set(nodes.map(n=>d[n.id]||0))];
    const maxD=visibleDepths.length?Math.max(...visibleDepths):0;
    for(const dp in byDepth){
      byDepth[dp].sort((a,b)=>
        (a.numeric_label||"").localeCompare(b.numeric_label||"") || a.name.localeCompare(b.name));
    }
    curY=20;
    for(let dp=maxD; dp>=0; dp--){
      const row=byDepth[dp]||[];
      if(!row.length) continue;
      const subRows=Math.ceil(row.length/cols);
      const wTotal=Math.min(row.length,cols)*(blockW+gapX)-gapX;
      const xStart=Math.max(20,(W-wTotal)/2);
      row.forEach((n,i)=>{
        const sr=Math.floor(i/cols), col=i%cols;
        positions[n.id]={x:xStart+col*(blockW+gapX)+blockW/2, y:curY+sr*(blockH+gapY*0.4)+blockH/2};
      });
      curY += subRows*(blockH+gapY*0.4) + gapY*0.5;
    }
  }
  // 折叠的 locked 章节节点位置=屏外，把它们和相关边从渲染集中剔除
  // （避免出现"指向屏幕左侧的孤儿边"）
  const offScreen = new Set();
  for(const id in positions){
    if(positions[id].x < -1000) offScreen.add(id);
  }
  if(offScreen.size){
    nodes = nodes.filter(n => !offScreen.has(n.id));
    edges = edges.filter(e => !offScreen.has(e.from) && !offScreen.has(e.to));
  }
  const svgW=Math.max(W, cols*(blockW+gapX));
  const svgH=Math.max(wrap.clientHeight-40, curY+40);
  baseSvgW=svgW; baseSvgH=svgH;
  svg.attr("width",svgW*canvasZoom).attr("height",svgH*canvasZoom);
  if(settings.enableZoom) root.attr("transform", `scale(${canvasZoom})`);
  else root.attr("transform", null);

  // 章带：屏幕两侧 4px 竖色线 + 左侧贴边章名（章名所在段色线断开）
  root.selectAll("rect.chap-band").remove();
  const bandsG = root.select("g.layer-bands");
  const edgesG = root.select("g.layer-edges");
  const tilesG = root.select("g.layer-tiles");
  const overlayG = root.select("g.layer-overlay");
  // 把每个章带的左侧色线拆成「字上方」「字下方」两段（字所在的中段断开）
  const labelCharH = 18;   // 每字旋转后占的纵向高度（含字距，跟 font-size 15 + letter-spacing 3 对齐）
  const labelPad = 6;
  const sideLSegments = chapBands.flatMap(b => {
    const txt = (b.label?b.label+" ":"") + b.name;
    const textH = Math.min(b.h - 16, txt.length * labelCharH);
    const yMid = b.y + b.h/2;
    const gapTop = yMid - textH/2 - labelPad;
    const gapBot = yMid + textH/2 + labelPad;
    return [
      { id: b.id+"-l-top", y: b.y, h: Math.max(0, gapTop - b.y), color: b.color },
      { id: b.id+"-l-bot", y: gapBot, h: Math.max(0, b.y + b.h - gapBot), color: b.color },
    ].filter(s => s.h > 1);
  });
  // 右侧不影响文字，整条色线
  const sideRSegments = chapBands.map(b => ({id: b.id+"-r", y: b.y, h: b.h, color: b.color}));

  // 左侧分段色线
  const sideLSel = bandsG.selectAll("rect.chap-side-l").data(sideLSegments, s=>s.id);
  sideLSel.exit().transition().duration(220).style("opacity",0).remove();
  const sideLEnter = sideLSel.enter().insert("rect",":first-child").attr("class","chap-side chap-side-l")
    .style("opacity",0);
  sideLEnter.merge(sideLSel).transition().duration(380)
    .attr("x",6).attr("width",4)
    .attr("y",s=>s.y).attr("height",s=>s.h)
    .attr("fill",s=>s.color)
    .style("opacity",0.9);
  // 右侧色线
  const sideRSel = bandsG.selectAll("rect.chap-side-r").data(sideRSegments, s=>s.id);
  sideRSel.exit().transition().duration(220).style("opacity",0).remove();
  const sideREnter = sideRSel.enter().insert("rect",":first-child").attr("class","chap-side chap-side-r")
    .style("opacity",0);
  sideREnter.merge(sideRSel).transition().duration(380)
    .attr("x",svgW-10).attr("width",4)
    .attr("y",s=>s.y).attr("height",s=>s.h)
    .attr("fill",s=>s.color)
    .style("opacity",0.9);
  // 章名标签：竖排紧贴左侧色线，加粗 + 发光阴影
  const labSel = bandsG.selectAll("text.chap-band-label").data(chapBands, b=>b.id);
  labSel.exit().transition().duration(220).style("opacity",0).remove();
  const labEnter = labSel.enter().append("text").attr("class","chap-band-label")
    .style("opacity",0);
  labEnter.merge(labSel).transition().duration(380)
    .attr("x", 16)                          // 紧贴左侧色线（色线 x=6,width=4）
    .attr("y", b=>b.y + b.h/2)              // 章带垂直中央
    .attr("text-anchor","middle")
    .attr("font-size", 15)
    .attr("fill", b=>b.color)
    .attr("transform", b=>`rotate(-90, 16, ${b.y + b.h/2})`)
    .text(b=>(b.label?b.label+" ":"")+b.name)
    .style("opacity", 1);

  // 未开放章节折叠条（仅 home 视图有）
  const showBar = (current.kind==="home") && window.__lockedBarRect;
  const barData = showBar ? [window.__lockedBarRect] : [];
  const barSel = overlayG.selectAll("g.locked-bar").data(barData);
  barSel.exit().transition().duration(220).style("opacity",0).remove();
  const barEnter = barSel.enter().append("g").attr("class","locked-bar")
    .style("opacity",0)
    .on("click", ()=>{ showLockedSection = !showLockedSection; render(); });
  barEnter.append("rect").attr("class","locked-bar-rect")
    .attr("x",20).attr("rx",8).attr("ry",8);
  barEnter.append("text").attr("class","locked-bar-label")
    .attr("text-anchor","middle").attr("dominant-baseline","middle");
  const barAll = barEnter.merge(barSel);
  barAll.transition().duration(380).style("opacity",1);
  barAll.select("rect.locked-bar-rect")
    .attr("y", b=>b.y).attr("width", W-40).attr("height", b=>b.h);
  barAll.select("text.locked-bar-label")
    .attr("x", W/2).attr("y", b=>b.y+b.h/2)
    .text(b=>`${showLockedSection?"▾":"▸"}  ${b.count} 章未开放（${showLockedSection?"点击折叠":"点击展开"}）`);

  // 边（key by from→to）
  const edgeKey=e=>e.from+"→"+e.to;
  const edgeSel=edgesG.selectAll("path.edge").data(edges, edgeKey);
  edgeSel.exit().transition().duration(280).style("opacity",0).remove();
  const edgeEnter=edgeSel.enter().append("path").attr("class",e=>"edge "+edgeClass(e))
    .attr("data-from",e=>e.from).attr("data-to",e=>e.to)
    .style("opacity",0);
  edgeSel.merge(edgeEnter).transition().duration(380)
    .attr("d",e=>{const s=positions[e.from],t=positions[e.to];if(!s||!t) return "";
      const y1=s.y-blockH/2, y2=t.y+blockH/2, my=(y1+y2)/2;
      return `M${s.x},${y1} C${s.x},${my} ${t.x},${my} ${t.x},${y2}`;})
    .attr("class",e=>"edge "+edgeClass(e))
    .attr("stroke-width",e=>edgeWidthFor(e))
    .style("opacity",1);

  // 节点（key by id），动画 transform
  const tileSel=tilesG.selectAll("g.tile").data(nodes, d=>d.id);
  tileSel.exit().transition().duration(220).style("opacity",0).remove();
  const tileEnter=tileSel.enter().append("g")
    .attr("class",d=>tileClass(d,focusedId))
    .attr("data-id",d=>d.id)
    .attr("transform",d=>{const p=positions[d.id]; return `translate(${p.x-blockW/2},${p.y-blockH/2})`})
    .style("opacity",0)
    .on("click",(_,d)=>nodeClick(d))
    .on("mouseenter",(ev,d)=>scheduleTooltip(ev,d))
    .on("mouseleave",hideTooltip)
    .on("mousemove",moveTooltip)
    .on("touchstart",(ev,d)=>scheduleTooltip(ev,d,1000))
    .on("touchend",hideTooltip)
    .on("touchmove",hideTooltip);
  // 内容（仅 enter 时创建结构；update 时只更新文字/位置）
  tileEnter.append("rect").attr("class","tbox").attr("width",blockW).attr("height",blockH)
    .attr("rx",level===0?12:level===1?9:7).attr("ry",level===0?12:level===1?9:7);
  tileEnter.append("rect").attr("class","chap-bar").attr("x",0).attr("y",0).attr("height",4)
    .attr("width",blockW).attr("rx",2).attr("ry",2);
  tileEnter.append("rect").attr("class","mastery-bar").attr("x",0).attr("height",3)
    .attr("rx",1.5).attr("ry",1.5);
  tileEnter.append("title");  // hover 完整名
  tileEnter.append("text").attr("class","tname");
  tileEnter.append("text").attr("class","tsub");
  tileEnter.append("text").attr("class","tcount");
  tileEnter.append("text").attr("class","inferred-mark").text("↓");
  tileEnter.append("text").attr("class","bottleneck-mark").text("💎");

  // 更新所有节点（含 enter）：先合并再设置内容
  const tileAll=tileEnter.merge(tileSel);
  tileAll.attr("class",d=>tileClass(d,focusedId));
  // 章色条
  tileAll.select("rect.tbox").attr("width",blockW).attr("height",blockH);
  tileAll.select("rect.chap-bar")
    .attr("width",blockW)
    .attr("fill",d=>{const c=chapOf(d); return c?chapterColor[c]:"#3b6db5"});
  tileAll.select("rect.mastery-bar")
    .attr("width",blockW).attr("y",blockH-3);
  // tooltip
  tileAll.select("title").text(d=>{
    const sum=(d.summary||"").replace(/\$\$?[^$]+\$\$?/g,"…");
    return `${d.name}\n${d.numeric_label?'['+d.numeric_label+'] ':''}${sum}`;
  });
  // 字号
  const fontMain=Math.max(10, Math.floor(blockW*0.10));
  const fontSub =Math.max(9 , Math.floor(blockW*0.075));
  tileAll.select("text.tname").attr("font-size",fontMain).attr("x",blockW/2).attr("y",blockH/2-(level===0?6:2))
    .text(d=>truncate(d.name,blockW,fontMain));
  tileAll.select("text.tsub").attr("font-size",fontSub).attr("x",blockW/2).attr("y",blockH/2+fontSub+(level===0?4:4))
    .text(d=>{
      if(d.level===0) return d.chapter_label||"";
      if(d.level===1) return `${d.section_label||""} · ${countL2Under(d)}`;
      return d.numeric_label||d.type||"";
    });
  tileAll.select("text.tcount").attr("font-size",fontSub).attr("x",blockW/2).attr("y",blockH/2+fontSub*2+8)
    .text(d=>d.level===0?`${countL2Under(d)} 知识点`:"");
  // 推断掌握标记：右上角小 ↓
  tileAll.select("text.inferred-mark")
    .attr("x", blockW-8).attr("y", 12);
  // 瓶颈标记：左上角 💎
  tileAll.select("text.bottleneck-mark")
    .attr("x", 8).attr("y", 14);

  // 位置过渡（update 时滑动）
  tileAll.transition().duration(420)
    .attr("transform",d=>{const p=positions[d.id]; return `translate(${p.x-blockW/2},${p.y-blockH/2})`})
    .style("opacity",1);

  // 滚动到焦点
  if(focusedId){
    const p=positions[focusedId];
    if(p) wrap.scrollTo({left:Math.max(0,p.x-wrap.clientWidth/2), top:Math.max(0,p.y-wrap.clientHeight/2), behavior:"smooth"});
    showDetail(id2[focusedId]);
  }
  // 搜索高亮
  applySearchHighlight();
}

let _ttTimer = null;
function scheduleTooltip(ev, d, delay){
  if(_ttTimer) clearTimeout(_ttTimer);
  delay = delay || 500;
  _ttTimer = setTimeout(()=>showTooltip(ev, d), delay);
}
function showTooltip(ev, d){
  const tt = document.getElementById("node-tooltip");
  const typeZh = {definition:'定义', theorem:'定理', proposition:'命题',
                  corollary:'推论', lemma:'引理', example:'例子'};
  const pg = (d.pages || []).length ? `· p.${d.pages[0]}` : "";
  const tyz = d.type ? typeZh[d.type] || d.type : "";
  const meta = [d.numeric_label, tyz, pg].filter(Boolean).join(" · ");
  tt.innerHTML = `<div class="ttl">${d.name||"?"}</div>
    <div class="meta">${meta}</div>
    <div class="sum">${(d.summary||"（无摘要）").replace(/</g,"&lt;")}</div>`;
  tt.classList.add("show");
  moveTooltip(ev);
}
function moveTooltip(ev){
  const tt = document.getElementById("node-tooltip");
  if(!tt.classList.contains("show")) return;
  // 用第一个 touch 或鼠标坐标
  const x = ev.touches ? ev.touches[0].clientX : ev.clientX;
  const y = ev.touches ? ev.touches[0].clientY : ev.clientY;
  if(x == null || y == null) return;
  const ttW = tt.offsetWidth, ttH = tt.offsetHeight;
  const vw = window.innerWidth, vh = window.innerHeight;
  let nx = x + 14, ny = y + 14;
  if(nx + ttW > vw - 8) nx = x - ttW - 14;
  if(ny + ttH > vh - 8) ny = y - ttH - 14;
  tt.style.left = Math.max(8, nx) + "px";
  tt.style.top = Math.max(8, ny) + "px";
}
function hideTooltip(){
  if(_ttTimer){ clearTimeout(_ttTimer); _ttTimer = null; }
  document.getElementById("node-tooltip").classList.remove("show");
}

function tileClass(d, focusedId){
  const role = chainRoleNode(d, focusedId);
  const inferred = d.mastery_inferred ? ' inferred' : '';
  // 瓶颈：score >= 2 算高价值（解锁 ≥2 个 locked 后续）
  const bottleneck = (d.bottleneck_score || 0) >= 2 ? ' is-bottleneck' : '';
  return `tile ${stateOf(d)}${d.id===focusedId?' focus':''}${role?' chain-'+role:''}${inferred}${bottleneck}`;
}
function edgeBaseClass(e){
  // 仅返回 "mast"/"unl"/"prev"/"lock"，供 marker-end 的 #arr-* 用
  const f=id2[e.from]; if(!f) return "lock";
  const s=stateOf(f);
  return s==="mastered"?"mast":(s==="unlockable"?"unl":(s==="previewable"?"prev":"lock"));
}
function edgeClass(e){
  const base = edgeBaseClass(e);
  const focusedId = current.kind==="focus"?current.id:null;
  const role = chainRoleEdge(e, focusedId);
  return role ? `${base} chain-edge-${role}` : base;
}
function edgeWidthFor(e){
  // 边权重 = 源节点的后继数（更基础的前置=更粗）
  if(current.kind==="home"||current.kind==="chapter"){
    // 聚合视图：用源的子代 L2 后继数之和的粗估
    return 1.5;
  }
  const d=descendants[e.from]||0;
  return 1.2 + Math.min(3.5, Math.log2(1+d)*0.7);
}
function truncate(s,w,fontSize){
  const maxChars=Math.max(4, Math.floor((w-12)/(fontSize*0.95)));
  return s.length>maxChars ? s.slice(0,maxChars-1)+"…" : s;
}
function countL2Under(node){
  if(node.level===2) return 0;
  let n=0;
  for(const x of nodesByLevel[2]){
    let c=x; while(c&&c.parent_id){if(c.parent_id===node.id){n++;break} c=id2[c.parent_id]}
  }
  return n;
}
function nodeClick(n){
  if(editMode){ showDetail(n); return; }   // 编辑模式：只显详情面板（含编辑按钮）
  if(n.level===0) pushView({kind:"chapter", id:n.id});
  else if(n.level===1) pushView({kind:"section", id:n.id});
  else pushView({kind:"focus", id:n.id});
}

function onSearchInput(ev){
  applySearchHighlight();
}
function onSearchEnter(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  if(!q) return;
  const hit=KG.nodes.find(n=>matchNode(n,q));
  if(hit){
    if(hit.level===0) pushView({kind:"chapter",id:hit.id});
    else if(hit.level===1) pushView({kind:"section",id:hit.id});
    else pushView({kind:"focus",id:hit.id});
    document.getElementById("search").blur();
  }
}
function matchNode(n,q){
  const s=(n.name+" "+(n.numeric_label||"")+" "+(n.summary||"")).toLowerCase();
  return s.includes(q);
}
function applySearchHighlight(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  root.selectAll(".tile").classed("filter-out",false).classed("search-hit",false);
  if(!q) return;
  root.selectAll(".tile").classed("filter-out",true);
  root.selectAll(".tile").filter(d=>matchNode(d,q))
    .classed("filter-out",false).classed("search-hit",true);
}

// 🎯 学习计划：今日复习 + 下一步新节点 + 瓶颈 + 本章进度
// ============================================================
function openRecommend(){
  const firstPage = n => (n.pages && n.pages.length) ? n.pages[0] : 999999;
  const all = nodesByLevel[2];
  const mastered = all.filter(n => stateOf(n) === "mastered");
  const unlockable = all.filter(n => stateOf(n) === "unlockable");
  const locked = all.filter(n => stateOf(n) === "locked");
  // 下一步：按页码升序的 unlockable 前 6 个
  const nextNew = [...unlockable].sort((a,b) => firstPage(a) - firstPage(b)).slice(0, 6);
  // 瓶颈：bottleneck_score 最高的 5 个
  const bottlenecks = [...all].filter(n => (n.bottleneck_score || 0) >= 2)
    .sort((a,b) => (b.bottleneck_score||0) - (a.bottleneck_score||0)).slice(0, 5);
  // 本章进度：按章统计
  const chapStats = nodesByLevel[0].map(ch => {
    const inChap = all.filter(n => chapOf(n) === ch.id);
    return {
      ch, total: inChap.length,
      mast: inChap.filter(n => stateOf(n) === "mastered").length,
      unl:  inChap.filter(n => stateOf(n) === "unlockable").length,
    };
  }).filter(c => c.mast > 0 || c.unl > 0);

  const list = document.getElementById("reco-list");
  const renderNode = (n, tagText, tagColor) => {
    const sec  = id2[n.parent_id], chap = sec ? id2[sec.parent_id] : null;
    const lbl  = n.numeric_label ? `[${n.numeric_label}] ` : "";
    const path = `${chap?chap.name+' › ':''}${sec?sec.name:''}`;
    const pg   = (n.pages || []).length ? `p.${n.pages[0]}` : "—";
    const score = n.bottleneck_score ? ` 💎×${n.bottleneck_score}` : "";
    return `<div class="reco-item" onclick="document.getElementById('reco-mask').classList.remove('open'); pushView({kind:'focus',id:'${n.id}'})">
        <div class="top">
          <span><span style="color:${tagColor};margin-right:6px;font-size:10px">[${tagText}]</span>${lbl}<b>${n.name}</b>${score}</span>
          <span style="color:#60a5fa;font-family:monospace">${pg}</span>
        </div>
        <div class="sub">${path}</div>
      </div>`;
  };
  const sec = (lbl, items, renderItem, emptyMsg) => {
    if(!items || !items.length){
      return `<div style="margin:10px 0 6px"><b style="color:#e6e6f0">${lbl}</b><div style="opacity:0.5;font-size:11px;margin-top:4px">${emptyMsg||'（无）'}</div></div>`;
    }
    return `<div style="margin:10px 0 6px"><b style="color:#e6e6f0">${lbl}</b></div>${items.map(renderItem).join("")}`;
  };
  // 概览顶部条
  const total = all.length;
  const pctMast = total ? Math.round(mastered.length/total*100) : 0;
  const overview = `<div style="display:flex;gap:14px;font-size:12px;color:#cfd6e6;margin-bottom:8px;padding:8px 10px;background:#0d1322;border-radius:6px">
    <span>🟢 已掌握 <b style="color:#7be096">${mastered.length}</b></span>
    <span>🟡 可学 <b style="color:#a8cdff">${unlockable.length}</b></span>
    <span>⚫ 未解锁 <b style="color:#6f7888">${locked.length}</b></span>
    <span style="margin-left:auto">总进度 <b style="color:#fbbf24">${pctMast}%</b></span>
  </div>`;
  const chapHtml = chapStats.slice(0, 5).map(c => {
    const pct = c.total ? Math.round(c.mast / c.total * 100) : 0;
    const barW = Math.max(2, pct);
    return `<div style="margin:4px 0;font-size:11px;color:#cfd6e6">
      <div style="display:flex;justify-content:space-between"><span>${c.ch.name}</span>
        <span style="color:#8a9bb4">${c.mast}/${c.total} · ${pct}%</span></div>
      <div style="height:4px;background:#1a2030;border-radius:2px;margin-top:2px;overflow:hidden">
        <div style="height:100%;width:${barW}%;background:linear-gradient(90deg,#34d399,#60a5fa)"></div>
      </div></div>`;
  }).join("");
  list.innerHTML = overview
    + sec("📍 下一步（按教材页码）", nextNew, n => renderNode(n, "可学", "#a8cdff"),
          "暂无可学节点——建笔记/刷卡来开启新节点")
    + sec("💎 瓶颈节点（攻克可大量解锁）", bottlenecks, n => renderNode(n, stateOf(n) === "unlockable" ? "可学" : "未解锁", stateOf(n) === "unlockable" ? "#a8cdff" : "#6f7888"),
          "目前没有显著瓶颈")
    + (chapStats.length ? `<div style="margin:10px 0 4px"><b style="color:#e6e6f0">📊 章节进度</b></div>${chapHtml}` : "");
  document.getElementById("reco-mask").classList.add("open");
}

async function editPost(op, payload){
  const r=await fetch(`/skilltree/${BOOK}/api/edit`,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(Object.assign({op},payload))
  });
  const j=await r.json();
  if(!j.ok){ alert("失败："+(j.error||j.info||"未知")); return false; }
  // 重新拉数据
  const d=await (await fetch(`/skilltree/${BOOK}/data.json`)).json();
  KG=d; id2=Object.fromEntries(KG.nodes.map(n=>[n.id,n]));
  nodesByLevel={0:[],1:[],2:[]};
  for(const n of KG.nodes){(nodesByLevel[n.level]=nodesByLevel[n.level]||[]).push(n)}
  buildAggregatedEdges(); computeGlobalDepth(); computeChapterColors(); computeDescendants();
  // 当前 view 节点可能消失（删除/合并），自动后退到 home 如失效
  if(current.id && !id2[current.id]){ current={kind:"home"}; backDepth=0; updateNav(); }
  render();
  return true;
}

  if(!editingNode) return;
  if(!confirm(`删除节点「${editingNode.name}」？相关边也会一并删除。不可撤销。`)) return;
  await editPost("delete_node",{id:editingNode.id});
}

let pickMode=null;   // "addPrereq" | "merge"
function editAddPrereqDlg(){ if(!editingNode||editingNode.level!==2)return alert("仅 L2 节点可编辑前置"); pickMode="addPrereq"; document.getElementById("pick-title").textContent=`为「${editingNode.name}」添加前置`; document.getElementById("pick-q").value=""; renderPickList(); document.getElementById("pick-mask").classList.add("open"); }
function editMergeDlg(){ if(!editingNode)return; pickMode="merge"; document.getElementById("pick-title").textContent=`把「${editingNode.name}」合并到…`; document.getElementById("pick-q").value=""; renderPickList(); document.getElementById("pick-mask").classList.add("open"); }
function closePick(){document.getElementById("pick-mask").classList.remove("open")}
function renderPickList(){
  const q=document.getElementById("pick-q").value.trim().toLowerCase();
  let candidates=nodesByLevel[editingNode.level].filter(n=>n.id!==editingNode.id);
  if(q) candidates=candidates.filter(n=>matchNode(n,q));
  candidates=candidates.slice(0,80);
  const list=document.getElementById("pick-list");
  list.innerHTML=candidates.map(n=>{
    const lbl=n.numeric_label?`[${n.numeric_label}] `:"";
    return `<div class="reco-item" onclick="pickConfirm('${n.id}')">${lbl}<b>${n.name}</b><div class="sub">${n.summary||""}</div></div>`;
  }).join("") || '<p style="color:#8a9bb4">无匹配</p>';
}
async function pickConfirm(targetId){
  closePick();
  if(!editingNode||!id2[targetId]) return;
  if(pickMode==="addPrereq"){
    await editPost("add_edge",{from:targetId, to:editingNode.id, evidence:"手动添加"});
  }else if(pickMode==="merge"){
    if(!confirm(`合并「${editingNode.name}」到「${id2[targetId].name}」？「${editingNode.name}」将被删除。`)) return;
    await editPost("merge",{canonical:targetId, drop:[editingNode.id]});
  }
}

    if(!d.ok){
      alert("创建失败: " + (d.error || "未知错误"));
      if(btn){ btn.disabled = false; btn.textContent = "📝 从 PDF 创建笔记"; btn.style.opacity = "1"; }
      return;
    }
    alert(`✓ 笔记已创建：${d.note_path}\n含 ${d.covered_node_ids.length} 个知识点的 PDF 嵌入区域。\n打开 Obsidian 编辑。`);
    // 重新加载 KG 数据
    const newD = await (await fetch(`/skilltree/${BOOK}/data.json`)).json();
    KG = newD;
    id2 = Object.fromEntries(KG.nodes.map(n=>[n.id,n]));
    nodesByLevel={0:[],1:[],2:[]};
    for(const n of KG.nodes){(nodesByLevel[n.level]=nodesByLevel[n.level]||[]).push(n)}
    buildAggregatedEdges();
    computeGlobalDepth();
    computeChapterColors();
    computeDescendants();
    render();
    showDetail(id2[nodeId]);
  }catch(ex){
    alert("创建失败: " + ex.message);
    if(btn){ btn.disabled = false; btn.textContent = "📝 从 PDF 创建笔记"; btn.style.opacity = "1"; }
  }
}

function newNodeNoteUrl(n){
  // 单 L2 节点笔记
  const numLabel = n.numeric_label || "";
  const fileName = `${_randHex3()}-${_safeFileName(n.name)}`;
  const book = KG && KG.book ? KG.book : "教材";
  const tyz = TYPE_ZH[n.type] || n.type || "";
  const sec = id2[n.parent_id], chap = sec ? id2[sec.parent_id] : null;
  const path = `${chap?chap.name:''} › ${sec?sec.name:''}`;
  const pages = (n.pages || []).join(", ");
  const content = `---
subject: 数学
type: ${tyz}
source: ${book} ${numLabel}
pages: ${pages}
chapter: ${chap?chap.name:''}
section: ${sec?sec.name:''}
kg_node_ids: [${n.id}]
---

# ${n.name}

${tyz?'**类型**：' + tyz + '\n':''}**编号**：${numLabel}  **所在**：${path}  **页码**：${pages}

## 定义

${n.summary || ''}

## 性质 / 证明

（待补充）

## 例子

（待补充）
`;
  return "obsidian://new?vault=" + encodeURIComponent(VAULT)
       + "&file=" + encodeURIComponent(fileName)
       + "&content=" + encodeURIComponent(content);
}

function newSectionNoteUrl(sectionNode){
  // 整节笔记：涵盖 sectionNode（L1）下的所有 L2 节点
  // sectionNode 可以是 L1，或 L2（取其父 L1）
  const sec = sectionNode.level === 1 ? sectionNode : id2[sectionNode.parent_id];
  if(!sec || sec.level !== 1) return "";
  const chap = id2[sec.parent_id];
  const l2s = nodesByLevel[2].filter(n => n.parent_id === sec.id)
    .sort((a,b) => {
      const pa = (a.pages||[])[0] || 99999;
      const pb = (b.pages||[])[0] || 99999;
      return pa - pb;
    });
  const fileName = `${_randHex3()}-${_safeFileName(sec.name)}`;
  const book = KG && KG.book ? KG.book : "教材";
  const allPages = [...new Set(l2s.flatMap(n => n.pages || []))].sort((a,b)=>a-b);
  const idList = l2s.map(n => n.id).join(", ");
  const sections = l2s.map(n => {
    const tyz = TYPE_ZH[n.type] || n.type || "";
    const pg = (n.pages || []).join(", ");
    return `## ${n.numeric_label || ""} ${n.name}${tyz?` *[${tyz}]*`:""}

${pg?`> p.${pg}\n`:""}
${n.summary || '（待展开）'}

`;
  }).join("");
  const content = `---
subject: 数学
source: ${book} ${sec.section_label || sec.id.split('.').pop()}
pages: ${allPages.join(", ")}
chapter: ${chap?chap.name:''}
section: ${sec.name}
kg_section_id: ${sec.id}
kg_node_ids: [${idList}]
---

# ${sec.name}

**所在章节**：${chap?chap.name:''} › ${sec.name}
**页码范围**：p.${allPages[0]||"?"} - p.${allPages[allPages.length-1]||"?"}
**含 ${l2s.length} 个知识点**

---

${sections}
`;
  return "obsidian://new?vault=" + encodeURIComponent(VAULT)
       + "&file=" + encodeURIComponent(fileName)
       + "&content=" + encodeURIComponent(content);
}
function obsidianPdfUrl(page){
  // KG.pdf_vault_path 由服务端 data.json 派生（PDF 在 vault 内时）
  const vp = KG && KG.pdf_vault_path;
  if(!vp) return null;
  // 跟 wikilink [[X.pdf#page=N]] 同语义：把 "#page=N" 拼到 file 末尾整体 encode
  // （# 变 %23、= 变 %3D）。这样 Obsidian 协议 handler 收到完整字符串能跳页。
  return "obsidian://open?vault="+encodeURIComponent(VAULT)
       + "&file="+encodeURIComponent(vp + "#page=" + page);
}
function showDetail(n){
  if(!n) return;
  const dt = document.getElementById("detail");
  const wasOpen = dt.classList.contains("open");
  dt.classList.add("open");
  // 整面板按 mastery 状态主题色（顶部色带 + 左边框 + 背景渐变）
  dt.classList.remove("theme-mastered","theme-unlockable","theme-previewable","theme-locked");
  dt.classList.add("theme-" + stateOf(n));
  if(!wasOpen && settings.fitToWidth){
    updateWrapPadding();
    // 详情面板新打开：等过渡完成后 re-layout 适应新宽度
    setTimeout(()=>render(), 230);
  }
  document.getElementById("d-name").textContent=n.name;
  const st=stateOf(n);
  const sLabel={mastered:"✓ 已掌握", unlockable:"▶ 可学", locked:"🔒 未解锁"}[st] || "🔒 未解锁";
  const sBadge={mastered:"b-mast", unlockable:"b-unl", locked:"b-lock"}[st] || "b-lock";
  const badges=[`<span class="badge ${sBadge}">${sLabel}</span>`];
  if(n.level<2){
    badges.push(`<span class="badge b-type">L${n.level} ${n.level===0?'章':'节'}</span>`);
    badges.push(`<span class="badge b-type">${countL2Under(n)} 知识点</span>`);
  }else{
    // L2 type 中文化：definition→定义、theorem→定理、proposition→命题、
    // corollary→推论、lemma→引理、example→例子
    const typeZh = {definition:'📖 定义', theorem:'📐 定理', proposition:'🔹 命题',
                    corollary:'⤴ 推论', lemma:'🔸 引理', example:'🔬 例子'};
    if(n.type){
      const lbl = typeZh[n.type] || n.type;
      badges.push(`<span class="badge b-type">${lbl}</span>`);
    }
    if(n.numeric_label) badges.push(`<span class="badge b-type">编号 ${n.numeric_label}</span>`);
    // ⭐ 五级掌握度：X/5 显眼大徽章
    const lvl = typeof n.mastery_level === "number" ? n.mastery_level : 0;
    const lvlColor = lvl >= 4 ? "#34d399" : lvl >= 2 ? "#60a5fa" : lvl === 1 ? "#fbbf24" : "#6f7888";
    const lvlBg    = lvl >= 4 ? "#0e2118" : lvl >= 2 ? "#0e1a2e" : lvl === 1 ? "#241a08" : "#1f2530";
    const lvlTip   = lvl === 0 ? "未开始" : lvl === 1 ? "刚解锁，未达掌握门槛（≥2/5 才作为前置）"
                   : lvl === 2 ? "已掌握（达 2/5 门槛，可作前置开放后续）"
                   : lvl >= 4 ? "深度掌握" : "中等掌握";
    badges.push(`<span class="badge" title="${lvlTip}" style="background:${lvlBg};color:${lvlColor};box-shadow:inset 0 0 0 1.5px ${lvlColor};font-size:13px;padding:5px 12px">⭐ ${lvl}/5</span>`);
    if(n.mastery_inferred){
      badges.push(`<span class="badge b-type" title="推断掌握：由后续节点反向传递">↓推断</span>`);
    }
    if(typeof n.mastery==="number" && !n.mastery_inferred){
      badges.push(`<span class="badge b-type" style="opacity:.7">Anki ${(n.mastery*100).toFixed(0)}%</span>`);
    }
    badges.push(`<span class="badge b-type">解锁 ${descendants[n.id]||0} 后继</span>`);
  }
  const chap=chapOf(n);
  if(chap) badges.push(`<span class="badge b-chap" style="background:${chapterColor[chap]}33;color:${chapterColor[chap]};box-shadow:inset 0 0 0 1px ${chapterColor[chap]}">${id2[chap]?.name||""}</span>`);
  document.getElementById("d-badges").innerHTML=badges.join("");
  document.getElementById("d-label").textContent=[n.numeric_label||"", n.type||""].filter(Boolean).join(" · ") || (n.level===0?n.chapter_label:n.section_label)||"—";
  document.getElementById("d-summary").innerHTML=n.summary?marked.parse(n.summary):"—";
  const chain=[]; let cur=id2[n.parent_id]; while(cur){chain.unshift(cur.name); cur=id2[cur.parent_id]}
  const pages=n.pages||[];
  // 连续页码合并：[288,289,298] → [[288,289],[298]] → "p.288-289" "p.298"
  const sorted = [...pages].sort((a,b)=>a-b);
  const groups = [];
  for(const p of sorted){
    const last = groups[groups.length-1];
    if(last && p === last[last.length-1] + 1) last.push(p);
    else groups.push([p]);
  }
  const pageHTML = groups.length
    ? groups.map(g => {
        const startPg = g[0], endPg = g[g.length-1];
        const label = g.length===1 ? `p.${startPg}` : `p.${startPg}-${endPg}`;
        const titleSuffix = g.length===1 ? `第 ${startPg} 页` : `第 ${startPg}-${endPg} 页`;
        const obs = obsidianPdfUrl(startPg);
        const web = `/skilltree/${BOOK}/pdf#page=${startPg}`;
        const main = obs
          ? `<a href="${obs}" class="page-link" title="在 Obsidian 中打开 PDF ${titleSuffix}">${label}</a>`
          : `<a href="${web}" target="_blank" class="page-link" title="浏览器打开 PDF ${titleSuffix}">${label}</a>`;
        const fallback = `<a href="${web}" target="_blank" class="page-link-web" title="改用浏览器打开（远程/无 Obsidian 时）"
                            onclick="event.stopPropagation()">🌐</a>`;
        return `<span class="page-pair">${main}${obs?fallback:""}</span>`;
      }).join(" ")
    : "—";
  document.getElementById("d-path").innerHTML=`${pageHTML}<br><small style="color:#6b7488">${chain.join(" › ")||"（顶层）"}</small>`;
  const link=[];
  // containing_notes 数组：可能有多篇笔记都讲到该知识点
  const notes = (n.containing_notes && n.containing_notes.length)
    ? n.containing_notes
    : (n.note_ref ? [n.note_ref] : []);
  for(const nt of notes){
    link.push(`<a href="${obsidianUrl(nt)}">📝 ${nt}</a>`);
  }
  if(n.card_refs && n.card_refs.length) link.push(`🎴 ${n.card_refs.length} 张 Anki 卡`);
  // 没有笔记时给「📝 创建笔记」按钮（服务端读 PDF 提取相关内容生成）
  if(!notes.length && (n.level === 1 || n.level === 2)){
    const cnt = n.level === 1 ? `（涵盖 ${countL2Under(n)} 个知识点）` : "";
    link.push(`<button id="btn-create-note" onclick="createNote('${n.id}')"
      style="margin-top:8px;padding:8px 14px;background:#1a2540;color:#a8cdff;
      border:1.5px solid #3b6db5;border-radius:8px;cursor:pointer;font-size:13px;
      font-weight:600;width:100%;text-align:left">📝 从 PDF 创建笔记 ${cnt}</button>`);
  }
  document.getElementById("d-link").innerHTML=link.join("<br>")||"—";
  function fillList(elId, dir){
    const ul=document.getElementById(elId); ul.innerHTML="";
    if(n.level!==2){const li=document.createElement("li"); li.style.cursor="default"; li.style.color="#5a6680"; li.textContent="（聚合层：进入知识点视图后可见）"; ul.appendChild(li); return}
    let count=0;
    for(const e of edgesByLevel[2]) if(e[dir==="prereq"?"to":"from"]===n.id){
      const other=id2[e[dir==="prereq"?"from":"to"]]; if(!other) continue;
      const li=document.createElement("li");
      const arrow=dir==="prereq"?"←":"→";
      const stO=stateOf(other);
      const stEmoji={mastered:"🟢", unlockable:"🟡", locked:"⚫"}[stO] || "⚫";
      li.innerHTML=`${stEmoji} ${arrow} <b>${other.name}</b>${editMode?` <button onclick="event.stopPropagation();delEdge('${dir==='prereq'?other.id:n.id}','${dir==='prereq'?n.id:other.id}')" style="float:right;background:#4a1a1a;border:1px solid #7a2828;color:#ffb4b4;border-radius:4px;padding:1px 6px;font-size:10px;cursor:pointer">删</button>`:""}${e.evidence?'<br><small style="color:#6b7488">'+e.evidence+'</small>':''}`;
      li.onclick=()=>{pushView({kind:"focus",id:other.id})};
      ul.appendChild(li); count++;
    }
    if(!count){const li=document.createElement("li"); li.style.cursor="default"; li.style.color="#5a6680"; li.textContent="（无）"; ul.appendChild(li)}
  }
  fillList("d-prereqs","prereq");
  fillList("d-unlocks","unlock");
  showEditPanel(n);
}
async function delEdge(a,b){
  if(!confirm(`删除边 ${id2[a]?.name} → ${id2[b]?.name}？`)) return;
  await editPost("delete_edge",{from:a, to:b});
}
function closeDetail(){
  const wasOpen = document.getElementById("detail").classList.contains("open");
  document.getElementById("detail").classList.remove("open");
  if(wasOpen && settings.fitToWidth){
    updateWrapPadding();
    setTimeout(()=>render(), 230);
  }
  // focus 模式时关闭 = 退出 focus（回到上一视图，所有方块都回来）
  if(current.kind==="focus") goBack();
}

function openSettings(){
  document.getElementById("sett-mask").classList.add("open");
  const inp=document.getElementById("sett-ratio");
  inp.value=Math.round(settings.blockRatio*100);
  document.getElementById("sett-zoom").checked = !!settings.enableZoom;
  document.getElementById("sett-fit").checked = !!settings.fitToWidth;
  updateSettPreview();
  inp.oninput=updateSettPreview;
}
function updateSettPreview(){
  const v=+document.getElementById("sett-ratio").value;
  document.getElementById("sett-val").textContent=v+"%";
  document.getElementById("sett-bar").style.width=(v/30*100)+"%";
}
function applySettings(){
  const v=+document.getElementById("sett-ratio").value;
  settings.blockRatio=v/100;
  settings.enableZoom = document.getElementById("sett-zoom").checked;
  settings.fitToWidth = document.getElementById("sett-fit").checked;
  saveSettings(settings);
  closeSettings();
  applyZoomState();
  render();
}
// 缩放只调 svg 尺寸 + root transform scale，不重 layout
function applyZoomState(){
  if(!settings.enableZoom) canvasZoom=1;
  if(baseSvgW && baseSvgH){
    svg.attr("width", baseSvgW*canvasZoom).attr("height", baseSvgH*canvasZoom);
    root.attr("transform", `scale(${canvasZoom})`);
  }
}
// wrap 容器右 padding 根据详情面板是否打开 + fitToWidth 设置切换
function updateWrapPadding(){
  const detailOpen = document.getElementById("detail").classList.contains("open");
  if(settings.fitToWidth){
    wrap.style.paddingRight = detailOpen ? "380px" : "20px";
  } else {
    wrap.style.paddingRight = "380px";
  }
}
function closeSettings(){document.getElementById("sett-mask").classList.remove("open")}

// 快捷键
document.addEventListener("keydown",e=>{
  if(document.activeElement && ["INPUT","TEXTAREA"].includes(document.activeElement.tagName)) return;
  if(e.key==="Escape"){
    if(document.querySelector(".mask.open")){
      document.querySelectorAll(".mask.open").forEach(m=>m.classList.remove("open"));
    } else goBack();
  }
  if(e.key==="Backspace") goBack();
  if(e.key==="/"){ e.preventDefault(); document.getElementById("search").focus(); }
});
window.addEventListener("resize",()=>render());
updateNav();
