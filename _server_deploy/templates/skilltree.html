<!doctype html>
<html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ book }} · 技能树</title>
<script src="//bwicarus.taile44d0c.ts.net/static/qa/marked.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;background:#0a0e1a;color:#e6e6f0;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
#bar{background:linear-gradient(180deg,#141a2b,#0e1320);border-bottom:1px solid #2a3550;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-shrink:0;z-index:10}
#bar h1{font-size:14px;font-weight:700;letter-spacing:.05em;color:#9ec3ff}
#crumbs{display:flex;align-items:center;gap:6px;font-size:13px;color:#8a9bb4}
#crumbs a{color:#7dc4ff;text-decoration:none;cursor:pointer;font-weight:500;padding:2px 6px;border-radius:4px}
#crumbs a:hover{background:#1a2540}
#legend{margin-left:auto;display:flex;gap:14px;font-size:11px;color:#8a9bb4}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle;box-shadow:0 0 8px currentColor}
#viz{flex:1;position:relative;overflow:hidden;background-color:#0a0e1a;background-image:
  radial-gradient(ellipse at center,rgba(40,60,120,.18) 0%,transparent 60%),
  linear-gradient(rgba(60,80,140,.06) 1px,transparent 1px),
  linear-gradient(90deg,rgba(60,80,140,.06) 1px,transparent 1px);
  background-size:100% 100%, 40px 40px, 40px 40px}
svg{width:100%;height:100%;cursor:grab;display:block}
svg:active{cursor:grabbing}
/* 节点瓦片 */
.tile{cursor:pointer}
.tile rect{transition:filter .15s, stroke-width .15s}
.tile:hover rect{filter:brightness(1.25)}
.tile text.tname{font-size:12px;font-weight:600;fill:currentColor;text-anchor:middle;pointer-events:none;user-select:none}
.tile text.tlabel{font-size:10px;fill:#8a9bb4;text-anchor:middle;pointer-events:none;user-select:none}
.tile.mastered rect{stroke:#34d399;stroke-width:2.5;fill:#0d2a1f;filter:drop-shadow(0 0 10px #34d39988)}
.tile.mastered{color:#7be096}
.tile.unlocked rect{stroke:#fbbf24;stroke-width:2;fill:#241a08;filter:drop-shadow(0 0 8px #fbbf2466)}
.tile.unlocked{color:#fcd383}
.tile.locked rect{stroke:#4a5568;stroke-width:1.5;fill:#141926;stroke-dasharray:4 3}
.tile.locked{color:#6b7488}
.tile.l0 rect{rx:12;ry:12}
.tile.l1 rect{rx:9;ry:9}
.tile.l2 rect{rx:7;ry:7}
.tile.selected rect{stroke:#7dc4ff !important;stroke-width:3 !important;filter:drop-shadow(0 0 14px #7dc4ffaa)}
/* 边 */
.edge{fill:none;stroke-linecap:round}
.edge.mast{stroke:#34d39988;stroke-width:2}
.edge.unl{stroke:#fbbf2466;stroke-width:1.8}
.edge.lock{stroke:#4a5568;stroke-width:1.4;stroke-dasharray:4 4}
/* detail */
#detail{position:absolute;right:0;top:0;bottom:0;width:360px;background:linear-gradient(180deg,#10162a,#0a0e1a);border-left:1px solid #2a3550;padding:18px 20px 24px;overflow-y:auto;transform:translateX(100%);transition:transform .22s ease;font-size:13px;line-height:1.65;z-index:5}
#detail.open{transform:translateX(0);box-shadow:-12px 0 32px rgba(0,0,0,.5)}
#detail h2{font-size:16px;margin-bottom:8px;color:#e6e6f0}
#detail .lbl{color:#8a9bb4;font-size:10px;margin-top:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
#detail .v{margin-top:3px;color:#cfd6e6}
#detail-close{position:absolute;top:12px;right:14px;background:none;border:none;color:#8a9bb4;font-size:18px;cursor:pointer;line-height:1}
#detail-close:hover{color:#fff}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;margin-right:6px;font-weight:600}
.b-mast{background:#10412a;color:#7be096;box-shadow:inset 0 0 0 1px #34d399}
.b-unl{background:#3a2a08;color:#fcd383;box-shadow:inset 0 0 0 1px #fbbf24}
.b-lock{background:#1f2530;color:#7a8497;box-shadow:inset 0 0 0 1px #4a5568}
.b-type{background:#142540;color:#9ec3ff;box-shadow:inset 0 0 0 1px #3b6db5}
#detail .prereqs{margin-top:4px}
#detail .prereqs li{margin:5px 0;padding:7px 10px;background:#0d1322;border:1px solid #1f2740;border-radius:6px;cursor:pointer;list-style:none;font-size:12px}
#detail .prereqs li:hover{background:#162045;border-color:#3b6db5}
.empty-hint{text-align:center;padding:60px 20px;color:#5a6680;font-size:13px}
</style></head>
<body>
<div id="bar">
  <h1>{{ book }} · 技能树</h1>
  <div id="crumbs"><a data-level="0">全书</a></div>
  <div id="legend">
    <span><span class="dot" style="background:#34d399;color:#34d399"></span>已掌握</span>
    <span><span class="dot" style="background:#fbbf24;color:#fbbf24"></span>已解锁</span>
    <span><span class="dot" style="background:#4a5568;color:#4a5568"></span>未解锁</span>
  </div>
</div>
<div id="viz">
  <svg><defs>
    <marker id="arr-mast" viewBox="0 -5 10 10" refX="9" refY="0" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,-4L9,0L0,4" fill="#34d399"/>
    </marker>
    <marker id="arr-unl" viewBox="0 -5 10 10" refX="9" refY="0" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,-4L9,0L0,4" fill="#fbbf24"/>
    </marker>
    <marker id="arr-lock" viewBox="0 -5 10 10" refX="9" refY="0" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,-4L9,0L0,4" fill="#5a6680"/>
    </marker>
  </defs></svg>
  <aside id="detail">
    <button id="detail-close" onclick="closeDetail()">✕</button>
    <h2 id="d-name">—</h2>
    <div id="d-badges"></div>
    <div class="lbl">编号 · 类型</div><div class="v" id="d-label">—</div>
    <div class="lbl">描述</div><div class="v" id="d-summary">—</div>
    <div class="lbl">页码 · 路径</div><div class="v" id="d-path">—</div>
    <div class="lbl">关联</div><div class="v" id="d-link">—</div>
    <div class="lbl">前置（解锁条件）</div><ul class="prereqs" id="d-prereqs"></ul>
    <div class="lbl">后续（解锁后开放）</div><ul class="prereqs" id="d-unlocks"></ul>
  </aside>
</div>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const BOOK="{{ book }}";
let KG=null, currentLevel=0, currentParent=null, selectedId=null;
const svg=d3.select("svg"), W=()=>svg.node().clientWidth, H=()=>svg.node().clientHeight;
const g=svg.append("g");
const zoom=d3.zoom().scaleExtent([0.25,3]).on("zoom",ev=>g.attr("transform",ev.transform));
svg.call(zoom);

const NODE_W={0:140,1:120,2:130}, NODE_H={0:54,1:46,2:42};
const GAP_X=24, GAP_Y=86;

fetch(`/skilltree/${BOOK}/data.json`).then(r=>r.json()).then(d=>{KG=d;render();fitView()});

function stateOf(n){return n.mastered?"mastered":(n.unlocked?"unlocked":"locked")}

function visibleNodes(){
  return KG.nodes.filter(n=>{
    if(n.level!==currentLevel) return false;
    if(!currentParent) return true;
    let cur=n;
    while(cur&&cur.parent_id){
      if(cur.parent_id===currentParent) return true;
      cur=KG.nodes.find(x=>x.id===cur.parent_id);
    }
    return false;
  });
}
function visibleEdges(visIds){
  const id2=Object.fromEntries(KG.nodes.map(n=>[n.id,n]));
  function liftTo(id){
    let cur=id2[id];
    while(cur&&cur.level>currentLevel) cur=id2[cur.parent_id];
    return cur&&cur.level===currentLevel?cur.id:null;
  }
  const E=new Map();
  for(const e of KG.edges||[]){
    if(e.kind!=="prereq") continue;
    const a=liftTo(e.from), b=liftTo(e.to);
    if(!a||!b||a===b) continue;
    if(!visIds.has(a)||!visIds.has(b)) continue;
    const k=a+"→"+b; if(!E.has(k)) E.set(k,{from:a,to:b});
  }
  return [...E.values()];
}

// 分层布局（top-down）：BFS 拓扑层级 → y；同层均匀分布 → x。无边时网格回退。
function layout(nodes, edges){
  const id2=Object.fromEntries(nodes.map(n=>[n.id,n]));
  const inEdges={}; for(const n of nodes) inEdges[n.id]=[];
  for(const e of edges) if(id2[e.from]&&id2[e.to]) inEdges[e.to].push(e.from);
  // 计算层级（最长路径长度 from source）
  const depth={}; for(const n of nodes) depth[n.id]=0;
  let changed=true, iter=0;
  while(changed&&iter++<nodes.length+2){
    changed=false;
    for(const n of nodes){
      const d=inEdges[n.id].length?Math.max(...inEdges[n.id].map(s=>(depth[s]??0)+1)):0;
      if(d!==depth[n.id]){depth[n.id]=d;changed=true}
    }
  }
  // 无边时：所有 depth=0，回退网格
  const maxD=Math.max(...Object.values(depth),0);
  const padX=60, padY=48;
  if(maxD===0){
    const cols=Math.max(1, Math.min(8, Math.ceil(Math.sqrt(nodes.length*1.6))));
    const cw=NODE_W[currentLevel]+GAP_X;
    const ch=NODE_H[currentLevel]+GAP_Y*0.5;
    nodes.forEach((n,i)=>{
      n.x=padX + (i%cols)*cw + cw/2;
      n.y=padY + Math.floor(i/cols)*ch + ch/2;
    });
  }else{
    // 同层按出现顺序排；y 翻转：maxD 在顶（已习得目标），depth 0 在底（基础前置）
    const byDepth={};
    nodes.sort((a,b)=>(a.numeric_label||"").localeCompare(b.numeric_label||"")||a.name.localeCompare(b.name));
    for(const n of nodes){(byDepth[depth[n.id]]=byDepth[depth[n.id]]||[]).push(n)}
    for(const d in byDepth){
      const row=byDepth[d];
      const totalW=row.length*(NODE_W[currentLevel]+GAP_X)-GAP_X;
      const x0=Math.max(padX, (W()-totalW)/2);
      row.forEach((n,i)=>{
        n.x=x0+i*(NODE_W[currentLevel]+GAP_X)+NODE_W[currentLevel]/2;
        n.y=padY+(maxD-(+d))*GAP_Y+NODE_H[currentLevel]/2;
      });
    }
  }
}

function edgeClass(edge,id2){
  const f=id2[edge.from], t=id2[edge.to];
  if(!f||!t) return "lock";
  if(f.mastered) return "mast";
  if(f.unlocked) return "unl";
  return "lock";
}

function bezierPath(s,t,lvl){
  // 自下而上：源（前置）在底 → 从其顶部出；目标（推出来的）在顶 → 从其底部入
  // 箭头朝上（marker orient auto 跟随路径方向）
  const x1=s.x, y1=s.y-NODE_H[lvl]/2;
  const x2=t.x, y2=t.y+NODE_H[lvl]/2;
  const my=(y1+y2)/2;
  return `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`;
}

function render(){
  g.selectAll("*").remove();
  if(!KG){return}
  const nodes=visibleNodes().map(n=>({...n}));
  if(!nodes.length){
    g.append("foreignObject").attr("x",W()/2-160).attr("y",H()/2-30).attr("width",320).attr("height",60)
      .append("xhtml:div").attr("class","empty-hint").html("此层暂无节点<br><small>（扫描进行中或本节无原子知识点）</small>");
    return;
  }
  const ids=new Set(nodes.map(n=>n.id));
  const edges=visibleEdges(ids);
  layout(nodes,edges);
  const id2=Object.fromEntries(nodes.map(n=>[n.id,n]));
  // 边
  g.selectAll(".edge").data(edges).enter().append("path")
    .attr("class",e=>"edge "+edgeClass(e,id2))
    .attr("d",e=>bezierPath(id2[e.from],id2[e.to],currentLevel))
    .attr("marker-end",e=>"url(#arr-"+edgeClass(e,id2)+")");
  // 节点瓦片
  const w=NODE_W[currentLevel], h=NODE_H[currentLevel];
  const tile=g.selectAll(".tile").data(nodes).enter().append("g")
    .attr("class",d=>`tile l${d.level} ${stateOf(d)}${d.id===selectedId?" selected":""}`)
    .attr("transform",d=>`translate(${d.x-w/2},${d.y-h/2})`)
    .on("click",(_,d)=>tileClick(d));
  tile.append("rect").attr("width",w).attr("height",h);
  tile.append("text").attr("class","tname").attr("x",w/2).attr("y",h/2-2).text(d=>{
    const n=d.name.length>11?d.name.slice(0,11)+"…":d.name;
    return n;
  });
  tile.append("text").attr("class","tlabel").attr("x",w/2).attr("y",h/2+13)
    .text(d=>{
      if(d.level===0) return d.chapter_label||"";
      if(d.level===1) return d.section_label||"";
      return d.numeric_label||d.type||"";
    });
  updateCrumbs();
}
function fitView(){
  // 居中重置缩放（首次或层切换）
  svg.call(zoom.transform, d3.zoomIdentity);
}
function updateCrumbs(){
  const crumbs=document.getElementById("crumbs"); crumbs.innerHTML="";
  const path=[{level:0,name:"全书",parent:null}];
  if(currentParent){
    const id2=Object.fromEntries(KG.nodes.map(n=>[n.id,n]));
    let cur=id2[currentParent]; const chain=[];
    while(cur){chain.unshift(cur); cur=id2[cur.parent_id]}
    for(const n of chain) path.push({level:n.level+1,name:n.name,parent:n.id,nodeLevel:n.level});
  }
  path.forEach((p,i)=>{
    if(i) crumbs.appendChild(Object.assign(document.createElement("span"),{textContent:" › "}));
    const a=document.createElement("a"); a.textContent=p.name;
    a.onclick=()=>{if(i===0){currentLevel=0;currentParent=null;selectedId=null}else{currentLevel=p.nodeLevel;currentParent=p.parent;selectedId=null} render(); fitView()};
    crumbs.appendChild(a);
  });
}
function tileClick(n){
  selectedId=n.id;
  if(n.level<2){
    currentLevel=n.level+1; currentParent=n.id;
    render(); fitView();
  }else{
    render();   // 重绘以高亮 selected
  }
  showDetail(n);
}
function showDetail(n){
  document.getElementById("detail").classList.add("open");
  document.getElementById("d-name").textContent=n.name;
  const st=stateOf(n);
  const sLabel={mastered:"已掌握",unlocked:"已解锁",locked:"未解锁"}[st];
  const sBadge={mastered:"b-mast",unlocked:"b-unl",locked:"b-lock"}[st];
  const badges=[`<span class="badge ${sBadge}">${sLabel}</span>`];
  if(n.type) badges.push(`<span class="badge b-type">${n.type}</span>`);
  if(typeof n.mastery==="number") badges.push(`<span class="badge b-type">掌握 ${(n.mastery*100).toFixed(0)}%</span>`);
  document.getElementById("d-badges").innerHTML=badges.join("");
  document.getElementById("d-label").textContent=[n.numeric_label||"", n.type||""].filter(x=>x).join(" · ") || "—";
  document.getElementById("d-summary").innerHTML=n.summary?marked.parse(n.summary):"—";
  const id2=Object.fromEntries(KG.nodes.map(x=>[x.id,x]));
  const chain=[]; let cur=id2[n.parent_id]; while(cur){chain.unshift(cur.name); cur=id2[cur.parent_id]}
  const pageStr=(n.pages||[]).join(", ")||"—";
  document.getElementById("d-path").innerHTML=`p.${pageStr}<br><small style="color:#6b7488">${chain.join(" › ")||"（顶层）"}</small>`;
  const link=[];
  if(n.note_ref) link.push(`📝 ${n.note_ref}`);
  if(n.card_refs&&n.card_refs.length) link.push(`🎴 ${n.card_refs.length} 张卡`);
  document.getElementById("d-link").innerHTML=link.join("<br>")||"—";
  const ed=KG.edges||[];
  function fillList(elId, edges, dir){
    const ul=document.getElementById(elId); ul.innerHTML="";
    let count=0;
    for(const e of edges) if(e.kind==="prereq"&&e[dir==="prereq"?"to":"from"]===n.id){
      const other=id2[e[dir==="prereq"?"from":"to"]]; if(!other) continue;
      const li=document.createElement("li");
      const arrow=dir==="prereq"?"←":"→";
      const stOther=stateOf(other);
      const stEmoji={mastered:"🟢",unlocked:"🟡",locked:"⚫"}[stOther];
      li.innerHTML=`${stEmoji} ${arrow} <b>${other.name}</b>${e.evidence?'<br><small style="color:#6b7488">'+e.evidence+'</small>':''}`;
      li.onclick=()=>{currentLevel=other.level;currentParent=other.parent_id;selectedId=other.id;render();fitView();setTimeout(()=>showDetail(other),250)};
      ul.appendChild(li); count++;
    }
    if(!count){const li=document.createElement("li"); li.style.cursor="default"; li.style.color="#5a6680"; li.textContent="（无）"; ul.appendChild(li)}
  }
  fillList("d-prereqs", ed, "prereq");
  fillList("d-unlocks", ed, "unlock");
}
function closeDetail(){document.getElementById("detail").classList.remove("open")}
window.addEventListener("resize",()=>{if(KG) render()});
</script></body></html>
