<!doctype html>
<html lang="zh"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="apple-touch-icon" href="/static/icons/web.png">
<meta name="apple-mobile-web-app-title" content="网页">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>🌐 {{ url_esc }}</title>
<style>
  /* RBI 实况网页(阶段1):rrweb Replayer 把 Pi 真 Chrome 的 DOM 事件流重建到 #stage 内的 iframe。
     顶栏地址栏 + 状态;查词/翻译作用于重建 DOM(阶段1b 接 web-adapter)。 */
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0e1a;font-family:system-ui,-apple-system,"Noto Sans CJK SC",sans-serif}
  #rbi-top{position:fixed;top:0;left:0;right:0;height:calc(46px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);
    display:flex;align-items:center;gap:8px;padding-left:10px;padding-right:10px;background:#0d1322;border-bottom:1px solid #1e2740;z-index:100}
  #rbi-back,#rbi-go{background:#152036;color:#cfe6ff;border:1px solid #2a3550;border-radius:16px;height:32px;min-width:36px;font-size:15px;cursor:pointer}
  #rbi-url{flex:1 1 auto;min-width:0;background:#0d1322;border:1px solid #2a3550;color:#cfe6ff;border-radius:16px;height:32px;padding:0 14px;font-size:13px;outline:none}
  #rbi-url:focus{border-color:#3b6db5}
  #rbi-status{position:fixed;bottom:8px;left:8px;z-index:120;background:rgba(13,19,34,.9);color:#7fb2ff;font-size:11px;padding:3px 8px;border-radius:8px;pointer-events:none;max-width:70vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  #stage{position:absolute;left:0;right:0;bottom:0;top:calc(46px + env(safe-area-inset-top));background:#fff;overflow:auto;-webkit-overflow-scrolling:touch}
  /* ⚠ iframe 必须保持 rrweb 录制的 viewport 尺寸(1280×900),不能 width:100% reflow —— 否则
     客户端布局 ≠ Pi 真 Chrome 布局,点击坐标(iframe 内容坐标系)会错位、Pi 点不中链接。 */
  #stage{display:flex;justify-content:center}
  #stage iframe{border:0;display:block}
  #rbi-load{position:absolute;inset:0;top:calc(46px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:center;background:#0a0e1a;color:#8a9bb4;font-size:14px;z-index:60}
  .rbi-spin{width:26px;height:26px;border:3px solid #26324d;border-top-color:#5a96f0;border-radius:50%;animation:rbisp 1s linear infinite;margin-right:10px}
  @keyframes rbisp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div id="rbi-top">
    <button id="rbi-back" title="后退">←</button>
    <input id="rbi-url" value="{{ url_esc }}" spellcheck="false" autocomplete="off" title="地址栏:输网址或搜索词">
    <button id="rbi-go" title="真浏览器打开">↵</button>
  </div>
  <div id="stage"></div>
  <div id="rbi-load"><span class="rbi-spin"></span>Pi 真浏览器加载中…</div>
  <div id="rbi-status">connecting…</div>

<script src="/static/pdf/rrweb-record.umd.js?v={{ js_v }}"></script>
<script>
(function(){
  var CFG = { url: {{ url|tojson }}, uid: {{ uid|tojson }} };
  var stage=document.getElementById('stage'), st=document.getElementById('rbi-status'),
      load=document.getElementById('rbi-load'), urlbox=document.getElementById('rbi-url');
  function setSt(m){ try{ st.textContent=m; }catch(e){} }

  var replayer=null, gotFull=false;
  function freshReplayer(){
    try{ if(replayer && replayer.destroy) replayer.destroy(); }catch(e){}
    stage.innerHTML='';
    replayer=new rrweb.Replayer([], {liveMode:true, root:stage, mouseTail:false, UNSAFE_replayCanvas:false});
    replayer.startLive();
    gotFull=false;
  }
  freshReplayer();

  var proto = location.protocol==='https:' ? 'wss:' : 'ws:';
  var ws, reconnectT=null;
  function connect(){
    ws=new WebSocket(proto+'//'+location.host+'/rbi-ws');
    ws.onopen=function(){ setSt('已连,请求页面…'); open(CFG.url); };
    ws.onmessage=function(e){
      var m; try{ m=JSON.parse(e.data); }catch(_){ return; }
      if(m.t==='ev'){
        var ev; try{ ev=JSON.parse(m.d); }catch(_){ return; }
        try{ replayer.addEvent(ev); }catch(err){ return; }
        if(ev.type===2){ gotFull=true; load.style.display='none';
          var dt = _openT ? ((Date.now()-_openT)/1000).toFixed(1)+'s' : '';
          setSt('已重建 DOM'+(dt?' · 跳转 '+dt:''));
          setTimeout(hookInteract, 250);   // 重建 iframe 就绪后,拦截页内链接点击(回传 Pi 导航)
        }
      } else if(m.t==='nav'){
        CFG.url=m.url; urlbox.value=m.url; setSt('打开 '+m.url);
        try{ history.replaceState(null,'','/pdf/web/rbi-live?url='+encodeURIComponent(m.url)); }catch(_){}
      } else if(m.t==='clickres'){ var r=m.r||{};
        setSt('Pi点击: '+(r.e?('✗'+r.e):(r.tag+(r.href?(' →'+String(r.href).slice(0,40)):''))));
      } else if(m.t==='err'){ load.style.display='none'; setSt('✗ '+m.msg); }
    };
    ws.onclose=function(){ setSt('断开,重连中…'); if(reconnectT) return;
      reconnectT=setTimeout(function(){ reconnectT=null; connect(); }, 2000); };
    ws.onerror=function(){ setSt('ws 错误'); };
  }
  var _openT=0;
  function open(u){
    if(!u) return;
    if(!/^https?:\/\//.test(u)) u='https://'+u;
    _openT=Date.now(); load.style.display='flex'; setSt('Pi 加载中…'); freshReplayer();
    try{ ws.send(JSON.stringify({cmd:'open', url:u, uid:CFG.uid})); }catch(_){}
  }
  // ★ 交互回传(不变量3):rrweb Replayer 是"回放观看"模式,重建的 DOM **不接受任何交互**
  //   (点链接/搜索框都没反应的根因)。所以把用户在重建 DOM 上的点击/输入/滚动**回传 Pi 真 Chrome**
  //   执行,产生的变化再顺 rrweb 增量流回。坐标用 iframe 内容坐标系(录制 viewport,直接对应真 Chrome)。
  //   ⚠ 查词是"客户端处理不回传"(不变量2),但那要区分选区 vs 单击 —— 阶段1b 做;现在单击全回传。
  function hookInteract(){
    var ifr = stage.querySelector('iframe');
    if(!ifr || !ifr.contentDocument || ifr.__rbiHooked) return;
    ifr.__rbiHooked = true;
    // ★ 根因:rrweb Replayer 回放模式默认给 iframe 设 pointer-events:none(防交互干扰回放),
    //   真实点击落到外层 wrapper 进不了 iframe → 点什么都没反应。强制开回可交互。
    ifr.style.setProperty('pointer-events', 'auto', 'important');
    var _mouse = stage.querySelector('.replayer-mouse');
    if(_mouse) _mouse.style.setProperty('pointer-events', 'none', 'important');   // 假鼠标层别挡点击
    var d = ifr.contentDocument;
    // ★ 滚动:rrweb 把 iframe 高度固定成录制 viewport(900),内容却几千~几万 px,靠 iframe 内部滚动——
    //   iOS 上 iframe 内滚动坑多 + rrweb 回放锁定 → 滚不动。改成 iframe 撑到内容全高,外层 #stage 滚。
    startFit(ifr);
    // 点击 → 回传**节点 id**(坐标会因客户端/Pi 布局差错位;rrweb node id 精确)
    var mir = (replayer.getMirror ? replayer.getMirror() : null);
    function sendClick(e){
      var node = e.target;
      // 点在链接/按钮/输入等交互元素上,取最近的交互祖先(点的可能是链接里的 <b>)
      var t = node.closest ? (node.closest('a,button,input,textarea,select,[role=button],[onclick],label,summary,[tabindex]') || node) : node;
      var interactive = /^(A|BUTTON|INPUT|TEXTAREA|SELECT|SUMMARY|LABEL)$/.test(t.tagName||'')
                        || (t.getAttribute && t.getAttribute('role')==='button') || (t.onclick!=null);
      // 交互元素一定回传(链接必须点得动);只有正文文字点击 + 有选区才豁免(查词,不变量2)
      if(!interactive){
        try{ var sel=(d.getSelection?d.getSelection():null); if(sel && String(sel).length>1) return; }catch(_){}
      }
      var id = mir ? mir.getId(t) : 0;
      if(!id){ setSt('点击:节点无 id('+(t.tagName||'?')+')'); return; }
      e.preventDefault(); e.stopPropagation();
      try{ ws.send(JSON.stringify({cmd:'ev', t:'click', id:id})); }catch(_){}   // CDP 真实点击
      setSt('点击 #'+id+' '+(t.tagName||'')+' → Pi');
      _lastClickInput = /^(INPUT|TEXTAREA)$/.test(t.tagName) || t.isContentEditable;
      if(_lastClickInput){ _inputEl=t; _inputId=id; setTimeout(focusKbd, 30); }   // 记住输入框,回车时提交
    }
    d.addEventListener('click', sendClick, true);
  }

  // 输入:重建 DOM 的 input 聚焦**不会弹 iPad 键盘**(不是真实焦点)。用一个隐藏真 input 在用户手势内
  //   聚焦弹键盘,打的字回传 Pi 的已聚焦输入框。
  var _lastClickInput=false, _kbd=null, _inputEl=null, _inputId=0;
  function focusKbd(){
    if(!_kbd){
      _kbd=document.createElement('input');
      _kbd.style.cssText='position:fixed;left:-1000px;top:0;opacity:0;height:1px';
      document.body.appendChild(_kbd);
      // 文本走值同步(免 IME 逐字坑);功能键走 CDP 真实按键
      _kbd.addEventListener('input', function(){
        if(_inputId) try{ ws.send(JSON.stringify({cmd:'ev', t:'input', id:_inputId, value:_kbd.value})); }catch(_){}
      });
      _kbd.addEventListener('keydown', function(e){
        if(!_inputId) return;
        if(e.key==='Enter'){ e.preventDefault();
          try{ ws.send(JSON.stringify({cmd:'ev', t:'input', id:_inputId, value:_kbd.value})); }catch(_){}  // 先同步最新值
          try{ ws.send(JSON.stringify({cmd:'ev', t:'key', key:'Enter', code:'Enter', id:_inputId})); }catch(_){}  // 再 CDP 真回车→原生提交
        } else if(e.key==='Backspace'||e.key==='Tab'||e.key==='Escape'||e.key.indexOf('Arrow')===0){
          try{ ws.send(JSON.stringify({cmd:'ev', t:'key', key:e.key, code:e.code||e.key, id:_inputId})); }catch(_){}
        }
      });
    }
    if(_inputEl){ try{ _kbd.value = _inputEl.value || ''; }catch(_){ _kbd.value=''; } }
    try{ _kbd.focus(); }catch(_){}
  }
  // ★ 表单提交(用户拍板:当请求转发,比逐字键盘可靠)。GET 表单 → 构造搜索 URL 直接 open
  //   (复用已通的跳转链路);POST 表单 → 让 Pi 真提交。
  function submitInput(){
    var v=_kbd.value;
    var f = _inputEl && _inputEl.form;
    if(f && (f.method||'get').toLowerCase()==='get'){
      var action = f.getAttribute('action') || CFG.url;
      var url; try{ url=new URL(action, CFG.url); }catch(_){ url=null; }
      if(url){
        // 收集 form 里所有具名字段(隐藏字段等),当前输入框用最新值
        try{ [].forEach.call(f.querySelectorAll('input[name],select[name],textarea[name]'), function(el){
          if(el.type==='submit'||el.type==='button') return;
          url.searchParams.set(el.name, el===_inputEl ? v : (el.value||'')); }); }catch(_){}
        if(_inputEl.name && !url.searchParams.get(_inputEl.name)) url.searchParams.set(_inputEl.name, v);
        try{ _kbd.blur(); }catch(_){}
        open(url.href);          // Pi 打开搜索结果页 = 一次跳转
        return;
      }
    }
    // 非 GET / 无 form:让 Pi 侧设值 + 提交(POST 或 SPA 回车处理)
    if(_inputId) try{ ws.send(JSON.stringify({cmd:'submitform', id:_inputId, text:v})); }catch(_){}
  }
  connect();

  // ★ 滚动同步(用户实测:无限滚动不加载新内容——根因=滚动位置没同步到 Pi,Pi 不知道你滚到底了、
  //   不触发它的懒加载)。把 #stage 的滚动位置回传 Pi,Pi window.scrollTo 到同位置 → 页面 JS 触发
  //   加载更多 → 新内容 record 增量流回 → iframe 变高 → 你能继续往下滚。内容一致所以 y 直接对应。
  var _scrollT=null;
  stage.addEventListener('scroll', function(){
    if(_scrollT) return;
    _scrollT=setTimeout(function(){ _scrollT=null;
      try{ ws.send(JSON.stringify({cmd:'ev', t:'scroll', id:0, top:Math.round(stage.scrollTop)})); }catch(_){}
    }, 160);
  }, {passive:true});

  // 地址栏:输网址直接开,输词走搜索(与 iframe 版一致)
  urlbox.addEventListener('keydown', function(e){
    if(e.key!=='Enter') return;
    var v=(this.value||'').trim(); if(!v) return;
    var isUrl = v.indexOf('http')===0 || /^[\w-]+(\.[\w-]+)+([/]|$)/.test(v);
    if(isUrl) open(v);
    else open('https://lite.duckduckgo.com/lite/?q='+encodeURIComponent(v));
  });
  document.getElementById('rbi-go').onclick=function(){ open(urlbox.value.trim()); };
  document.getElementById('rbi-back').onclick=function(){ location.href='/pdf/web?home=1'; };
  // 长按后退 = 切回轻量 iframe 代理版(同一 URL)
  document.getElementById('rbi-back').oncontextmenu=function(e){ e.preventDefault();
    location.href='/pdf/web/live?url='+encodeURIComponent(CFG.url); };

  // 阶段1b 接入点:web-adapter 会在 replay iframe 的 DOM 上挂查词/翻译。此处先暴露 replayer。
  var _fitT=null, _lastH=0;
  function startFit(ifr){
    if(_fitT) clearInterval(_fitT);
    function fit(){
      try{
        // ⚠ rrweb 回放模式反复把 iframe 设 pointer-events:none → 点击进不去(用户实测"所有点击没触发")。
        //   一次性 setProperty 会被它后续重建覆盖,必须在定时里持续强制。
        if(ifr.style.pointerEvents!=='auto') ifr.style.setProperty('pointer-events','auto','important');
        if(!ifr.contentDocument) return;
        var se=ifr.contentDocument.scrollingElement||ifr.contentDocument.documentElement;
        var h=se ? se.scrollHeight : 0;
        if(h>200 && Math.abs(h-_lastH)>4){ _lastH=h; ifr.style.height=h+'px'; }  // 内容变高→iframe 跟着长
      }catch(_){}
    }
    fit(); _fitT=setInterval(fit, 400);   // 增量内容(懒加载/展开)不断变高,持续贴合
  }
  window.__rbiReplayer=function(){ return replayer; };
  window.__rbiStageIframe=function(){ return stage.querySelector('iframe'); };
})();
</script>
</body></html>
