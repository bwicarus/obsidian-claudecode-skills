<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bwicarus</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Segoe UI',system-ui,sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(ellipse at 20% 20%, rgba(99,102,241,.25) 0%, transparent 55%),
    radial-gradient(ellipse at 80% 75%, rgba(139,92,246,.2)  0%, transparent 55%),
    linear-gradient(135deg, #0f0c29 0%, #1a1a3e 50%, #0d1b3e 100%);
}
.card{
  text-align:center;
  padding:48px 52px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:20px;
  backdrop-filter:blur(12px);
  max-width:380px;width:90%;
}
h1{font-size:26px;font-weight:600;color:#fff;letter-spacing:.02em;margin-bottom:8px}
p{font-size:13px;color:rgba(255,255,255,.45);margin-bottom:36px;line-height:1.6}
.links{display:flex;flex-direction:column;gap:10px}
.links a{
  display:block;text-decoration:none;
  padding:11px 0;border-radius:12px;font-size:14px;font-weight:500;
  border:1px solid rgba(255,255,255,.12);
  color:rgba(255,255,255,.8);
  background:rgba(255,255,255,.06);
  transition:all .18s;
}
.links a:hover{background:rgba(165,180,252,.2);border-color:#a5b4fc;color:#e0e7ff}
.links a .sub{display:block;font-size:11px;font-weight:400;color:rgba(255,255,255,.35);margin-top:2px}
</style>
</head>
<body>
<div class="card">
  <h1>bwicarus</h1>
  <p>个人笔记与学习记录</p>
  <div class="links">
    <a href="/dashboard/">
      仪表板
      <span class="sub">Anki 掌握度 · 复习优先级 · 知识图谱</span>
    </a>
    <a href="/history/">
      问答历史
      <span class="sub">截图问答对话记录</span>
    </a>
  </div>
</div>
</body>
</html>
