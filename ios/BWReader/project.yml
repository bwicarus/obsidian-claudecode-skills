name: BWReader

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "11.0"

settings:
  base:
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: 7MDVSLPV8F
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    # 1,2 = iPhone and iPad. The extension was already universal; only this
    # container held the app to iPad, so an iPhone could not install it at all.
    TARGETED_DEVICE_FAMILY: "1,2"

packages:
  flyingFox:
    url: https://github.com/swhitty/FlyingFox.git
    exactVersion: 0.27.1

targets:
  BWReader:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - Info.plist
          - BWReader.entitlements
      - path: Shared/ReaderNativeBridgeContract.swift
      - path: Shared/ReaderRealtimeCredentialCore.swift
      - path: Shared/ReaderSharedSnapshot.swift
      - path: Shared/ReaderLocalNoteBridge.swift
      # 离线词典的核心类型（ReaderOfflineDictionaryInfo / Error / Store）。
      # 2026-08-19 为了让 Safari 扩展也能离线查词，把它们从 App/ 挪到 Shared/，
      # 加进了扩展 target 却漏了 App target —— App 里的代码还在引用这些类型，
      # 于是 CI 连挂四次（cannot find type 'ReaderOfflineDictionaryInfo'）。
      # ⚠ Shared/ 下的文件**每个 target 都要单独列**，加一处不等于加好了。
      - path: Shared/ReaderOfflineDictionaryCore.swift
      # 手表载荷契约。⚠ 上面那条警告的活例子：2026-08-27 我只加进了手表
      # target,漏了这里,CI 立刻 cannot find type 'ReaderWatchVoice'。
      - path: Shared/ReaderWatchPayload.swift
      # Generated deterministically before XcodeGen. It is a folder resource so
      # the loopback host receives a stable ReaderBundle document root rather
      # than hundreds of flattened files.
      - path: Generated/ReaderBundle
        type: folder
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_IDENTITY: Apple Distribution
        CODE_SIGN_ENTITLEMENTS: App/BWReader.entitlements
        PROVISIONING_PROFILE_SPECIFIER: BWReader App Store App
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        MARKETING_VERSION: "1.1.82"
        PRODUCT_BUNDLE_IDENTIFIER: space.bwicarus.bwreader2
        PRODUCT_NAME: bwicarus-test
        # Stated explicitly because XcodeGen's application preset overrides
        # project-level values -- the setting has to be repeated here to hold,
        # in either direction.
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: BWReaderSafariExtension
        embed: true
        codeSign: true
        copy:
          destination: plugins
      - target: BWReaderWidget
        embed: true
        codeSign: true
        copy:
          destination: plugins
      # ⚠ 手表 app 这条**不能写 copy.destination** —— XcodeGen 对
      # platform: watchOS 的依赖会自己生成 Embed Watch Content 阶段，
      # 手写 copy 会跟它打架。跟上面两条形状不同是有原因的。
      - target: BWReaderWatch
        embed: true
        codeSign: true
      - package: flyingFox
        product: FlyingFox
      - package: flyingFox
        product: FlyingSocks

  BWReaderSafariExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Extension/SafariWebExtensionHandler.swift
      - path: Shared/ReaderNativeBridgeContract.swift
      - path: Shared/ReaderRealtimeCredentialCore.swift
      - path: Shared/ReaderSharedSnapshot.swift
      - path: Shared/ReaderLocalNoteBridge.swift
      # 离线词典的只读核心：扩展查词走本地词典而不是打 Pi（C 组 #19）。
      - path: Shared/ReaderOfflineDictionaryCore.swift
      # Keep the staging directory itself out of the bundle. Root files are
      # copied one by one, while the referenced directories preserve the paths
      # used by manifest.json and extension-owned packaged data.
      - path: Extension/Resources/manifest.json
        buildPhase: resources
        optional: true
      - path: Extension/Resources/background.js
        buildPhase: resources
        optional: true
      - path: Extension/Resources/content.js
        buildPhase: resources
        optional: true
      - path: Extension/Resources/popup.html
        buildPhase: resources
        optional: true
      - path: Extension/Resources/popup.js
        buildPhase: resources
        optional: true
      # The in-extension call surface. Root files are enumerated one by one
      # here, so a file that ships in the Safari package still has to be listed
      # again or it silently never reaches the built extension.
      - path: Extension/Resources/call.html
        buildPhase: resources
        optional: true
      - path: Extension/Resources/call.js
        buildPhase: resources
        optional: true
      - path: Extension/Resources/inline-computer-voice.html
        buildPhase: resources
        optional: true
      - path: Extension/Resources/inline-computer-voice.js
        buildPhase: resources
        optional: true
      - path: Extension/Resources/ctxlink.js
        buildPhase: resources
        optional: true
      - path: Extension/Resources/src
        type: folder
        buildPhase: resources
        optional: true
      - path: Extension/Resources/vendor
        type: folder
        buildPhase: resources
        optional: true
      - path: Extension/Resources/icons
        type: folder
        buildPhase: resources
        optional: true
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_IDENTITY: Apple Distribution
        CODE_SIGN_ENTITLEMENTS: Extension/BWReaderSafariExtension.entitlements
        PROVISIONING_PROFILE_SPECIFIER: BWReader App Store Extension
        COMPRESS_PNG_FILES: NO
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Extension/Info.plist
        MARKETING_VERSION: "1.1.82"
        PRODUCT_BUNDLE_IDENTIFIER: space.bwicarus.bwreader2.Extension
        PRODUCT_MODULE_NAME: BWReaderSafariExtension
        PRODUCT_NAME: BWReaderSafariExtension
        SKIP_INSTALL: YES
        # Apple requires an embedded app extension to declare both iPhone and
        # iPad even when its containing app is intentionally iPad-only.
        TARGETED_DEVICE_FAMILY: "1,2"

  BWReaderWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widget/BWReaderWidget.swift
      - path: Shared/ReaderNativeBridgeContract.swift
      - path: Shared/ReaderSharedSnapshot.swift
      - path: Shared/ReaderLocalNoteBridge.swift
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_IDENTITY: Apple Distribution
        CODE_SIGN_STYLE: Manual
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widget/Info.plist
        MARKETING_VERSION: "1.1.82"
        PRODUCT_BUNDLE_IDENTIFIER: space.bwicarus.bwreader2.Widget
        PRODUCT_MODULE_NAME: BWReaderWidget
        PRODUCT_NAME: BWReaderWidget
        PROVISIONING_PROFILE_SPECIFIER: BWReader App Store Widget
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  # 手表伴侣 app（2026-08-27 用户要的）。三件事：看 AI 卡片、看待办、
  # 开关电脑语音桥。数据全部经 WatchConnectivity 由手机转发 ——
  # 手表够不到 tailnet（watchOS 没有 Tailscale 客户端），而那三样东西的
  # 数据源只在 tailnet 内可达。原因详见 Shared/ReaderWatchPayload.swift。
  BWReaderWatch:
    # ⚠ 必须是 platform: watchOS,**不能用 supportedDestinations** ——
    # 后者会让 XcodeGen 不生成 "Embed Watch Content" 阶段,手表 app 根本
    # 不会被嵌进 iOS app 里(XcodeGen issue #1463)。
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: Watch
        excludes:
          - Info.plist
      # ⚠ Shared/ 下的文件**每个 target 都要单独列**（同 App target 那条
      # 注释：漏列让 CI 连挂过四次）。手表只需要这一个契约文件。
      - path: Shared/ReaderWatchPayload.swift
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: Apple Distribution
        CODE_SIGN_STYLE: Manual
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Watch/Info.plist
        MARKETING_VERSION: "1.1.82"
        PRODUCT_BUNDLE_IDENTIFIER: space.bwicarus.bwreader2.watchkitapp
        PRODUCT_MODULE_NAME: BWReaderWatch
        PRODUCT_NAME: BWReaderWatch
        PROVISIONING_PROFILE_SPECIFIER: BWReader App Store Watch
        SKIP_INSTALL: YES
        # ⚠ 项目级 settings.base 写死了 SUPPORTED_PLATFORMS 为 iphoneos,
        # 而 XcodeGen 的 watchOS preset 里**没有**这一项压不住它 ——
        # 不覆写的话手表 target 会被当成 iOS 编。
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "11.0"

schemes:
  BWReader:
    build:
      targets:
        BWReader: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    management:
      shared: true
